# CoreGacha · 外观扭蛋参数（设计 docs/design/DESIGN-ember-gacha.md）。两份：CoreGacha/src/main/resources/ 和
# plugins/CoreGacha/ —— 一起改。改完 /gacha admin reload（公示概率会重算），再跑模拟器（docs/tests/TEST-gacha-sim-*.md）。
# 只放外观：kind 只能是 badge / tag / aura / pet / show / corerpg（corerpg = CoreRpg 外观商店的件，ref = 商店 id）。
# 没有属性、材料、币、门票这种奖励类型（经济文档 §5.1：抽奖箱出战力禁止）。

rates:
  # 每一抽的基础概率；普通 = 1 − 三项之和
  base: {legend: 0.006, epic: 0.051, rare: 0.143}
  # 原神式软保底：距上次传说第 k 抽，k ≤ start 固定 base.legend；k > start 每抽 +step
  soft_pity: {start: 60, step: 0.04}
  # 第 hard_pity 抽必出传说
  hard_pity: 80
  # 每 tier2_every 抽内至少一件史诗或以上
  tier2_every: 10
  # 明日方舟式：同一个池里不连续出同一件传说
  no_repeat_legend: true

# 火花：每个池每抽 +1，满这么多可在该池任选一件没有的外观
spark: 200
# 每人每天最多抽这么多次（经济文档 §9：不做无上限抽奖）
daily_pull_cap: 50
cost_per_pull: 1

# 炉石式：重复 → 光屑；光屑可以直接换池里任意一件
shards:
  dup: {legend: 300, epic: 80, rare: 20, common: 5}
  craft: {legend: 1800, epic: 480, rare: 120, common: 40}
  # 限定池结束后，没用掉的火花每点折成这么多光屑（池子写了 spark_leftover: carry 的转进 retire_to 池的火花，不折光屑）
  spark_leftover: 1

