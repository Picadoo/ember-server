name: CoreRpg
main: town.sunshine.corerpg.CoreRpgPlugin
version: 1.3.5
author: sunshine-town
description: 余烬 RPG — 币/签到/活跃/悬赏/强化/镶嵌/分解/重铸/灾厄/誓约/天赋/晶钻商城/月卡/邮寄/好友/设置/天梯/使魔 + 记分板/刷怪
softdepend: [MythicMobs, NeigeItems, PlaceholderAPI]
load: POSTWORLD
commands:
  corerpg:
    description: RPG 状态 / 刷怪 / 币 / 签到 / 活跃 / 悬赏 / 强化 / 镶嵌 / 分解 / 重铸 / 灾厄 / 深渊 / 誓约 / 天赋 / 晶钻 / 商城 / 月卡 / 邮寄 / 好友 / 设置 / 使魔
    usage: /corerpg <spawn|status|coin|sign|activity|bounty|enhance|socket|scrap|reforge|calamity|abyss|covenant|talent|cash|shop|monthly|mail|friend|settings|ladder|pet|reload|help>
    permission: corerpg.use
    aliases: [crpg, rpg]
permissions:
  corerpg.use:
    default: true
  corerpg.enhance:
    default: true
  corerpg.socket:
    default: true
  corerpg.covenant:
    default: true
  corerpg.talent:
    default: true
  corerpg.cash:
    default: true
  corerpg.shop:
    default: true
  corerpg.monthly:
    default: true
  corerpg.scrap:
    default: true
  corerpg.reforge:
    default: true
  corerpg.mail:
    default: true
  corerpg.mail.send:
    default: op
  corerpg.friend:
    default: true
  corerpg.settings:
    default: true
  corerpg.pet:
    default: true
  corerpg.admin:
    default: op
