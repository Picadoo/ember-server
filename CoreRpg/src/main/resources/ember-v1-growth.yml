# ember-v1.0-P1 D141–D143 横向成长（P2 草案 §5za）：天赋专精 / 余烬勋记 / 词条洗练。三样的全部参数都在这个文件。
# 两份要一致：plugins/CoreRpg/ 和 CoreRpg/src/main/resources/。改完重启（或 /corerpg p1 growth reload）。
#
# 硬约束（用户 10-03 15:42）：三样全开到顶，Q01–Q07（普通 = 书参考装、挑战 = T3+6）和团本的通关率变化不超过约 3 个点，
# Q07 首通中位和两件极品最快路线变化不超过约 0.5 周。模型 tools/p1sim/growth.py（p1sim / p1party / p2econ 共用这份 yml）。
# 主线图对数值极敏感（+2% 攻击 = Q04 普通 0.5 档 +9 点，回复药 20%→22% = Q06 +8 点），所以：
#   天赋 = 有得有失的取舍（得在一种情况，失在另一种），按模型调到参考装上几乎抵消；
#   勋记 = 以经济 / 便利为主，战斗类很小；
#   词条 = 小的纯加成，上限跟成色走（标准件只能到 1 档），参考装都是标准件。
#
# 修饰键（Java EmberGrowth.Mods 和 growth.py 用同一套）：乘数默认 1，加数默认 0。
#   dmg_boss / dmg_mob / dmg_affix   对首领 / 普通怪 / 词缀精英（含分身）造成的伤害 ×
#   dmg_split                        对词缀精英裂出来的分身再 ×
#   dmg_affix_body                   只对词缀精英本体再 ×（不含分身；D163 / B01；D164 起没有节点在用）
#   dmg_affix_shield / dmg_affix_blazing / dmg_affix_split   按词缀种类再 ×：厚甲 / 炽热 / 分裂精英（分裂含分身；D164 破甲）
#   dodge_dmg + dodge_secs           躲开首领预警招后 dodge_secs 秒内造成的伤害 ×
#   dodge_heal + dodge_icd           躲开首领预警招回最大生命的比例（冷却 dodge_icd 秒）
#   taken_tele / taken_boss / taken_mob / taken_affix / taken_all   受到首领预警招 / 首领普攻 / 怪物（非首领）/ 词缀精英 / 全部 伤害 ×
#   potion                           回复药回复比例 ×（20% × potion）
#   burn_ticks / burn_mult           焚烬点燃多几跳 / 每跳系数 ×（只在焚烬成套时）
#   burn_spread / spread_icd         燃烧中的敌人倒下时把最多几秒的燃烧传给 4 格内最近的敌人 / 每几秒最多传一次
#   dodge_burst / hit_burst          躲开 / 被打中首领预警招时烬爆计数 +n（内置冷却照旧）
#   burst_every / burst_mult         烬爆每几次普攻（加减）/ 系数 ×（只在烬爆成套时）
#   sustain_every / sustain_mult / sustain_hp   炽愈回复间隔（加减）/ 回复 × / 生命加成（相对成套基线；D293 成套基线 1.00）×
#   share_w / share_taken            烬核分摊时自己算几份 / 自己那份 ×
#   set_dmg                          焚烬 / 烬爆 套装事件伤害 ×
#   max_hp                           最大生命 ×
#   abyss_taken / abyss_fee          深渊里受到伤害 × / 深渊层费 ×
#   coin / shard_bonus               结算余烬币 × / 每次通关结算多给碎片
#   reroll_coin                      洗练的币 ×
# D163 / B01: t2c 拆分 used dmg_affix_body (body −20%) so clones stay dmg_split +50% net.
# D164 (build-diversity P7, 10-04): t2c 拆分 → 破甲 — 厚甲精英 ×1.6（正好抵掉生命 ×1.6），炽热 / 分裂精英（含分身）×0.8。
#   p1sim builddiv propose P7: 厚甲精英击杀 −30～−36%，主线重打通关率相对拆分 ≤ ±2～3 点；首通 / 挑战 / 团本 / 深渊没有词缀精英 = 0。
#   节点 id 不变（t2c），已点「拆分」的人自动变成「破甲」，不用重置。
version: 3

# ---------------------------------------------------------------- D141 天赋专精
talents:
  # 第一次重置免费，之后每次（币）
  respec_coin: 2000
  # 专精点：一次性，按进度给（合计 6）
  points:
    - {id: q03, kind: first_clear, arg: q03, name: "首通 Q03"}
    - {id: q05, kind: first_clear, arg: q05, name: "首通 Q05"}
    - {id: q07, kind: first_clear, arg: q07, name: "首通 Q07"}
    - {id: chal, kind: challenge_any, arg: "", name: "首通任一挑战版"}
    - {id: raid, kind: raid_any, arg: "", name: "首通任一团本"}
    - {id: abyss5, kind: abyss_floor, arg: "5", name: "深渊·余烬层到第 5 层"}
  # 每排只能点一个；点数 = 占用的专精点（重置时退回），币 = 第一次学会这个天赋时付一次（重置不退，以后再点不收）
  rows:
    # theme = shown to players (no internal D-numbers; D147 review 10-04 #3 / #8 / #10)
    - {row: 1, name: "应变", points: 1, coin: 800, theme: "首领预警招 · 3% ≈ Q07 重砸每次 1 点"}
    - {row: 2, name: "猎手", points: 2, coin: 2000, theme: "仅主线重打词缀精英（首通 / 挑战 / 团本 / 深渊无效；每局约 1 只）"}
    - {row: 3, name: "套装专精", points: 3, coin: 4000, theme: "只在对应套装成套时生效"}
  nodes:
    # 第 1 排「应变」：首领预警招（D140）。fit = 菜单里「适合 / 不适合」一行（D147，评审 10-04 #3）。得失都只在首领战里。
    - id: t1a
      row: 1
      name: "回身斩"
      family: burst
      mods: {dodge_dmg: 1.02, dodge_secs: 3, taken_tele: 1.02}
      good: "躲开首领预警招后 3 秒内伤害 +2%"
      bad: "被首领预警招打中多受 2%"
      fit: "适合：预警招大多能躲开的人 · 不适合：常被预警招打中（那样是净亏）"
    - id: t1b
      row: 1
      name: "稳桩"
      family: sustain
      mods: {taken_tele: 0.97, dmg_boss: 0.99}
      good: "受到首领预警招伤害 -3%"
      bad: "对首领伤害 -1%"
      fit: "适合：常被预警招打中、求稳的人 · 不适合：想打得快的人"
    - id: t1c
      row: 1
      name: "踏步回气"
      family: scorch
      mods: {dodge_heal: 0.008, dodge_icd: 15, taken_tele: 1.03}
      good: "躲开首领预警招回 0.8% 最大生命（15 秒一次）"
      bad: "被首领预警招打中多受 3%"
      fit: "适合：躲招稳、常用踏步的人 · 不适合：常被预警招打中（那样是净亏）"
    # 第 2 排「猎手」：仅主线重打词缀精英（D138）。得失只落在词缀精英（含分身）；首通 / 挑战 / 团本 / 深渊无效。
    # D164：三选一 = 破缀（全打快、多挨打）/ 守缀（少挨打、打得慢）/ 破甲（专打厚甲，另两种慢）。
    - id: t2a
      row: 2
      name: "破缀"
      family: burst
      mods: {dmg_affix: 1.30, taken_affix: 1.20}
      good: "对词缀精英（含分身）伤害 +30%（仅主线重打词缀精英）"
      bad: "受到词缀精英（含分身、炽热火圈）伤害 +20%"
      fit: "适合：想快点清掉词缀精英 · 不适合：容易被精英火圈 / 分身围住"
    - id: t2b
      row: 2
      name: "守缀"
      family: sustain
      mods: {taken_affix: 0.75, dmg_affix: 0.85}
      good: "受到词缀精英（含分身、炽热火圈）伤害 -25%（仅主线重打词缀精英）"
      bad: "对词缀精英（含分身）伤害 -15%"
      fit: "适合：怕词缀精英的人 · 不适合：想快清精英的人"
    - id: t2c
      row: 2
      name: "破甲"
      family: scorch
      mods: {dmg_affix_shield: 1.60, dmg_affix_blazing: 0.80, dmg_affix_split: 0.80}
      good: "对厚甲精英伤害 +60%（正好抵掉它的 1.6 倍生命；仅主线重打词缀精英）"
      bad: "对炽热 / 分裂精英（含分身）伤害 -20%"
      fit: "适合：专门对付厚甲精英 · 不适合：遇到炽热 / 分裂精英（会更慢）"
    # 第 3 排「套装专精」：只在穿对应套装成套时生效（换套自动失效，不用重置）。
    - id: t3a
      row: 3
      name: "燎原"
      family: scorch
      set: scorch
      mods: {burn_spread: 1, spread_icd: 15, burn_mult: 0.94}
      good: "燃烧中的敌人倒下时，把最多 1 秒燃烧传给 4 格内最近的敌人（15 秒一次）"
      bad: "焚烬燃烧每跳伤害 ×0.94"
      fit: "适合：焚烬套、怪多扎堆的图 · 不适合：单体首领战"
    - id: t3b
      row: 3
      name: "反震"
      family: burst
      set: burst
      mods: {hit_burst: 1, taken_tele: 1.02}
      good: "被首领预警招打中时烬爆计数 +1（硬吃一招换一次更早的烬爆，和天赋「稳桩」搭）"
      bad: "被首领预警招打中多受 2%"
      fit: "适合：烬爆套、敢硬吃一招的人 · 不适合：常被预警招打中"
    - id: t3c
      row: 3
      name: "扛核"
      family: sustain
      set: sustain
      mods: {share_w: 1.5, sustain_mult: 0.99}
      good: "烬核分摊时你算 1.5 份（队友少扛）"
      bad: "你自己扛的烬核变多（1.5 份）；炽愈回复量 ×0.99"
      fit: "适合：炽愈套、团本里替队友扛烬核 · 不适合：单人（没人分摊）"

# ---------------------------------------------------------------- D142 余烬勋记
# 账号永久、自动解锁；条件全是已有的一次性成就。效果以经济 / 便利为主，战斗类只有「深渊里受伤」（只在深渊）。
# 主线图和团本里没有任何战斗加成。caps = 全部勋记合起来的硬上限（>1 是上限，<1 是下限；加数是上限）。
honors:
  caps: {coin: 1.04, shard_bonus: 1, abyss_fee: 0.95, abyss_taken: 0.98, reroll_coin: 0.85}
  list:
    - {id: h_abyss5, name: "深渊行者", kind: abyss_floor, arg: "5", desc: "深渊层费 -5%", mods: {abyss_fee: 0.95}}
    - {id: h_abyss10, name: "深渊老手", kind: abyss_floor, arg: "10", desc: "深渊里受到伤害 -2%（只在深渊）", mods: {abyss_taken: 0.98}}
    - {id: h_chal3, name: "挑战新秀", kind: challenge_count, arg: "3", desc: "结算余烬币 +2%", mods: {coin: 1.02}}
    - {id: h_chal7, name: "挑战全通", kind: challenge_count, arg: "7", desc: "每次通关结算 +1 余烬碎片", mods: {shard_bonus: 1}}
    - {id: h_raid1, name: "团本首胜", kind: raid_count, arg: "1", desc: "洗练的币 -10%", mods: {reroll_coin: 0.90}}
    - {id: h_raid3, name: "三团全胜", kind: raid_count, arg: "3", desc: "结算余烬币 +2%", mods: {coin: 1.02}}
    - {id: h_codex, name: "图录全满", kind: codex_full, arg: "", desc: "洗练的币 -5%（图录不给战斗属性）", mods: {reroll_coin: 0.95}}

# ---------------------------------------------------------------- D143 词条洗练
# 每件 T1+ 刃 / 护符一个词条槽（初始空）。一次洗练 = 同部位同阶的一件重复件（掉落来的、没投入、没穿着）或碎片，加币。
# 档位按 tier_weights 抽，截在成色上限 tier_cap[成色]（标准 1 / 精良 2 / 卓越 3 / 极品 4）再归一；
# 连续 pity 次没出到上限档，下一次必出上限档。洗完二选一：保留新 / 保留旧（不选 = 旧的）。
# 数值 = 1 / 2 / 3 / 4 档。参考装都是标准件，只能到 1 档。词条几乎都只落在词缀精英 / 分身 / 烬核上（D138 / D137），
# 通用的两条（余烬纹、定身纹）每档只有 0.5%；回复药类词条试过（+1% = Q06 约 +1 点）删掉了，code 5 空着不要复用。
# D148（评审 10-04 #4）：保底只保档位，词条仍在本部位 3 个里随机；锁定 = 保留当前词条只重抽档位，另加 lock_shard 碎片
# （同一保底计数）。tools/p1sim/rerollsim.py：极品件指定词条满档 不锁 15.9 次（1910 碎片 + 15.9k 币）→ 锁定 6.2 次
# （1136 碎片 + 6.2k 币）。上限不变（D143 的两件 4 档已在 10-03 成长检查里），只省钱。
# D147（评审 10-04 #5）：词条名一律带「纹」，不和天赋重名（code 不变，存档不受影响）。
reroll:
  pity: 5
  tier_weights: [50, 30, 15, 5]
  tier_cap: [1, 2, 3, 4]
  # 按物品阶 T0..T3
  coin: [0, 300, 600, 1000]
  shard: [0, 40, 80, 120]
  lock_shard: [0, 40, 80, 120]
  # code = 存档里的编号（玩家数据 p4_af_<物品 uid> = code × 10 + 档），上线后不要改
  affixes:
    blade:
      - {id: b_affix, code: 1, name: "猎缀纹", key: dmg_affix, desc: "对词缀精英伤害", note: "仅主线重打词缀精英", values: [1.04, 1.08, 1.12, 1.16]}
      - {id: b_set, code: 2, name: "余烬纹", key: set_dmg, desc: "套装事件（燃烧 / 烬爆）伤害", values: [1.0025, 1.005, 1.0075, 1.01]}
      # D164（build-diversity R5）：裂身纹移出洗练池（rollable: false）——洗不出来、也不能锁定再洗；已经有的照常生效、照常显示。
      #   code 3 不要复用。刃池 3 → 2：极品件洗到指定 4 档（锁定路线）6.2 → 5.6 次。
      - {id: b_split, code: 3, name: "裂身纹", key: dmg_split, desc: "对分身伤害", note: "仅主线重打词缀精英", rollable: false, values: [1.05, 1.10, 1.15, 1.20]}
    charm:
      - {id: c_tele, code: 4, name: "定身纹", key: taken_tele, desc: "受到首领预警招伤害", values: [0.995, 0.99, 0.985, 0.98]}
      - {id: c_share, code: 6, name: "分核纹", key: share_taken, desc: "烬核自己那份", values: [0.99, 0.98, 0.97, 0.96]}
      - {id: c_affix, code: 7, name: "抗缀纹", key: taken_affix, desc: "受到词缀精英伤害", note: "仅主线重打词缀精英", values: [0.96, 0.92, 0.88, 0.84]}

# D429 烙纹定向（批 A·M · 切片自 D167；不抬 AFK；不改 enhance 价）
forge:
  brand:
    craft: {shard: 40}   # 40 碎片 → 1 mat_ember_brand
    pin_brand: [0, 2, 4, 6]   # T0 不开；T1/T2/T3
    pin_coin: [0, 300, 600, 1000]
  charges:
    max: 13

  # D430 随机锻造（刃/护符；极品成色权重 0）
  roll:
    marks: 8
    blank: 4
    coin: 500
    quality: [70, 23, 7, 0]
    craft: [70, 20, 9, 1]
