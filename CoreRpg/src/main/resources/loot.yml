# 1.8.1 (2026-09-27): clear-box loot with weekly-first guarantees — docs/reviews/critic-fixes-20260927.md
# /corerpg loot <player> <key>  (DP end scripts, console)
#  first_per_week: items given on the player's first call of this key in the ISO week
#  chance:         each item rolled independently on every other call (and also on the first call if listed)
abyss_t2:
  label: 深渊通关箱
  first_per_week: { gear_ember_t2_blade: 1, gear_ember_t2_talisman: 1 }
  chance: { gear_ember_t2_blade: 0.04, gear_ember_t2_talisman: 0.03 }
weekly_t1:
  label: 周本通关箱
  # 1.11.0: 精炼刃改由主线第 2 章（日常首通）给；周本首通只保底护符，避免与主线重复
  first_per_week: { gear_ember_t1_talisman: 1 }
  chance: { gear_ember_t1_blade: 0.10, gear_ember_t1_talisman: 0.08 }
raid_gem:
  label: 团本通关箱
  chance: { gem_ember_sharp: 0.5 }
guild_gem:
  label: 盟Boss通关箱
  chance: { gem_ember_sharp: 0.5 }

# 2026-09-27 stage4.1：第12层周首通稳定符（手工测 /corerpg loot <p> abyss_weekly12）
# 线上 COMPLETE/撤离只走 AbyssSettleService.settle(floor≥12)，勿在 DP reward 再调本 key（防双提示）
abyss_weekly12:
  label: 深渊第12层周首通
  first_per_week: { mat_ember_stable_charm: 1 }

# Stage 4.4 精英试炼：通关随机孔石一枚 + 周首通稳定符（亦可走 corerpg elite weekly-first）
elite_gem:
  label: 精英试炼孔石
  pick_one:
    - gem_ember_sharp
    - gem_ember_steady
    - gem_ember_drain
    - gem_ember_gale
elite_weekly_first:
  label: 精英试炼周首通
  first_per_week: { mat_ember_stable_charm: 1 }

