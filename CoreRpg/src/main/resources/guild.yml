# 余烬盟约 — 轻量公会（CoreRpg 1.3.7）
# DESIGN-ember-guild-ladder.md §1 · create + donate + guild weekly boss
enabled: true
create:
  coin_cost: 5000
  crystal_cost: 40
  # prefer coin if enough, else crystal
  prefer_coin: true
name:
  min_chars: 2
  max_chars: 8
  banned:
    - "管理"
    - "官方"
    - "GM"
    - "运营"
members:
  max: 20
donate:
  daily_cap: 50
  # items: amount of NI item per 1 contribution
  rates:
    mat_ember_shard: 10
    mat_ember_bone_dust: 5
  # activity points for 盟课 — 0 = skip (本期可选跳过)
  activity_points: 0
boss:
  enabled: true
  dungeon_id: EmberGuildBoss
  contribution_cost: 20
  weekly_limit: 1
  # 1.4.9: {player} → 扣贡献后由控制台 dp start-console 启动，并给全队发一次性通行（%corerpg_guildboss_pass%，5s），
  #   EmberGuildBoss 的 DP 条件只认 OP 或该通行 → 玩家手打 /dp start EmberGuildBoss 被拒。不含 {player} 则按旧方式以玩家身份执行。
  start_command: "dp start-console {player} EmberGuildBoss"
