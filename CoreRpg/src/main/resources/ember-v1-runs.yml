# ember-v1.0-P1 G04 — main maps Q01–Q03 (batch 1) and Q04–Q05 (batch 2) (book ch. 11–13, §9, §20.5, §23.2).
# CoreRpg runs the encounters (rooms, doors, A/B variants, boss skills, extra event) and the single settlement;
# DungeonPlus only creates the instance (EmberQ01..03 reuse the ember_daily* map templates), teleports, and ends it.
# Coordinates are the REAL template coordinates of ember_daily / ember_daily_ash / ember_daily_crypt (not the book's
# R0..RB layout, which those maps do not have) — see docs/DESIGN-ember-v1.0-P1-source-table.md §10 for the mapping.
# Check every point after editing:  DP_MAP_ROOT=<maps> python3 scripts/check-dp-spawns.py plugins/DungeonPlus/dungeon/EmberQ0*
# Runtime-only file edits need a restart (no reload path for runs on purpose: a live run keeps its snapshot).

version: 1
rule_version: g04-1
# §9.5 new main maps cost 30 stamina; weekly first-free credits never apply here
cost: 30
party_min: 1
party_max: 3
# instance worlds are dungeon_<DungeonId>_<HEX>; must also be listed in ember-v1.yml scope.world_prefixes
world_prefix: dungeon_EmberQ0
# seconds a P1 entry pass stays valid for the DP js-condition (paid entries only)
pass_seconds: 30

# §18.1 challenge difficulty for all seven maps, opened by the player's OWN Q07 first clear. One shared T3 reference
# (B_ref 90), overriding — not multiplying — the normal values; party HP 1+0.65(n−1) still applies; damage does not
# scale with party size. Same 30 stamina and the same fixed settlement; items and marks are T3 with the challenge
# quality table; no first-clear package. Boss skills: heavy (重斩/刀气/重砸/冲撞) = boss.heavy, the lighter second
# skill (marked `light: true` on the map) = boss.light. Warnings, shapes and recoveries are the normal ones.
challenge:
  requires: q07
  tier: 3
  b_ref: 90
  quality: [60, 28, 10, 2]
  mobs:
    melee:    {hp: 270, atk: 24}
    ranged:   {hp: 198, atk: 24}
    heavy:    {hp: 378, atk: 24}
    caster:   {hp: 234, atk: 24}
    treasure: {hp: 360, atk: 0}
    elite:    {hp: 900, atk: 24}
  boss: {hp: 8000, atk: 44, heavy: 72, light: 44}

