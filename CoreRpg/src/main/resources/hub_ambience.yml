# D97 枢纽氛围（只做展示，不给任何属性）：NPC 闲话、指路牌、粒子、排行榜与荣誉陈列。
# 位置都在 ember_hub；出生点 (-18.5, 58, 110.5) 面朝北。改完重启或 /corerpg hubambience reload。
enabled: true
# NPC 闲话：每 talk_every_s 秒挑一个附近有人的 NPC，头顶冒一句，talk_show_s 秒后消失。
# {featured} = 本周精选图与规则
talk_every_s: 25
talk_show_s: 6
npcs:
  guide:
    name: '灰烛'
    at: [-16.5, 58.0, 106.5]
    lines:
      - '新来的？先去门吏那儿打 Q01，别急着往深处走。'
      - '烛火不灭，余烬就还在。'
      - '首通一张图，下一张才会开门。'
      - '本周精选：{featured}。'
      - '迷路了就看帮助页，余晶讲得比我细。'
  smith:
    name: '烬砧'
    at: [-11.5, 58.0, 105.5]
    lines:
      - '强化失败不掉级，也不会碎。放心敲。'
      - '多余的刃别扔，拆了就是胚料。'
      - '升阶？先首通 Q04 再来找我。'
      - '同族的刃和护符凑一套，才有套装效果。'
      - '这炉火三百年没熄过。'
  clerk:
    name: '灰钥'
    at: [-14.5, 58.0, 110.5]
    lines:
      - '一局 30 体力，0 点回满。'
      - '没拿到 T1 护符就去 Q02？我劝你再想想。'
      - '本周精选：{featured}。'
      - '深渊每层都比上一层硬，量力而行。'
      - '团本要 3 到 5 个人，先去好友页拉队。'
  quartermaster:
    name: '灰粮'
    at: [-18.5, 58.0, 114.5]
    lines:
      - '回复药 10 余烬币一瓶，进本前补到 5 瓶。'
      - '每天第一次倒下，那局喝掉的药会退给你。'
      - '饿着肚子可打不动首领。'
  enchanter:
    name: '余晶'
    at: [-21.5, 58.0, 104.5]
    lines:
      - '主线本里，附魔和宝石都不算数。'
      - '看不懂的地方翻帮助页，我都写在里面了。'
      - '称号只是好看，不加属性，但人人都看得见。'
# 指路牌：悬浮字，第一行最上。从出生点面朝北看，→ 是东边。
signs:
  - at: [-16.3, 59.3, 110.5]
    lines: ['§e→ §f门吏 · 灰钥', '§7进副本：主线 / 挑战 / 深渊 / 团本']
  - at: [-17.6, 59.3, 108.3]
    lines: ['§6↑ §f引路人 · 灰烛', '§7主线指引']
  - at: [-13.6, 59.3, 106.6]
    lines: ['§6↗ §f锻炉师 · 烬砧', '§7强化 / 升阶 / 成色']
  - at: [-20.6, 59.3, 106.4]
    lines: ['§d↖ §f咒火师 · 余晶', '§7帮助与讲解']
  - at: [-18.5, 59.3, 112.9]
    lines: ['§a↓ §f补给官 · 灰粮', '§7回复药']
  - at: [-21.4, 59.3, 110.5]
    lines: ['§b← §f排行榜 · 荣誉陈列']
# 门吏头顶的地下城招牌（在 NPC 名字之上）
dungeon_header:
  at: [-14.5, 61.15, 110.5]
  lines: ['§c§l⚔ 地下城入口 ⚔', '§7Q01–Q07 · 挑战 · 深渊 · 团本', '§7本周精选：§f{featured}']
board:
  at: [-24.5, 61.2, 109.0]
  rows: 3
honors:
  at: [-24.5, 62.5, 112.6]
