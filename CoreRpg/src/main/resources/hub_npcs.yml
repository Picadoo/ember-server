# 枢纽工坊 NPC（Adyeshach + Bukkit hitbox）— docs/design/design-ember-hub-workshop-npcs.md
# + 日常门吏 ember_dungeon_clerk — docs/design/design-ember-hub-dungeon-clerk.md
# ember_guide（灰烛）仍由 quest.yml / QuestService 管理，此处不列。
enabled: true
npcs:
  ember_smith:
    enabled: true
    id: ember_smith
    name: '§6锻炉师 · 烬砧'
    world: ember_hub
    x: -11.5
    y: 58.0
    z: 105.5
    yaw: 90.0
    # D64: P1 默认模式 → 工坊（主线本装备）；旧 ember_forge 不再对玩家开放
    action: p1_forge
    tell: '§6烬砧：§f手持刃或护符，在工坊里强化、升阶、精工。材料从主线本来。'
    menu: ember_p1_forge
    open_menu: true
  ember_enchanter:
    enabled: true
    id: ember_enchanter
    name: '§d咒火师 · 余晶'
    world: ember_hub
    x: -21.5
    y: 58.0
    z: 104.5
    yaw: 270.0
    # D64: 主线本里附魔不生效（源表 A01/A02），余晶改为讲解员 → 帮助页
    action: help
    tell: |-
      §d余晶：§f主线本只认刃、护符与套装——附魔、宝石、旧天赋在主线本里都不加属性。
      §7不清楚的地方，看帮助页。
    menu: ember_help
    open_menu: true
  ember_quartermaster:
    enabled: true
    id: ember_quartermaster
    name: '§a补给官 · 灰粮'
    world: ember_hub
    x: -18.5
    y: 58.0
    z: 114.5
    yaw: 0.0
    # 1.36.1: P1 默认模式 → 补给官卖主线本回复药（装备页下方的购买按钮）；旧 ember_life 不再从这里打开
    action: p1_supply
    tell: |-
      §a灰粮：§f回复药 10 余烬币一瓶，装备页下方就能买，进本前补到 5 瓶。
      §7副本里按数字键切到回复药、按住右键喝；每天第一次倒下会退还那一局喝掉的药。
    menu: ember_p1_gear
    open_menu: true

  ember_dungeon_clerk:
    enabled: true
    id: ember_dungeon_clerk
    name: '§e门吏 · 灰钥'
    world: ember_hub
    x: -14.5
    y: 58.0
    z: 110.5
    yaw: 90.0
    # D64: 门吏改送主线本（冒险页）；旧日常窟不再对玩家开放
    action: adventure
    tell: |-
      §e灰钥：§f主线本靠体力进，一次 30，0 点回满。
      §7Q01 灰烬庭院起步，首通开放下一张图——点菜单选图。
    menu: ember_p1_adventure
    open_menu: true
