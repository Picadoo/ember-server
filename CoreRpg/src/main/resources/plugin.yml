name: CoreRpg
main: town.sunshine.corerpg.CoreRpgPlugin
version: 1.65.248-d557.local
author: sunshine-town
description: 余烬 RPG — 币/签到/活跃/悬赏/强化/镶嵌/分解/重铸/灾厄/精英试炼/誓约/天赋/技能/晶钻商城/月卡/体力/邮寄/好友/设置/天梯/使魔/盟约/竞技/寄售/材料仓 + 记分板/刷怪
softdepend: [MythicMobs, NeigeItems, PlaceholderAPI, Adyeshach]
load: POSTWORLD
commands:
  corerpg:
    description: RPG 状态 / 刷怪 / 币 / 签到 / 活跃 / 悬赏 / 强化 / 镶嵌 / 分解 / 重铸 / 灾厄 / 深渊 / 誓约 / 天赋 / 技能 / 晶钻 / 商城 / 月卡 / 邮寄 / 好友 / 设置 / 使魔 / 盟约 / 竞技 / 寄售 / 材料仓
    usage: /corerpg <spawn|status|afk|coin|sign|activity|bounty|enhance|socket|scrap|reforge|calamity|abyss|elite|raid|set|covenant|talent|skill|cash|tickets|shop|monthly|vip|mail|friend|settings|ladder|pet|guild|arena|pvp|auction|warehouse|p1|storage|invsnap|admin|reload|help>
    permission: corerpg.use
    aliases: [crpg, rpg]
  hub:
    description: 回到余烬枢纽（主城）
    usage: /hub
    permission: corerpg.use
    aliases: [spawn, lobby, 回城]
permissions:
  corerpg.use:
    default: true
  corerpg.enhance:
    default: true
  corerpg.socket:
    default: true
  corerpg.covenant:
    default: true
  corerpg.talent:
    default: true
  corerpg.skill:
    default: true
  corerpg.cash:
    default: true
  corerpg.shop:
    default: true
  corerpg.monthly:
    default: true
  corerpg.scrap:
    default: true
  corerpg.reforge:
    default: true
  corerpg.mail:
    default: true
  corerpg.mail.send:
    default: op
  corerpg.friend:
    default: true
  corerpg.settings:
    default: true
  corerpg.pet:
    default: true
  corerpg.guild:
    default: true
  corerpg.arena:
    default: true
  corerpg.auction:
    default: true
  corerpg.warehouse:
    default: true
  corerpg.admin:
    default: op
