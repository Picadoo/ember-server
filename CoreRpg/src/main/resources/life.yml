# CoreRpg 1.11.0 生活玩法（docs/ember-master-plan.md §8）
# /corerpg life  · 枢纽补给：食物/钓竿（币消耗）、代烤鱼、熬药、遗物/宝珠兑换（每周上限，不绕过战斗：稳固符需核心碎片）
enabled: true

# 生活等级：钓到 1 条 +fish_xp；代烤每条 +xp_each；配方 xp 字段
fish_xp: 2
level_xp: [0, 20, 60, 150, 300, 600, 1000, 1600]   # Lv1..Lv8 所需累计经验

cook:
  inputs: [fish_ember_cod, fish_ember_salmon]
  output: food_ember_grilled_fish
  coin_each: 1
  max_per_use: 32
  xp_each: 1

offers:
  bread:
    name: '&e余烬面包 ×8'
    coin: 40
    give: { food_ember_bread: 8 }
  rod:
    name: '&b余烬钓竿'
    coin: 60
    give: { tool_ember_rod: 1 }
  heal_potion:
    name: '&c熬制 余烬回复药'
    inputs: { fish_ember_puffer: 1, fish_ember_cod: 2 }
    coin: 10
    give: { potion_ember_heal: 1 }
    life_level: 2
    xp: 3
  reforge_stone:
    name: '&6遗物 → 余烬重铸石'
    inputs: { treasure_ember_relic: 5 }
    coin: 30
    give: { mat_ember_reforge_stone: 1 }
    weekly: 5
    life_level: 3
    xp: 5
  stable_charm:
    name: '&b宝珠 → 余烬稳固符'
    inputs: { treasure_ember_pearl: 3, mat_ember_core_fragment: 3 }
    coin: 300
    give: { mat_ember_stable_charm: 1 }
    weekly: 1
    life_level: 5
    xp: 10

# 食用/饮用时附加效果：EFFECT:放大等级(0=I):持续tick；cooldown 秒  # 1.12.0 断供补源：魂尘（钓鱼杂物）与使魔蛋（魂尘 + 币）。使魔只有展示战力，不进属性层。
  #   钓鱼杂物 10%（旧靴 60 / 碎骨 40），实测约 2.9 条/分钟 → 约 17 件杂物/小时
  soul_dust:
    name: '&d旧靴 → 余烬魂尘'
    inputs: { junk_ember_boot: 2 }
    coin: 5
    give: { mat_ember_soul_dust: 1 }
    daily: 2
    life_level: 2
    xp: 1
  soul_dust_bone:
    name: '&d碎骨 → 余烬魂尘'
    inputs: { junk_ember_bone: 2 }
    coin: 5
    give: { mat_ember_soul_dust: 1 }
    daily: 2
    life_level: 2
    xp: 1
  pet_ashling:
    name: '&a孵化 余烬灰灵'
    inputs: { mat_ember_soul_dust: 10 }
    coin: 600
    give: { pet_ember_ashling: 1 }
    weekly: 1
    life_level: 4
    xp: 5
  pet_cinder:
    name: '&6孵化 余烬烬火'
    inputs: { mat_ember_soul_dust: 10 }
    coin: 600
    give: { pet_ember_cinder: 1 }
    weekly: 1
    life_level: 4
    xp: 5
  offhand_ward:
    name: '&a余烬守腕'
    coin: 80
    weekly: 1
    give: { acc_ember_offhand_ward: 1 }
  offhand_vita:
    name: '&a余烬生坠'
    coin: 80
    weekly: 1
    give: { acc_ember_offhand_vita: 1 }

consumables:
  food_ember_grilled_fish: { effects: ['REGENERATION:0:120'] }
  potion_ember_heal: { effects: ['HEAL:1:1'], cooldown: 20 }
  potion_ember_swift: { effects: ['SPEED:0:3600'] }
  potion_ember_strength: { effects: ['INCREASE_DAMAGE:0:1200'] }
  potion_ember_night: { effects: ['NIGHT_VISION:0:3600'] }

# 币消耗：铁砧修理每次手续费（强化手续费见 enhance.yml coin_fee）
fees:
  repair: 20
