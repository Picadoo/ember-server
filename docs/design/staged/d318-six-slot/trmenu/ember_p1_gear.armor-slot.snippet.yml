# D318 六槽 T1 · 装备页「护甲」格（预置片段，菜单岗定稿时并入 ember_p1_gear.yml 的 Icons，格位由菜单岗选；T2 前不放进线上目录）
# 开关关（armor_on = 0）且没有待领时这一格显示成普通玻璃板（和边框一样，不是按钮），装备页其余内容逐字不变。
# D320 ④⑤：开关关但还有待领（例如回滚后）时，这一格显示「待领物品」，点击直接领取（插件回领取结果）。
#   priority 3 = 开关开（护甲入口，待领行也在 lore 里）；priority 2 = 有待领（只有开关关时才会走到这一支）。
  M:
    update: 20
    display:
      material: gray stained glass pane
      name: '§8'
    icons:
      - condition: 'check papi %corerpg_p1_armor_on% == 1'
        priority: 3
        display:
          material: iron chestplate
          name: '§6护甲'
          lore:
            - '%corerpg_p1_armor_head%'
            - '%corerpg_p1_armor_chest%'
            - '%corerpg_p1_armor_legs%'
            - '%corerpg_p1_armor_boots%'
            - '%corerpg_p1_armor_stash_line%'
            - ''
            - '§7阶级和强化跟随已选护符；成色 / 精工看掉落'
            - '§e➥ §f打开护甲页（对比后换上）'
        actions:
          all:
            - 'sound: BLOCK_NOTE_PLING-1-2'
            - 'menu: ember_p1_armor'
      - condition: 'check papi %corerpg_p1_armor_stash_has% == 1'
        priority: 2
        display:
          material: chest
          name: '§6待领物品'
          lore:
            - '%corerpg_p1_armor_stash_line%'
            - ''
            - '§7原来穿着的东西收在这里，一件不少'
            - '§e➥ §f点击领取到背包（背包满时留在这里，腾出空位再来）'
        actions:
          all:
            - 'sound: BLOCK_NOTE_PLING-1-2'
            - 'command: corerpg p1 armor claim'
