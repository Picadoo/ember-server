  C14: {econ_row: C14, name: 回复药购买, takes: [coin], economy_keys: [C14.coin], config: ["ember-v1-economy.yml#sinks.C14", "ember-v1.yml#shop.heal_potion.price"]}
  C15: {econ_row: C15, name: 外观商店（暂停）, takes: [coin, badge, mark, cosmetic], code: ["p1/EmberCosmetics.java#C_BOUGHT"]}
