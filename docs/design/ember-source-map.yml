# ember-source-map.yml — D242 / ARCH S4-1 · machine-readable source map for Ember P1 gear / materials / currencies
#
# Every way a P1 character can GET gear, a material or a currency (and every registered sink) → where it happens
# (content / mode / boss / drop table / economy key) → which config file and which code location decide it.
# Authoritative prose: docs/design/DESIGN-ember-gear-structure-2026-10-06.md (§6 explains this file).
#
# Guarded by CoreRpg/src/test/java/town/sunshine/corerpg/p1/EmberSourceMapTest.java — the build fails when
#   · an EmberEconomy row (S01–S38, LS1–LS5, C01–C19) has no entry here;
#   · a key under sources/sinks in plugins/CoreRpg/ember-v1-economy.yml is not listed in some economy_keys (or a listed one is gone);
#   · a ledger / grant key or ledger run prefix written by p1/*.java is not covered by some grant_keys / ledger_runs pattern
#     (or a pattern here no longer matches anything in the code);
#   · a map / raid / rush entry in ember-v1-runs.yml, the festival dungeon, an AFK tier, a signature, an item affix,
#     an item source value or a vault material is missing (or its tier / boss / name / slot disagree with the config / code);
#   · a code ref (file#text) or config ref (file#dotted.key) below no longer resolves; a counter family is not in EmberCounters;
#   · (D243) a bundled CoreRpg/src/main/resources/ember-v1*.yml differs from the live plugins/CoreRpg copy;
#   · (D245) item_provenance below disagrees with EmberItemData / EmberProvenance / EmberItemStore (NBT keys, column,
#     rule examples → map / source row);
#   · (D244) a stock below does not list exactly the EmberEconomy rows touching its account, a life.yml / CoreFish item is
#     missing from stocks.life_item, a CoreGacha ticket grant is missing, or a gacha item has a non-cosmetic kind.
# tools/p1sim reads this file (rules.py snapshot → sourcemap.py): entries with `sim:` are one-time sources the sim pays.
# Patterns: <map> <n> <kind> <slot> <day> <month> <res> … = one dynamic segment ([a-z0-9_]+).
# Refs: code paths are relative to code_root, config paths to config_root; "#text" for code = a substring that must appear in the file.
# Behaviour-neutral: nothing in CoreRpg reads this file. Update it in the same commit as any new source / key / map.

version: 1
balance_version: 63
built_against: "CoreRpg 1.65.70 (D245)"
code_root: CoreRpg/src/main/java/town/sunshine/corerpg/
config_root: plugins/CoreRpg/

# ---------------------------------------------------------------------------------------------------- accounts
# What can be owned. store = where the balance lives. econ = EmberEconomy.Account.
accounts:
  coin:        {name: 余烬币, econ: COIN, store: "PlayerData.coin (cr_players)"}
  xp:          {name: 余烬经验, econ: XP, store: "ProgressService grantFlatEmberXp (progress.yml ember_xp.curve)"}
  shard:       {name: 余烬碎片, econ: SHARD, ni: mat_ember_shard, store: "EmberVault → cr_warehouse"}
  core:        {name: 核心碎片, econ: CORE, ni: mat_ember_core_fragment, store: "EmberVault → cr_warehouse"}
  bone:        {name: 骨尘, econ: BONE, ni: mat_ember_bone_dust, store: "EmberVault → cr_warehouse"}
  blank:       {name: 装备胚料, econ: BLANK, ni: mat_ember_v1_blank, store: "EmberVault → cr_warehouse"}
  bound_mat:   {name: 绑定材料, econ: BOUND_MAT, store: "p1_vbound_<ni> counter (cannot leave the account)"}
  mark:        {name: 锻造印记 T1–T3, econ: MARK, store: "p1_mark_t<n> counter"}
  insignia:    {name: 首领徽记（每图）, econ: INSIGNIA, store: "p1_sigmark_<map> counter"}
  badge:       {name: 余烬徽, econ: BADGE, store: "p3_badge counter"}
  stamina:     {name: 体力, econ: STAMINA, store: "StaminaService (cash.yml stamina)"}
  potion:      {name: 回复药（绑定）, econ: POTION, ni: potion_ember_heal, store: "inventory (EmberSupplyService)"}
  gear:        {name: P1 装备, econ: GEAR, store: "item NBT ember_v1 + cr_p1_item (EmberItemData v2, HMAC)"}
  title:       {name: 称号, econ: TITLE, store: "EmberCosmetics p2_title_ / p2_cosbuy_"}
  fest_coin:   {name: 国庆币, econ: FEST_COIN, ni: ember_fest_coin_gq26, store: "EmberVault → cr_warehouse (event)"}
  life_item:   {name: 生活产出, econ: LIFE_ITEM, store: "life.yml offers → NI items"}
  gacha_ticket: {name: 扭蛋券, econ: GACHA_TICKET, store: "CoreGacha tables"}
  cosmetic:    {name: 外观, econ: COSMETIC, store: "EmberCosmetics p2_cosbuy_"}
  mail:        {name: 邮件附件, econ: MAIL, store: "MailService"}

# item `source` field (EmberItemData.SOURCES) — decides dismantle / duplicate eligibility
item_sources:
  drop:    {meaning: "settlement random roll, raid_item, chest extra, 8-mark exchange (mark_item)", dismantle: true, code: ["p1/EmberRunService.java#: \"drop\""]}
  quest:   {meaning: "first-clear choice item (fc_<map>_item) / starter kit (starter_<slot>)", dismantle: false, code: ["p1/EmberRunService.java#startsWith(\"starter_\") ? \"quest\""]}
  admin:   {meaning: "/corerpg p1 give / givedup (OP test items); never counts for the codex; givedup may feed the reroll duplicate (D243)", dismantle: false, code: ["p1/EmberCommand.java#\"admin\""]}
  reissue: {meaning: "manual re-issue by staff", dismantle: false, code: ["p1/EmberCompare.java#\"reissue\""]}
  migrate: {meaning: "legacy migration (none on live: no old players)", dismantle: false, code: ["p1/EmberCompare.java#\"migrate\""]}

# item provenance (D245 · ARCH systems-map step 4) — WHERE a piece came from, stored on the item next to the D208 keys.
# Behaviour-neutral: no stat / lore / dismantle / codex rule reads it; shown to OPs only (/corerpg p1 inspect). Pieces made before
# 1.65.70 have no origin and stay valid (their canonical / HMAC bytes are unchanged; v2 canonical appends "|o:<packed>" only when
# present). The DB column is never wiped by a later write (UPDATE / upsert keep a non-empty origin).
item_provenance:
  nbt: {om: "map / mode id (lower [a-z0-9_], ≤ 24)", os: "source row S## / X##", or: "run id / request id (≤ 48)", ot: "unix seconds (int)"}
  column: "cr_p1_item.origin VARCHAR(128) NOT NULL DEFAULT ''"
  packed: "map|src|run|at"
  unknown_source: X00
  code: ["p1/EmberProvenance.java#public static EmberItemData.Origin forReward(", "p1/EmberItemData.java#public static final class Origin", "p1/EmberItemStore.java#\"origin\", \"VARCHAR(128) NOT NULL DEFAULT ''\"", "p1/EmberRunService.java#EmberProvenance.forReward(g.key, row.runId, row.created)"]
  rules:  # example = [ledger reward key, ledger run id] → expected map / src (pinned by EmberSourceMapTest.itemProvenanceMatchesCode)
    base_item:      {example: [base_item, q01-k3x9a-1b2c], map: q01, src: S01, meaning: "settlement random roll (normal / repeat)"}
    challenge_item: {example: [base_item, q03c-k3x9a-1b2c], map: q03c, src: S01, meaning: "challenge settlement roll"}
    abyss_item:     {example: [base_item, q05a2-k3x9a-1b2c], map: q05a2, src: S13, meaning: "abyss floor settlement roll"}
    chest_item:     {example: [extra_chest_item, q02-k3x9a-1b2c], map: q02, src: S34, meaning: "chest extra roll"}
    raid_item:      {example: [raid_item, r01-k3x9a-1b2c], map: r01, src: S12, meaning: "raid settlement piece"}
    fc_item:        {example: [fc_q01_blade_item, q01-k3x9a-1b2c], map: q01, src: S06, meaning: "first-clear choice piece"}
    starter:        {example: [starter_blade, starter], map: starter, src: S35, meaning: "T0 starter kit"}
    mark_redeem:    {map: forge, src: S28, meaning: "8-mark exchange (run = payment request id)", code: ["p1/EmberRunService.java#EmberProvenance.forRedeem(rid"]}
    admin:          {map: admin, src: X03, meaning: "/corerpg p1 give / givedup (run = give / givedup)", code: ["p1/EmberCommand.java#EmberProvenance.forAdmin(\"give\"", "p1/EmberCommand.java#EmberProvenance.forAdmin(\"givedup\""]}

