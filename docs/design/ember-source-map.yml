# ---------------------------------------------------------------------------------------------------- sources
sources:
  S01:
    name: 主线 / 挑战 / 团本结算基线（每局 1 件装备）
    econ_row: S01
    status: live
    pays: [coin, shard, bone, core, xp, mark, gear]
    period: run
    content: [q01, q02, q03, q04, q05, q06, q07, challenge, r01, r02, r03]
    drop_table: "gear: EmberRunRules.rollItem — family TARGET_WEIGHT 0.60 + loot_bias (own_family / map_share / slot), quality QUALITY_WEIGHTS 70/23/6/1 (challenge & raid 60/28/10/2), craft CRAFT_WEIGHTS 70/20/9/1, tier = map tier"
    grant_keys: [base_coin, base_shard, base_bone, base_core, base_xp, base_mark, base_item]
    economy_keys: [S01.coin, S01.shard, S01.bone, S01.core, S01.xp, S01.mark]
    config: ["ember-v1-economy.yml#sources.S01", "ember-v1-runs.yml#loot_bias", "ember-v1-runs.yml#challenge.quality"]
    code: ["p1/EmberRunRules.java#public static List<Grant> settle(", "p1/EmberRunRules.java#QUALITY_WEIGHTS", "p1/EmberSettleService.java#void settleFor("]
    notes: "The chest's extra gear roll is S34 since D243. Raid / abyss settles reuse the same keys; abyss base_* is re-tagged S13 by EmberEconomy.sourceForGrant."
  S02:
    name: 宝箱怪
    econ_row: S02
    status: live
    pays: [coin]
    period: run
    content: [q01, q02, q03, q04, q05, q06, q07, challenge]
    drop_table: "EmberRunRules.EXTRA_WEIGHTS none/treasure/elite/chest = 70/15/10/5"
    grant_keys: [extra_treasure_coin]
    economy_keys: [S02.coin]
    config: ["ember-v1-economy.yml#sources.S02"]
    code: ["p1/EmberRunRules.java#\"extra_treasure_coin\""]
  S03:
    name: 精英房
    econ_row: S03
    status: live
    pays: [shard, core]
    period: run
    content: [q01, q02, q03, q04, q05, q06, q07, challenge]
    grant_keys: [extra_elite_shard, extra_elite_core]
    economy_keys: [S03.shard, S03.core]
    config: ["ember-v1-economy.yml#sources.S03"]
    code: ["p1/EmberRunRules.java#\"extra_elite_shard\""]
  S04:
    name: 词缀精英结算
    econ_row: S04
    status: live
    pays: [shard]
    period: run
    content: [q01, q02, q03, q04, q05, q06, q07]
    grant_keys: [var_affix_shard]
    economy_keys: [S04.shard]
    config: ["ember-v1-economy.yml#sources.S04", "ember-v1-runs.yml#variety.affix_shard"]
    code: ["p1/EmberRunRules.java#public static List<Grant> varietyGrants("]
  S05:
    name: 房间事件达标
    econ_row: S05
    status: live
    pays: [core]
    period: run
    content: [q01, q02, q03, q04, q05, q06, q07]
    grant_keys: [var_event_core, "var_event_<kind>"]
    economy_keys: [S05.core]
    config: ["ember-v1-economy.yml#sources.S05", "ember-v1-runs.yml#variety.event_core"]
    code: ["p1/EmberRunRules.java#\"var_event_core\""]
  S06:
    name: 首通包（自选件 / 材料币）
    econ_row: S06
    status: live
    pays: [gear, shard, core, bone, blank, coin]
    period: once
    content: [q01, q02, q03, q04, q05, q06, q07]
    drop_table: "ember-v1-runs.yml maps.<map>.first_clear; choice item = standard q0 / craft 0 / +0, source quest"
    grant_keys: ["fc_<map>_choice", "fc_<map>_item", "fc_<map>_shard", "fc_<map>_core", "fc_<map>_coin", "fc_<map>_bone", "fc_<map>_blank", "fc_<map>_unlock", "fc_<map>_armor_<slot>"]
    economy_keys: [S06.q03.shard, S06.q03.core, S06.q03.coin, S06.q04.blank, S06.q04.core, S06.q04.coin, S06.q05.bone, S06.q05.blank, S06.q05.coin, S06.q06.core, S06.q06.coin, S06.q07.blank, S06.q07.core, S06.q07.coin]
