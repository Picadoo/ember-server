  C19: {econ_row: C19, name: 扭蛋抽取（耗券）, takes: [gacha_ticket], config: ["../CoreGacha/gacha.yml#cost_per_pull", "../CoreGacha/gacha.yml#daily_pull_cap"], notes: "D244 (G10): 1 ticket / pull, ≤ 50 pulls / day. Registered, tags only"}

# ---------------------------------------------------------------------------------------------------- stocks (D244 / G10)
# Item-level stocks: where the balance lives, which registered rows add to it (rows_in — incl. sinks that convert into it)
# and which take from it (rows_out), plus the item ids. EmberSourceMapTest: rows_in ∪ rows_out == EmberEconomy.touching(econ),
# rows_out are sinks; life_item.items == every item in life.yml (offers / cook) + CoreFish tables that is not another
# account's ni; gacha_ticket.grants == CoreGacha config tickets keys; every gacha.yml item kind ∈ cosmetic.gacha_kinds.
stocks:
  insignia:
    econ: INSIGNIA
    store: "p1_sigmark_<map>@all (one balance per signature map, not interchangeable)"
    rows_in: [S07, S08, S09, S17, S18, S23]
    rows_out: [C12, C13]
    cap: none
    model: "tools/p1sim/insignia.py (D222, opt-in: S07/S08/S09/S17/S18/S23 → C12/C13; p2econ --insignia)"
  badge:
    econ: BADGE
    store: "p3_badge@all"
    rows_in: [S16, S19, S27]
    rows_out: [C15, C16, C18]
    cap: "S27 exchange cap 40 (event); others uncapped"
    model: "p2econ behaviour only (earning); stock / spend not modelled — sinks C15 / C16 paused, C18 event-only"
  life_item:
    econ: LIFE_ITEM
    store: "inventory NI items (not in the vault whitelist)"
    rows_in: [S30, S36]
    rows_out: [C17]
    cap: "life.yml offers daily / weekly (soul dust 2/day, reforge stone 5/week, stable charm 1/week, pets 1/week)"
    model: "none (REG §5: 生活玩法; C17 stable charm eats 3 core / week — the only exit into the power economy)"
    items: [fish_ember_cod, fish_ember_salmon, fish_ember_puffer, treasure_ember_relic, treasure_ember_pearl, junk_ember_boot, junk_ember_bone, food_ember_bread, food_ember_grilled_fish, tool_ember_rod, mat_ember_reforge_stone, mat_ember_stable_charm, mat_ember_soul_dust, pet_ember_ashling, pet_ember_cinder, acc_ember_offhand_ward, acc_ember_offhand_vita]
  gacha_ticket:
    econ: GACHA_TICKET
    store: "CoreGacha wallet (gacha_* tables); NI item ember_gacha_ticket redeems into it"
    rows_in: [S37, C16]
    rows_out: [C19]
    cap: "exchange 5 / day (C16); pulls 50 / day (C19)"
    model: "none (cosmetics only; outside the power model)"
    grants: [welcome, online_minutes, afk_worlds, bounty_clears, exchange, ni_item]   # afk_worlds = where online minutes do not count
  cosmetic:
    econ: COSMETIC
    store: "CoreGacha owned items + EmberCosmetics p2_cosbuy_"
    rows_in: [S38, C15]
    rows_out: []
    cap: none
    model: "OUT (no stats)"
    gacha_kinds: [badge, tag, aura, pet, show, corerpg]
