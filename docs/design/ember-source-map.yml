    notes: "D392 批 A·M；有奖同 S40；首通略薄；p1sim 另号；地图/MM/TrMenu 另号；不抬 afk.tiers / daily_kills；不放开 gate_daily"
  X04:
    name: 六槽迁移补发（source=migrate，等价换算，不产生新价值）
    econ_row: null
    status: flag_off
    pays: [gear]
    period: once
    content: [account]
    counters: []
    code: ["p1/EmberSixMigration.java#ORIGIN_SRC = \"X04\""]
    notes: "D318 six-slot migration (spec §3.2): 4 armor pieces with the charm's family / tier / quality / craft (H / D bit-identical), bound, not dismantlable; idempotency flag p1_six_mig in plugins/CoreRpg/p1-six/<uuid>.yml; switch gear.six_slot.migrate default off"
  X03:
    name: 管理员发放 / 测试（/corerpg p1 give · give dup · coin give）
    econ_row: null
    status: admin_only
    pays: [gear, coin]
    period: none
    content: [account]
    code: ["p1/EmberCommand.java#private boolean give(", "p1/EmberCommand.java#private boolean giveDup("]
    notes: "OP-only; give and givedup = source admin (not dismantlable, not codex; D243 fixed G4 — givedup was source drop); givedup still feeds the reroll duplicate"

# ---------------------------------------------------------------------------------------------------- legacy (closed while P1 is on)
legacy:
  LS1: {econ_row: LS1, name: "/dp start · /corerpg enter 旧本", status: closed, code: ["LegacyGate.java#class LegacyGate"]}
