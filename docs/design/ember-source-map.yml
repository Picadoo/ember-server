  LS5: {econ_row: LS5, name: scrap / reforge / 旧 enhance, status: closed, config: ["scrap.yml", "enhance.yml"]}

# ---------------------------------------------------------------------------------------------------- sinks
sinks:
  C01: {econ_row: C01, name: 进主线 / 挑战 / 深渊段（体力）, takes: [stamina], ledger_keys: [cost, refund], economy_keys: [C01.stamina], config: ["ember-v1-economy.yml#sinks.C01", "ember-v1-runs.yml#cost"], code: ["p1/EmberSessionService.java#\"cost\""]}
  C02: {econ_row: C02, name: 进团本（体力 50）, takes: [stamina], config: ["ember-v1-runs.yml#raids.r01.cost"], code: ["p1/EmberRaidService.java#C_RAID"]}
  C03: {econ_row: C03, name: 强化, takes: [shard, core, coin], code: ["p1/EmberUpgradeRules.java#SHARDS = {0, 4, 6, 8, 12, 16, 22, 30, 40, 54, 72}", "p1/EmberEconomy.java#case \"enhance\": return \"C03\""]}
  C04: {econ_row: C04, name: 升阶, takes: [shard, core, blank, coin], code: ["p1/EmberUpgradeRules.java#public static Cost upgradeCost(int tier)"]}
  C05: {econ_row: C05, name: 精工, takes: [blank, bone, coin], code: ["p1/EmberEconomy.java#case \"refine\": return \"C05\""]}
  C06: {econ_row: C06, name: 成色, takes: [blank, bone, coin], code: ["p1/EmberEconomy.java#case \"quality\": return \"C06\""]}
  C07: {econ_row: C07, name: 8 印记兑换（付印记）, takes: [mark], economy_keys: [C07.marks], config: ["ember-v1-economy.yml#sinks.C07"], code: ["p1/EmberRunService.java#EmberEconomy.spendMark(d, \"C07\""]}
  C08: {econ_row: C08, name: 深渊层费（币 / 超额 T3 印记）, takes: [coin, mark], ledger_keys: [cost_coin, refund_coin], config: ["ember-v1-runs.yml#abyss.fee_mark_coin"], code: ["p1/EmberAbyssService.java#EmberEconomy.spendCoin(pd, \"C08\""]}
  C09: {econ_row: C09, name: 天赋学习, takes: [coin], economy_keys: [C09.row1.coin, C09.row2.coin, C09.row3.coin], config: ["ember-v1-economy.yml#sinks.C09", "ember-v1-growth.yml#talents.rows"]}
  C10: {econ_row: C10, name: 天赋重置, takes: [coin], economy_keys: [C10.respec_coin], config: ["ember-v1-economy.yml#sinks.C10", "ember-v1-growth.yml#talents.respec_coin"]}
  C11: {econ_row: C11, name: 洗练（词条）, takes: [coin, shard, gear], config: ["ember-v1-growth.yml#reroll.coin", "ember-v1-growth.yml#reroll.affixes"], code: ["p1/EmberEconomy.java#case \"reroll\": return \"C11\""]}
  C12: {econ_row: C12, name: 烬炉烙印, takes: [insignia, coin], economy_keys: [C12.insignia, C12.coin_per_tier], config: ["ember-v1-economy.yml#sinks.C12"], code: ["p1/EmberSignature.java#IMPRINT_MARKS = 5"]}
