# 余烬 v1 (P1) 护甲页（D318 六槽 T1 · 预置稿，T2 由菜单岗定稿后再放进 plugins/TrMenu/menus/）
#   spec: docs/design/DESIGN-ember-six-slot-t1-spec-revision-2026-10-08.md §2.3（示例布局）
#   数值全部来自 CoreRpg 占位符 %corerpg_p1_armor_*%（插件真实公式算的整装生命差），菜单不自己算。
#   D320 ⑤ 每一格的写法（TrMenu 子图标按 priority 从高到低取第一个条件成立的，都不成立显示默认图标）：
#     默认图标 = 开关关时的样子：灰玻璃板「护甲功能尚未开放」，点击照样代发本格的命令，插件统一回「护甲功能尚未开放。」
#     priority 2 = armor_on == 1（开关开）时的样子；priority 3 = 更具体的状态（有候选 / 能全部换上 / 有待领）。
#     armor_<slot>_has、armor_all_has 在开关关时是空串，所以这两个 priority 3 分支只会在开关开时成立，不必再叠 armor_on。
#     待领（L）例外：armor_stash_has 开关关也有值（待领与开关脱钩，回滚后仍能领回原物），有待领时开关关也显示领取入口。
#   每一格点击都有一句回复，从不静默：穿着格 → armor worn <部位>（报穿着什么、怎么换）；候选格 → armor equip <部位>
#     （没有候选回「背包里没有可换的…」）；全部换上 → armor all（没得换回「四个部位都已是最好的一件」）；
#     四件套 → armor set（D325 真实状态：未激活/进行中/已激活，D169 护甲 n/2）；待领 → armor claim；返回 → 装备页。
#   点击 = 菜单代发内部命令（同 ember_p1_forge 写法），玩家看不到也不需要打命令。
# 打开：装备页「护甲」格（见 ember_p1_gear.armor-slot.snippet.yml）；Bindings 直接打开时开关关也只看到「尚未开放」+ 待领。

Title: '§6余烬 · 护甲'

Bindings:
  Commands:
    - '(?i)ember_p1_armor'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 400

Layout:
  - '#########'
  - '#1 2 3 4#'
  - '#a b c d#'
  - '#S A L R#'
  - '#########'

Icons:
  '#':
    display:
      material: gray stained glass pane
      name: '§8'

  # 穿着：头盔（只读；点击回穿着什么、怎么换）
  '1':
    update: 20
    display:
      material: gray stained glass pane
      name: '§8护甲功能尚未开放'
    actions:
      all:
        - 'command: corerpg p1 armor worn head'
    icons:
      - condition: 'check papi %corerpg_p1_armor_on% == 1'
        priority: 2
        display:
          material: leather helmet
          name: '§6穿着 · 头盔'
          lore:
            - '%corerpg_p1_armor_head%'
            - '%corerpg_p1_armor_head_info%'
            - ''
            - '§7护甲的阶级和强化跟随已选护符'
            - '§7成色和精工看掉落，换更好的就多一点生命'
            - '§8也可以照旧直接拖进护甲栏'
        actions:
          all:
            - 'command: corerpg p1 armor worn head'

  # 背包里同部位最好的一件
  'a':
    update: 20
    display:
      material: gray stained glass pane
      name: '§8护甲功能尚未开放'
    actions:
      all:
        - 'command: corerpg p1 armor equip head'
    icons:
      - condition: 'check papi %corerpg_p1_armor_head_has% == 1'
        priority: 3
        display:
          material: leather helmet
          name: '§e可换上 · 头盔'
          lore:
            - '%corerpg_p1_armor_head_cand%'
            - '%corerpg_p1_armor_head_cmp%'
            - '%corerpg_p1_armor_head_delta%'
            - '%corerpg_p1_armor_head_fam%'
            - ''
            - '§7换下来的那件回到背包'
            - '§e➥ §f点击换上'
        actions:
          all:
            - 'sound: BLOCK_NOTE_PLING-1-2'
            - 'command: corerpg p1 armor equip head'
      - condition: 'check papi %corerpg_p1_armor_on% == 1'
        priority: 2
        display:
          material: gray stained glass pane
          name: '§8背包里：头盔'
          lore:
