# D430 / D1164 K2b: 随机锻造 + 成色下限可发现
Title: '§6余烬 · 随机锻造'

Bindings:
  Commands:
    - '(?i)ember_p1_forgeroll'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 400

Layout:
  - '####N####'
  - '#123######'
  - '#456######'
  - '#abc######'
  - '#def######'
  - '###LRB###'

Events:
  Open:
    - 'sound: BLOCK_ANVIL_LAND-0.4-1.2'
    - 'tell: §6旁路赌线§7 · 主养请回工坊强化/成色/精工'
    - 'tell: §e上两排普通锻 · 下两排§f成色下限§7（再扣胚8+骨8+币800 → 必≥精良）'
    - 'tell: §88 印记+4胚料+500币 · 成色标准70%/精良23%/卓越7% · 出不了极品'
    - 'tell: §c普通还差：§f%corerpg_p1_forge_gap_roll% §8· 下限还差：§f%corerpg_p1_forge_gap_roll_floor%'

Icons:
  '#':
    display:
      material: gray stained glass pane
      name: '§8'
  N:
    display:
      material: book
      name: '§6旁路 · 随机锻造说明'
