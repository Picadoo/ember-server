# 天梯子菜单壳 — docs/design/DESIGN-ember-guild-ladder.md §2
# 战力 / 深渊层数 / 周本竞速；PAPI + HD 见 docs/ember-holograms.md
# 大厅全息板（AFK 一带）：power -44 67 265 · abyss -40 67 265 · speed -36 67 265

Title: '§e余烬 · 天梯'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 200

Layout:
  - '#########'
  - '#       #'
  - '# P A S #'
  - '#  I M  #'
  - '####X####'

Events:
  Open:
    - 'sound: BLOCK_NOTE_PLING-1-0.8'
    - 'tell: §e【天梯】 §7战力 · 深渊层数 · 周本竞速。周结算只发外观。'
    - 'tell: §8全息板在挂机庭附近 · 战力 / 深渊 / 竞速三块'

Icons:
  '#':
    display:
      material: stained glass pane
      name: '§8 '

  X:
    display:
      material: arrow
      name: '§7返回主菜单'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-0'
        - 'menu: ember_hub'

  I:
    display:
      material: book
      name: '§e我的成绩'
      lore:
        - ''
        - '§7查看本人战力 / 深渊 / 竞速'
        - ''
        - '§7战力展示分：§f%ember_power_score%'
        - '§7余烬币：§f%corerpg_coin%'
        - ''
        - '§e➥ §f点击查询'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'command: corerpg ladder'

  M:
    display:
      material: sign
      name: '§7全息榜说明'
      lore:
        - ''
        - '§7挂机庭西侧三块全息（战力·深渊·竞速）· 每分钟刷新'
        - '§8位置：主世界 §f-44/-40/-36 · 67 · 265'
        - ''
        - '§7➥ §f聊天提示路径'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §7【天梯·全息】 §f挂机庭西侧三块全息（战力·深渊·竞速）§7 · 每分钟刷新'

  P:
    display:
      material: diamond
      name: '§b战力榜'
      lore:
        - ''
        - '§7按展示分排名'
        - '§8展示分 · 不乘伤害公式'
        - '§8周结算：外观称号'
        - ''
        - '§8全息：战力榜'
        - '§7榜首：§f%ember_ladder_power_1_name% §7(%ember_ladder_power_1_value%)'
        - ''
        - '§b➥ §f查看说明'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'command: corerpg ladder power'
        - 'tell: §8挂机庭全息 · 战力'
        - 'tell: §7展示分 · 不乘伤害 · 周结算外观称号'

  A:
    display:
      material: obsidian
      name: '§5深渊层数榜'
      lore:
        - ''
        - '§7本周 / 历史最高层'
        - '§8对齐深渊层数'
        - '§8周结算：外观'
        - ''
        - '§8全息：深渊榜'
        - '§7榜首：§f%ember_ladder_abyss_1_name% §7(%ember_ladder_abyss_1_value%层)'
        - ''
        - '§5➥ §f查看说明'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'command: corerpg ladder abyss'
        - 'tell: §8层数越高越靠前 · 周结算外观 · 对齐深渊层数'
        - 'tell: §8挂机庭全息 · 深渊'

  S:
    display:
      material: watch
      name: '§c周本竞速榜'
      lore:
        - ''
        - '§7周本通关秒数'
        - '§8越低越好'
        - '§8周结算：外观'
        - ''
        - '§8全息：竞速榜'
        - '§7榜首：§f%ember_ladder_speed_1_name% §7(%ember_ladder_speed_1_value%s)'
        - ''
        - '§c➥ §f查看说明'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'command: corerpg ladder speed'
        - 'tell: §8用时（秒）越低排名越高 · 只奖外观 · 禁核心'
        - 'tell: §8挂机庭全息 · 竞速'
