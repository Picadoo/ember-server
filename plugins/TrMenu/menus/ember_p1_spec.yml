# D141 天赋专精（P2 草案 §5za，源表 §13.67）— 每人一棵 3 排 × 3 个的小天赋树，每排只能点一个，从上往下点。
# 所有文字 / 状态都来自 PAPI %corerpg_p1_spec_*%（数据源 plugins/CoreRpg/ember-v1-growth.yml）；扣币、点数、重置全在服务端
# （/corerpg p1 spec pick|reset，带确认按钮）。入口：装备页、主界面；返回键回到打开它的那一页（D136 同款）。
# 专精点按进度一次性给（首通 Q03 / Q05 / Q07、任一挑战版、任一团本、深渊第 5 层），学会一个天赋付一次币；第一次重置免费。

Title: '§6天赋专精'

Bindings:
  Commands:
    - '(?i)ember_p1_spec'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 400

Layout:
  - '####P####'
  - '1##a#b#c#'
  - '2##d#e#f#'
  - '3##g#h#i#'
  - '###R#B#H#'

Events:
  Open:
    - 'sound: BLOCK_ENCHANTMENT_TABLE_USE-1-1'
    - 'tell: §8第 2 排猎手 · 仅主线重打词缀精英（首通/挑战/团本/深渊无效）'

Icons:
  '#':
    display:
      material: black stained glass pane
      name: '§8'

  P:
    update: 20
    display:
      material: nether star
      name: '§6天赋专精'
      lore:
        - '%corerpg_p1_spec_pts%'
        - ''
        - '§7专精点来源（一次性，各 +1）：'
        - '%corerpg_p1_spec_src_1%'
        - '%corerpg_p1_spec_src_2%'
        - '%corerpg_p1_spec_src_3%'
        - '%corerpg_p1_spec_src_4%'
        - '%corerpg_p1_spec_src_5%'
        - '%corerpg_p1_spec_src_6%'
        - ''
        - '§e打法取舍，不是变强：§7每个天赋都有得有失，'
        - '§7效果很小：模拟里单个天赋让通关率变化约 1 点上下，'
        - '§7例：3% ≈ Q07 重砸每次少挨 / 多挨 1 点。'
        - '§7选合你打法的那个；躲不好预警招时别点「回身斩」「踏步回气」。'
        - '§7装备的阶、成色、强化仍是主线。'
        - '§c第 2 排猎手：仅主线重打词缀精英'
        - '§8（首通 / 挑战 / 团本 / 深渊没有词缀精英 = 无效）'
        - '§8每排只能点一个 · 从上往下点 · 只能在城里改'

  '1':
    update: 20
    display:
      material: clock
      name: '%corerpg_p1_spec_row_1%'

  '2':
    update: 20
    display:
      material: bow
      name: '%corerpg_p1_spec_row_2%'

  '3':
    update: 20
    display:
      material: enchanted book
      name: '%corerpg_p1_spec_row_3%'

  a:
    update: 20
    display:
      material: iron sword
      name: '%corerpg_p1_spec_name_t1a%'
      lore:
        - ''
        - '%corerpg_p1_spec_good_t1a%'
        - '%corerpg_p1_spec_bad_t1a%'
        - '%corerpg_p1_spec_fit_t1a%'
        - ''
        - '%corerpg_p1_spec_st_t1a%'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - close
        - 'command: corerpg p1 spec pick t1a'

