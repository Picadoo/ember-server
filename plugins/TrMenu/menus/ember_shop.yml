# 余烬商城 — DESIGN-ember-economy-monetization.md §5 + DESIGN-ember-rpg-systems.md §8.1
# 日票：command corerpg shop buy daily_ticket + tell 回退（DESIGN-ember-cash-monthly.md）
# 在售：月卡、战令解锁、日票、周票（均为 CoreRpg 实装 SKU）· 软通货用 /corerpg coin

Title: '§6余烬 · 商城'

Options:
