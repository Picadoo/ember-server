    - 'sound: BLOCK_CHEST_OPEN-1-0'
    - 'tell: §6[商城] §7便利·特权货架 · §c不卖毕业伤害'
    - 'tell: §8日票可直接买 · 月卡点图标尝试购买 · 余烬币 /corerpg coin'

