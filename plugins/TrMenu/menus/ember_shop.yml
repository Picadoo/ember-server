# 余烬商城 — DESIGN-ember-economy-monetization.md §5 + DESIGN-ember-rpg-systems.md §8.1
# S0：体力药 / 周体力包（展示名；SKU 别名仍 daily_ticket / weekly_ticket）
# 在售：月卡、战令解锁、体力药、周体力包

Title: '§6余烬 · 商城'

Options:
