# 余烬商城 — docs/design/DESIGN-ember-economy-monetization.md §5 + docs/design/DESIGN-ember-rpg-systems.md §8.1
# S0：体力药 / 周体力包（展示名；SKU 别名仍 daily_ticket / weekly_ticket）
# 在售：月卡、战令解锁、体力药、周体力包

Title: '§6余烬 · 商城'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 200

# 2026-09-26：未接线的占位货架（首充、加速券、仓库扩容、外观·刃焰红、周礼包、节日礼包）已下架，
#   不编造价格；接上支付/发货后再加回（备份见 git 历史 c3a1ce5）。仓库扩容走 仓库菜单 / corerpg warehouse unlock。
Layout:
  - '#########'
  - '#$ P V  #'
  - '#A B D E#'
  - '####R####'

Events:
  Open:
    - 'sound: BLOCK_CHEST_OPEN-1-0'
    - 'tell: §6【商城】 §7便利货架 · §c不卖毕业伤害'
    - 'tell: §8月卡登录礼照常 · 勋阶/战令旧币礼 P1 暂停 · 体力药可买'

Icons:
  '#':
    display:
      material: stained glass pane
      name: '§8 '

  $:
    display:
      material: gold nugget
      name: '§e余烬币余额'
      lore:
        - ''
        - '§7软通货 D · 挂机庭/签到/主线本产出'
        - ''
        - '§e➥ §f点击查询'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §e【商城】 §7正在查询余烬币…'
        - 'command: corerpg coin'

  P:
    display:
      material: name tag
      name: '§b战令'
      lore:
        - ''
        - '§cP1 下暂不发放旧战令币礼'
        - '§7请用签到 / 周目标 / 外观'
        - '§8付费轨解锁也不恢复旧币礼'
        - ''
        - '§e➥ §f打开说明页'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'menu: ember_pass'

  V:
    display:
      material: gold helmet
      name: '§6勋阶'
      lore:
        - ''
        - '§cP1 下暂不发放旧勋阶币礼'
        - '§7请用签到 / 周目标 / 挂机庭'
        - '§8可查层级；日礼不会到账'
        - ''
        - '§e➥ §f打开说明页'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'menu: ember_vip'

  # —— 热销 ——
  A:
    display:
      material: watch
      name: '§e月卡 · 30 天'
      lore:
        - ''
        - '§6热销 · P1 照常'
        - '§a每日登录礼：余烬币 + 体力相关'
        - '§7立即：体力 +30 · 每日：币 200 + 体力 +30'
        - '§8上限 120（月卡）· 溢出进银行'
        - '§8与勋阶日礼 / 战令补给无关（那两轨 P1 暂停）'
        - ''
        - '§6价 §f68 §6晶钻'
        - '§8限购 1 · 点击购买月卡'
        - ''
        - '§e➥ §f点击购买 / 查询'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §e【月卡】 §7每日登录礼：币 + 体力 · 与勋阶/战令无关 · 价 §f68 晶钻'
        - 'command: corerpg monthly buy'
        - 'command: corerpg monthly'

  B:
    display:
      material: name tag
      name: '§b战令解锁'
      lore:
        - ''
        - '§6付费轨标记'
        - '§cP1 下旧战令币礼仍不发'
        - '§7解锁只留付费轨标记 / 外观向预期'
        - '§8不出核心 · 不卖毕业伤害'
        - ''
        - '§6价 §f48 §6晶钻'
        - '§8限购 · 季'
        - ''
        - '§e➥ §f了解 / 尝试解锁'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §b【战令解锁】 §7P1 下旧币礼仍挡 · 价 §f48 晶钻'
        - 'command: corerpg shop buy pass_unlock'
        - 'menu: ember_pass'

  D:
    display:
      material: paper
      name: '§e体力药 · 小 ×1'
      lore:
        - ''
        - '§a便利'
        - '§7获得体力药（+30）或直加体力'
        - '§7当前 §f%corerpg_stamina%§7/§f%corerpg_stamina_max%'
        - '§8限购 3/日 · 药剂回体上限 90/日'
        - ''
        - '§c价 §f60 §c晶钻'
        - ''
        - '§e➥ §f点击购买'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §e【便利·体力药】 §7尝试购买 · 价 §f60 晶钻 §7· 日限 3 / 药剂回体≤90'
        - 'command: corerpg shop buy daily_ticket'

  E:
    display:
      material: map
      name: '§6周体力包 · +45'
      lore:
        - ''
        - '§a便利'
        - '§7直接回复 §e45 §7体力'
        - '§8限购 1/周 · 与周本免费次数无关'
        - ''
        - '§c价 §f180 §c晶钻'
        - ''
        - '§e➥ §f点击购买（插件未装则提示未知商品）'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §6【便利·周体力】 §7尝试购买 · 价 §f180 晶钻 §7· 限购 1/周'
        - 'command: corerpg shop buy weekly_ticket'

  R:
    display:
      material: arrow
      name: '§7返回主菜单'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-0'
        - 'menu: ember_hub'
