# 余烬 v1.1 · P2-2 深渊 · 余烬层（书 §18.3，源表 D70；E-review D109 第 1 层 = 挑战版）— 每层 = 一张已验收主线图（R1–R3 + 首领，按种子抽），
# 挑战版数值 × 层系数；十层封顶。每层单独确认与付费（30 体力 + 层费余烬币，没开打就退出 / 重启全退），
# 打完首领才结算（挑战版固定结算 + 本层成色表），失败只丢本段，不掉装备不降强化。
# 只转发 /corerpg p1 abyss <层>；层数、费用、资格全在服务端校验，lore 全部来自 PAPI（参数源 ember-v1-runs.yml abyss:）。
# 入口：冒险页「深渊 · 余烬层」、主菜单、/ember_p1_abyss。

Title: '§5余烬 · 深渊 · 余烬层'

Bindings:
  Commands:
    - '(?i)ember_p1_abyss'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 400

Layout:
  - '#########'
  - '#   I   #'
  - '# 12345 #'
  - '# 67890 #'
  - '####B####'

Events:
  Open:
    - 'sound: BLOCK_CHEST_OPEN-1-0'

Icons:
  '#':
    display:
      material: gray stained glass pane
      name: '§8'

  I:
    update: 20
    display:
      material: ender eye
      name: '§5深渊 · 余烬层：§f%corerpg_p1_abyss_state%'
      lore:
        - ''
        - '§7体力：§f%corerpg_stamina%§7/§f%corerpg_stamina_max% §8（每层 30）'
        - '§7余烬币：§f%corerpg_coin%'
        - '§7每层 = 随机一张主线图打一局（3 房 + 首领）'
        - '§7每层单独付费：30 体力 + 层费；没开打就退出（含服务器重启）全额退还'
        - '§7余烬币不够时，多出来的 T3 印记自动抵层费：1 枚 = 200 币（每阶留 8 枚备用兑换）'
        - '§7打完首领才结算：挑战版固定结算 + 本层成色表 · T3 掉落与印记'
        - '§7失败只丢这一层的花费，不掉装备、不降强化 · 无本周精选加成'
        - '%corerpg_p1_failrefund% §8（层费不退）'
        - '§7打赢第 N 层 → 开放第 N+1 层 · 共 10 层封顶'
        - '§7第 1 层 = 挑战版强度（倍率 ×1.00）：挑战版能过就能下；之后每层更难、掉落成色更好'
        - '§8参考：刃换成 T3 约一半能过第 1 层，两件 T3 基本稳过；第 10 层要两件 T3 +10、卓越以上'
        - '§8需本人首通 Q07 · 1～3 人（每人都要开放该层）'
        - ''
        - '§7当前主手：§f%corerpg_p1_blade%'
        - '§7当前护符：§f%corerpg_p1_charm%'
        - '§8极品的成长加成还是 +12%，不会因为层数更高而变大'
        - '§8深渊是用难度和币，换更高的极品掉率'

  '1':
    update: 20
    display:
      material: stone sword
      name: '§5深渊 第 1 层'
      lore:
        - ''
        - '%corerpg_p1_abyss_t1%'
        - ''
        - '§e➥ §f点击开始这一层（队长点；会预留 30 体力与层费）'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'command: corerpg p1 abyss 1'
        - close

