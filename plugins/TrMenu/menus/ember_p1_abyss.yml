# 余烬 v1.1 · P2-2 深渊 · 余烬层（书 §18.3，源表 D70；E-review D109 第 1 层 = 挑战版）— 每层 = 一张已验收主线图（R1–R3 + 首领，按种子抽），
# 挑战版数值 × 层系数；十层封顶。每层单独确认与付费（30 体力 + 层费余烬币，没开打就退出 / 重启全退），
# 打完首领才结算（挑战版固定结算 + 本层成色表），失败只丢本段，不掉装备不降强化。
# 只转发 /corerpg p1 abyss <层>；层数、费用、资格全在服务端校验，lore 全部来自 PAPI（参数源 ember-v1-runs.yml abyss:）。
# D302：软三段签 浅1–3/中4–7/深8–10 + 段门槛短提示；进层节奏揭示在 jar（本层地图 + D300 短签）。
# 入口：冒险页「深渊 · 余烬层」、主菜单、/ember_p1_abyss。

Title: '§5余烬 · 深渊 · 余烬层'

Bindings:
  Commands:
    - '(?i)ember_p1_abyss'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 400

Layout:
  - '#########'
  - '#   I   #'
  - '# 12345 #'
  - '# 67890 #'
  - '####B####'

Events:
  Open:
    # TIP-DB / D13333：清教 abysstarget 手打旁路；层目标改结算下一环页菜单点设
    - 'sound: BLOCK_CHEST_OPEN-1-0'
    - 'tell: §5深渊选层 §7· %corerpg_p1_abyss_state%'
    - 'tell: §8点层进本 · 层目标在结算下一环页点设'

Icons:
  '#':
    display:
      material: gray stained glass pane
      name: '§8'

  I:
    update: 20
    display:
      material: ender eye
      name: '§5深渊：§f%corerpg_p1_abyss_state%'
      lore:
        - '%corerpg_p1_abyss_hope%'
        - '§7体力：§f%corerpg_stamina%§7/§f%corerpg_stamina_max% §8（每层 30）'

  '1':
    update: 20
    display:
      material: stone sword
      name: '§a浅渊 · 第 1 层'
      lore:
        - '%corerpg_p1_abyss_t1%'
        - '§a段：浅渊 §7· 近挑战强度 · 层费低/免'
        - '§e➥ §f点击开始这一层（队长点；会预留 30 体力与层费）'

    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'command: corerpg p1 abyss 1'
        - close

