# 余烬 v1.1 · P2-2 深渊 · 余烬层（书 §18.3，源表 D70）— 每段 = 一张已验收主线图（R1–R3 + 首领，按种子抽），
# 挑战版数值 × 层系数；十层封顶。每段单独确认与付费（30 体力 + 层费余烬币，进本失败 / 开战前中止 / 重启全退），
# 打完首领才结算（挑战版固定结算 + 本层成色表），失败只丢本段，不掉装备不降强化。
# 只转发 /corerpg p1 abyss <层>；层数、费用、资格全在服务端校验，lore 全部来自 PAPI（参数源 ember-v1-runs.yml abyss:）。
# 入口：冒险页「深渊 · 余烬层」、主菜单、/ember_p1_abyss。

Title: '§5余烬 · 深渊 · 余烬层'

Bindings:
  Commands:
    - '(?i)ember_p1_abyss'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 400

Layout:
  - '#########'
  - '#   I   #'
  - '# 12345 #'
  - '# 67890 #'
  - '####B####'

Events:
  Open:
    - 'sound: BLOCK_CHEST_OPEN-1-0'

Icons:
  '#':
    display:
      material: gray stained glass pane
      name: '§8'

  I:
    update: 20
    display:
      material: ender eye
      name: '§5深渊 · 余烬层：§f%corerpg_p1_abyss_state%'
      lore:
        - ''
        - '§7体力：§f%corerpg_stamina%§7/§f%corerpg_stamina_max% §8（每段 30）'
        - '§7余烬币：§f%corerpg_coin%'
        - '§7每段 = 一张主线图（3 房 + 首领，随机抽）· 挑战版数值 × 层系数'
        - '§7每段单独付费：30 体力 + 层费；没进本 / 开战前中止 / 重启 全退'
        - '§7打完首领才结算：挑战版固定结算 + 本层成色表 · T3 掉落与印记'
        - '§7失败只丢本段，不掉装备、不降强化 · 无本周精选加成'
        - '§7完整通关第 N 层 → 开放第 N+1 层 · 共 10 层封顶'
        - '§8需本人首通 Q07 · 1～3 人（每人都要开放该层）'
        - ''
        - '§7当前主手：§f%corerpg_p1_blade%'
        - '§7当前护符：§f%corerpg_p1_charm%'
        - '§8成色上限不变（极品仍是 +12%）：深渊只是用难度和币更快地追两件极品'

  '1':
    update: 20
    display:
      material: stone sword
      name: '§5深渊 第 1 层'
      lore:
        - ''
        - '%corerpg_p1_abyss_t1%'
        - ''
        - '§e➥ §f点击开始本段（队长点；会预留 30 体力与层费）'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'command: corerpg p1 abyss 1'
        - close

