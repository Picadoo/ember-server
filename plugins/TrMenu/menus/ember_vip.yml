Title: '§6余烬 · 勋阶'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 400

Layout:
  - '#########'
  - '#       #'
  - '# L Q S #'
  - '# C     #'
  - '####B####'

Events:
  Open:
    - 'sound: BLOCK_NOTE_PLING-1-1'
    - 'tell: §6【勋阶】 §7P1 下暂不发放旧勋阶币礼 · 请用签到 / 周目标 / 挂机庭'

Icons:
  '#':
    display:
      material: stained glass pane
      name: '§8 '

  L:
    display:
      material: gold helmet
      name: '§6勋阶状态'
      lore:
        - ''
        - '§7层级 §f0～10§7（累计充值晶钻，不降级）'
        - '§8I 68 · II 198 · III 488 · IV 988 · V 1988 …'
        - ''
        - '§cP1 现行：旧日礼币不发'
        - '§7可查层级 / 称号等展示位；币请走签到、周目标、挂机'
        - ''
        - '§e➥ §f查看我的勋阶'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'command: corerpg vip'

  Q:
    display:
      material: emerald
      name: '§8领取日礼 · P1 暂停'
      lore:
        - ''
