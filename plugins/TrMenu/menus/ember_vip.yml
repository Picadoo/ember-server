      all:
        - 'sound: BLOCK_CHEST_OPEN-1-0'
        - 'command: corerpg mail'
        - 'menu: ember_mail'

  B:
    display:
      material: arrow
      name: '§7返回主菜单'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-0'
        - 'menu: ember_hub'
