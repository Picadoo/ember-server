        - ''
        - '§e➥ §f查看说明（不会发币）'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'tell: §8【勋阶·日礼】 §7P1 下暂不发放 · 请用签到 / 周目标 / 挂机庭'
        - 'command: corerpg vip claim'
        - 'command: corerpg vip'

  S:
    display:
      material: gold block
      name: '§e前往商城'
      lore:
        - ''
        - '§7月卡登录礼照常 · 战令/勋阶币礼 P1 暂停'
        - ''
        - '§e➥ §f打开商城'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'menu: ember_shop'

  C:
    display:
      material: chest
      name: '§e打开邮寄'
      lore:
        - ''
        - '§7系统邮件 / 维护补偿'
