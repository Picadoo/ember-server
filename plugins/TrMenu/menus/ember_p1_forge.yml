    - 'tell: §8烙纹路径 %corerpg_p1_brand_path%'
    - 'sound: BLOCK_ANVIL_LAND-1-0.6'
    - 'tell: §8缺料？点「材料哪来」回挂机庭 · 产→仓→本页花'
    - 'tell: §8未持件也能看费用：点「配方速览」'
    - 'tell: §8挂机仓差→烙纹/随机锻/转化见配方速览与挂机战况'
    - 'tell: §8词条洗练（普通随机 / Shift 锁定保类型只重抽档）在本页「洗练」'
    - 'tell: §e本周工坊目标：§f%corerpg_p1_forge_goal_line%'
    - 'command: corerpg p1 forgegoal nudge'

Icons:
