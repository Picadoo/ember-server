# D1139 K1: 稳线/旁路诚实入口（零经济）
# D461: 工坊周目标路径点选（forgegoal）· 零改价/AFK表
# 余烬 锻造菜单桩 — 只转发到 /corerpg p1 命令；预览在聊天栏，执行需二次点击"确认"按钮。
# 旧 ember_enhance / ember_forge / ember_disassemble 菜单不变（旧物品仍走旧强化）。
# 打开：/ember_p1_forge、主菜单「工坊」或装备页（B2.174）。互换确认按钮 B2.176（§19.1 不需要手打命令）
# D307：确认/预览同屏嵌本次费用与缺料（PAPI 镜像 UpgradeRules；零改价；分解仍聊天确认）
# D333：手持甲时养成格灰显/禁命令（held_is_armor）；分解 lore 去「胚料 1/2/3」、对齐白板零头
# D381：底栏「材料哪来·挂机庭」→ember_p1_afk（产花反向互指；零改价/产量）
# D398：底栏「配方速览」P → ember_p1_forge_recipes（静态镜像 UpgradeRules；零改价/产量）
# D609：底栏「P1 宝石」m → ember_p1_gem
# D451：底栏「词条洗练」W → 洗练页（D143/D148 锁定保类型；与烙纹/随机锻/转化并列）

Title: '§6余烬 · 锻造'

Bindings:
  Commands:
    - '(?i)ember_p1_forge'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 400

Layout:
  - '#########'
  - '# E U R #'
  - '# e u r #'
  - '# Q S D #'
  - '# q s d #'
  - 'NFGPmWbB#'
# D100 (review #10): every confirm sits directly under its preview (same column); 分解 confirms in chat (one-shot token)

Events:
  Open:
    - 'command: corerpg p1 setchase'
    # D12301 TIP-H: 教学 tell · 稳/赌并排 + 缺料/配方/本周指针；TIP-BX 半行：分解首拆+1待用
    - 'tell: §a稳§7上排确定+1 §8· §6赌§7点F（有下限·极品0）'
    - 'tell: §8缺料→材料哪来 · 配方速览 · 本周：%corerpg_p1_forge_goal_line%'
    - 'tell: §8分解预览可见今日首拆+1待用（不改表）'
    - 'sound: BLOCK_ANVIL_LAND-1-0.6'
    - 'command: corerpg p1 forgegoal nudge'

Icons:
  '#':
    display:
      material: gray stained glass pane
      name: '§8'
  E:
    update: 20
    display:
      material: anvil
      name: '§c强化 · 预览'
      lore:
        - '§e花费：§f%corerpg_p1_held_enhance_cost%'
        - '§e成功率：§f%corerpg_p1_held_enhance_rate% §8· %corerpg_p1_held_enhance_pity%'
        - '§e➥ §f点预览'
    actions:
      all:
        - 'command: corerpg p1 enhance'
    icons:
      # D333：手持甲 · 养成格灰显（待插件 %corerpg_p1_held_is_armor% 上线后生效）
      - condition: 'check papi %corerpg_p1_held_is_armor% == 1'
        priority: 5
        display:
          material: gray stained glass pane
          name: '§8强化 · 不可用'
          lore:
            - '§e本次：§f%corerpg_p1_held_enhance_cost%'
            - '§c%corerpg_p1_held_enhance_lack%'
        actions:
          all:
            - 'tell: §8护甲随护符成长；成色和精工看掉落'
