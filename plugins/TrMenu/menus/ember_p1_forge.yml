# 余烬 锻造菜单桩 — 只转发到 /corerpg p1 命令；预览在聊天栏，执行需二次点击"确认"按钮。
# 旧 ember_enhance / ember_forge / ember_disassemble 菜单不变（旧物品仍走旧强化）。
# 打开：/ember_p1_forge、主菜单「工坊」或装备页（B2.174）。互换确认按钮 B2.176（§19.1 不需要手打命令）

Title: '§6余烬 · 锻造'

Bindings:
  Commands:
    - '(?i)ember_p1_forge'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 400

Layout:
  - '#########'
  - '# E U R #'
  - '# e u r #'
  - '# Q S D #'
  - '# q s d #'
  - '#   b  B#'
# D100 (review #10): every confirm sits directly under its preview (same column); 分解 confirms in chat (one-shot token)

Icons:
  '#':
    display:
      material: gray stained glass pane
      name: '§8'
  E:
    display:
      material: anvil
      name: '§c强化 · 预览'
      lore:
        - '§7手持刃或护符；+1~+3 必成，之后按次数保底'
        - '§7失败不降级、不爆装'
    actions:
      all:
        - 'command: corerpg p1 enhance'
  e:
    display:
      material: redstone
      name: '§c强化 · 确认一次'
      lore:
        - '§7先点上面的预览，消耗以聊天为准'
    actions:
      all:
        - 'command: corerpg p1 enhance confirm'
  U:
    display:
      material: nether star
      name: '§d升阶 · 预览'
      lore:
        - '§7同族 T1→T2（需首通 Q04）· T2→T3（需首通 Q07）'
        - '§7强化/成色/精工/绑定全部保留'
    actions:
      all:
        - 'command: corerpg p1 upgrade'
  u:
    display:
      material: nether star
      name: '§d升阶 · 确认'
      lore:
        - '§7先点上面的预览，消耗以聊天为准'
    actions:
      all:
        - 'command: corerpg p1 upgrade confirm'
        - close
  R:
    display:
      material: blaze powder
      name: '§6精工 · 预览'
      lore:
        - '§7让这件的成长 +2%/档（0→2%→4%→6%）'
        - '§7确定成功'
    actions:
      all:
        - 'command: corerpg p1 refine craft'
  r:
    display:
      material: blaze powder
      name: '§6精工 · 确认'
      lore:
        - '§7先点上面的预览，消耗以聊天为准'
    actions:
      all:
        - 'command: corerpg p1 refine craft confirm'
  Q:
    display:
      material: gold nugget
      name: '§e成色 · 预览'
      lore:
        - '§7标准→精良→卓越；极品只从掉落获得'
    actions:
      all:
        - 'command: corerpg p1 refine quality'
  q:
    display:
      material: gold nugget
      name: '§e成色 · 确认'
      lore:
        - '§7先点上面的预览，消耗以聊天为准'
    actions:
      all:
        - 'command: corerpg p1 refine quality confirm'
  S:
    display:
      material: hopper
      name: '§b强化轨道互换 · 预览'
      lore:
        - '§7主手与副手同部位装备互换 强化等级+失败计数'
        - '§7两件都会绑定；副手（按 F 换手，在主城里按）'
        - '§7先预览，再点下方「互换 · 确认」'
    actions:
      all:
        - 'command: corerpg p1 swap'
  D:
    display:
      material: flint
      name: '§7分解 · 预览'
      lore:
        - '§7只限普通掉落件 → 胚料 1/2/3'
        - '§7预览后在聊天栏点击 §c[确认分解]§7（30 秒内有效）'
    actions:
      all:
        - 'command: corerpg p1 dismantle'
        - close
  s:
    display:
      material: ender pearl
      name: '§b强化轨道互换 · 确认'
      lore:
        - '§7主手与副手的同部位装备交换「强化等级 + 失败计数」'
        - '§7成色 / 精工 / 家族 / 阶级不变；两件都会绑定'
        - '§7先点上面的预览，消耗以聊天为准'
    actions:
      all:
        - 'command: corerpg p1 swap confirm'
  d:
    display:
      material: gray dye
      name: '§7分解 · 确认在聊天栏'
      lore:
        - '§7点上面的预览后，聊天栏出现 §c[确认分解]'
        - '§7只限普通掉落件；首通和起步件拆不了'
  b:
    display:
      material: arrow
      name: '§7返回装备页'
    actions:
      all:
        - 'menu: ember_p1_gear'
  B:
    display:
      material: barrier
      name: '§c关闭'
    actions:
      all:
        - close
