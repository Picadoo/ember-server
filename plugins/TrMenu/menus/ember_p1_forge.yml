# 余烬 v1 (P1) 锻造菜单桩 — 只转发到 /corerpg p1 命令；预览在聊天栏，执行需二次点击"确认"按钮。
# 旧 ember_enhance / ember_forge / ember_disassemble 菜单不变（旧物品仍走旧强化）。
# 打开：/ember_p1_forge、主菜单「工坊」或装备页（B2.174）。互换确认按钮 B2.176（§19.1 不需要手打命令）

Title: '§6余烬 v1 · 锻造'

Bindings:
  Commands:
    - '(?i)ember_p1_forge'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 400

Layout:
  - '#########'
  - '# E U R #'
  - '# Q S D #'
  - '#e u r q#'
  - '# s  b B#'

Icons:
  '#':
    display:
      material: gray stained glass pane
      name: '§8'
  E:
    display:
      material: anvil
      name: '§c强化 · 预览'
      lore:
        - '§7手持 P1 装备；+1~+3 必成，之后按次数保底'
        - '§7失败不降级、不爆装'
    actions:
      all:
        - 'command: corerpg p1 enhance'
  e:
    display:
      material: redstone
      name: '§c强化 · 确认一次'
    actions:
      all:
        - 'command: corerpg p1 enhance confirm'
  U:
    display:
      material: nether star
      name: '§d升阶 · 预览'
      lore:
        - '§7同族 T1→T2（需首通 Q04）· T2→T3（需首通 Q07）'
        - '§7强化/成色/精工/绑定全部保留'
    actions:
      all:
        - 'command: corerpg p1 upgrade'
  u:
    display:
      material: nether star
      name: '§d升阶 · 确认'
    actions:
      all:
        - 'command: corerpg p1 upgrade confirm'
        - close
  R:
    display:
      material: blaze powder
      name: '§6精工 · 预览'
      lore:
        - '§70→2%→4%→6%，确定成功'
    actions:
      all:
        - 'command: corerpg p1 refine craft'
  r:
    display:
      material: blaze powder
      name: '§6精工 · 确认'
    actions:
      all:
        - 'command: corerpg p1 refine craft confirm'
  Q:
    display:
      material: gold nugget
      name: '§e成色 · 预览'
      lore:
        - '§7标准→精良→卓越；极品只从掉落获得'
    actions:
      all:
        - 'command: corerpg p1 refine quality'
  q:
    display:
      material: gold nugget
      name: '§e成色 · 确认'
    actions:
      all:
        - 'command: corerpg p1 refine quality confirm'
  S:
    display:
      material: hopper
      name: '§b强化轨道互换 · 预览'
      lore:
        - '§7主手与副手同部位装备互换 强化等级+失败计数'
        - '§7两件都会绑定；先预览，再点下方「互换 · 确认」'
    actions:
      all:
        - 'command: corerpg p1 swap'
  D:
    display:
      material: flint
      name: '§7分解 · 预览'
      lore:
        - '§7只限普通掉落件 → 胚料 1/2/3'
        - '§7预览后在聊天栏点击 §c[确认分解]§7（30 秒内有效）'
    actions:
      all:
        - 'command: corerpg p1 dismantle'
        - close
  s:
    display:
      material: ender pearl
      name: '§b强化轨道互换 · 确认'
      lore:
        - '§7主手与副手的同部位装备交换「强化等级 + 失败计数」'
        - '§7成色 / 精工 / 家族 / 阶级不变；两件都会绑定'
        - '§c先点上方「预览」看清两件再确认'
    actions:
      all:
        - 'command: corerpg p1 swap confirm'
  b:
    display:
      material: arrow
      name: '§7返回装备页'
    actions:
      all:
        - 'menu: ember_p1_gear'
  B:
    display:
      material: barrier
      name: '§c关闭'
    actions:
      all:
        - close
