# 邮寄子菜单壳 — docs/design/DESIGN-ember-mail-friends.md
# 系统邮件 / 战令 / 维护补偿

Title: '§f余烬 · 邮寄'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 200

Layout:
  - '#########'
  - '#       #'
  - '# I C S #'
  - '#  D    #'
  - '####X####'

Events:
  Open:
    - 'sound: BLOCK_NOTE_PLING-1-0.8'
    - 'tell: §f【邮寄】 §7领取系统邮件、战令与维护补偿。奖励统一进邮箱。'

Icons:
  '#':
    display:
      material: stained glass pane
      name: '§8 '

  X:
    display:
      material: arrow
      name: '§7返回主菜单'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-0'
        - 'menu: ember_hub'

  I:
    display:
      material: book and quill
      name: '§f收件箱'
      lore:
        - ''
        - '§7查看未读与未领附件'
        - '§8基础邮寄 · 系统发奖入口'
        - ''
        - ''
        - '§e➥ §f点击查询'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'command: corerpg mail'

  C:
    display:
      material: chest
      name: '§a一键领取'
      lore:
        - ''
        - '§7领取全部可领附件'
        - '§8战令结算 · 维护补偿 · 日活箱'
        - '§8奖励统一进邮箱，不弹背包散件'
        - ''
        - ''
        - '§a➥ §f查看说明'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'tell: §a【邮寄】 §7正在领取全部…'
        - 'tell: §8战令 / 维护补偿 / 活动箱走邮箱'
        - 'command: corerpg mail claim all'

  S:
    display:
      material: paper
      name: '§6系统发奖'
      lore:
        - ''
        - '§7战令、维护补偿由系统投递'
        - '§8玩家互寄本期不做（防刷）'
        - '§8附件：币 / 体力药 / 外观碎片'
        - '§8不发核心 / 毕业刃'
        - ''
        - ''
        - '§6➥ §f查看说明'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §6【邮寄·系统】 §7战令与维护补偿由系统投递'

  D:
    display:
      material: hopper
      name: '§7清理已领'
      lore:
        - ''
        - '§7删除已领取的空信'
        - '§8未领附件的邮件不可删'
        - ''
        - ''
        - '§7➥ §f查看说明'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-0'
        - 'tell: §7【邮寄】 §7点击邮件清理；无需手打编号'
        - 'tell: §8未领附件不可删'
