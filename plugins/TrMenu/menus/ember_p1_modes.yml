# D174 第 2b 阶段 · 进阶模式页（docs/design/DESIGN-ember-mainline-unlocks-2026-10-04.md §4 Q04 / Q05 / Q06）
# 三个模式各由一张主线图的首通打开：首领残响（Q04）、连战·前哨（Q05）、自选誓约（Q06）。
# 文字 / 状态来自 PAPI（%corerpg_p1_pledge_*% …），菜单不自己算；按钮只调 /corerpg p1 的子命令，资格全在服务端校验。
# 入口：冒险页「进阶模式」、首通解锁消息里的 [打开进阶模式]、/corerpg p1 modes。

Title: '§6进阶模式'

Bindings:
  Commands:
    - '(?i)ember_p1_modes'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 400

Layout:
  - '#########'
  - '#E  O  P#'
  - '####B####'

Events:
  Open:
    - 'sound: BLOCK_CHEST_OPEN-1-0'

Icons:
  '#':
    display:
      material: gray stained glass pane
      name: '§8'

  E:
    display:
      material: gray dye
      name: '§7首领残响 §8（Q04 首通开放 · 即将上线）'
      lore:
        - ''
        - '§7每周 3 次：单独再打一个已首通的 Q01–Q04 首领（强化版）'
        - '§7每次必得这张图 2 枚首领徽记 · 不耗体力 · 不掉装备'

  O:
    icons:
      - condition: 'check papi %corerpg_p1_q05done% < 1'
        priority: 1
        display:
          material: gray dye
          name: '§7连战·前哨 §8（首通 Q05 断塔回廊后开放）'
          lore:
            - ''
            - '§7Q01 → Q02 → Q03 三个首领同一个大厅连打（按 T2 加强）'
            - '§7每周首通领奖：三张图各 2 枚首领徽记 + 1 枚 T2 印记'
    update: 20
    display:
      material: blaze powder
      name: '§c连战·前哨（1～3 人）'
      lore:
        - ''
        - '§7状态：§f%corerpg_p1_rush_outpost%'
        - '§7残门蛮兵 → 守炉蛮兵 → 残誓守卫，同一个首领厅连打'
        - '§7招式和各自主线图一样，按 T2 加强：生命 ×3、伤害 ×2.2（组队另按人数加生命）'
        - '§7每打倒一个休息 10 秒、站着的人回复 30% 生命 · 倒下观战，没有复活'
        - '§e每周首通领奖：Q01 / Q02 / Q03 首领徽记各 +2 · T2 印记 +1'
        - '§7不耗体力 · 失败只结束这一局，不扣任何东西，可以无限重试；领过后是练习'
        - '§8不给余烬币、装备和碎片，不算每日委托'
        - ''
        - '§a参考：T2 两件 +8、躲得中等的单人约 9 成能过；T2 +4 约 3 成'
        - ''
        - '§e➥ §f左键：开始（组队时队长点）'
        - '§e➥ §f右键：规则（聊天栏）'
    actions:
      left:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'command: corerpg p1 rush outpost go'
        - close
      right:
        - 'sound: UI_BUTTON_CLICK-1-1'
        - 'command: corerpg p1 rush outpost'
        - close

  P:
    icons:
      - condition: 'check papi %corerpg_p1_pledge_ok% < 1'
        priority: 1
        display:
          material: gray dye
          name: '§7自选誓约 §8（首通 Q06 霜封哨所后开放）'
          lore:
            - ''
            - '§7重打已首通的 Q01–Q06 普通版时自己挂规则（限药 / 逆行）'
            - '§7每挂一条，通关结算每人 +1 枚本图首领徽记 · 掉落不变'
    update: 20
    display:
      material: writable book
      name: '§d自选誓约'
      lore:
        - ''
        - '%corerpg_p1_pledge_head%'
        - ''
        - '§7你当队长重打已首通的 Q01–Q06 普通版时生效（全队都首通过这张图）'
        - '§7每挂一条规则，通关结算每人 +1 枚本图首领徽记 · 掉落和成色不变'
        - '§7本周精选图有周规则时，那张图按周规则打、誓约不叠'
        - '§8首通、挑战、深渊、团本、连战都不受影响'
        - ''
        - '§e➥ §f点击：选择要挂的规则'
    actions:
      all:
        - 'sound: UI_BUTTON_CLICK-1-1'
        - 'menu: ember_p1_pledge'

  B:
    display:
      material: arrow
      name: '§7返回冒险页'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-0'
        - 'menu: ember_p1_adventure'
