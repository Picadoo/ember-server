# D462: 首通 Q04/Q05/Q06 会聊天弹出进阶路径点选 · 零改模式数值
# D174 第 2b 阶段 · 进阶模式页（docs/design/DESIGN-ember-mainline-unlocks-2026-10-04.md §4 Q04 / Q05 / Q06）
# 三个模式各由一张主线图的首通打开：首领残响（Q04，厅扩至 Q01–Q07 / D227）、连战·前哨（Q05）、自选誓约（Q06）。
# 文字 / 状态来自 PAPI（%corerpg_p1_pledge_*% …），菜单不自己算；按钮只调 /corerpg p1 的子命令，资格全在服务端校验。
# 入口：冒险页「进阶模式」、首通解锁消息里的 [打开进阶模式]、/corerpg p1 modes。

Title: '§6进阶模式'

Bindings:
  Commands:
    - '(?i)ember_p1_modes'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 400

Layout:
  - '#########'
  - '#E  O  P#'
  - '#1 2 3 4#'
  - '#5 6 7  #'
  - '####B####'

Events:
  Open:
    - 'tell: §e残响路径：§f%corerpg_p1_echo_path% §8· /corerpg p1 echopath'
    - 'command: corerpg p1 echopath nudge'
    - 'sound: BLOCK_CHEST_OPEN-1-0'
    - 'tell: §8首通 Q04/Q05/Q06 会聊天弹出进阶路径点选（残响/前哨/誓约）'

Icons:
  '#':
    display:
      material: gray stained glass pane
      name: '§8'

  E:
    icons:
      - condition: 'check papi %corerpg_p1_q04done% < 1'
        priority: 1
        display:
          material: gray dye
          name: '§7首领残响 §8（首通 Q04 潮蚀水道后开放）'
          lore:
            - '§7每周 3 次：单独再打一个 Q01–Q07 首领（按 T2 加强）'
            - '§7每次必得这张图 2 枚首领徽记 · 不耗体力 · 不掉装备'
    update: 20
    display:
      material: amethyst shard
      name: '§b首领残响 §7（下面一排选首领）'
      lore:
        - '§7状态：§f%corerpg_p1_rush_echo_q01%'
        - '§7选一个已首通的 Q01–Q07 首领'


  O:
    icons:
      - condition: 'check papi %corerpg_p1_q05done% < 1'
        priority: 1
        display:
          material: gray dye
          name: '§7连战·前哨 §8（首通 Q05 断塔回廊后开放）'
          lore:
            - '§7Q01 → Q02 → Q03 三个首领同一个大厅连打（按 T2 加强）'
            - '§7每周首通领奖：三张图各 2 枚首领徽记 + 1 枚 T2 印记'
    update: 20
    display:
      material: blaze powder
      name: '§c连战·前哨（1～3 人）'
      lore:
        - '§7状态：§f%corerpg_p1_rush_outpost%'
        - '§7每打倒一个休息 10 秒、站着的人回复 30% 生命 · 倒下观战，没有复活'
        - '§e➥ §f左：开始（组队时队长点） · 右：规则（聊天栏）'
    actions:
      left:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'command: corerpg p1 rush outpost go'
        - close
      right:
        - 'sound: UI_BUTTON_CLICK-1-1'
        - 'command: corerpg p1 rush outpost'
        - close

  P:
    icons:
      - condition: 'check papi %corerpg_p1_pledge_ok% < 1'
        priority: 1
        display:
          material: gray dye
          name: '§7自选誓约 §8（首通 Q06 霜封哨所后开放）'
          lore:
            - '§7重打已首通的 Q01–Q07 普通版时自己挂规则（限药 / 逆行）'
            - '§7每挂一条，通关结算每人 +1 枚本图首领徽记 · 掉落不变'
    update: 20
    display:
      material: writable book
      name: '§d自选誓约'
      lore:
        - '%corerpg_p1_pledge_head%'
        - '§7你当队长重打已首通的 Q01–Q07 普通版时生效（全队都首通过这张图）'
        - '§e➥ §f点击：选择要挂的规则'
    actions:
      all:
        - 'sound: UI_BUTTON_CLICK-1-1'
        - 'menu: ember_p1_pledge'

  '1':
    icons:
      - condition: 'check papi %corerpg_p1_q04done% < 1'
        priority: 1
