# D139 国庆限时活动「烟火庙会」— 活动页。所有日期 / 价格 / 次数 / 状态都来自 PAPI %corerpg_p1_fest_*%
# （数据源 plugins/CoreRpg/ember-v1-festival.yml）；付款、校验、时间窗全在服务端（/corerpg p1 fest enter|buy|equip|unequip）。
# 入口：主界面左上角（活动期间才亮）、/ember_p1_fest、/corerpg p1 fest。返回键回主界面。
# 活动结束后：活动本下架、限时称号不再发；盛世烟火符改为常驻价（余烬币 或 余烬徽），这一页仍可打开（主界面左上角
# 变成「国庆纪念」图标，装备页也有常驻入口）。D146：剩下的国庆币可以换纪念称号、换余烬徽（每人上限），足迹也还能用国庆币买。

Title: '§c国庆 · 烟火庙会'

Bindings:
  Commands:
    - '(?i)ember_p1_fest'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 400

Layout:
  - '####I####'
  - '#a#b#c#d#'
  - '##m#B#x##'

Events:
  Open:
    - 'sound: ENTITY_FIREWORK_TWINKLE-1-1'

Icons:
  '#':
    display:
      material: red stained glass pane
      name: '§8'

  I:
    update: 20
    display:
      material: firework
      name: '§c%corerpg_p1_fest_name%'
      lore:
        - '§7时间：§f%corerpg_p1_fest_window%'
        - '§7状态：%corerpg_p1_fest_state%'

  a:
    icons:
      - condition: 'check papi %corerpg_p1_fest_open% < 1'
        priority: 1
        display:
          material: gray dye
          name: '§7活动本「烟火庙会」§8（未开放）'
          lore:
            - '§7状态：%corerpg_p1_fest_state%'
            - '§7时间：§f%corerpg_p1_fest_window%'
    update: 20
    display:
      material: blaze powder
      name: '§6活动本「烟火庙会」§7（1～3 人）'
      lore:
        - '§7今日：§f%corerpg_p1_fest_entries% §7· 不耗体力 · 掉%corerpg_p1_fest_coinname%'
        - '§e➥ §f开本（需 Q04）'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - close
        - 'command: corerpg p1 fest enter'

  b:
    icons:
      - condition: 'check papi %corerpg_p1_fest_charm_own% >= 1'
        priority: 1
        display:
          material: nether star
          name: '§c%corerpg_p1_fest_charm_name% §7（%corerpg_p1_fest_charm%§7）'
          lore:
            - '§7独立的活动护符位：不占主手和已选护符，不算套装'
            - '§f%corerpg_p1_fest_charm_effect%'
            - '§e➥ §f左键：佩戴 · 右键：取下'
        actions:
          left:
            - 'sound: BLOCK_NOTE_PLING-1-2'
            - close
            - 'command: corerpg p1 fest equip'
          right:
            - 'sound: UI_BUTTON_CLICK-1-1'
            - close
            - 'command: corerpg p1 fest unequip'
    update: 20
    display:
      material: nether star
      name: '§c%corerpg_p1_fest_charm_name% §8（%corerpg_p1_fest_charm%§8）'
      lore:
        - '§f%corerpg_p1_fest_charm_effect%'
        - '§6价格：%corerpg_p1_fest_charm_price%'
        - '§e➥ §f左：币购 · 右：徽购'
    actions:
      left:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - close
        - 'command: corerpg p1 fest buy charm coin'
      right:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - close
        - 'command: corerpg p1 fest buy charm badge'

  c:
    update: 20
    display:
      material: blaze powder
      name: '§6足迹 %corerpg_p1_fest_trail_name% §8（限时）'
      lore:
        - '§7状态 / 价格：%corerpg_p1_fest_trail%'
        - '§8活动结束后也能用剩下的%corerpg_p1_fest_coinname%买（不再掉落）'
        - '§e➥ §f左：购买 · 右：装上'
    actions:
      left:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - close
        - 'command: corerpg p1 fest buy trail'
      right:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - close
        - 'command: corerpg p1 trail trail_gq26'

  d:
    update: 20
    display:
      material: name tag
      name: '§6称号 §c盛世§6烟火 §8（限时）'
      lore:
        - '§7%corerpg_p1_fest_title%'
        - '§8只做展示，不加属性；活动结束后不再发放（已有的一直保留）'
        - '§e➥ §f左键：装上称号'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - close
        - 'command: corerpg p1 title gq26'

  m:
    update: 20
    display:
      material: name tag
      name: '§6纪念称号 %corerpg_p1_fest_memo_name%'
      lore:
        - '§7用剩下的%corerpg_p1_fest_coinname%换：§f%corerpg_p1_fest_memo%'
        - '§7国庆币（含仓库）：§f%corerpg_p1_fest_coins%'
        - '§e➥ §f左：兑换 · 右：装上'
    actions:
      left:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - close
        - 'command: corerpg p1 fest buy memo'
      right:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - close
        - 'command: corerpg p1 title gq26_memo'

  x:
    update: 20
    display:
      material: gold nugget
      name: '§6%corerpg_p1_fest_coinname% → 余烬徽'
      lore:
        - '§7%corerpg_p1_fest_xbadge%'
        - '§7%corerpg_p1_fest_xrate%枚换1徽 · 上限%corerpg_p1_fest_xcap%'
        - '§e➥ §f左：全换 · 右：换5徽'
    actions:
      left:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - close
        - 'command: corerpg p1 fest buy badge all'
      right:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - close
        - 'command: corerpg p1 fest buy badge 5'

  B:
    display:
      material: arrow
      name: '§7返回主界面'
    actions:
      all:
        - 'sound: UI_BUTTON_CLICK-1-1'
        - 'menu: ember_hub'
