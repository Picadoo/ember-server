# TIP-FZ / D13409 · 面包路径选打薄页 · bread_path* · breadpath auto|ask|mute|clear
# 入口：BreadPath.offerPick / 无参 breadpath / 周要约 / Q01首通 → /ember_p1_bread_path（插件并行改开菜单）
# 选打：corerpg p1 breadpath auto|ask|mute|clear
# 导航：技能组 ember_skill_kit / 冒险 / 熬药
# 禁：教裸指令主 UI · 抬伤害/CD表/掉落/配方表 · 改 bite_path / bank_path / ticket_path / sip_path / armor_path / cook_path / prep_path / dose_path / bar_path / 其他已齐选打 / D546 熬药语义 / 庭内 · ≠Bite果腹 · ≠Bank取银 · ≠Ticket旧票 · ≠Stash存仓 · ≠Sip喝药 · ≠Cook代烤 · ≠Prep买药 · ≠Dose补体 · ≠Bar药栏 · ≠Brew熬药 · 含Brew熬药邻页
# PAPI（插件可能后到·静态接线）：bread_path / bread_path_label / bread_path_tip · bread_unlock（灰态·首通 Q01）
# ≠ ember_p1_bank_path · ≠ ember_p1_ticket_path · ≠ ember_p1_flee_path · ≠ ember_p1_gate_path · ≠ ember_p1_call_path · ≠ ember_p1_link_path · ≠ ember_p1_hunt_path · ≠ ember_p1_pack_path · ≠ ember_p1_chest_path · ≠ ember_p1_duck_path · ≠ ember_p1_thaw_path · ≠ ember_p1_rally_path · ≠ ember_p1_smash_path · ≠ ember_p1_guard_path · ≠ ember_p1_hold_path · ≠ ember_p1_beacon_path · ≠ ember_p1_relay_path · ≠ ember_p1_breach_path · ≠ ember_p1_alert_path · ≠ ember_p1_stock_path · ≠ ember_p1_hurry_path · ≠ ember_p1_focus_path · ≠ ember_p1_doom_path · ≠ ember_p1_nest_path · ≠ ember_p1_save_path · ≠ ember_p1_sequel_path · ≠ ember_p1_bait_path · ≠ ember_p1_slip_path · ≠ ember_p1_crash_path · ≠ ember_p1_bolt_path · ≠ ember_p1_shift_path · ≠ ember_p1_gap_path · ≠ ember_p1_phase_path · ≠ ember_p1_wave_path · ≠ ember_p1_soak_path · ≠ ember_p1_shell_path · ≠ ember_p1_clone_path · ≠ ember_p1_press_path · ≠ ember_p1_cut_path · ≠ ember_p1_rush_path · ≠ ember_p1_clean_path · ≠ ember_p1_streak_path · ≠ ember_p1_blaze_path · ≠ ember_p1_spin_path · ≠ ember_p1_snap_path · ≠ ember_p1_veil_path · ≠ ember_p1_free_path · ≠ ember_p1_dodge_path · ≠ ember_p1_sidestep_path · ≠ ember_p1_step_path · ≠ ember_p1_flex_path · ≠ ember_p1_stride_path · ≠ ember_p1_counter_path · ≠ ember_p1_pledge_path · ≠ ember_p1_trial_path · ≠ ember_p1_abyss_path · ≠ ember_p1_short_path · ≠ ember_p1_raid_path · ≠ ember_p1_challenge_path · ≠ ember_p1_featured_path · ≠ ember_p1_sight_path · ≠ ember_p1_charm_path · ≠ ember_p1_grip_path · ≠ ember_p1_armor_path · ≠ ember_p1_sip_path · ≠ ember_p1_stash_path · ≠ ember_p1_pack_path


Title: '§e面包 · 路径'

Bindings:
  Commands:
    - '(?i)ember_p1_bread_path'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 400

Layout:
  - '####I####'
  - '#1#2#3#C#'
  - '##K#A#F##'
  - '####Z####'

Events:
  Open:
    - 'sound: BLOCK_NOTE_PLING-1-1.1'
    - 'tell: §e面包路径 §7· 当前 §e%corerpg_p1_bread_path_label%'
    - 'tell: §8点选 · 自动 / 提醒 / 静默 / 清空 · 或技能组 / 冒险 / 熬药'

Icons:
  '#':
    display:
      material: gray stained glass pane
      name: '§8'

  I:
    update: 20
    display:
      material: bread: '§e面包路径 · 说明'
      lore:
        - '§7当前路径：§e%corerpg_p1_bread_path_label%'
        - '§8%corerpg_p1_bread_path_tip%'
        - '§8点选 · 自动 / 提醒 / 静默 / 清空'
        - '§8需本人首通 Q01'
        - '§8花币买余烬面包（≠Bite果腹 · ≠Brew熬药 · ≠Cook代烤 · ≠Rod钓鱼 · ≠Dose补体 · ≠Bar药栏 · ≠Prep买药）'

  # 自动 · AUTO=1 · 城内无烤鱼也无面包时自动买一包余烬面包
  '1':
    update: 20
    icons:
      - condition: 'check papi %corerpg_p1_bread_unlock% < 1'
        priority: 1
        display:
          material: gray dye
          name: '§7自动 §8（需首通 Q01）'
          lore:
            - '§c需本人首通 Q01'
            - '§7城内无烤鱼也无面包时自动买一包余烬面包'
            - '§8通关后再选路径'
      - condition: 'check papi %corerpg_p1_bread_path% == 1'
        priority: 2
        display:
          material: emerald
          shiny: true
          name: '§a自动 §8· §f已选'
          lore:
            - '§7城内无烤鱼也无面包时自动买一包余烬面包'
            - '§8%corerpg_p1_bread_path_tip%'
            - '§a当前路径焦点'
            - '§8再点可重选同路径'
        actions:
          all:
            - 'sound: UI_BUTTON_CLICK-1-1'
            - 'command: corerpg p1 breadpath auto'
            - 'menu: ember_p1_bread_path'
    display:
      material: lime dye
      name: '§a自动'
      lore:
        - '§7城内无烤鱼也无面包时自动买一包余烬面包'
        - '§8点选切换面包路径'
        - '§e➥ §f设为自动'
    actions:
      all:
        - 'sound: UI_BUTTON_CLICK-1-1'
        - 'command: corerpg p1 breadpath auto'
        - 'menu: ember_p1_bread_path'

  # 提醒 · ASK=2 · 缺干粮时聊天提醒，点按钮购买（默认）
  '2':
    update: 20
    icons:
      - condition: 'check papi %corerpg_p1_bread_unlock% < 1'
        priority: 1
        display:
          material: gray dye
          name: '§7提醒 §8（需首通 Q01）'
          lore:
            - '§c需本人首通 Q01'
            - '§7缺干粮时聊天提醒，点按钮购买（默认）'
            - '§8通关后再选路径'
      - condition: 'check papi %corerpg_p1_bread_path% == 2'
        priority: 2
        display:
          material: gold nugget
          shiny: true
          name: '§a提醒 §8· §f已选'
          lore:
            - '§7缺干粮时聊天提醒，点按钮购买（默认）'
            - '§8%corerpg_p1_bread_path_tip%'
            - '§a当前路径焦点'
            - '§8再点可重选同路径'
        actions:
          all:
            - 'sound: UI_BUTTON_CLICK-1-1'
            - 'command: corerpg p1 breadpath ask'
            - 'menu: ember_p1_bread_path'
    display:
      material: gold nugget
      name: '§e提醒'
      lore:
        - '§7缺干粮时聊天提醒，点按钮购买（默认）'
        - '§8点选切换面包路径'
        - '§e➥ §f设为提醒'
    actions:
      all:
        - 'sound: UI_BUTTON_CLICK-1-1'
        - 'command: corerpg p1 breadpath ask'
        - 'menu: ember_p1_bread_path'

  # 静默 · MUTE=3 · 不刷提醒；可 /corerpg life buy bread
  '3':
    update: 20
    icons:
      - condition: 'check papi %corerpg_p1_bread_unlock% < 1'
        priority: 1
        display:
          material: gray dye
          name: '§7静默 §8（需首通 Q01）'
          lore:
            - '§c需本人首通 Q01'
            - '§7不刷提醒；可 /corerpg life buy bread'
            - '§8通关后再选路径'
      - condition: 'check papi %corerpg_p1_bread_path% == 3'
        priority: 2
        display:
          material: ink sac
          shiny: true
          name: '§a静默 §8· §f已选'
          lore:
            - '§7不刷提醒；可 /corerpg life buy bread'
            - '§8%corerpg_p1_bread_path_tip%'
            - '§a当前路径焦点'
            - '§8再点可重选同路径'
        actions:
          all:
            - 'sound: UI_BUTTON_CLICK-1-1'
            - 'command: corerpg p1 breadpath mute'
            - 'menu: ember_p1_bread_path'
    display:
      material: ink sac
      name: '§7静默'
      lore:
        - '§7不刷提醒；可 /corerpg life buy bread'
        - '§8点选切换面包路径'
        - '§e➥ §f设为静默'
    actions:
      all:
        - 'sound: UI_BUTTON_CLICK-1-1'
        - 'command: corerpg p1 breadpath mute'
        - 'menu: ember_p1_bread_path'

  # 清空 · NONE=0
  C:
    update: 20
    icons:
      - condition: 'check papi %corerpg_p1_bread_unlock% < 1'
        priority: 1
        display:
          material: gray dye
          name: '§7清空路径 §8（需首通 Q01）'
          lore:
            - '§c需本人首通 Q01'
            - '§8通关后再清 / 重选'
      - condition: 'check papi %corerpg_p1_bread_path% < 1'
        priority: 2
        display:
          material: gray dye
          name: '§7已清空 §8· §f未选'
          lore:
            - '§7当前无面包路径焦点'
            - '§8先点 自动 / 提醒 / 静默'
        actions:
          all:
            - 'sound: UI_BUTTON_CLICK-1-0.8'
            - 'command: corerpg p1 breadpath clear'
            - 'menu: ember_p1_bread_path'
    display:
      material: barrier
      name: '§7清空路径'
      lore:
        - '§7当前：§e%corerpg_p1_bread_path_label%'
        - '§8清焦点 · 可重选（默认回提醒语义由插件）'
        - '§e➥ §f清空'
    actions:
      all:
        - 'sound: UI_BUTTON_CLICK-1-0.8'
        - 'command: corerpg p1 breadpath clear'
        - 'menu: ember_p1_bread_path'

  # 技能组
  K:
    display:
      material: book
      name: '§6去技能组'
      lore:
        - '§7看按键 / 形状 / 身法方向'
        - '§8选好后可对照手感'
        - '§e➥ §f开技能组'
    actions:
      all:
        - 'sound: UI_BUTTON_CLICK-1-1'
        - 'menu: ember_skill_kit'

  # 冒险页
  A:
    display:
      material: compass
      name: '§e回冒险'
      lore:
        - '§7主线 / 挑战 / 深渊 / 短征'
        - '§8换一条内容再冲'
        - '§e➥ §f开冒险页'
    actions:
      all:
        - 'sound: UI_BUTTON_CLICK-1-1'
        - 'menu: ember_p1_adventure'

  # 熬药（BrewPath TIP-FY 选打邻页）
  F:
    display:
      material: brewing stand
      name: '§b熬药路径'
      lore:
        - '§7干粮旁路熬药'
        - '§8不改配方表'
        - '§e➥ §f开熬药路径'
    actions:
      all:
        - 'sound: UI_BUTTON_CLICK-1-1'
        - 'menu: ember_p1_brew_path'


  Z:
    display:
      material: arrow
      name: '§7关闭'
      lore:
        - '§8关掉本页'
    actions:
      all:
        - 'sound: UI_BUTTON_CLICK-1-0.8'
        - close
