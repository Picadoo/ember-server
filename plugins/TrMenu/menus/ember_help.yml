# 余烬 帮助页 — 策划书 §3.1「默认有可用主动，菜单能看操作；愿意读背景的人可以打开两三句说明，不读也能进入 Q01」
#   + §19.1「玩家不需要手打命令」+ §19.3 / §19.4。B2.175。只读说明，不发任何奖励、不改任何数值。
# 数字与 ember-v1.yml / ember-v1-runs.yml / EmberUpgradeRules 一致（改数后同步这里，或用占位符）。
# 打开：主菜单「帮助」或 /ember_help

Title: '§b余烬 · 帮助'

Bindings:
  Commands:
    - '(?i)ember_help'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 300

Layout:
  - '#########'
  - '# L K S #'
  - '# G E D #'
  - '# R Y O #'
  - '###bAB###'

Icons:
  '#':
    display:
      material: gray stained glass pane
      name: '§8'

  L:
    display:
      material: compass
      name: '§6怎么玩（一分钟）'
      lore:
        - '§71. §f冒险 → 选主线本 §8（Q01 进入游戏即可）'
        - '§72. §f清 3 个房间，打倒首领 → 结算'
        - '§73. §f回城：换更好的装备、强化、升阶'
        - '§74. §f刃 + 护符同族 = 套装被动'
        - '§75. §f首通一张图开放下一张，七张图到 Q07'
        - ''
        - '§8打不过就回低一张图刷材料；没有限时'

  K:
    display:
      material: iron sword
      name: '§c操作'
      lore:
        - '§f普攻§7：等武器蓄满再打（满蓄力才有暴击和套装计数）'
        - '§f烬斩§7：主线本里手持 P1 刃按 §eF§7（副手键）'
        - '§8  1.5B · 前方 100° · 3.5 格 · 最多 5 个 · 8 秒冷却'
        - '§f踏步§7：§e潜行 + Q§7 短位移（需在「轻技」页装配）'
        - '§f回复药§7：在快捷栏右侧，按数字键切过去、§e按住右键§7喝'
        - '§8  回复最大生命 20% · 共用 15 秒冷却 · 生命低时屏幕下方会提醒'
        - ''
        - '§7首领出招前地上有§c火焰轮廓§7 + 聊天提示「蓄力」'
        - '§7看到就走出轮廓；伤害不会超出轮廓'

  S:
    display:
      material: nether star
      name: '§d三套装'
      lore:
        - '§6焚烬§7：每 3 次普攻点燃，适合打首领'
        - '§c烬爆§7：每 5 次普攻爆炸，适合清一群'
        - '§a炽愈§7：生命 ×1.12，打中回血，最稳'
        - ''
        - '§7刃和已选护符同族、都 ≥ T1 才成套'
        - '§7觉醒 II：两件 T2 且 +6 · 觉醒 III：两件 T3 且 +9'
        - '§8冒险页可设「掉落目标族」：该族掉率 60%'

  G:
    display:
      material: anvil
      name: '§6变强'
      lore:
        - '§f强化§7：+1~+3 必成；之后失败不降级、不爆装，按次数保底'
        - '§f升阶§7：T1→T2（首通 Q04 后）、T2→T3（首通 Q07 后）'
        - '§8  强化、成色、精工全部保留'
        - '§f印记§7：每次通关 1 枚，8 枚换一件指定族指定部位'
        - '§f互换§7：两件同部位可免费交换强化等级'
        - '§f分解§7：多余的掉落件换胚料（精工 / 成色 / 升阶用）'
        - ''
        - '§8都在「装备 → 工坊」里，点按钮即可'

  E:
    display:
      material: gold nugget
      name: '§e收益与体力'
      lore:
        - '§7主线本每次 §f30 §7体力（每天基础 90）'
        - '§7通关一次固定：§f300 币 · 24 碎片 · 6 骨尘 · 2 核心'
        - '§f  · 120 经验 · 1 印记 · 1 件装备'
        - '§730% 的局途中侧室有额外事件：宝藏怪 / 奖励精英 / 宝箱'
        - '§7首通另有一次性奖励（冒险页每张图都写着）'
        - ''
        - '§e每日委托§7：当天第 1 局通关 +30 币，第 3 局 +60 币 + 6 碎片'
        - '§c中途倒下或离开：本局没有奖励，体力不退'

  D:
    display:
      material: potion
      name: '§a补给与倒下'
      lore:
        - '§7起步送 5 瓶回复药；之后在「装备」页 10 币一瓶'
        - '§7副本里不会自然回血，房间之间也不回'
        - '§7每天第一次在主线本倒下：§f退还该局喝掉的药§7（最多 5 瓶）'
        - '§7回城即补满生命'
        - ''
        - '§8背包满时奖励会暂存，装备页「补领」'

  R:
    display:
      material: map
      name: '§3七张图'
      lore:
        - '§aQ01 灰烬庭院 §8· 首通自选 T1 刃'
        - '§aQ02 焦骨甬道 §8· 首通自选 T1 护符'
        - '§aQ03 残誓地窖 §8· 首通 碎片 / 核心 / 币'
        - '§bQ04 潮蚀水道 §8· 掉 T2；首通后可升 T2'
        - '§bQ05 断塔回廊 §8· T2'
        - '§bQ06 霜封哨所 §8· T2'
        - '§6Q07 锈轨矿道 §8· 掉 T3；首通开放挑战版'
        - ''
        - '§8组队 1～3 人：怪物生命随人数增加，伤害不变'
        - ''
        - '§e➥ §f点击：首领图录（招式与躲法）'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'menu: ember_p1_codex'

  Y:
    display:
      material: written book
      name: '§7背景（可不读）'
      lore:
        - '§7旧誓崩塌后，余烬仍在灰原上燃着。'
        - '§7七处废墟里，守卫们还守着早已没有主人的门。'
        - '§7带上你的刃与护符，把火种一件件找回来。'

  O:
    display:
      material: redstone torch on
      name: '§8关于旧系统'
      lore:
        - '§7主线本（P1）里只认 P1 刃 + 已选护符'
        - '§7旧装备、宝石、附魔、誓约、天赋、同袍、使魔'
        - '§7在主线本里§c不加战斗数值§7（旧物品保留）'
        - '§8挂机 / 日常 / 周本等旧玩法照旧'

  A:
    display:
      material: blaze rod
      name: '§6冒险 · 主线本'
      lore:
        - '§e➥ §f打开冒险页'
    actions:
      all:
        - 'menu: ember_p1_adventure'

  b:
    display:
      material: arrow
      name: '§7返回主菜单'
    actions:
      all:
        - 'menu: ember_hub'

  B:
    display:
      material: barrier
      name: '§c关闭'
    actions:
      all:
        - close
