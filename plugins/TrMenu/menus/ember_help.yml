# 余烬 帮助页 — 策划书 §3.1 / §19 · B2.175 · 只读 · D12197 lore≤3
# 打开：主菜单「帮助」或 /ember_help

Title: '§b余烬 · 帮助'

Bindings:
  Commands:
    - '(?i)ember_help'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 300

Layout:
  - '#########'
  - '# L K S #'
  - '# G E D #'
  - '# R Y O #'
  - '###bAB###'

Icons:
  '#':
    display:
      material: gray stained glass pane
      name: '§8'

  L:
    display:
      material: compass
      name: '§6怎么玩（一分钟）'
      lore:
        - '§7冒险开主线 → 清房打首领 → 回城强化'
        - '§7刃+护符同族=觉醒；同族T2+甲≥2=四件套（受伤−3%）'
        - '§7首通解锁下一张 · 共七张到 Q07'

  K:
    display:
      material: iron sword
      name: '§c操作'
      lore:
        - '§7普攻满蓄 · 副本 F=烬斩 · 潜行+Q=踏步'
        - '§7回复药：快捷栏右 · 按住右键喝（15s CD）'
        - '§8地上火焰轮廓=走开'

  S:
    display:
      material: nether star
      name: '§d套装说明'
      lore:
        - '§6焚烬点燃 §7/ §c烬爆清群 §7/ §a炽愈回血'
        - '§7刃+护符同族且≥T1 成套 · 觉醒看阶/+6/+9'
        - '§8详情：套装/装备/护甲 · 冒险可设掉落目标族'

  G:
    display:
      material: anvil
      name: '§6变强'
      lore:
        - '§7强化保底 · 升阶保留 · 印记8枚定向 · 互换免费'
        - '§7分解：刃/护符→胚料 · 甲→白板零头'
        - '§e➥ §f推荐打法页'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'menu: ember_p1_playstyle'

  E:
    display:
      material: gold nugget
      name: '§e收益与体力'
      lore:
        - '§7主线每次30体力 · 通关固定币/碎/骨/核/印记/装备'
        - '§7委托：第1局+30币 · 第3局+60币+6碎'
        - '§8中途倒下不退体力 · 挑战/深渊首败退半'

  D:
    display:
      material: potion
      name: '§a补给与倒下'
      lore:
        - '§7起步5瓶药 · 装备页10币/瓶 · 本内不自然回血'
        - '§7每天首次主线倒下退还该局药（最多5）'
        - '§8背包满奖励暂存 · 装备页「补领」'

  R:
    display:
      material: map
      name: '§3七张图'
      lore:
        - '§7Q01–Q03 T1 · Q04–Q06 T2 · Q07 T3'
        - '§7组队1～3人 · 怪血随人数 · 伤害不变'
        - '§e➥ §f首领图录'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'menu: ember_p1_codex'

  Y:
    display:
      material: written book
      name: '§7背景（可不读）'
      lore:
        - '§7旧誓崩塌后，余烬仍在灰原上燃着。'
        - '§7七处废墟里，守卫们还守着门。'
        - '§7带上刃与护符，把火种找回来。'

  O:
    display:
      material: redstone torch on
      name: '§8关于旧系统'
      lore:
        - '§7主线只认余烬刃 + 已选护符'
        - '§7旧装/宝石/附魔等主线§c不加战斗数值'
        - '§8挂机庭·自动战斗仍开放'

  A:
    display:
      material: blaze rod
      name: '§6冒险 · 主线本'
      lore:
        - '§e➥ §f打开冒险页'
    actions:
      all:
        - 'menu: ember_p1_adventure'

  b:
    display:
      material: arrow
      name: '§7返回主菜单'
    actions:
      all:
        - 'menu: ember_hub'

  B:
    display:
      material: barrier
      name: '§c关闭'
    actions:
      all:
        - close
