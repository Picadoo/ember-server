# TIP-CS / D13324: 返回用 p1 convert back（勿硬编码工坊）
# D431 每周转化：手持刃/护符 → 选目标族 → 命令确认
Title: '§6余烬 · 每周转化'

Bindings:
  Commands:
    - '(?i)ember_p1_convert'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 400

Layout:
  - '####N####'
  - '#123######'
  - '####RB###'

Events:
  Open:
    - 'tell: §e转化路径：§f%corerpg_p1_convert_path% §8· /corerpg p1 convertpath'
    - 'command: corerpg p1 convertpath nudge'
    - 'sound: BLOCK_ANVIL_LAND-0.4-1.2'
    - 'tell: §8手持刃/护符 · 每周 1 次 · 保留精工/词条/签名/孔 · 强化归零 · 成色截卓越'

Icons:
  '#':
    display:
      material: gray stained glass pane
      name: '§8'
  N:
    display:
      material: book
      name: '§6每周转化 · 说明'
      lore:
        - '§7每周 1 次 · 手持刃/护符'
        - '§a保留精工/词条/签名/孔 · uid 不变'
        - '§c还差：§f%corerpg_p1_forge_gap_convert%'
  '1':
    display:
      material: blaze powder
      name: '§c转到 · 焚烬'
      lore:
        - '§7同阶同部位改族'
        - '§a保留精工/词条/签名/孔 · §c强化归零 · 成色截卓越'
        - '§e➥ §f点选 · 聊天预览'
    actions:
      all: [close, 'command: corerpg p1 convert scorch']
  '2':
    display:
      material: magma cream
      name: '§6转到 · 烬爆'
      lore:
        - '§7同阶同部位改族'
        - '§a保留精工/词条/签名/孔 · §c强化归零 · 成色截卓越'
        - '§e➥ §f点选 · 聊天预览'
    actions:
      all: [close, 'command: corerpg p1 convert burst']
  '3':
    display:
      material: slime ball
      name: '§a转到 · 承烬'
      lore:
        - '§7同阶同部位改族'
        - '§a保留精工/词条/签名/孔 · §c强化归零 · 成色截卓越'
        - '§e➥ §f点选 · 聊天预览'
    actions:
      all: [close, 'command: corerpg p1 convert sustain']
  # TIP-CS / D13324: 动态返回（from afk→挂机庭 · from forge→工坊）；PAPI 未齐先静态「返回」
  R:
    update: 20
    display:
      material: arrow
      name: '§7返回'
    actions:
      all:
        - 'sound: UI_BUTTON_CLICK-1-1'
        - close
        - 'command: corerpg p1 convert back'
  B:
    display:
      material: barrier
      name: '§c关闭'
    actions:
      all: [close]
