# D613: 希望表盘补挂 掉落成色/宝石/图身份（零改数值）
# D458: 洗练入口保底一眼 pity · 零改 pity 数学
# D457: 本局套装 cue %corerpg_p1_set_run% · 零改套装数值
# 余烬 v1 (P1) 装备页 — 策划书 §19.1「装备页显示主手、已选护符、套装是否激活、觉醒档以及下一次突破缺哪项；
#   背包中的非生效装备应明确标注」+ §19.2（实际基础属性 = 统一公式输出）。B2.174。
# 数值全部来自 CoreRpg 占位符 %corerpg_p1_*%（与 /corerpg p1 status 同一份 EmberLoadout），菜单不自己算。
# 打开：主菜单「装备」或 /ember_p1_gear

Title: '§6余烬 · 装备'

Bindings:
  Commands:
    - '(?i)ember_p1_gear'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 400

Layout:
  - '#########'
  - '# W TMCF#'
  - '# S N PL#'
  - '#h H q f#'
  - '#OEbABZX#'

Events:
  Open:
    - 'tell: §e成套追：§f进度与下一觉醒缺项见聊天'
    - 'command: corerpg p1 setchase'

Icons:
  '#':
    display:
      material: gray stained glass pane
      name: '§8'

  W:
    update: 20
    display:
      material: iron sword
      name: '§6主手 · 刃'
      lore:
        - '§f%corerpg_p1_blade%'
        - '%corerpg_p1_gearlib_hope%'
        - '§e➥ §f点击：看手持物品的属性，以及换上后整套怎么变'
    actions:
      all:
        - 'command: corerpg p1 inspect'
        - close

  C:
    update: 20
    display:
      material: totem
      name: '§6已选护符'
      lore:
        - '§f%corerpg_p1_charm%'
        - '§7%corerpg_p1_charm_next_q%'
        - '§e➥ §f手持要用的护符，点击选定'
    actions:
      all:
        - 'command: corerpg p1 charm select'
        - close

  T:
    update: 20
    display:
      material: paper
      name: '§e实际属性'
      lore:
        - '§f%corerpg_p1_stats%'
        - '§7有效生命 §f%corerpg_p1_ehp% §8（生命 ÷ 承伤倍率）'
        - '§e➥ §f点击：聊天栏完整明细与计算公式'
    actions:
      all:
        - 'command: corerpg p1 status'
        - close

  S:
    update: 20
    display:
      material: nether star
      name: '§d套装：§f%corerpg_p1_awaken%'
      lore:
        - '§a炽愈：生命 ×1.00，每 5 次普攻回最大生命 2.5%（觉醒后最多 4%，6 秒一次），最稳'
        - '§8护甲四件套：§f%corerpg_p1_armor_set%'

  N:
    update: 20
    display:
      material: exp bottle
      name: '§b下一次突破'
      lore:
        - '§f%corerpg_p1_awaken_next%'
        - '%corerpg_p1_awaken_route%'
        - '§e➥ §f点击：在聊天栏列出每件的路线（带 [换上] / [兑换] 按钮）'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - close
        - 'command: corerpg p1 route'

  P:
    update: 20
    display:
      material: book
      name: '§6成套进度'
      lore:
        - '§f%corerpg_p1_set_progress%'
        - '%corerpg_p1_set_run%'

  h:
    display:
      material: potion
      name: '§a回复药 · 买 1 瓶'
      lore:
        - '§7余烬回复药：回复最大生命 20%'
        - '§7所有回复药共用 15 秒冷却 · 绑定、不回售'
        - '§e➥ §f点击购买 1 瓶（10 余烬币）'
    actions:
      all:
        - 'command: corerpg p1 shop buy 1'

  H:
    display:
      material: potion
      amount: 5
      name: '§a回复药 · 买5瓶'
      lore:
        - '§7普通本约喝 4–8 瓶 · 限药精选最多 3'
        - '§e➥ §f买 5 瓶（50 币）'
    actions:
      all:
        - 'command: corerpg p1 shop buy 5'

  q:
    update: 20
    display:
      material: chest
      name: '§b补领暂存奖励'
      lore:
        - '§7背包满时结算会先暂存：§f%corerpg_p1_pending% §7项'
        - '§e➥ §f点击补领'
    actions:
      all:
        - 'command: corerpg p1 claim'

  f:
    display:
      material: anvil
      name: '§6工坊'
      lore:
        - '§7手持要处理的刃或护符再打开'
        - '§8手持护甲：仅可分解（白板零头）；养成随护符'
        - '§e➥ §f打开工坊'
    actions:
      all:
        - 'menu: ember_p1_forge'

  X:
    update: 20
    display:
      material: banner
      name: '§6外观商店'
      lore:
        - '§7余烬币 §f%corerpg_coin% §7· 余烬徽 §f%corerpg_p1_badges%'
        - '§7可用印记 §f%corerpg_p1_shopmarks% §8（每阶留 8 枚备用兑换）'
        - '§e➥ §f外观商店页（点商品在页内付款，右键试穿）'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - close
        - 'command: corerpg p1 cosmetic from gear'

  # D174 第 1.5 阶段：签名传奇页（图鉴 / 烙印 / 开关；返回键回到装备页）
  L:
    update: 20
    display:
      material: nether star
      name: '§6签名传奇'
      lore:
        - '§f%corerpg_p1_sig_feel%'
        - '§8详细图鉴在签名页'
        - '§e➥ §f签名页'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - close
        - 'command: corerpg p1 sig from gear'

  # D142 余烬勋记（返回键回到装备页）
  O:
    update: 20
    display:
      material: gold ingot
      name: '§6余烬勋记'
      lore:
        - '%corerpg_p1_honor_n%'
        - '§7一次性成就换来的账号永久小加成（有总上限）'
        - '§e➥ §f打开勋记页'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - close
        - 'command: corerpg p1 honor from gear'

  # D143 词条洗练（返回键回到装备页）
  E:
    update: 20
    display:
      material: prismarine crystals
      name: '§6词条洗练'
      lore:
        - '§7主手刃：%corerpg_p1_reroll_blade_cur%'
        - '§7护符：%corerpg_p1_reroll_charm_cur%'
        - '§e➥ §f洗练页'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - close
        - 'command: corerpg p1 reroll from gear'

  # D145（评审 10-04 #1）：盛世烟火符的常驻入口（活动期间 / 结束后都在；价格、拥有状态来自 PAPI，购买走活动页）
  F:
    update: 20
    display:
      material: firework charge
      name: '§c%corerpg_p1_fest_charm_name% §8（活动护符位）'
      lore:
        - '§7%corerpg_p1_fest_charm%'
        - '§f%corerpg_p1_fest_charm_effect%'
        - '§e➥ §f活动页（购买 / 佩戴 / 剩余国庆币兑换）'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'menu: ember_p1_fest'

  Z:
    update: 20
    display:
      material: enchanted book
      name: '§6天赋专精'
      lore:
        - '%corerpg_p1_spec_pts%'
        - '§7三排小天赋树：首领预警 · 词缀精英 · 套装专精'
        - '§e➥ §f天赋页'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - close
        - 'command: corerpg p1 spec from gear'

  A:
    display:
      material: blaze rod
      name: '§6冒险'
      lore:
        - '§e➥ §f打开冒险页'
    actions:
      all:
        - 'menu: ember_p1_adventure'

  b:
    display:
      material: arrow
      name: '§7返回主菜单'
    actions:
      all:
        - 'menu: ember_hub'

  B:
    display:
      material: barrier
      name: '§c关闭'
    actions:
      all:
        - close

  M:
    update: 20
    display:
      material: gray stained glass pane
      name: '§8'
    icons:
      # D336：本服 priority 数字越小越优先；sa/sb 必须压过 on（双命中）；stash 低于 sa/sb、高于 on
      # D335：装备页护甲入口三态改用 armor_sa/sb（≡active/busy）；actions 仍进护甲页
      - condition: 'check papi %corerpg_p1_armor_sa% == 1'
        priority: 1
        display:
          material: iron chestplate
          name: '§6护甲'
          lore:
            - '%corerpg_p1_armor_head%'
            - '%corerpg_p1_armor_chest%'
            - '§e➥ §f护甲页（对比后换上）'
        actions:
          all:
            - 'sound: BLOCK_NOTE_PLING-1-2'
            - 'menu: ember_p1_armor'
      - condition: 'check papi %corerpg_p1_armor_sb% == 1'
        priority: 2
        display:
          material: iron chestplate
          name: '§6护甲'
          lore:
            - '%corerpg_p1_armor_head%'
            - '%corerpg_p1_armor_chest%'
            - '§e➥ §f护甲页（对比后换上）'
        actions:
          all:
            - 'sound: BLOCK_NOTE_PLING-1-2'
            - 'menu: ember_p1_armor'
      - condition: 'check papi %corerpg_p1_armor_stash_has% == 1'
        priority: 3
        display:
          material: chest
          name: '§6待领物品'
          lore:
            - '%corerpg_p1_armor_stash_line%'
            - '§7原来穿着的东西收在这里，一件不少'
            - '§e➥ §f点击领取到背包（背包满时留在这里，腾出空位再来）'
        actions:
          all:
            - 'sound: BLOCK_NOTE_PLING-1-2'
            - 'command: corerpg p1 armor claim'
      - condition: 'check papi %corerpg_p1_armor_on% == 1'
        priority: 10
        display:
          material: iron chestplate
          name: '§6护甲'
          lore:
            - '%corerpg_p1_armor_head%'
            - '%corerpg_p1_armor_chest%'
            - '§e➥ §f护甲页（对比后换上）'
        actions:
          all:
            - 'sound: BLOCK_NOTE_PLING-1-2'
            - 'menu: ember_p1_armor'
