# 团本子菜单 — EmberRaid · docs/design/DESIGN-ember-rpg-systems.md §4
# 进本：corerpg enter raid · S0 体力 %corerpg_stamina_cost_raid%（cash.yml，现 50）/ 本周首次免费 · 3～5 人

Title: '§9团本 · 大厅通道'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 200

Layout:
  - '#########'
  - '#       #'
  - '# S P R #'
  - '#       #'
  - '####B####'

Events:
  Open:
    - 'sound: BLOCK_CHEST_OPEN-1-0'
    - 'tell: §9【团本】 §7需 3～5 人 · 消耗 %corerpg_stamina_cost_raid% 体力（本周首次免费）'

Icons:
  '#':
    display:
      material: stained glass pane
      name: '§8 '

  B:
    display:
      material: arrow
      name: '§7返回主菜单'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-0'
        - 'menu: ember_hub'

  S:
    icons:
      # 无周免费且体力不足：灰显；blocked_* 已合 credit+cost，右侧字面量（禁双侧 PAPI）
      - condition: 'check papi %corerpg_stamina_blocked_raid% > 0'
        priority: 2
        inherit: true
        display:
          material: gray stained glass pane
          name: '§8开始协作 · 体力不足'
          lore:
            - ''
            - '§7需要 §e%corerpg_stamina_cost_raid% §7体力 · 当前 §f%corerpg_stamina%§7/§f%corerpg_stamina_max%'
            - '§c本周免费已用完 · 体力不足 · 每日 0:00 回满'
        actions:
          all:
            - 'sound: BLOCK_NOTE_PLING-1-0.6'
            - 'tell: §c体力不足，需 %corerpg_stamina_cost_raid% 点体力（本周免费已用完）；每日 0:00 回满。'

    update: 20
    refresh: 20
    display:
      material: beacon
      name: '§a开始协作'
      lore:
        - ''
        - '§7消耗 §e%corerpg_stamina_cost_raid% §7体力（本周首次免费）'
        - '§7当前 §f%corerpg_stamina%§7/§f%corerpg_stamina_max%'
        - '§7失败不返还 · 请确认全队就绪'
        - ''
        - '§8大厅集结 → 左道卫兵 → 右道射手 → 汇合 → 终厅'
        - '§8周首通保底团戒 · 戒+刃=同袍套装'
        - '§8人数 §f3～5 §8· 时限约 30～40 分'
        - ''
        - '§e➥ §f点击进本'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'tell: §9【团本】 §7尝试进入……'
        - 'tell: §8人数 3～5'
        - 'tell: §8需要余烬等级 §eLv.35§8（见菜单等级要求）'
        - 'command: corerpg enter raid'
        - close

  P:
    display:
      material: ender chest
      name: '§6奖励预览'
      lore:
        - ''
        - '§7通关箱（全队每人）：'
        - '  §e核心 ×4 · 附魔晶 ×2'
        - '  §e碎片 ×10 · 骨尘 ×6'
        - '  §e锋利石约 50%（非必给）'
        - ''
        - '§7周首通保底 §6余烬团本之戒'
        - '§7戒+刃=§6余烬同袍'
        - '§7T2/T3 终厅低概率 · 不保底'
        - ''
        - '§e➥ §f点击查看'
    actions:
      all:
        - 'sound: BLOCK_CHEST_OPEN-1-1'
        - 'menu: ember_raid_rewards'

  R:
    display:
      material: watch
      name: '§e次数说明'
      lore:
        - ''
        - '§7本周首次免费 · 其后 %corerpg_stamina_cost_raid% 体力'
        - '§7重置：§f周一 00:00 Asia/Shanghai'
        - '§7只扣发起者 · 没进成本自动退还'
        - '§7进本后失败 / 超时不返还（含首免）'
        - '§7人数硬限 §f3～5'
        - ''
        - '§7体力 §f%corerpg_stamina%§7/§f%corerpg_stamina_max%'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §9团本本周首次免费，其后 %corerpg_stamina_cost_raid% 体力；需 3～5 人。'
