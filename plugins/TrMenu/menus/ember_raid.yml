# 团本子菜单 — EmberRaid · docs/design/DESIGN-ember-rpg-systems.md §4
# 进本：corerpg enter raid · S0 体力 %corerpg_stamina_cost_raid%（cash.yml，现 50）/ 本周首次免费 · 3～5 人

Title: '§9团本 · 大厅通道'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 200

Layout:
  - '#########'
  - '#       #'
  - '# S P R #'
  - '#       #'
  - '####B####'

Events:
  Open:
    - 'sound: BLOCK_CHEST_OPEN-1-0'
    - 'tell: §9【团本】 §7需 3～5 人 · 消耗 %corerpg_stamina_cost_raid% 体力（本周首次免费）'

Icons:
  '#':
    display:
      material: stained glass pane
      name: '§8 '

  B:
    display:
      material: arrow
      name: '§7返回主菜单'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-0'
        - 'menu: ember_hub'

  S:
    icons:
      # 无周免费且体力不足：灰显；blocked_* 已合 credit+cost，右侧字面量（禁双侧 PAPI）
      - condition: 'check papi %corerpg_stamina_blocked_raid% > 0'
        priority: 2
        inherit: true
        display:
          material: gray stained glass pane
          name: '§8开始协作 · 体力不足'
          lore:
            - '§7需要 §e%corerpg_stamina_cost_raid% §7体力 · 现 §f%corerpg_stamina%§7/§f%corerpg_stamina_max%'
            - '§c本周免费已用完 · 体力不足 · 每日 0:00 回满'
        actions:
          all:
            - 'sound: BLOCK_NOTE_PLING-1-0.6'
            - 'tell: §c体力不足，需 %corerpg_stamina_cost_raid% 点体力（本周免费已用完）；每日 0:00 回满。'

    update: 20
    refresh: 20
    display:
      material: beacon
      name: '§a开始协作'
      lore:
        - '§7%corerpg_stamina_cost_raid% 体力（周首免费）· 现 §f%corerpg_stamina%§7/§f%corerpg_stamina_max%'
        - '§83～5人 · 约30～40分 · 周首保底团戒 · 失败不退'
        - '§e➥ §f点击进本'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'tell: §9【团本】 §7尝试进入……'
        - 'tell: §8人数 3～5'
        - 'tell: §8需要余烬等级 §eLv.35§8（见菜单等级要求）'
        - 'command: corerpg enter raid'
        - close

  P:
    display:
      material: ender chest
      name: '§6奖励预览'
      lore:
        - '§7通关箱：核×4 晶×2 碎×10 骨×6 · 锋利石约50%'
        - '§7周首保底团戒 · 戒+刃=同袍 · T2/T3低概率'
        - '§e➥ §f点击查看'
    actions:
      all:
        - 'sound: BLOCK_CHEST_OPEN-1-1'
        - 'menu: ember_raid_rewards'

  R:
    display:
      material: watch
      name: '§e次数说明'
      lore:
        - '§7周首免费 · 其后 %corerpg_stamina_cost_raid% · 3～5人'
        - '§7只扣发起者 · 未进本自动退 · 进本后不退'
        - '§8体力 §f%corerpg_stamina%§7/§f%corerpg_stamina_max% · 周一0:00重置'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §9团本本周首次免费，其后 %corerpg_stamina_cost_raid% 体力；需 3～5 人。'
