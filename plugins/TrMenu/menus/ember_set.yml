# D289：副手诚实半行（方案 A · 永不进 P1 B/H）。
# 套装 · 余烬同袍 2 件（戒+刃）— docs/ember-raid-channel-spec.md
# 背包持有即计件；击杀回能另计

Title: '§9余烬 · 套装'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 200

Layout:
  - '#########'
  - '#       #'
  - '# B R E #'
  - '#   O   #'
  - '####X####'

Events:
  Open:
    - 'sound: BLOCK_NOTE_PLING-1-0.8'
    - 'tell: §9【同袍】 §6余烬同袍 §7= 团戒 + 余烬之刃（背包同持）。击杀微量回能，无大额攻击乘区。'
    - 'tell: §8同袍不计主线刃/护符战力（永不进 P1 B/H）'
    - 'tell: §a【P1 套装】 §7刃+护符同族→族觉醒；再穿 ≥2 件同族掉落阶 T2+ 护甲→四件套受伤 −3%'
    - 'tell: §8详情：主菜单 → 装备 / 护甲'

Icons:
  '#':
    display:
      material: stained glass pane
      name: '§8 '

  X:
    display:
      material: arrow
      name: '§7返回主菜单'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-0'
        - 'menu: ember_hub'

  B:
    display:
      material: diamond sword
      name: '§6余烬之刃'
      lore:
        - ''
        - '§7套装件 A · 武器位'
        - '§8T0 余烬之刃'
        - '§8T1/T2/T3 精炼/深核/灾厄之刃'
        - '§8与团戒同持激活 2 件'
        - ''
        - '§e➥ §f查看说明'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §6【套装·刃】 §7任意余烬之刃（T0～T3）+ 团戒 = §6余烬同袍§7。'

  R:
    display:
      material: gold ingot
      name: '§6余烬团本之戒'
      lore:
        - ''
        - '§7套装件 B · 余烬团本之戒'
        - '§8团本周首通保底'
        - '§8背包持有即计件（不占饰品槽）'
        - '§8与刃同持激活 2 件'
        - ''
        - '§e➥ §f查看说明'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §6【套装·戒】 §7余烬团本之戒 · 周首通保底。与刃同持即激活 §6余烬同袍'

  E:
    display:
      material: nether star
      name: '§9二件套 · 余烬同袍'
      lore:
        - ''
        - '§6套装：余烬同袍（戒+刃）'
        - '§7戒 + 刃 → 击杀微量回能'
        - '§8上限 ≤ 总战力 2%'
        - '§8禁止大额攻击乘区'
        - '§8P1 另有：刃+护符觉醒 · 护甲四件套（受伤 −3%）'
        - '§8见 装备 / 护甲 页（以服内为准）'
        - '§f%corerpg_p1_awaken%'
        - '%corerpg_p1_armor_set%'
        - ''
        - '§8具体数值以服内说明为准'
        - ''
        - '§e➥ §f查看说明'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §9【同袍】 §6余烬同袍 §7= 戒+刃（背包同持即激活）。击杀微量回能，无大额攻击乘区。'
        - 'tell: §a【P1】 §7刃+护符同族→觉醒；四件套受伤 −3% · 见装备/护甲页'

  O:
    display:
      material: iron nugget
      name: '§a副手饰品'
      lore:
        - ''
        - '§7副手饰品 · 放副手槽 · 微量守势'
        - '§8不计入主线刃/护符战力（永不进 P1 B/H）'
        - '§8与护符并行 · 不占护符 best · 无物伤/暴击/技能系数'
        - '§8试点：守腕（物防）/ 生坠（生命）· 灰粮可购'
        - ''
        - '§e➥ §f查看说明'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §a【副手】 §7副手饰品 · 放副手槽 · 微量守势。'
        - 'tell: §8不计入主线刃/护符战力（永不进 P1 B/H）。'
