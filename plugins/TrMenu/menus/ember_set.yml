# 套装 · 余烬同袍 2 件（戒+刃）— docs/ember-raid-channel-spec.md
# 背包持有即计件；击杀回能另计

Title: '§9余烬 · 套装'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 200

Layout:
  - '#########'
  - '#       #'
  - '# B R E #'
  - '#   O   #'
  - '####X####'

Events:
  Open:
    - 'sound: BLOCK_NOTE_PLING-1-0.8'
    - 'tell: §9【套装】 §6余烬同袍 §7· 团戒 + 任意余烬之刃。背包同持即激活。'
    - 'tell: §8击杀微量回能（≤战力 2%），无大额攻击乘区'
    - 'tell: §7副手饰品 · 放副手槽生效'

Icons:
  '#':
    display:
      material: stained glass pane
      name: '§8 '

  X:
    display:
      material: arrow
      name: '§7返回主菜单'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-0'
        - 'menu: ember_hub'

  B:
    display:
      material: diamond sword
      name: '§6余烬之刃'
      lore:
        - ''
        - '§7套装件 A · 武器位'
        - '§8T0 余烬之刃'
        - '§8T1/T2/T3 精炼/深核/灾厄之刃'
        - '§8与团戒同持激活 2 件'
        - ''
        - '§e➥ §f查看说明'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §6【套装·刃】 §7任意余烬之刃（T0～T3）+ 团戒 = §6余烬同袍§7。'

  R:
    display:
      material: gold ingot
      name: '§6余烬团本之戒'
      lore:
        - ''
        - '§7套装件 B · 余烬团本之戒'
        - '§8团本周首通保底'
        - '§8背包持有即计件（不占饰品槽）'
        - '§8与刃同持激活 2 件'
        - ''
        - '§e➥ §f查看说明'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §6【套装·戒】 §7余烬团本之戒 · 周首通保底。与刃同持即激活 §6余烬同袍'

  E:
    display:
      material: nether star
      name: '§9二件套 · 余烬同袍'
      lore:
        - ''
        - '§6套装：余烬同袍（戒+刃）'
        - '§7戒 + 刃 → 击杀微量回能'
        - '§8上限 ≤ 总战力 2%'
        - '§8禁止大额攻击乘区'
        - '§8日后 4 件（甲/饰品）再扩'
        - '§8本期 §c不改方块甲'
        - ''
        - '§8具体数值以服内说明为准'
        - ''
        - '§e➥ §f查看说明'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §9【套装】 §6余烬同袍 §7= 戒+刃（背包同持即激活）。击杀微量回能，无大额攻击乘区。'
        - 'tell: §8目前只有「戒+刃」这一套；护符套装后续开放。'

  O:
    display:
      material: iron nugget
      name: '§a副手饰品'
      lore:
        - ''
        - '§7副手饰品 · 放副手槽生效'
        - '§8与护符并行 · 不占护符 best'
        - '§8试点：守腕（物防）/ 生坠（生命）'
        - '§8工坊灰粮可购'
        - ''
        - '§e➥ §f查看说明'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §a【副手】 §7副手饰品 · 放副手槽生效。与护符并行叠加。'
