# D289：副手诚实半行（方案 A · 永不进 P1 B/H）。
# 套装 · 余烬同袍 2 件（戒+刃）— docs/ember-raid-channel-spec.md
# 背包持有即计件；击杀回能另计

Title: '§9余烬 · 套装'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 200

Layout:
  - '#########'
  - '#       #'
  - '# B R E #'
  - '#   O   #'
  - '####X####'

Events:
  Open:
    - 'sound: BLOCK_NOTE_PLING-1-0.8'
    - 'tell: §9【同袍】 §6余烬同袍 §7= 团戒 + 余烬之刃（背包同持）。击杀微量回能，无大额攻击乘区。'
    - 'tell: §8同袍不计主线刃/护符战力（永不进 P1 B/H）'
    - 'tell: §a【P1 套装】 §7刃+护符同族→族觉醒；再穿 ≥2 件同族掉落阶 T2+ 护甲→四件套受伤 −3%'
    - 'tell: §8详情：主菜单 → 装备 / 护甲'

Icons:
  '#':
    display:
      material: stained glass pane
      name: '§8 '

  X:
    display:
      material: arrow
      name: '§7返回主菜单'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-0'
        - 'menu: ember_hub'

  B:
    display:
      material: diamond sword
      name: '§6余烬之刃'
      lore:
        - '§7套装件 A · T0～T3 余烬之刃'
        - '§8与团戒同持激活同袍'
        - '§e➥ §f查看说明'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §6【套装·刃】 §7任意余烬之刃（T0～T3）+ 团戒 = §6余烬同袍§7。'

  R:
    display:
      material: gold ingot
      name: '§6余烬团本之戒'
      lore:
        - '§7套装件 B · 团本周首通保底'
        - '§8背包计件 · 与刃同持激活'
        - '§e➥ §f查看说明'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §6【套装·戒】 §7余烬团本之戒 · 周首通保底。与刃同持即激活 §6余烬同袍'

  E:
    display:
      material: nether star
      name: '§9二件套 · 余烬同袍'
      lore:
        - '§6同袍：戒+刃 · 击杀微量回能 · ≤总战力2%'
        - '§aP1：§7刃+符觉醒 · 四件套受伤−3% · %corerpg_p1_awaken%'
        - '§8%corerpg_p1_armor_set% · 详见装备/护甲'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §9【同袍】 §6余烬同袍 §7= 戒+刃（背包同持即激活）。击杀微量回能，无大额攻击乘区。'
        - 'tell: §a【P1】 §7刃+护符同族→觉醒；四件套受伤 −3% · 见装备/护甲页'

  O:
    display:
      material: iron nugget
      name: '§a副手饰品'
      lore:
        - '§7副手微量守势 · 永不进 P1 B/H'
        - '§8守腕/生坠 · 灰粮可购'
        - '§e➥ §f打开补给·生活'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'menu: ember_life'
