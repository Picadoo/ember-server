# 余烬 v1 (P1) 图录 · 主线首领 — 书 §7（各图首领）、§19.3（预警用动作 + 范围形状）、§19.5（图录只给展示，不叠战斗属性）。
# 只读页：每格写首领名、单人普通版生命 / 普攻、技能形状与预警、怎么躲，以及本人首通状态（PAPI corerpg_p1_qXX_state）。
# 生命 / 普攻数字必须与 MythicMobs/Mobs/EmberP1Main.yml 的 EmberQxxBoss Health / Damage 一致（tools/p1sim/selfcheck.py 会核对）。
# 入口：图录 ember_bestiary「主线首领」、冒险页 ember_p1_adventure「图录」、帮助页「七张图」，或 /ember_p1_codex。

Title: '§6余烬 v1 · 图录 · 主线首领'

Bindings:
  Commands:
    - '(?i)ember_p1_codex'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 300

Layout:
  - '#########'
  - '#   I   #'
  - '#1234567#'
  - '#       #'
  - '##A#H#B##'

Events:
  Open:
    - 'sound: BLOCK_CHEST_OPEN-1-0'

Icons:
  '#':
    display:
      material: gray stained glass pane
      name: '§8'

  I:
    display:
      material: book
      name: '§e怎么看'
      lore:
        - '§7数字是§f单人普通版§7；组队时首领生命随人数增加，伤害不变'
        - '§7挑战版招式相同，生命和伤害更高'
        - '§7首领出招前地上有§c火焰轮廓§7 + 聊天「蓄力」'
        - '§7伤害不会超出轮廓；首领全程可以直接打'
        - ''
        - '§8图录只做展示，不加任何属性'

  '1':
    display:
      material: stone axe
      name: '§aQ01 §c残门蛮兵'
      lore:
        - '§7状态：§f%corerpg_p1_q01_state%'
        - '§7生命 §f240 §8· §7普攻 §f6§8（≥3.2 秒一次）'
        - ''
        - '§c重斩§7：每 8 秒，正前方 100° · 4 格'
        - '§8  抬斧预警 1.0 秒 · 伤害 12'
        - ''
        - '§a躲法§7：看到抬斧就绕到它侧后'
        - '§8不锁血、不招小怪'

  '2':
    display:
