# 余烬 v1 (P1) 图录 · 主线首领 — 书 §7（各图首领）、§19.3（预警用动作 + 范围形状）、§19.5（图录只给展示，不叠战斗属性）。
# 只读页：每格写首领名、单人普通版生命 / 普攻、技能形状与预警、怎么躲，以及本人首通状态（PAPI corerpg_p1_qXX_state）。
# 生命 / 普攻数字必须与 MythicMobs/Mobs/EmberP1Main.yml 的 EmberQxxBoss Health / Damage 一致（tools/p1sim/selfcheck.py 会核对）。
# 入口：图录 ember_bestiary「主线首领」、冒险页 ember_p1_adventure「图录」、帮助页「七张图」，或 /ember_p1_codex。

Title: '§6余烬 · 图录 · 主线首领'

Bindings:
  Commands:
    - '(?i)ember_p1_codex'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 300

Layout:
  - '#########'
  - '#   I   #'
  - '#1234567#'
  - '#TVYRGJZ#'
  - '##A#H#B##'

Events:
  Open:
    - 'sound: BLOCK_CHEST_OPEN-1-0'

Icons:
  J:
    display:
      material: diamond chestplate
      name: '§b团本首领 · 霜封统领·团'
      lore:
        - ''
        - '§7半血砸地 · 全员躲开'
        - '§7倒下可复活 · 点进冒险看团本'
    actions:
      all:
        - 'menu: ember_p1_adventure'

  Z:
    display:
      material: golden chestplate
      name: '§6团本首领 · 断塔斧卫·团'
      lore:
        - ''
        - '§7倒下：观战队友，下个房间开打 / 首领转阶段 / 首领最后 20% 时复活（50% 生命）'
        - '§7地图：断塔回廊（Q05）· 3～5 人'
    actions:
      all:
        - 'menu: ember_p1_adventure'

  G:
    display:
      material: iron chestplate
      name: '§6团本首领 · 炉锁巨卫·团'
      lore:
        - ''
        - '§7倒下：观战队友，下个房间开打 / 首领转阶段 / 首领最后 20% 时复活（50% 生命）'
        - '§7地图：锈轨矿道（Q07）· 3～5 人'
    actions:
      all:
        - 'menu: ember_p1_adventure'

  Y:
    update: 40
    display:
      material: ender eye
      name: '§5深渊 · 余烬层'
      lore:
        - ''
        - '§7%corerpg_p1_abyss_state%'
        - '%corerpg_p1_abyss_t1%'
    actions:
      all:
        - 'menu: ember_p1_abyss'

  R:
    update: 40
    display:
      material: blaze powder
      name: '§c余烬连战 · 每周首领连战'
      lore:
        - ''
        - '§7状态：§f%corerpg_p1_rush%'
        - '§7每打倒一个：休息 10 秒，站着的人回复 30% 生命；倒下的人观战，没有复活'
    actions:
      all:
        - 'menu: ember_p1_adventure'

  V:
    update: 40
    display:
      material: glowstone dust
      name: '§6重打花样'
      lore:
        - ''
        - '§7今天：%corerpg_p1_vbounty%'
        - '§7只在§f全队都已首通§7的普通版主线重打里出现（首通、挑战、深渊、团本都没有）'
    actions:
      all:
        - 'menu: ember_p1_adventure'

  T:
    display:
      material: enchanted book
      name: '§d成长'
      lore:
        - ''
        - '§b洗练§7：给刃 / 护符换一个小词条（如「定身纹」首领预警招伤害 -0.5%～-2%）'
        - '§7三样都是§f打法取舍，不是变强§7：装备的阶、成色、强化仍是主线'
    actions:
      all:
        - 'menu: ember_p1_spec'

  '#':
    display:
      material: gray stained glass pane
      name: '§8'

  I:
    display:
      material: book
      name: '§e怎么看'
      lore:
        - ''
        - '§7数字是§f单人普通版§7；组队时首领生命随人数增加，伤害不变'
        - '§7挑战版招式相同，生命和伤害更高'

  '1':
    display:
      material: stone axe
      name: '§aQ01 §c残门蛮兵'
      lore:
        - ''
        - '§7状态：§f%corerpg_p1_q01_state%'
        - '§7生命 §f200 §8· §7普攻 §f4§8（≥3.2 秒一次）'

  '2':
    display:
      material: iron axe
      name: '§aQ02 §c守炉蛮兵'
      lore:
        - ''
        - '§7状态：§f%corerpg_p1_q02_state%'
        - '§7生命 §f900 §8· §7普攻 §f10§8（≥3 秒一次）'

  '3':
    display:
      material: iron sword
      name: '§aQ03 §c残誓守卫'
      lore:
        - ''
        - '§7状态：§f%corerpg_p1_q03_state%'
        - '§7生命 §f950 §8· §7普攻 §f13§8（≥3 秒一次）'

  '4':
    display:
      material: prismarine shard
      name: '§bQ04 §c潮闸重卫'
      lore:
        - ''
        - '§7状态：§f%corerpg_p1_q04_state%'
        - '§7生命 §f1420 §8· §7普攻 §f14§8（≥3 秒一次）'

  '5':
    display:
      material: diamond axe
      name: '§bQ05 §c断塔斧卫'
      lore:
        - ''
        - '§7状态：§f%corerpg_p1_q05_state%'
        - '§7生命 §f2280 §8· §7普攻 §f17§8（≥3 秒一次）'

  '6':
    display:
      material: packed ice
      name: '§bQ06 §c霜封统领'
      lore:
        - ''
        - '§7状态：§f%corerpg_p1_q06_state%'
        - '§8  预警 3.0 秒 · 伤害 30'

  '7':
    display:
      material: anvil
      name: '§6Q07 §c炉锁巨卫'
      lore:
        - ''
        - '§7状态：§f%corerpg_p1_q07_state%'
        - '§8  预警 3.0 秒 · 伤害 36'

  A:
    display:
      material: map
      name: '§a冒险'
      lore:
        - '§7打开主线本列表'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'menu: ember_p1_adventure'

  H:
    display:
      material: compass
      name: '§e帮助'
      lore:
        - '§7怎么玩 / 操作 / 套装（含四件套）'
