        - '§7生命 §f900 §8· §7普攻 §f10§8（≥3 秒一次）'
        - ''
        - '§c砸地§7：每 9 秒，它前方 2 格处 半径 3 格圆'
        - '§8  预警 1.2 秒 · 伤害 18'
        - '§c横扫§7（半血后）：砸地后 2 秒，前方 80° · 3 格'
        - '§8  预警 0.9 秒 · 伤害 10'
        - ''
        - '§a躲法§7：砸地走出圆圈，紧接着别站它正面'
        - '§8炉管只是装饰，不用打'

  '3':
