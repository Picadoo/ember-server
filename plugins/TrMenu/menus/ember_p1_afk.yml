    icons:
      # D285: daily kill cap → steer to adventure (stamina still usable)
      - condition: 'check papi %corerpg_p1_afk_full% >= 1'
        priority: 1
        display:
          material: diamond sword
          name: '§e体力还在 · 去冒险'
          lore:
            - ''
            - '§a今日挂机击杀已满（%corerpg_p1_afk_today%）'
