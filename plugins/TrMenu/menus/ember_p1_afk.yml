# D383: 战况今日软目标 + 层差一览 + 层格相对多养 + 去哪花旁文案（零改产量）
# P1 挂机庭 · 自动战斗（D177 rev 2，DESIGN-ember-afk-p1-2026-10-04.md）— CoreRpg EmberAfkService + AfkTierService（复用 ember_afk 世界）
# 站在已解锁的层里角色自己打本层的个人怪：自动普攻 + 冷却好自动烬斩 + 战利品直接进账（材料进仓库）；击杀速度和能扛住哪层看装备
# 四层按主线首通开放：灰坡 Q01 · 荒原 Q03 · 焦土 Q05 · 烬原深处 Q07；每日 2400 只封顶（在线 + 离线），离线按实测速度 × 25%、最多 1200 只
# 旧挂机子菜单 ember_afk.yml 只留给旧枢纽 ember_hub_legacy.yml
Title: '§a挂机庭 · 自动战斗'
Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 200
Layout:
  - '#########'
  - '# 1 2 3 #'
  - '# S 4 V #'
  - '# I F H #'
  - '####B####'
Events:
  Open:
    - 'sound: BLOCK_CHEST_OPEN-1-0'
    - 'tell: §8挂机庭 · 日 2400 只封顶 · 材料进仓库 · 点「去哪花」强化升阶'
    - 'tell: §8满后体力还能去冒险'
    - 'tell: §8战况有今日软目标·层差一览 · 多坐一会儿看还差多少'
Icons:
  '#':
    display:
      material: stained glass pane
      name: '§8 '
  B:
    display:
      material: arrow
      name: '§7返回主菜单'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-0'
        - 'menu: ember_hub'
  I:
    update: 20
    display:
      material: clock
      name: '§f挂机战况（实时）'
      lore:
