        - '§7未满就继续坐 · 满了点「去冒险」/「去哪花」'
        - '§7本次：%corerpg_p1_afk_session% · 速度：%corerpg_p1_afk_kph%'
        - '§7每小时战利品：%corerpg_p1_afk_loot%'
        - '§7本层日上限预览：%corerpg_p1_afk_cap%'
        - '§7离线：%corerpg_p1_afk_offline%'
        - ''
        - '§e层差一览'
        - '§7灰坡→荒原：下一层更好 · 多养 §e核心碎片'
        - '§7荒原→焦土：下一层更好 · 多养 §e胚料 §7（核心续）'
        - '§7焦土→烬原：币/碎片/核心最高档 · §8刚通 Q07 多半扛不住'
        - '§7已是最高层 · 打满今天去花材料或去冒险'
        - '§7看上排①–④名片换层 · 打得稳可试更高'
        - ''
        - '§7规则：站在层里就自动打怪、自动放烬斩，战利品直接到账'
        - '§7装备越好打得越快、能挂的层越高；10 分钟死 3 次会停下'
        - '§7每日 2400 只封顶（在线 + 离线），0 点重置；材料账号绑定'
        - '§7扛不住就降一层，不丢人（10 分钟死 3 次会停）'
        - '§a材料进仓库 · 点「去哪花」强化升阶（魂尘≠挂机）'
