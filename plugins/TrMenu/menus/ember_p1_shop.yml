        - '§6%corerpg_p1_shopprice_color_white%'
        - ''
        - '%corerpg_p1_shop_color_white%'
        - ''
        - '§e➥ §f左键：购买 / 换上 · 右键：试穿 10 秒'
    actions:
      left:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - close
        - 'command: corerpg p1 cosmetic pick color_white'
      right:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - close
        - 'command: corerpg p1 cosmetic try color_white'

