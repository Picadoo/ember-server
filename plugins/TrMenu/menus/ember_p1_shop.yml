# 余烬 v1.1 · 外观商店页（D107 外观商店 + E-review #2 印记外观 + D117 余烬徽；F-review #2 / D121 唯一的商店）— 只做展示，不加属性。
# 名字 / 说明 / 价格 / 状态全来自 PAPI（%corerpg_p1_shopname_|shophow_|shopprice_|shop_<id>%），和聊天栏列表
# （/corerpg p1 cosmetic list）同一份数据、同一句话。左键：没有就打开页内确认页 ember_p1_shop_buy（每种付款方式一格，
# 写付得起或还差多少），有了就换上 / 取下；右键：试穿 10 秒。付款与校验全在服务端（/corerpg p1 cosmetic pick|buysel|try）。
# 入口（都打开这一页）：赛季页 [43]、装备页 [43]、/ember_p1_shop、/corerpg p1 cosmetic、进服消息与称号列表的 [外观商店]。

Title: '§b余烬 · 外观商店'

Bindings:
  Commands:
    - '(?i)ember_p1_shop'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 400

Layout:
  - '####I####'
  - '#abcde###'
  - '#fgh#ijk#'
  - '#lmn#op##'
  - '####B####'

Events:
  Open:
    - 'sound: BLOCK_CHEST_OPEN-1-0'

Icons:
  '#':
    display:
      material: gray stained glass pane
      name: '§8'

  I:
    update: 20
    display:
      material: chest
      name: '§b外观商店 §8（只做展示，不加属性）'
      lore:
        - ''
        - '§7余烬币：§f%corerpg_coin%'
        - '§7余烬徽：§f%corerpg_p1_badges% §8（周目标奖励）'
        - '§7可用印记：§f%corerpg_p1_shopmarks% §8（每阶留 8 枚备用兑换）'
        - '§7折算：1 徽 = 1 点 · T1 1 点 · T2 2 点 · T3 4 点 · 1 点 = 50 币'
        - '§7辉光 / 动效不收币，其余币、徽、印记都能付 · 买一次永久有，不回收'
        - ''
        - '§e➥ §f左键：没有就看付款方式 / 有了就换上或取下'
        - '§e➥ §f右键：试穿 10 秒'

  a:
    update: 20
    display:
      material: paper
      name: '%corerpg_p1_shopname_color_white%'
      lore:
