# 余烬 v1.1 · D119 外观商店页（D107 外观商店 + E-review #2 印记外观 + D117 余烬徽）— 只做展示，不加属性。
# 每件一个图标：状态 / 价格来自 PAPI %corerpg_p1_shop_<id>%；左键 = 没有就打开购买（聊天栏按付款方式出按钮），
# 有了就换上 / 取下；右键 = 试穿 10 秒。付款与校验全在服务端（/corerpg p1 cosmetic pick|try <id>）。
# 入口：赛季页「外观商店」、/ember_p1_shop；聊天版仍是 /corerpg p1 cosmetic。

Title: '§b余烬 · 外观商店'

Bindings:
  Commands:
    - '(?i)ember_p1_shop'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 400

Layout:
  - '####I####'
  - '#abcde###'
  - '#fgh#ijk#'
  - '#lmn#op##'
  - '##H#B#T##'

Events:
  Open:
    - 'sound: BLOCK_CHEST_OPEN-1-0'

Icons:
  '#':
    display:
      material: gray stained glass pane
      name: '§8'

  I:
    update: 20
    display:
      material: chest
      name: '§b外观商店 §8（只做展示，不加属性）'
      lore:
        - ''
        - '§7余烬币：§f%corerpg_coin%'
        - '§7余烬徽：§f%corerpg_p1_badges% §8（周目标奖励，1 徽 = 1 点）'
        - '§7多出来的印记也能付：T1 1 点 · T2 2 点 · T3 4 点（每阶留 8 枚备用兑换）'
        - '§71 点 = 50 币标价 · 买一次永久有，不回收'
        - ''
        - '§e➥ §f左键：没有就购买 / 有了就换上或取下'
        - '§e➥ §f右键：试穿 10 秒'

  a:
