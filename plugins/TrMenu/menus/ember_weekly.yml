# 周常副本子菜单 — EmberWeekly
# 进本：corerpg enter weekly · S0 体力 45 / 本周首次免费

Title: '§c周常 · 深核'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 200

Layout:
  - '#########'
  - '#       #'
  - '# S P R #'
  - '#       #'
  - '####B####'

Events:
  Open:
    - 'sound: BLOCK_CHEST_OPEN-1-0'

Icons:
  '#':
    display:
      material: stained glass pane
      name: '§8 '

  B:
    display:
      material: arrow
      name: '§7返回主菜单'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-0'
        - 'menu: ember_hub'

  S:
    icons:
      # 无周免费且体力不足：灰显；blocked_* 已合 credit+cost，右侧字面量（禁双侧 PAPI）
      - condition: 'check papi %corerpg_stamina_blocked_weekly% > 0'
        priority: 2
        inherit: true
        display:
          material: gray stained glass pane
          name: '§8开始挑战 · 体力不足'
          lore:
            - '§7需要 §e%corerpg_stamina_cost_weekly% §7体力 · 现 §f%corerpg_stamina%§7/§f%corerpg_stamina_max%'
            - '§c本周免费已用完 · 体力不足 · 每日 0:00 回满'
        actions:
          all:
            - 'sound: BLOCK_NOTE_PLING-1-0.6'
            - 'tell: §c体力不足，需 %corerpg_stamina_cost_weekly% 点体力（本周免费已用完）；每日 0:00 回满。'

    update: 20
    refresh: 20
    display:
      material: diamond sword
      name: '§a开始挑战'
      lore:
        - '§7%corerpg_stamina_cost_weekly% 体力（周首免费）· 现 §f%corerpg_stamina%§7/§f%corerpg_stamina_max%'
        - '§8高难多波 · 约2～3分 · 1～3人 · 失败不退'
        - '§e➥ §f点击进本'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'tell: §c【周】 正在进入 §f深核·周§c …'
        - 'tell: §8（门槛：余烬 Lv.20 · 1～3 人；不满足会提示且不扣体力）'
        - 'command: corerpg enter weekly'
        - close

  P:
    display:
      material: ender chest
      name: '§6奖励预览'
      lore:
        - '§7终厅：核心×1 · 刃约20% · 护符约12% · 稳定符约4%'
        - '§7通关箱：核×3 晶×2 碎×8 骨×4 · 周首保底护符'
        - '§e➥ §f点击查看'
    actions:
      all:
        - 'sound: BLOCK_CHEST_OPEN-1-1'
        - 'menu: ember_weekly_rewards'

  R:
    display:
      material: watch
      name: '§e次数说明'
      lore:
        - '§7周首免费 · 其后 %corerpg_stamina_cost_weekly% 体力 · 剩 §f%ember_weekly_left%'
        - '§7重置周一 0:00 · 进本即扣 · 失败不退'
        - '§8体力 §f%corerpg_stamina%§8/§f%corerpg_stamina_max%'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §6周本本周首次免费，其后消耗 %corerpg_stamina_cost_weekly% 体力；每日 0:00 回满体力。'
