# 周常副本子菜单 — EmberWeekly
# 进本：corerpg enter weekly · S0 体力 45 / 本周首次免费

Title: '§c周常 · 深核'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 200

Layout:
  - '#########'
  - '#       #'
  - '# S P R #'
  - '#       #'
  - '####B####'

Events:
  Open:
    - 'sound: BLOCK_CHEST_OPEN-1-0'

Icons:
  '#':
    display:
      material: stained glass pane
      name: '§8 '

  B:
    display:
      material: arrow
      name: '§7返回主菜单'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-0'
        - 'menu: ember_hub'

  S:
    icons:
      # 无周免费且体力不足：灰显；blocked_* 已合 credit+cost，右侧字面量（禁双侧 PAPI）
      - condition: 'check papi %corerpg_stamina_blocked_weekly% > 0'
        priority: 2
        inherit: true
        display:
          material: gray stained glass pane
          name: '§8开始挑战 · 体力不足'
          lore:
            - ''
            - '§7需要 §e%corerpg_stamina_cost_weekly% §7体力 · 当前 §f%corerpg_stamina%§7/§f%corerpg_stamina_max%'
            - '§c本周免费已用完 · 体力不足 · 每日 0:00 回满'
        actions:
          all:
            - 'sound: BLOCK_NOTE_PLING-1-0.6'
            - 'tell: §c体力不足，需 %corerpg_stamina_cost_weekly% 点体力（本周免费已用完）；每日 0:00 回满。'

    update: 20
    refresh: 20
    display:
      material: diamond sword
      name: '§a开始挑战'
      lore:
        - ''
        - '§7消耗 §e%corerpg_stamina_cost_weekly% §7体力（本周首次免费抵扣）'
        - '§7当前 §f%corerpg_stamina%§7/§f%corerpg_stamina_max%'
        - '§7失败不返还 · 请确认后再进'
        - ''
        - '§8高难多波 + 终局蛮兵'
        - '§8一局约 2～3 分钟 · 建议 1～3 人'
        - ''
        - '§c'
        - '§e➥ §f点击进本'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'tell: §c[周] 正在尝试进入 §fEmberWeekly§c …'
        - 'tell: §8需要余烬等级 §eLv.20§8（打开角色面板可查看）'
        - 'command: corerpg enter weekly'
        - close

  P:
    display:
      material: ender chest
      name: '§6奖励预览'
      lore:
        - ''
        - '§7Boss 掉落：'
        - '  §f核心 1～2 / 只'
        - '  §f刃 ~28% · 护符 ~20%'
        - ''
        - '§7通关箱：'
        - '  §e核心 ×2～3 · 附魔晶 ×2'
        - '  §e碎片 ×8 · 骨尘 ×4'
        - '  §e每周首通保底 精炼护符'
        - '  §8之后：刃 10% · 护符 8%'
        - ''
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §6[周奖励] §7核心 + 晶×2 + 材料；每周首通保底精炼护符（精炼刃来自主线第 2 章）'

  R:
    display:
      material: watch
      name: '§e次数说明'
      lore:
        - ''
        - '§7本周首次免费（账户抵扣）· 其后扣 45 体力'
        - '§7商城可再补 §f1 §7张 · 主线第 2 章送 1 张'
        - '§7重置：§f周一 00:00 Asia/Shanghai'
        - '§7进本即扣 · 失败不返还'
        - ''
        - '§8体力 §f%corerpg_stamina%§8/§f%corerpg_stamina_max%'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §6周本本周首次免费，其后消耗 45 体力；每日 0:00 回满体力。'
