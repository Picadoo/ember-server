# 周常副本子菜单 — EmberWeekly
# 进本命令：/dp start EmberWeekly

Title: '§c周常 · 深核'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 200

Layout:
  - '#########'
  - '#       #'
  - '# S P R #'
  - '#       #'
  - '####B####'

Events:
  Open:
    - 'sound: BLOCK_CHEST_OPEN-1-0'

Icons:
  '#':
    display:
      material: stained glass pane
      name: '§8 '

  B:
    display:
      material: arrow
      name: '§7返回主菜单'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-0'
        - 'menu: ember_hub'

  S:
    display:
      material: diamond sword
      name: '§a开始挑战'
      lore:
        - ''
        - '§7进本消耗 §f1 §7张 §6余烬周票'
        - '§7失败不返还 · 请确认后再进'
        - ''
        - '§8高难多波 + 终局蛮兵'
        - '§8一局约 2～3 分钟 · 建议 1～3 人'
        - ''
        - '§c'
        - '§e➥ §f点击进本'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'tell: §c[周] 正在尝试进入 §fEmberWeekly§c …'
                - 'tell: §8需要余烬等级 §eLv.20§8（打开角色面板可查看）'
        - 'command: dp start EmberWeekly'
        - close

  P:
    display:
      material: ender chest
      name: '§6奖励预览'
      lore:
        - ''
        - '§7Boss 掉落：'
        - '  §f核心 1～2 / 只'
        - '  §f刃 ~28% · 护符 ~20%'
        - ''
        - '§7通关箱：'
        - '  §e核心 ×2～3 · 附魔晶 ×2'
        - '  §e碎片 ×8 · 骨尘 ×4'
        - '  §e每周首通保底 精炼护符'
        - '  §8之后：刃 10% · 护符 8%'
        - ''
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §6[周奖励] §7核心 + 晶×2 + 材料；每周首通保底精炼护符（精炼刃来自主线第 2 章）'

  R:
    display:
      material: watch
      name: '§e次数说明'
      lore:
        - ''
        - '§7每周免费 §f1 §7张周票（周一登录发放）'
        - '§7商城可再补 §f1 §7张 · 主线第 2 章送 1 张'
        - '§7重置：§f周一 00:00 Asia/Shanghai'
        - '§7进本即扣 · 失败不返还'
        - ''
        - '§8次数 = 背包 §6余烬周票 §8数量'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §c周本每周免费 1 张周票（商城可补 1 张），周一 0:00（上海时区）发放；进本扣 1 张。'
