# 分层挂机子菜单 — CoreRpg AfkTierService（菜单点选层；门槛与传送在 CoreRpg）
# 四层共用每日掉落上限（碎片 150 / 骨尘 80 / 核心碎片 10 / 魂尘 2 / 击杀币 150 / 击杀经验 100）
# 软顶：达顶后掉率约两成五；再挂再降一档（双软顶，长挂显著低于满速）

Title: '§a挂机庭 · 分层'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 200

Layout:
  - '#########'
  - '# 1 2 3 #'
  - '#   4   #'
  - '#  I H #'
  - '####B####'

Events:
  Open:
    - 'sound: BLOCK_CHEST_OPEN-1-0'

Icons:
  '#':
    display:
      material: stained glass pane
      name: '§8 '

  B:
    display:
      material: arrow
      name: '§7返回主菜单'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-0'
        - 'menu: ember_hub'

  '1':
    display:
      material: grass
      name: '§a① 灰坡 §7Lv10'
      lore:
        - '§7自动战斗 · 碎片·骨尘·魂尘2%'
        - '§8推荐：旧刃+护符'
        - '§e➥ §f点击传送'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'command: corerpg afk 1'
        - close

  '2':
    display:
      material: smooth brick
      name: '§e② 荒原 §7Lv20'
      lore:
        - '§7尸鬼/弓骸 · 碎·骨·核碎1%·魂2%'
        - '§8推荐：精炼刃+2、护符+1 · Lv20'
        - '§e➥ §f点击传送'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'command: corerpg afk 2'
        - close

  '3':
    display:
      material: nether brick
      name: '§6③ 焦土 §7Lv30'
      lore:
        - '§7焦兵/霜骸 · 碎·骨·核碎2%·魂3%'
        - '§8推荐：深核刃+3、精炼符+2 · Lv30'
        - '§e➥ §f点击传送'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'command: corerpg afk 3'
        - close

  '4':
    display:
      material: red nether brick
      name: '§c④ 烬原深处 §7Lv40'
      lore:
        - '§7灼尸/凋骸 · 碎·骨50%·核碎4%·魂3%'
        - '§8推荐：深核刃+4、深核符+3 · Lv40'
        - '§e➥ §f点击传送'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'command: corerpg afk 4'
        - close

  H:
    display:
      material: ender pearl
      name: '§e回枢纽'
      lore:
        - '§7打开枢纽菜单返回'
        - '§e➥ §f点击返回枢纽'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-0'
        - 'command: hub'
        - close

  I:
    display:
      material: paper
      name: '§f规则与今日上限'
      lore:
        - '§7日上限：碎150骨80核碎10魂2币150经验100'
        - '§7达顶掉率约25%再降 · 死亡不掉落'
        - '§e➥ §f点击查看今日进度'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'command: corerpg afk'
        - close
