# 深渊 — docs/ember-abyss-evacuate-spec.md / design-stage4-abyss-9-12.md
# 玩家走菜单按钮进本/撤离；action 内保留 dp start / evacuate 指令（菜单执行，勿在 lore/tell 强调手打）

Title: '§5深渊 · 无尽层'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 200

Layout:
  - '#########'
  - '#   P   #'
  - '# S E R #'
  - '#       #'
  - '####B####'

Events:
  Open:
    - 'sound: BLOCK_CHEST_OPEN-1-0'

Icons:
  '#':
    display:
      material: stained glass pane
      name: '§8 '

  B:
    display:
      material: arrow
      name: '§7返回主菜单'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-0'
        - 'menu: ember_hub'

  S:
    display:
      material: obsidian
      name: '§a开始下潜'
      lore:
        - ''
        - '§7进本即扣 §5余烬深渊票 §f×1'
        - '§7冲层 · 撤离按最高层结算'
        - '§7撤离不退票'
        - ''
        - '§7本期可下潜至第 §f12 §7层 · 第12层周首通稳定符'
        - '§7共 12 层：潮尸→混潮→骨潮→蛮层→看守→…→最终看守'
        - '§8清层后续潜；随时可打开本菜单撤离'
        - '§8时限约 25 分 · 人数 1～2 · 需余烬 Lv.25'
        - ''
        - '§e➥ §f点击开始下潜'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'tell: §5[深渊] §7尝试下潜……（需余烬 Lv.25 · 深渊票×1；等级不足不扣票）'
        - 'tell: §8需要撤离：打开本菜单 → 上浮撤离'
        - 'command: dp start EmberAbyss'
        - close

  E:
    display:
      material: ender pearl
      name: '§d上浮撤离'
      lore:
        - ''
        - '§7冲层中可随时撤离'
        - '§7按本局最高层发结算箱'
        - '§c撤离不退票'
        - ''
        - '§8需在深渊本内使用'
        - '§8打开深渊菜单点击撤离即可'
        - '§e➥ §f点击撤离'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §5[深渊] §7撤离按最高层结算 · §c票不退'
        - 'command: corerpg abyss evacuate'
        - close

  P:
    display:
      material: emerald
      name: '§6奖励预览'
      lore:
        - ''
        - '§7战斗中（MM）：碎片/骨尘/孔石/核心'
        - ''
        - '§7撤离/超时结算箱（按最高层）：'
        - '  §e1～4 §7碎片8 骨尘2'
        - '  §e5～9 §7碎片12 骨尘4 核心1 · 孔石(概率)'
        - '  §e10～14 §7碎片16 骨尘6 核心2 · 孔石(概率)'
        - ''
        - '§7通关 COMPLETE：本周首通 T2 刃+护符 · 之后 4% / 3%'
        - '§7第 §f12 §7层周首通：§a稳定符 ×1'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §5[深渊] §7结算按最高层档：1～4 / 5～9 / 10～14（本期顶层 12）'
        - 'tell: §8战斗中怪物另有碎片 / 骨尘 / 孔石 / 核心掉落'
        - 'tell: §8第12层周首通另发稳定符 ×1（同周再达静默）'

  R:
    display:
      material: watch
      name: '§e次数说明'
      lore:
        - ''
        - '§7日免费 §f1 §7张深渊票'
        - '§7重置：§f00:00 Asia/Shanghai'
        - '§7硬顶建议 ≤2/日（免费+购）'
        - ''
        - '§7撤离 / 超时 / 团灭均不退票'
        - '§8管理补票：打开商店或请 OP'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §5深渊日 1 票，0:00（上海）重置；进本即扣；撤离不退票。'
