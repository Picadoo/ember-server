# 深渊 — docs/ember-abyss-evacuate-spec.md / docs/design/design-stage4-abyss-9-12.md
# 玩家走菜单按钮进本/撤离；action 内保留 dp start / evacuate 指令（菜单执行，勿在 lore/tell 强调手打）

Title: '§5深渊 · 无尽层'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 200

Layout:
  - '#########'
  - '#   P   #'
  - '# S E R #'
  - '#       #'
  - '####B####'

Events:
  Open:
    - 'sound: BLOCK_CHEST_OPEN-1-0'

Icons:
  '#':
    display:
      material: stained glass pane
      name: '§8 '

  B:
    display:
      material: arrow
      name: '§7返回主菜单'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-0'
        - 'menu: ember_hub'

  S:
    icons:
      # 体力不足：灰显；深渊无周免费，字面量 30（禁双侧 PAPI）
      - condition: 'check papi %corerpg_stamina% < 30'
        priority: 2
        inherit: true
        display:
          material: gray stained glass pane
          name: '§8开始下潜 · 体力不足'
          lore:
            - '§7需要 §e%corerpg_stamina_cost_abyss% §7体力 · 现 §f%corerpg_stamina%§7/§f%corerpg_stamina_max%'
            - '§c体力不足 · 每日 0:00 回满'
        actions:
          all:
            - 'sound: BLOCK_NOTE_PLING-1-0.6'
            - 'tell: §c体力不足，需 %corerpg_stamina_cost_abyss% 点体力；每日 0:00 回满。'

    update: 20
    refresh: 20
    display:
      material: obsidian
      name: '§a开始下潜'
      lore:
        - '§7%corerpg_stamina_cost_abyss% 体力 · 现 §f%corerpg_stamina%§7/§f%corerpg_stamina_max% · 撤离不退'
        - '§8冲至12层 · 时限约25分 · 1～2人 · Lv.25'
        - '§e➥ §f点击开始下潜'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'tell: §5【深渊】 §7尝试下潜……（需余烬 Lv.25）'
        - 'tell: §8需要撤离：打开本菜单 → 上浮撤离'
        - 'command: corerpg enter abyss'
        - close

  E:
    display:
      material: ender pearl
      name: '§d上浮撤离'
      lore:
        - '§7按本局最高层结算 · 撤离不退体力'
        - '§8需在深渊本内使用'
        - '§e➥ §f点击撤离'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §5【深渊】 §7撤离按最高层结算 · §c体力不退'
        - 'command: corerpg abyss evacuate'
        - close

  P:
    display:
      material: emerald
      name: '§6奖励预览'
      lore:
        - '§7结算按最高层：1～4碎8骨2 · 5～9核1 · 10+核2'
        - '§7通关周首 T2刃+符 · 第12层周首稳定符'
        - '§e➥ §f点击查看'
    actions:
      all:
        - 'sound: BLOCK_CHEST_OPEN-1-1'
        - 'menu: ember_abyss_rewards'

  R:
    display:
      material: watch
      name: '§e次数说明'
      lore:
        - '§7%corerpg_stamina_cost_abyss% 体力 · 每日不限 · 0:00回满'
        - '§7撤离/超时/团灭均不退'
        - '§8不足：明日恢复或商城体力药'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §5深渊消耗 %corerpg_stamina_cost_abyss% 体力；0:00（上海）回满；撤离不退。'
