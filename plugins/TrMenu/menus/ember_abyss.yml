# 深渊 — docs/ember-abyss-evacuate-spec.md / design-stage4-abyss-9-12.md
# 玩家走菜单按钮进本/撤离；action 内保留 dp start / evacuate 指令（菜单执行，勿在 lore/tell 强调手打）

Title: '§5深渊 · 无尽层'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 200

Layout:
  - '#########'
  - '#   P   #'
  - '# S E R #'
  - '#       #'
  - '####B####'

Events:
  Open:
    - 'sound: BLOCK_CHEST_OPEN-1-0'

Icons:
  '#':
    display:
      material: stained glass pane
      name: '§8 '

  B:
    display:
      material: arrow
      name: '§7返回主菜单'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-0'
        - 'menu: ember_hub'

  S:
    icons:
      # 体力不足：灰显；深渊无周免费，字面量 30（禁双侧 PAPI）
      - condition: 'check papi %corerpg_stamina% < 30'
        priority: 2
        inherit: true
        display:
          material: gray stained glass pane
          name: '§8开始下潜 · 体力不足'
          lore:
            - ''
            - '§7需要 §e30 §7体力 · 当前 §f%corerpg_stamina%§7/§f%corerpg_stamina_max%'
            - '§c体力不足 · 每日 0:00 回满'
        actions:
          all:
            - 'sound: BLOCK_NOTE_PLING-1-0.6'
            - 'tell: §c体力不足，需 30 点体力；每日 0:00 回满。'

    update: 20
    refresh: 20
    display:
      material: obsidian
      name: '§a开始下潜'
      lore:
        - ''
        - '§7消耗 §e%corerpg_stamina_cost_abyss% §7体力'
        - '§7当前 §f%corerpg_stamina%§7/§f%corerpg_stamina_max%'
        - '§7冲层 · 撤离按最高层结算'
        - '§7撤离不退体力'
        - ''
        - '§7本期可下潜至第 §f12 §7层 · 第12层周首通稳定符'
        - '§7共 12 层：潮尸→混潮→骨潮→蛮层→看守→…→最终看守'
        - '§8清层后续潜；随时可打开本菜单撤离'
        - '§8时限约 25 分 · 人数 1～2 · 需余烬 Lv.25'
        - ''
        - '§e➥ §f点击开始下潜'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'tell: §5[深渊] §7尝试下潜……（需余烬 Lv.25 · 体力 30；等级不足不扣）'
        - 'tell: §8需要撤离：打开本菜单 → 上浮撤离'
        - 'command: corerpg enter abyss'
        - close

  E:
    display:
      material: ender pearl
      name: '§d上浮撤离'
      lore:
        - ''
        - '§7冲层中可随时撤离'
        - '§7按本局最高层发结算箱'
        - '§c撤离不退体力'
        - ''
        - '§8需在深渊本内使用'
        - '§8打开深渊菜单点击撤离即可'
        - '§e➥ §f点击撤离'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §5[深渊] §7撤离按最高层结算 · §c体力不退'
        - 'command: corerpg abyss evacuate'
        - close

  P:
    display:
      material: emerald
      name: '§6奖励预览'
      lore:
        - ''
        - '§7战斗中（MM）：碎片 / 骨尘 / 孔石 / 核心'
        - ''
        - '§7撤离/超时结算箱（按最高层）：'
        - '  §e1～4 §7碎片8 骨尘2'
        - '  §e5～9 §7碎片12 骨尘4 核心1 · 孔石约 10%（非必给）'
        - '  §e10+ §7碎片16 骨尘6 核心2 · 孔石约 10%（本期顶12）'
        - ''
        - '§7通关 COMPLETE：本周首通 T2 刃+护符 · 之后 4% / 3%'
        - '§7第 §f12 §7层周首通：§a稳定符 ×1'
        - ''
        - '§e➥ §f点击查看'
    actions:
      all:
        - 'sound: BLOCK_CHEST_OPEN-1-1'
        - 'menu: ember_abyss_rewards'

  R:
    display:
      material: watch
      name: '§e次数说明'
      lore:
        - ''
        - '§7消耗 §e30 §7体力（与日常同池）'
        - '§7重置：§f00:00 Asia/Shanghai'
        - '§7硬顶建议 ≤2/日（免费+购）'
        - ''
        - '§7撤离 / 超时 / 团灭均不退体力'
        - '§8体力不足：明日 0 点恢复或商城体力药'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §5深渊消耗 30 体力；0:00（上海）回满；撤离不退。'
