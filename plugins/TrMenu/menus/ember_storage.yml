# 余烬仓库（1.62）— P1 免费无限材料仓 + 装备库入口；旧「解锁格 / 付费扩容」文案已去掉
# 主菜单「仓库」直接 /corerpg p1 vault；本页作备用二级壳（末影箱 / 跳转）

Title: '§3余烬 · 仓库'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 300

Layout:
  - '#########'
  - '#  V G  #'
  - '#  D E  #'
  - '#       #'
  - '####X####'

Events:
  Open:
    - 'sound: BLOCK_CHEST_OPEN-1-0.8'
    - 'tell: §3【仓库】 §7材料无限仓 · 装备库 · 全部免费，无需解锁'

Icons:

  '#':
    display:
      material: stained glass pane
      name: '§8 '

  V:
    display:
      material: chest
      name: '§6材料仓库'
      lore:
        - ''
        - '§7白名单材料无格子上限'
        - '§7每种最多近二十亿 · 打副本自动入库'
        - '§8强化 / 升阶直接扣仓库里的材料'
        - ''
        - '§e➥ §f打开材料仓库'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - close
        - 'command: corerpg p1 vault'

  G:
    display:
      material: diamond sword
      name: '§b装备库'
      lore:
        - ''
        - '§7背包快满时新装备自动存入'
        - '§7筛选 · 收藏 · 批量分解（可撤销）'
        - '§8免费无限 · 不占背包格'
        - ''
        - '§e➥ §f打开装备库'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1.2'
        - close
        - 'command: corerpg p1 gearlib'

  D:
    display:
      material: hopper
      name: '§a一键存入'
      lore:
        - ''
        - '§7背包里的白名单材料 → 材料仓'
        - '§7背包里的 P1 装备 → 装备库'
        - ''
        - '§e➥ §f点击存入'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'command: corerpg p1 stash'
        - close
        - 'command: corerpg p1 vault'

  E:
    display:
      material: ender chest
      name: '§5末影箱'
      lore:
        - ''
        - '§7普通物品仍走末影箱'
        - ''
        - '§e➥ §f打开'
    actions:
      all:
        - 'sound: BLOCK_CHEST_OPEN-1-1'
        - 'command: corerpg enderchest'
        - close

  X:
    display:
      material: arrow
      name: '§7返回主菜单'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-0'
        - 'menu: ember_hub'
