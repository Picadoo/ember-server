Title: '§6短征 · 选本'

Bindings:
  Commands:
    - '(?i)ember_p1_short'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 400

Layout:
  # D463 · 压到 6 行（箱体上限）· 体力键 S→H 避与 sx18 烬晶 S 撞键
  - '#########'
  - '#I H B Z#'
  - '#A C E G#'
  - '#K M O Q#'
  - '#TVXYWUN#'
  - '#PRSJDFL#'

Events:
  Open:
    - 'sound: BLOCK_CHEST_OPEN-1-0'
    - 'command: corerpg p1 shortpath'
    # D409 W1b：日帽合计满 → 满态 Open；未满保持现网选本句（真键 sx_day_left_sum · 禁假写固定 N）
    - condition: 'check papi %corerpg_p1_sx_day_left_sum% <= 0'
      priority: 1
      actions:
        - 'tell: §e今日短征有奖已满 §7· 材料在仓 · 去工坊花'
        - 'tell: §8练习仍可进 · 0 点重置有奖次数 · 不是旧日常窟'
      deny-actions:
        - 'tell: §e短征选本：§f点下方各图 · Q01后 · 各30体力 · 日帽分开'
        - 'tell: §8独立短本 · 不是旧日常窟 · 奖励以结算为准 · 材料进仓去工坊 · 今日有奖见各本悬停'
    - 'tell: §8生涯首通：各本悬停可见未领/已领取 · %corerpg_p1_sx_fc_pending_line%'
    - 'tell: §8本周短征可冲见本页 F · %corerpg_p1_goal_short% · 有奖通关计入 · 可选 · 不算全部完成'
    - 'tell: §8日差本可冲见本页 L · %corerpg_p1_short_div_line% · 今日未领日奖的另一本'
    # D416 W1b：Open 半行 · 选本说明可看仓内还差（满态/未满共用 · 不盖 D409 去工坊花）
    - 'tell: §8选本说明可看仓内还差'
    - 'tell: §8今日推：§f%corerpg_p1_sx_today_name%'

