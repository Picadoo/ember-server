# D409 · 日帽满（sx_day_left_sum==0）Open/I/B 追工坊（W1b/W1c）+ 可选满态右键挂机（W1d）；零改日帽/S40–S49/体力。
# 日帽同屏：sx01–sx09 挂 %corerpg_p1_sx0N_day_line%（及 I 合计 left_sum）；sx10 day_line/fc **注释预留**（键号另挂）。禁假写个人 n/3。
# D406+D407+D410+D412 · 生涯首通同屏：A/C/E/G/K/M/O/Q/T + I 挂 %corerpg_p1_sx0N_fc% + sx_fc_left/pending_line；sx10_fc **注释预留**。
# 入口：冒险页「短征」/ 枢纽半指 → 本菜单；进本 command: corerpg p1 enter sx01|…|sx10。
# 禁：教玩家手打 /dp start；假宣传旧日常窟开放；抬日表文案；假写个人日帽/首通数字；连续霜雾廊复读 sx03；连续窄桥复读 sx05。
# 键（sx01–sx09 day_line/fc live · tip 13583cfe · jar 1.65.119-d412）：
#   %corerpg_p1_sx01_day_line% … %corerpg_p1_sx09_day_line%
#   %corerpg_p1_sx_day_left_sum% · %corerpg_p1_sx0N_fc%（sx01–sx09）
#   %corerpg_p1_sx_fc_left% · %corerpg_p1_sx_fc_pending_line%
# D414 预留（插件日帽/首通号另挂，本骨架勿假写个人 n/3）：
#   %corerpg_p1_sx10_day_line% · %corerpg_p1_sx10_fc% · 合计 left_sum/fc_left 须扫第十本
# 挂点：A/C/E/G/K/M/O/Q/T/V 主 lore + 灰态 · I 说明 + Open；update:20。
# D401：Open/I 半行「本周可选周目标·短征」；进度键 %corerpg_p1_goal_short%。
# 金额：有奖 80/4/3 · 首通由 fc 真键显示（sx07=120/6/1 · sx08=110/6/1 · sx09=100/6/1 · sx10 草案90/6/1）· 体力 30 · 日帽 3 分开。

