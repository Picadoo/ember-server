# 挂点：A/C/E/G/K/M/O/Q/T/V/X/Y/W/U/N/P 主 lore + 灰态 · I 说明 + Open；update:20。
# D401：Open/I 半行「本周可选周目标·短征」；进度键 %corerpg_p1_goal_short%。
# 金额：有奖 80/4/3 · 首通由 fc 真键显示（sx07=120/6/1 · sx08=110/6/1 · sx09=100/6/1 · sx10=90/6/1 · sx11=80/6/1 · sx12=70/6/1 · sx13=60/6/1 · sx14=50/6/1 · sx15=40/6/1 · sx16=30/6/1）· 体力 30 · 日帽 3 分开。

