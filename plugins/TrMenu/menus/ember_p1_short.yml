# D403 · 短征六本选页（sx01 烬门哨岗 · sx02 锈灯栈道 · sx03 霜雾闸廊 · sx04 烬井螺旋 · sx05 裂谷风廊 · sx06 烬环廊）
# 日帽同屏：sx01–sx06 挂 %corerpg_p1_sx0N_day_line%（及 I 合计 left_sum，含第六本）；禁假写个人 n/3。
# 入口：冒险页「短征」/ 枢纽半指 → 本菜单；进本 command: corerpg p1 enter sx01|…|sx06。
# 禁：教玩家手打 /dp start；假宣传旧日常窟开放；抬日表文案；假写个人日帽数字。
# 键（jar 1.65.112-d403.local · tip d96b0dd3 · sx01–sx06 live）：
#   %corerpg_p1_sx01_day_line% … %corerpg_p1_sx06_day_line%
#   %corerpg_p1_sx_day_left_sum% · %corerpg_p1_sx0N_day% / day_left
# 挂点：A/C/E/G/K/M 主 lore + 灰态 · I 说明；update:20。
# D401：Open/I 半行「本周可选周目标·短征」；进度键 %corerpg_p1_goal_short%。
# 金额：有奖 80/4/3 · 首通各本略异（sx06=130/6/1）· 体力 30 · 日帽 3 分开。

Title: '§6短征 · 选本'

Bindings:
  Commands:
    - '(?i)ember_p1_short'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 400

Layout:
  - '#########'
  - '#  I  S #'
  - '# A C E #'
  - '# G K M #'
  - '# B # Z #'

Events:
  Open:
    - 'sound: BLOCK_CHEST_OPEN-1-0'
