# D211 · 余烬技能组 S1（烬斩 / 烬突 / 烬斩符文）
# D214 · S2 火痕步（焚烬 2pc + Q05 替换踏步）；后撤步暂缓
# 枢纽入口；符文切换走 /corerpg skill shape（出本，切换后充能转满）

Title: '§6余烬 · 技能组'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 200

Layout:
  - '#########'
  - '# A B C #'
  - '# D E F #'
  - '#   I   #'
  - '####X####'

Events:
  Open:
    - 'sound: BLOCK_NOTE_PLING-1-0.8'
    - 'tell: §7技能组 · 充能 §f%corerpg_kit_charge%§7 · 烬斩形状 §f%corerpg_kit_shape%'
    - 'command: corerpg skill kit'

Icons:
  '#':
    display:
      material: stained glass pane
      name: '§8 '

  X:
    display:
      material: arrow
      name: '§7返回主菜单'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-0'
        - 'menu: ember_hub'

  A:
    display:
      material: blaze powder
      name: '§6烬斩 · F'
      lore:
        - ''
        - '§7主招 · 1.5B · 8 秒余烬充能'
        - '§7当前形状：§f%corerpg_kit_shape%'
        - '§7充能：§f%corerpg_kit_charge%'
        - ''
        - '§8不暴击 · 不吸血 · 不触发套装计数'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'command: corerpg skill kit'

  B:
    display:
      material: diamond sword
      name: '§c烬突 · 潜行+F'
      lore:
        - ''
        - '§7副招 · 花掉本次余烬充能'
        - '§7向前冲 §f4 §7格 · 穿过最多 §f3 §7个'
