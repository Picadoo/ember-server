    display:
      material: book
      name: '§f说明'
      lore:
        - ''
        - '§7每 8 秒一份余烬充能：'
        - '§f  F §7放烬斩 · §f潜行+F §7放烬突（二选一）'
        - ''
        - '§7守招（单按 Q）搁置 · 见 S0b'
        - '§7火痕步：Q05 + 焚烬两件套自动替换踏步'
        - '§7后撤步暂缓'
