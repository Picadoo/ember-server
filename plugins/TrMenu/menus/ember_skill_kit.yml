        - ''
        - '§8解锁：§f%corerpg_kit_dash_unlock% §8（首通 Q02）'
        - '§8未解锁时潜行+F 仍放烬斩'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'command: corerpg skill kit'

  C:
    display:
      material: feather
      name: '§a%corerpg_kit_step% · 潜行+Q'
      lore:
        - ''
