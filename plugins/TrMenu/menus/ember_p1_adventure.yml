        - '§e花样委托 §8（重打已首通的普通版时才有花样）'
        - '§7%corerpg_p1_vbounty%'
        - '§7当天击败 2 只词缀精英：20 余烬币 · 当天 1 次房间事件达标：20 余烬币'
