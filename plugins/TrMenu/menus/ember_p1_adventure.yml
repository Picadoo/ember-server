# 余烬 v1 (P1) 冒险页 — 书 §19.1：主线本 Q01–Q07 的解锁状态 / 消耗 / 掉落阶 / 用途 + 掉落目标族 + 印记 / 首通自选 / 补领 + 挑战版入口（§18.1，本人首通 Q07 后开放）。
# 只转发到 CoreRpg 命令；解锁、体力、队伍校验全在服务端（锁定的本点了只会提示原因）。
# 不写通关时长承诺。P1 未启用（ember-v1.yml enabled=false）时进本命令会直接拒绝。
# 入口：主菜单 ember_hub 的「冒险 · 主线本」图标，或 /ember_p1_adventure。

Title: '§6余烬 v1 · 冒险'

Bindings:
  Commands:
    - '(?i)ember_p1_adventure'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 400

Layout:
  - '#########'
  - '#T X A K#'
  - '#1234567#'
  - '#Ws b u n'
  - '#GMRF C D'
  - '####B####'

Events:
  Open:
