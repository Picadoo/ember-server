      all:
        - 'sound: UI_BUTTON_CLICK-1-1'


  # TIP-CE / D13310: 房间事件 · 冲一下（第三行空位 E · 保留 W/s/b/u/n）
  E:
    icons:
      - condition: 'check papi %corerpg_p1_q01done% < 1 and check papi %corerpg_p1_q02done% < 1 and check papi %corerpg_p1_q03done% < 1 and check papi %corerpg_p1_q04done% < 1 and check papi %corerpg_p1_q05done% < 1 and check papi %corerpg_p1_q06done% < 1 and check papi %corerpg_p1_q07done% < 1'
        priority: 1
        display:
          material: gray dye
          name: '§7房间事件 · 冲一下 §8（无已通普通）'
          lore:
            - '§c未解锁：先通任意主线普通本'
            - '§7仅已通普通重打出事件 · 全未通无冲口'
            - '§e%corerpg_p1_event_soft_hope%'
      - condition: 'check papi %corerpg_stamina% < 30'
        priority: 2
        display:
          material: iron bars
          name: '§7房间事件 · 冲一下 §8（体力不足）'
          lore:
            - '§c需要 §e30 §c体力 · 当前 §f%corerpg_stamina%'
            - '§7冲图：§f%corerpg_p1_event_chase_name%'
            - '§e%corerpg_p1_event_soft_hope%'
            - '§8仅已通普通重打出事件'
      - condition: 'check papi %corerpg_p1_event_soft_ready% >= 1'
