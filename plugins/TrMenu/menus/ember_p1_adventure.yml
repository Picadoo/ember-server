# Open 挂 event_soft_hope (D729) + drop_q_hope（零改掉率）
# TIP-CE / D13310: 房间事件冲一下 E · event_chase*/soft_ready · enter event-chase · 零抬率
# D616: Open/目标族区挂 mapid_board 图身份一览
# D12251: 每图 L2 mapid_q0N → menuLine 短串（这图掉 / 图鉴进度）
# D456: 签名获取半行 %corerpg_p1_sig_acq% · 未出仍拿徽记 · 零改掉率
# 余烬 v1 (P1) 冒险页 — 书 §19.1：主线本 Q01–Q07 的解锁状态 / 消耗 / 掉落阶 / 用途 + 掉落目标族 + 印记 / 首通自选 / 补领 + 挑战版入口（§18.1，本人进过或首通 Q07 后开放）。
# 只转发到 CoreRpg 命令；解锁、体力、队伍校验全在服务端（锁定的本点了只会提示原因）。
# 不写通关时长承诺。P1 未启用（ember-v1.yml enabled=false）时进本命令会直接拒绝。
# 入口：主菜单 ember_hub 的「冒险 · 主线本」图标，或 /ember_p1_adventure。
# D288：左上「本周短目标」一眼精选剩次 / 事件池 / 誓约 / 残响 claim / 花样。
# D292：每图「签名：%sig_m_qXX%」徽记一眼；结算花样委托 +1（jar）。
# D297：有签名且 Q07 后 lore 增「本局生效」+ 短代价（%p1_sig_run% / run_cost；空则无行感）。

Title: '§6余烬 · 冒险'

Bindings:
  Commands:
    - '(?i)ember_p1_adventure'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 400

Layout:
  - '#########'
  - '#TVXSAHK#'
  - '#1234567#'
  - '#WsEb u n'
  - '#GMRFZCYD'
  - '####B####'

Events:
  Open:
    - 'tell: §6这图掉什么：§f看各 Q 第二行 · 图鉴进度 · 不锁通关'
    - 'tell: §e图身份板：§f%corerpg_p1_mapid_board%'
    - 'tell: §e冲一下见本页 E：§f%corerpg_p1_event_soft_hope%'
    - 'tell: §e掉落成色希望：§f%corerpg_p1_drop_q_hope%'
    - 'command: corerpg p1 setfocus nudge'
    - 'sound: BLOCK_CHEST_OPEN-1-0'
    - 'tell: §8短征：本页「烬门 / 锈灯 / 霜雾 / 烬井 / 裂谷 / 烬环 / 烬塔 / 错层 / 跳石 / 递闸 / 镜廊 / 枢厅 / 衡梁 / 裂廊 / 旋坡 / 影廊 / 潮廊 / 晶棱 / 弦共鸣」（Q01后 · 各体力30 · 日有奖帽分开）'
    - 'tell: §8短征入口可看今日剩余有奖/首通未领'
    - 'command: corerpg p1 abysstarget'
    - 'command: corerpg p1 setchase'
    - 'command: corerpg p1 challengepath'
    - 'command: corerpg p1 raidpath'
    - 'command: corerpg p1 featurepath'
    - 'command: corerpg p1 goalpath'
    - 'command: corerpg p1 mapfarm resume'
    - 'command: corerpg p1 onlinepath'
    - 'command: corerpg p1 mailpath'
    - 'command: corerpg p1 stashpath'

Icons:
  # D421 短征入口 → ember_p1_short 十九本选页（烬门/锈灯/霜雾/烬井/裂谷/烬环/烬塔/错层/跳石/递闸/镜廊/枢厅/衡梁）
  # D422：解锁态挂 day_left_sum + fc_left/pending_line；灰锁禁个人数字；Open 半行
  H:
    icons:
      - condition: 'check papi %corerpg_p1_access_q01% < 1'
        priority: 1
        display:
          material: gray dye
          name: '§7短征'
          lore:
            - '§c未解锁：进过或首通主线 Q01'
            - '§7进过即开 · 清过也开'
    update: 20
    display:
      material: shield
      name: '§6短征'
      lore:
        - '§e今日推：§f%corerpg_p1_sx_today_name% §7· 有奖剩 §f%corerpg_p1_sx_day_left_sum%'
        - '§7生涯首通未领：§f%corerpg_p1_sx_fc_left% §7本'
        - '§e➥ §f短征选本页'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'menu: ember_p1_short'

  W:

    update: 20
    display:
      material: paper
      name: '§e每日委托'
      lore:
        - '§7状态：§f%corerpg_p1_bounty%'
        - '§e希望：§f%corerpg_p1_bounty_hope%'
        - '§7%corerpg_p1_vbounty%'
