            - '§7冲图：§f%corerpg_p1_event_chase_name%'
            - '§8仅已通普通重打出事件'
            - '§e➥ §f点击进本'
        actions:
          all:
            - 'sound: BLOCK_NOTE_PLING-1-2'
            - 'command: corerpg p1 enter event-chase'
            - close
    update: 20
    display:
      material: fire charge
      name: '§e房间事件 · 冲一下'
      lore:
        - '§e%corerpg_p1_event_soft_hope%'
        - '§7冲图：§f%corerpg_p1_event_chase_name%'
        - '§8仅已通普通重打出事件'
        - '§e➥ §f点击进本'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'command: corerpg p1 enter event-chase'
        - close

