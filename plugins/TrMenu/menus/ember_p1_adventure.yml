        - '§7当天第 3 局结算通关：60 余烬币 + 余烬碎片 ×6'
        - '§7主线 / 挑战 / 深渊每层都算 1 局，团本算 2 局，失败不算'
        - '§7每天 0 点刷新（同体力日）· 自动到账，不用领取'
        - ''
