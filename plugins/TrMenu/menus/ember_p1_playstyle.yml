# D291 · 推荐打法（DESIGN playfeel §3.3-2）
# 认知标签：机动 / 站桩 / 压上 ↔ 天赋第 1 排（回身斩 / 稳桩 / 踏步回气）
# 数值不动；侧移提案（sidegrades）未施工。状态 / 得失 / 适合 来自既有 PAPI。
# 入口：主菜单、技能组、签名页、天赋页、帮助「变强」；/ember_p1_playstyle

Title: '§e推荐打法'

Bindings:
  Commands:
    - '(?i)ember_p1_playstyle'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 300

Layout:
  - '####I####'
  - '##A#B#C##'
  - '##S#G#N##'
  - '####X####'

Events:
  Open:
    - 'sound: BLOCK_NOTE_PLING-1-1.1'
    - 'tell: §e推荐打法 §7· 先认标签再点天赋一排；§f数值弱、不是变强§7（装备阶/成色/强化才是主线）'

Icons:
  '#':
    display:
      material: gray stained glass pane
      name: '§8'

  I:
    update: 20
    display:
      material: map
      name: '§e推荐打法 · 认知标签'
      lore:
        - ''
        - '§7专精：%corerpg_p1_spec_pts%'
        - '§8%corerpg_p1_spec_row_1%'

  A:
    update: 20
    display:
      material: feather
      name: '§b机动 §8· §f%corerpg_p1_spec_name_t1a%'
      lore:
        - ''
        - '%corerpg_p1_spec_good_t1a%'
        - '%corerpg_p1_spec_bad_t1a%'
        - '§e➥ §f天赋页点选 / 确认'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - close
        - 'command: corerpg p1 spec from hub'

  B:
    update: 20
    display:
      material: shield
      name: '§a站桩 §8· §f%corerpg_p1_spec_name_t1b%'
      lore:
        - ''
        - '%corerpg_p1_spec_good_t1b%'
        - '%corerpg_p1_spec_bad_t1b%'
        - '§e➥ §f天赋页点选 / 确认'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - close
        - 'command: corerpg p1 spec from hub'

  C:
    update: 20
    display:
      material: sugar
      name: '§6压上 §8· §f%corerpg_p1_spec_name_t1c%'
      lore:
        - ''
        - '%corerpg_p1_spec_good_t1c%'
        - '%corerpg_p1_spec_bad_t1c%'
        - '§e➥ §f天赋页点选 / 确认'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - close
        - 'command: corerpg p1 spec from hub'

  S:
    display:
      material: blaze powder
      name: '§6技能组'
      lore:
        - ''
        - '§7烬斩/烬突二选一 · 形状预览 · 身法方向'
        - '§7当前 §f%corerpg_kit_shape% §7· 身法 §b%corerpg_kit_step_dir%'
        - ''
        - '§e➥ §f打开'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'menu: ember_skill_kit'

  G:
    display:
      material: enchanted book
      name: '§6天赋专精'
      lore:
        - ''
        - '§7第 1 排三选一就在这里点'
        - '§7%corerpg_p1_spec_pts%'
        - ''
        - '§e➥ §f打开天赋页'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - close
        - 'command: corerpg p1 spec from hub'

  N:
    display:
      material: nether star
      name: '§6签名传奇'
      lore:
        - ''
        - '§7刃/护符签名可覆盖烬斩符文'
        - '§8L07 直线 · L09 环 · L13 蓄力环'
        - ''
        - '§e➥ §f打开签名页'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'command: corerpg p1 sig from hub'
        - close

  X:
    display:
      material: arrow
      name: '§7返回主菜单'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-0'
        - 'menu: ember_hub'

