# 寄售子菜单壳 — docs/design/DESIGN-ember-arena-auction.md §2
# 浏览 / 上架 / 税率 10%；绑定区分 · 不开放毕业伤害直售

Title: '§6余烬 · 寄售'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 200

Layout:
  - '#########'
  - '#       #'
  - '# L S T #'
  - '#  I    #'
  - '####X####'

Events:
  Open:
    - 'sound: BLOCK_NOTE_PLING-1-0.8'
    - 'tell: §6【寄售】 §7玩家间上架流通物。税率 §e10%§7 · 绑定物不可流通。'

Icons:
  '#':
    display:
      material: stained glass pane
      name: '§8 '

  X:
    display:
      material: arrow
      name: '§7返回主菜单'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-0'
        - 'menu: ember_hub'

  I:
    display:
      material: book
      name: '§e我的上架'
      lore:
        - ''
        - '§7查看本人在售与已售'
        - '§8成交扣税后入账'
        - ''
        - ''
        - '§e➥ §f点击查询'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §8我的在售 / 已售 · 成交扣税 §e10%'
        - 'command: corerpg auction'

  L:
    display:
      material: emerald
      name: '§a浏览寄售'
      lore:
        - ''
        - '§7按分类浏览在售流通物'
        - '§8材料 / 外观 / 便利 · 禁毕业伤害'
        - ''
        - ''
        - '§a➥ §f打开列表'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'tell: §a【寄售】 §7正在刷新列表…'
        - 'tell: §8白名单流通物 · 绑定物不可买'
        - 'command: corerpg auction list'

  S:
    display:
      material: gold ingot
      name: '§6上架出售'
      lore:
        - ''
        - '§7手持可流通物上架'
        - '§8定价余烬币 · 成交扣税 10%'
        - '§8不开放毕业伤害直售'
        - ''
        - ''
        - '§6➥ §f上架说明'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'tell: §6【寄售】 §7手持物品后点上架，按提示定价'
        - 'tell: §8手持白名单物品 · 成交卖方实收 = 标价 × 90%（税 10%）'
        - 'tell: §c禁止：§8核心、毕业刃、满孔装、战力扭蛋直售'
        - 'command: corerpg auction sell'

  T:
    display:
      material: paper
      name: '§e税率说明'
      lore:
        - ''
        - '§7寄售行统一税率'
        - '§8成交税 §e10%§8（卖方承担）'
        - '§8设计区间 5～15% · 本期定 10%'
        - '§8绑定物 / 旧票与体力药不可上架'
        - ''
        - '§e➥ §f聊天提示'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §e【寄售·税】 §7成交税率 §e10%§7 · 卖方实收标价的 90%'
        - 'tell: §8绑定物、旧票与体力药、邮件附件不可上架'
        - 'tell: §8不开放毕业伤害 / 核心直售'
