# D458: 说明格挂保底一眼 pity（cap 仍保留长句）· 零改数学
# D143 词条洗练（P2 草案 §5za 第 3 部分，源表 §13.69）— 洗的是正在用的那两件：主手的刃、选定的护符。
# 文字 / 状态都来自 PAPI %corerpg_p1_reroll_*%（参数 plugins/CoreRpg/ember-v1-growth.yml reroll:）。
# 点图标 → 聊天栏预览（花费、概率、保底）→ 点 [确认洗练]；有旧词条时再选 [保留新] / [保留旧]（不选 = 旧的）。
# D148：Shift+点击 = 锁定当前词条只重抽档位（另加一份碎片，lock_shard）。
# 入口：装备页、主界面；返回键回到打开它的那一页。

Title: '§6词条洗练'

Bindings:
  Commands:
    - '(?i)ember_p1_reroll'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 400

Layout:
  - '####N####'
  - '#a#b#c#d#'
  - '###K#O###'
  - '####B####'

Events:
  Open:
    - 'sound: BLOCK_ANVIL_LAND-0.4-1.4'
    - 'tell: §8猎缀 / 抗缀 / 裂身 · 仅主线重打词缀精英；余烬纹 / 定身纹 / 分核纹另算'

Icons:
  '#':
    display:
      material: gray stained glass pane
      name: '§8'

  N:
    update: 20
    display:
      material: book
      name: '§6说明'
      lore:
        - '§7用重复件或碎片洗词条'
        - '§a更优档直留 · 自动保留新'
        - '§e➥ §f点下方按钮 · Shift锁词'

  a:
    update: 20
    display:
      material: blaze rod
      name: '§6刃 · 用重复件洗练'
      lore:
        - '%corerpg_p1_reroll_blade_item%'
        - '%corerpg_p1_reroll_blade_cur%'
        - '§e➥ §f点击：聊天栏预览，再确认 · Shift：锁定词条再洗'
    actions:
      shift_left:
        - 'sound: UI_BUTTON_CLICK-1-1'
        - close
        - 'command: corerpg p1 reroll blade dup lock'
      left:
        - 'sound: UI_BUTTON_CLICK-1-1'
        - close
        - 'command: corerpg p1 reroll blade dup'

  b:
    update: 20
    display:
      material: prismarine shard
      name: '§6刃 · 用碎片洗练'
      lore:
        - '%corerpg_p1_reroll_blade_item%'
        - '%corerpg_p1_reroll_blade_cur%'
        - '§e➥ §f点击：聊天栏预览，再确认 · Shift：锁定词条再洗'
    actions:
      shift_left:
        - 'sound: UI_BUTTON_CLICK-1-1'
        - close
        - 'command: corerpg p1 reroll blade shard lock'
      left:
        - 'sound: UI_BUTTON_CLICK-1-1'
        - close
        - 'command: corerpg p1 reroll blade shard'

  c:
    update: 20
    display:
      material: ender eye
      name: '§6护符 · 用重复件洗练'
      lore:
        - '%corerpg_p1_reroll_charm_item%'
        - '%corerpg_p1_reroll_charm_cur%'
        - '§e➥ §f点击：聊天栏预览，再确认 · Shift：锁定词条再洗'
    actions:
      shift_left:
        - 'sound: UI_BUTTON_CLICK-1-1'
        - close
        - 'command: corerpg p1 reroll charm dup lock'
      left:
        - 'sound: UI_BUTTON_CLICK-1-1'
        - close
        - 'command: corerpg p1 reroll charm dup'

  d:
    update: 20
    display:
      material: prismarine crystals
      name: '§6护符 · 用碎片洗练'
      lore:
        - '%corerpg_p1_reroll_charm_item%'
        - '%corerpg_p1_reroll_charm_cur%'
        - '§e➥ §f点击：聊天栏预览，再确认 · Shift：锁定词条再洗'
    actions:
      shift_left:
        - 'sound: UI_BUTTON_CLICK-1-1'
        - close
        - 'command: corerpg p1 reroll charm shard lock'
      left:
        - 'sound: UI_BUTTON_CLICK-1-1'
        - close
        - 'command: corerpg p1 reroll charm shard'

  K:
    update: 20
    display:
      material: emerald
      name: '§a保留新'
      lore:
        - '%corerpg_p1_reroll_pending%'
        - '§7更优已直留 · 本格自选较差/同档'
    actions:
      all:
        - 'sound: UI_BUTTON_CLICK-1-1'
        - close
        - 'command: corerpg p1 reroll keep new'

  O:
    update: 20
    display:
      material: redstone
      name: '§7保留旧'
      lore:
        - '%corerpg_p1_reroll_pending%'
        - '§8不选也等于保留旧（花费不退）'
    actions:
      all:
        - 'sound: UI_BUTTON_CLICK-1-1'
        - close
        - 'command: corerpg p1 reroll keep old'

  B:
    update: 20
    display:
      material: arrow
      name: '%corerpg_p1_reroll_back%'
    actions:
      all:
        - 'sound: UI_BUTTON_CLICK-1-1'
        - close
        - 'command: corerpg p1 reroll back'
