# D678: craft→insert path · never legacy socket
# D622: 材料持有 + 合成希望半行（零改合成价/flat）
# D609 · P1 宝石页（Stage4）· 只调 /corerpg p1 gem · 永不 legacy ember_socket
# 入口：工坊「去镶嵌」、/ember_p1_gem

Title: '§5余烬 · P1 宝石'

Bindings:
  Commands:
    - '(?i)ember_p1_gem'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 300

Layout:
  - '###H#P###'
  - '#abcdefg#'
  - '#0123ijkl#'
  - '#4567mnop#'
  - '#R#Z#L#X#'

Events:
  Open:
    - 'sound: BLOCK_NOTE_PLING-1-0.9'
    - 'tell: §e手持刃/符看孔 · 背包备好石 · 希望保底 %corerpg_p1_gem_pity_hope%'
    - 'tell: §7仓内：碎%corerpg_p1_vault_shard% · 骨%corerpg_p1_vault_bone% · 币看背包 · 合成碎8+骨4+币40'
    - 'tell: §e合成→镶嵌：§f点合成后聊天出嵌孔按钮 · 手持刃/符 /corerpg p1 gem list · §c永不旧 socket'
    - 'command: corerpg p1 gem pity'
    - 'command: corerpg p1 gem list'
    - 'tell: §e强化开孔/空孔：§f强化升档后聊天出镶嵌追 · 有石一键嵌 · 无石点合成'

Icons:
  '#':
    display:
      material: stained glass pane
      name: '§8 '

  H:
    update: 20
    display:
      material: nether star
      name: '§e希望 · 通关保底'
      lore:
        - '§f%corerpg_p1_gem_pity_hope%'
        - '§7Q01–Q07 通关累计 · 满 5 发 1 石'
        - '§e➥ §f刷新保底提示'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'command: corerpg p1 gem pity'

  P:
    update: 20
    display:
      material: book
      name: '§6说明 · 孔与战斗'
      lore:
        - '§7仓内：碎%corerpg_p1_vault_shard% · 骨%corerpg_p1_vault_bone%'
        - '§e通关保底：§f%corerpg_p1_gem_pity_hope%'
        - '§e➥ §f手持件 list'
    actions:
      all:
        - 'command: corerpg p1 gem list'

  # —— 合成四石 ——
  a:
    display:
      material: blaze powder
      name: '§c合成 · 锋利石'
      lore: ['', '§7碎8+骨4+币40 → 锋利', '§7仓：碎%corerpg_p1_vault_shard% · 骨%corerpg_p1_vault_bone%', '§8仓+背包合计够才能成（含自动仓）', '', '§e➥ §f确定合成']
    actions:
      all:
        - 'sound: BLOCK_ANVIL_USE-0.5-1.2'
        - 'command: corerpg p1 gem craft sharp'
  b:
    display:
      material: iron ingot
      name: '§b合成 · 稳固石'
      lore: ['', '§7碎8+骨4+币40 → 稳固', '§7仓：碎%corerpg_p1_vault_shard% · 骨%corerpg_p1_vault_bone%', '§8仓+背包合计够才能成（含自动仓）', '', '§e➥ §f确定合成']
    actions:
      all:
        - 'sound: BLOCK_ANVIL_USE-0.5-1.2'
        - 'command: corerpg p1 gem craft steady'
  c:
