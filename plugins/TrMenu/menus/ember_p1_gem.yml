      name: '§a合成 · 疾风石'
      lore: ['', '§7碎8+骨4+币40 → 疾风', '§7仓：碎%corerpg_p1_vault_shard% · 骨%corerpg_p1_vault_bone%', '§8仓+背包合计够才能成（含自动仓）', '', '§e➥ §f确定合成']
    actions:
      all:
