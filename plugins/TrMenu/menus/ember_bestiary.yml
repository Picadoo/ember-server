# 图录 — DESIGN-ember-pet-bestiary.md；P1 书 §19.1 / §19.5（B2.178，D38）
# 主线首领 → ember_p1_codex；使魔 → ember_pet；装备图鉴 / 阶段奖励 → ember_p1_codex_gear（B2.180，1.24.0）。
# 图录奖励只给展示和一次性资源（一次性余烬币，D42），不承诺天赋点等永久战斗属性。

Title: '§3余烬 · 图录'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 200

Layout:
  - '#########'
  - '#       #'
  - '#  M G  #'
  - '#  R    #'
  - '####B####'

Events:
  Open:
    - 'sound: BLOCK_NOTE_PLING-1-0.8'
    - 'tell: §3【图录】 §7主线首领 · 装备。图录只做展示，不加属性。'

Icons:
  '#':
    display:
      material: stained glass pane
      name: '§8 '

  B:
    display:
      material: arrow
      name: '§7返回主菜单'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-0'
        - 'menu: ember_hub'

  M:
    display:
      material: skull item
      name: '§c主线首领'
      lore:
        - ''
        - '§7Q01–Q07 七个首领：生命、招式、预警、躲法'
        - '§7以及你自己的首通状态'
        - ''
        - '§c➥ §f打开'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'menu: ember_p1_codex'

  G:
    update: 40
    display:
      material: diamond sword
      name: '§6装备图鉴 §f%corerpg_p1_codex_count%'
      lore:
        - ''
        - '§7刃 / 护符：三族 × T0–T3，共 20 种'
        - '§7第一次拿到就登记；只做展示，不加属性'
        - ''
        - '§6➥ §f打开'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'menu: ember_p1_codex_gear'

  P:
    display:
      material: egg
      name: '§a使魔图鉴'
      lore:
        - ''
        - '§7与使魔系统共享收集进度'
        - '§8可跳转使魔菜单'
        - ''
        - '§e➥ §f打开使魔'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'menu: ember_pet'

  R:
    display:
      material: gold ingot
      name: '§e阶段奖励'
      lore:
        - ''
        - '§7装备图鉴集齐 5 / 10 / 15 / 20 种'
        - '§7各领一次余烬币（200 / 400 / 600 / 1000）'
        - '§8一次性资源，不加战斗属性'
        - ''
        - '§e➥ §f打开装备图鉴领取'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'menu: ember_p1_codex_gear'
