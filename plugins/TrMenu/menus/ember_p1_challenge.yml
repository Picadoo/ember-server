# 余烬 v1 (P1) 挑战版选图 — 书 §18.1：Q07 普通首通后七张图开放独立挑战难度（1～3 人、30 体力、统一 T3 参照、
# 掉落与印记全部 T3、成色 60/28/10/2、无首通奖励）。只转发 /corerpg enter <qXX> challenge；资格全在服务端校验。
# 入口：冒险页 ember_p1_adventure 的「挑战版 · 七图」图标，或 /ember_p1_challenge。

Title: '§c余烬 · 挑战版'

Bindings:
  Commands:
    - '(?i)ember_p1_challenge'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 400

Layout:
  - '#########'
  - '#   I   #'
  - '#1234567#'
  - '####B####'

Events:
  Open:
    - 'sound: BLOCK_CHEST_OPEN-1-0'

Icons:
  '#':
    display:
      material: gray stained glass pane
      name: '§8'

  I:
    update: 20
    display:
      material: blaze rod
      name: '§c挑战版：§f%corerpg_p1_challenge%'
      lore:
        - ''
        - '§7体力：§f%corerpg_stamina%§7/§f%corerpg_stamina_max% §8（每局 30）'
        - '§e按 T3 装备来调§7：刚首通 Q07 先把刃换到 T3（印记兑换或升阶），'
        - '§7再到工坊「互换」免费把强化挪过去'
        - '§7预期：只换了刃大约一半能过（输了丢体力，见下行）；两件 T3 后基本稳过'
        - '%corerpg_p1_failrefund%'
        - '§7七张图强度相同，只是掉落偏向的族 / 部位不同'
        - '§7首领预警时间和普通版一样；组队时敌人生命按人数加，同普通版'
        - '§7掉落 T3 装备 + T3 印记 · 没有首通奖励'
        - '§7T3 锻造印记：§f%corerpg_p1_marks_t3% §7/ 8'
        - ''
        - '§b本周精选：§f%corerpg_p1_featured%'
        - '§8精选图前 3 次通关各多 1 枚印记：挑战版给 T3；Q01–Q06 首通后的普通版重打给本图阶（两种共用 3 次，不加币、不加掉落）'
        - '§8已首通 Q07 的人重打普通版：不再多给印记，也不占挑战版的 3 次'
        - '§b本周规则：§f%corerpg_p1_modifier%'
        - '§8规则在精选图的挑战局生效；限药 / 逆行也用于重打已首通的普通版'
        - '§8逆行 = 第一间和第三间的敌群互换；规则只改玩法，不改奖励'
        - ''
        - '§e短目标一眼 §8（D288）'
        - '§7残响本周 claim：§f%corerpg_p1_rush_echo_q01% §8（七首领共用；进阶模式里选首领）'
        - '§7誓约：§f%corerpg_p1_pledge_head% §8（只作用于普通重打，挑战局不挂）'
        - '§7花样 / 事件池只在§f普通版重打§7：限时清房/砸晶/护宝兔/占点/护灯/传火/裂隙/连斩/无伤'
        - '§8挑战局无词缀精英 / 房间事件；精选印记见上行'
