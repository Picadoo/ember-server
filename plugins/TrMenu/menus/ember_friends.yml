# 好友子菜单壳 — docs/design/DESIGN-ember-mail-friends.md
# 列表 / 申请 / 组队邀请 / 师徒（可选）

Title: '§a余烬 · 好友'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 200

Layout:
  - '#########'
  - '#       #'
  - '# L A P #'
  - '#       #'
# D100: 师徒 is not built out (no rewards wired) → hidden; the icon stays defined but out of the layout
  - '####X####'

Events:
  Open:
    - 'sound: BLOCK_NOTE_PLING-1-0.8'
    - 'tell: §a【好友】 §7好友与组队：点「添加」看在线玩家，好友列表里点 [组队] 邀请。'

Icons:
  '#':
    display:
      material: stained glass pane
      name: '§8 '

  X:
    display:
      material: arrow
      name: '§7返回主菜单'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-0'
        - 'menu: ember_hub'

  L:
    display:
      material: book
      name: '§e好友列表'
      lore:
        - ''
        - '§7在线好友可点 [组队] 直接邀请，也能点 [删除]'
        - '§8好友上限 40 人'
        - ''
        - ''
        - '§e➥ §f点击查询'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'command: corerpg friend'

  A:
    display:
      material: paper
      name: '§a添加 / 删除'
      lore:
        - ''
        - '§7聊天栏列出在线玩家，点名字就发申请'
        - '§8对方点 [同意] 后成为好友 · 删除在好友列表里点'
        - ''
        - '§a➥ §f看在线玩家'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'command: corerpg friend addlist'

  P:
    display:
      material: fishing rod
      name: '§b组队 · 队伍面板'
      lore:
        - ''
        - '§7主线本 1～3 人，团本 3～5 人'
        - '§7队长在面板里建队；队友在面板里点队伍申请加入'
        - '§7有人申请时，队长聊天栏出现可点的 [同意] [拒绝]'
        - '§7也可以在好友列表里点 [组队] 直接邀请好友'
        - '§7组好后由§f队长§7在冒险页点图开本，全队一起进'
        - '§8人多时怪物生命更高，奖励每人各一份'
        - ''
        - '§b➥ §f打开队伍面板'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'command: dp team'

  M:
    display:
      material: name tag
      name: '§6师徒（可选）'
      lore:
        - ''
        - '§7新人绑定老手，双方活跃奖'
        - '§8可选模块 · 不挡主线'
        - '§8奖：币 / 外观碎片，不发核心'
        - ''
        - ''
        - '§6➥ §f查看说明'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §6【好友】 §7点击发起师徒'
        - 'tell: §8新人绑老手 · 双方活跃奖（币/外观）· 可选'
