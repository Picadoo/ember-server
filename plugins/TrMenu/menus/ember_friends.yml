# 好友子菜单壳 — DESIGN-ember-mail-friends.md
# 列表 / 申请 / 组队邀请 / 师徒（可选）

Title: '§a余烬 · 好友'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 200

Layout:
  - '#########'
  - '#       #'
  - '# L A P #'
  - '#  M    #'
  - '####X####'

Events:
  Open:
    - 'sound: BLOCK_NOTE_PLING-1-0.8'
    - 'tell: §a【好友】 §7好友与组队。点下方申请 / 邀请。'

Icons:
  '#':
    display:
      material: stained glass pane
      name: '§8 '

  X:
    display:
      material: arrow
      name: '§7返回主菜单'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-0'
        - 'menu: ember_hub'

  L:
    display:
      material: book
      name: '§e好友列表'
      lore:
        - ''
        - '§7查看在线好友与备注'
        - '§8基础社交 · 上限示意 50'
        - ''
        - ''
        - '§e➥ §f点击查询'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'command: corerpg friend'

  A:
    display:
      material: paper
      name: '§a添加 / 删除'
      lore:
        - ''
        - '§7申请加友或解除关系'
        - '§8双方确认后入表'
        - ''
        - ''
        - '§a➥ §f查看说明'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'tell: §a【好友】 §7点击申请；按提示填写名称'
        - 'tell: §8删除：在列表点对应好友'

  P:
    display:
      material: fishing rod
      name: '§b组队 · 队伍面板'
      lore:
        - ''
        - '§7主线本 1～3 人，团本 3～5 人'
        - '§7队长在面板里建队，队友在面板里申请加入'
        - '§7队长同意：§f/dungeon-team request accept <名字>'
        - '§7组好后由§f队长§7在冒险页点图开本，全队一起进'
        - '§8人多时怪物生命更高，奖励每人各一份'
        - ''
        - '§b➥ §f打开队伍面板'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'command: dp team'

  M:
    display:
      material: name tag
      name: '§6师徒（可选）'
      lore:
        - ''
        - '§7新人绑定老手，双方活跃奖'
        - '§8可选模块 · 不挡主线'
        - '§8奖：币 / 外观碎片，不发核心'
        - ''
        - ''
        - '§6➥ §f查看说明'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §6【好友】 §7点击发起师徒'
        - 'tell: §8新人绑老手 · 双方活跃奖（币/外观）· 可选'
