# 余烬主界面 — DESIGN-ember-rpg-systems.md §1 + docs/ember-hub-copy.md
# TrMenu 3.12.x · Paper 1.12.2 · /ember 或 /menu
# 实装：挂机/日/周/附魔/帮助/关闭 + 签到/活跃/悬赏（CoreRpg）+ 强化/镶嵌/分解菜单壳
# 商城/战令/勋阶：子菜单壳（晶钻支付未接线）· 月卡/礼包/外观/御兽入口进商城
# 角色/套装/仓库 + 盟约/天梯/团本/使魔/图录/邮寄/好友/设置/竞技/寄售：子菜单壳

Title: '§6余烬 · 冒险枢纽'

Bindings:
  Commands:
    - '(?i)ember'
    - '(?i)menu'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 200

Layout:
  - ' ABCDEFm1'
  - ' GHI2JKLk'
  - ' MNOPQR l'
  - ' STUVWX  '
  - ' YZabcd  '
  - ' efghij  '

Events:
  Open:
    - 'sound: BLOCK_CHEST_OPEN-1-0'
    - 'tell: §7欢迎回来。今日也从挂机或日常开始吧。'
