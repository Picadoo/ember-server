# 余烬主界面（P1 默认模式，D63）— 书 §19.1「一级菜单只需要冒险、装备、工坊、仓库与设置」
# 主路：冒险 · 主线本（Q01–Q07）→ 装备 → 工坊；P2-2 深渊 · 余烬层（D70）；P2-5 团本（D75）；另有图录 / 轻技（余烬踏步）/ 补给·生活 / 邮寄 / 好友 / 荣誉与排行 / 帮助（盟约 D102 起不在主菜单）
# 旧模式入口（挂机 / 日常 / 周常 / 精英 / 深渊 / 团本 / 灾厄 / 誓约 / 天赋 / 使魔 / 旧强化镶嵌附魔 / 商城等）整页留在
# ember_hub_legacy.yml（不绑定命令，管理员 trmenu open ember_hub_legacy），源表 §13.15 D63
Title: '§6余烬 · 冒险枢纽'
Bindings:
  Commands:
    - '(?i)ember'
    - '(?i)menu'
Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 200
Layout:
  - 'Ln o p F '
  - 'Tm X k i '
  - ' R c Y d '
  - ' ZA G h j'
Events:
  Open:
    - 'sound: BLOCK_CHEST_OPEN-1-0'
    - 'tell: §7下一步：§f%corerpg_p1_next% §8（冒险 · 主线本）'
  Close:
    - 'sound: BLOCK_CHEST_CLOSE-1-0'
Icons:
  # D141 天赋专精（装备页也有入口；返回键回到这里）
  T:
    update: 20
    display:
      material: enchanted book
      name: '§6天赋专精'
      lore:
        - '%corerpg_p1_spec_pts%'
        - '§7按进度得专精点，三排各选一个打法取舍'
        - ''
        - '§e➥ §f打开天赋页'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - close
        - 'command: corerpg p1 spec from hub'
  # D139 国庆限时活动（活动期间才亮；时间来自 ember-v1-festival.yml，PAPI %corerpg_p1_fest_open%）
  L:
    icons:
      - condition: 'check papi %corerpg_p1_fest_open% < 1'
        priority: 1
        display:
          material: stained glass pane
          name: '§8 '
    update: 20
    display:
      material: firework
      name: '§c国庆 · 烟火庙会 §6（限时）'
      lore:
        - ''
        - '§7%corerpg_p1_fest_window% · %corerpg_p1_fest_state%'
        - '§7活动本（首通 Q04 后 · 不耗体力 · 今日 %corerpg_p1_fest_entries%）掉国庆币'
        - '§7换「盛世烟火符」（打怪时炸开烟火）和限时足迹；通关得限时称号'
        - ''
        - '§e➥ §f打开活动页'
    actions:
      all:
        - 'sound: ENTITY_FIREWORK_LAUNCH-1-1'
        - 'menu: ember_p1_fest'
  h:
    icons:
      - condition: 'check papi %corerpg_p1_q07done% < 1'
        priority: 1
        display:
          material: stained glass pane
          name: '§8 '
    update: 20
    display:
      material: diamond chestplate
      name: '§b团本 · 霜封哨所·团（3～5 人）'
      lore:
        - ''
        - '§7状态：§f%corerpg_p1_raid_r02%'
        - '§7Q06 的地图 · 首领双段刀气 + 追身冲击圈；半血进入第二阶段（砸地接横扫）'
        - '§7战斗规则和三套装不变；通关得专属称号与足迹（只做展示）'
        - '§7人越多，敌方生命与伤害越高（倍率见开局提示）'
        - '§7倒下后观战队友；下一个房间开打、首领转阶段时自动复活（50% 生命），首领最后 20% 生命再复活一次；全员倒下才算失败'
        - '§7结算同锈轨矿道·团：挑战版固定结算 + 1 件你目标族的 T3（至少精良）+ 1 枚 T3 印记'
        - '§7与锈轨矿道·团、断塔回廊·团合计每周 3 次'
        - '§a人越多越稳：第 2 周 3 人约 5 成、5 人约 8 成；第 4 周 3 人约 7 成、4～5 人 9 成以上'
        - '§7招募中：§f%corerpg_p1_recruits%'
        - ''
        - '§e➥ §f左键：队长开本（全队需各自首通 Q07）'
        - '§e➥ §f右键：全服招募队员（挂 10 分钟）'
    actions:
      left:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'command: corerpg p1 enter r02'
        - close
      right:
        - 'sound: UI_BUTTON_CLICK-1-1'
        - 'command: corerpg p1 recruit r02'
        - close
  Z:
    icons:
      - condition: 'check papi %corerpg_p1_q07done% < 1'
        priority: 1
        display:
          material: stained glass pane
          name: '§8 '
    update: 20
    display:
      material: golden chestplate
      name: '§6团本 · 断塔回廊·团（3～5 人）'
      lore:
        - ''
        - '§7状态：§f%corerpg_p1_raid_r03%'
        - '§7Q05 的地图 · 首领斧刃横扫 + 径向冲击；招牌机制「烬核」：绿圈锁定一人，3 秒后圈里的人平分伤害——全队靠拢！'
        - '§7战斗规则和三套装不变；通关得专属称号与足迹（只做展示）'
        - '§7人越多，敌方生命与伤害越高（倍率见开局提示）'
        - '§7倒下后观战队友；下一个房间开打、首领转阶段时自动复活（50% 生命），首领最后 20% 生命再复活一次；全员倒下才算失败'
        - '§7结算同锈轨矿道·团（偏向族焚烬）：挑战版固定结算 + 1 件你目标族的 T3（至少精良）+ 1 枚 T3 印记'
        - '§7与锈轨矿道·团、霜封哨所·团合计每周 3 次'
        - '§a人越多越稳：第 2 周 3 人约 5 成、5 人约 9 成；第 4 周 3 人约 7 成半、4～5 人 9 成以上'
        - '§7招募中：§f%corerpg_p1_recruits%'
        - ''
        - '§e➥ §f左键：队长开本（全队需各自首通 Q07）'
        - '§e➥ §f右键：全服招募队员（挂 10 分钟）'
    actions:
      left:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'command: corerpg p1 enter r03'
        - close
      right:
        - 'sound: UI_BUTTON_CLICK-1-1'
        - 'command: corerpg p1 recruit r03'
        - close
  n:
    update: 20
    display:
      material: blaze rod
      name: '§6冒险 · 主线本'
      lore:
        - ''
        - '§a下一步：§f%corerpg_p1_next%'
