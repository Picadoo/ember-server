# 旧模式入口（挂机 / 日常 / 周常 / 精英 / 深渊 / 团本 / 灾厄 / 誓约 / 天赋 / 使魔 / 旧强化镶嵌附魔 / 商城等）整页留在
# ember_hub_legacy.yml（不绑定命令，管理员 trmenu open ember_hub_legacy），源表 §13.15 D63
Title: '§6余烬 · 冒险枢纽'
Bindings:
  Commands:
    - '(?i)ember'
    - '(?i)menu'
Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 200
Layout:
  - 'LnHo p FS'
  - 'TBmX k i '
  - 'ZR c Y d '
  - 'Q A G U j'
Events:
  Open:
    - 'sound: BLOCK_CHEST_OPEN-1-0'
    - 'tell: §e今天：§f%corerpg_p1_route_pri%'
    - 'tell: §8%corerpg_p1_route_sec%'
  Close:
    - 'sound: BLOCK_CHEST_CLOSE-1-0'
Icons:

  # D306 枢纽「今天该打哪」日路由决策卡（方案 M · 零经济）
