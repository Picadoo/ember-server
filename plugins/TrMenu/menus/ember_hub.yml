    update: 20
    icons:
      - condition: 'check papi %corerpg_stamina% < 30'
        priority: 1
        display:
          material: compass
          name: '§e今天该打哪'
          lore:
            - ''
            - '§e%corerpg_p1_route_pri%'
            - '§8%corerpg_p1_route_sec%'
            - ''
            - '§7—— 今日四态 ——'
            - '§e体力 §f%corerpg_stamina%§7/§f%corerpg_stamina_max% §8· 主线30 / 深渊30 / 团本50'
            - '§b精选：§f%corerpg_p1_featured%'
            - '§e花样：§f%corerpg_p1_vbounty%'
            - '§a挂机：§f%corerpg_p1_afk_state% §7· 今日 %corerpg_p1_afk_today%'
            - '§8体力不足：优先挂机/补给，不假开主线'
            - ''
            - '§e➥ §f打开挂机庭'
        actions:
          all:
            - 'sound: BLOCK_NOTE_PLING-1-1'
            - 'menu: ember_p1_afk'
      - condition: 'check papi %corerpg_p1_afk_full% >= 1'
        priority: 2
        display:
          material: compass
          shiny: true
          name: '§e今天该打哪 §6（挂机已满）'
          lore:
            - ''
            - '§e%corerpg_p1_route_pri%'
            - '§8%corerpg_p1_route_sec%'
            - ''
            - '§7—— 今日四态 ——'
            - '§e体力 §f%corerpg_stamina%§7/§f%corerpg_stamina_max% §8· 主线30 / 深渊30 / 团本50'
            - '§b精选：§f%corerpg_p1_featured%'
            - '§e花样：§f%corerpg_p1_vbounty%'
            - '§a挂机：§f满 · 去冒险 §7· 今日 %corerpg_p1_afk_today%'
            - '§8层名片仍在挂机页（不盖过满额→冒险）'
            - ''
            - '§e➥ §f去冒险'
        actions:
          all:
            - 'sound: BLOCK_NOTE_PLING-1-2'
            - 'menu: ember_p1_adventure'
    display:
      material: compass
      name: '§e今天该打哪'
      lore:
        - ''
        - '§e%corerpg_p1_route_pri%'
        - '§8%corerpg_p1_route_sec%'
        - ''
        - '§7—— 今日四态 ——'
        - '§e体力 §f%corerpg_stamina%§7/§f%corerpg_stamina_max% §8· 主线30 / 深渊30 / 团本50'
