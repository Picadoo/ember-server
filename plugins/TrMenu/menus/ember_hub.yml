        - '§e➥ §f打开工坊'
    actions:
      all:
        - 'sound: BLOCK_ANVIL_USE-1-1'
        - 'menu: ember_p1_forge'

  A:
    icons:
      # D99: before the player's own Q07 first clear the post-Q07 content is one locked icon (the others are blank)
      - condition: 'check papi %corerpg_p1_q07done% < 1'
        priority: 1
        display:
          material: gray dye
          name: '§7Q07 之后：挑战 / 深渊 / 团本'
          lore:
            - ''
            - '§7首通 Q07 锈轨矿道后开放：'
            - '§7· 七图挑战版（更强的敌人，掉 T3）'
            - '§7· 深渊 · 余烬层（十层，越深越难）'
            - '§7· 团本两张（3～5 人，每周 3 次）'
            - ''
            - '§a现在：§f%corerpg_p1_next%'
        actions:
          all:
            - 'sound: BLOCK_NOTE_PLING-1-0.6'
    update: 20
    display:
      material: ender eye
      name: '§5深渊 · 余烬层'
      lore:
        - ''
        - '§7Q07 首通后的长线挑战：§f%corerpg_p1_abyss_state%'
