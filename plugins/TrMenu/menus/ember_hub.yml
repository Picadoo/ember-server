# 余烬主界面（P1 默认模式，D63）— 书 §19.1「一级菜单只需要冒险、装备、工坊、仓库与设置」
# 主路：冒险 · 主线本（Q01–Q07）→ 装备 → 工坊；P2-2 深渊 · 余烬层（D70）；另有图录 / 轻技（余烬踏步）/ 补给·生活 / 邮寄 / 好友 / 盟约 / 帮助
# 旧模式入口（挂机 / 日常 / 周常 / 精英 / 深渊 / 团本 / 灾厄 / 誓约 / 天赋 / 使魔 / 旧强化镶嵌附魔 / 商城等）整页留在
# ember_hub_legacy.yml（不绑定命令，管理员 trmenu open ember_hub_legacy），源表 §13.15 D63
Title: '§6余烬 · 冒险枢纽'
Bindings:
  Commands:
    - '(?i)ember'
    - '(?i)menu'
Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 200
Layout:
  - ' n o p F '
  - ' m X k i '
  - ' R c Y d '
  - '  A j    '
Events:
  Open:
    - 'sound: BLOCK_CHEST_OPEN-1-0'
    - 'tell: §7主路：冒险 · 主线本，从 Q01 灰烬庭院开始；首通开放下一张图。'
  Close:
    - 'sound: BLOCK_CHEST_CLOSE-1-0'
Icons:
  n:
    display:
      material: blaze rod
      name: '§6冒险 · 主线本'
      lore:
        - ''
        - '§7新模式主线本 Q01–Q07 + 挑战版：解锁状态、消耗、掉落阶与用途'
        - '§7掉落目标族 · 锻造印记 · 首通自选 · 补领'
        - '§8每次 30 体力 · 1～3 人'
        - ''
        - '§e➥ §f打开冒险页'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'menu: ember_p1_adventure'

  o:
    update: 20
    display:
      material: iron chestplate
      name: '§6装备 · 主线本'
      lore:
        - ''
        - '§7主手刃、已选护符、实际属性、套装与觉醒'
        - '§7下一次突破缺什么 · 回复药补给 · 补领'
        - '§8套装：§f%corerpg_p1_awaken%'
        - ''
        - '§e➥ §f打开装备页'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'menu: ember_p1_gear'
  p:
    display:
      material: anvil
      name: '§6工坊 · 主线本装备'
      lore:
        - ''
        - '§7手持 P1 装备：强化 / 升阶 / 精工 / 成色 / 互换 / 分解'
        - '§8先预览，再点确认'
        - ''
        - '§e➥ §f打开工坊'
    actions:
      all:
        - 'sound: BLOCK_ANVIL_USE-1-1'
        - 'menu: ember_p1_forge'

  A:
    update: 20
    display:
      material: ender eye
      name: '§5深渊 · 余烬层'
      lore:
        - ''
        - '§7Q07 首通后的长线挑战：§f%corerpg_p1_abyss_state%'
        - '§7三房一段 · 十层封顶 · 每段单独付费与结算'
        - ''
        - '§e➥ §f打开深渊选层'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'menu: ember_p1_abyss'
  F:
    display:
      material: book and quill
      name: '§3图录'
      lore:
        - ''
        - '§7主线七个首领的招式与躲法 · 使魔图鉴'
        - '§8只做展示，不加属性'
        - ''
        - '§e➥ §f打开图录菜单'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'menu: ember_bestiary'

  m:
    display:
      material: feather
      name: '§a轻技'
      lore:
        - ''
        - '§7可装配轻技槽 · 试点余烬踏步'
        - '§7短位移 · CD 14s · 零体力'
        - '§7战斗中 §e潜行+Q §7可释放'
        - '§8与誓约主动并行 · 当前 §f%corerpg_flex_skill_name%'
        - ''
        - '§e➥ §f打开轻技页'
        - '§7潜行点击直接释放轻技'
    actions:
      left:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'menu: ember_flex_skill'
      right:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'menu: ember_flex_skill'
      shift_left:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'command: corerpg flex cast'
        - close
      shift_right:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'command: corerpg flex cast'
        - close
  X:
    display:
      material: ender chest
      name: '§3仓库'
      lore:
        - ''
        - '§7扩展存储；勋阶可提升格数'
        - '§8材料仓 · 点此打开'
        - '§8绑定与流通分仓'
        - ''
        - '§e➥ §f打开仓库菜单'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'menu: ember_storage'

  k:
    display:
      material: bread
      name: '§a补给 · 生活'
      lore:
        - ''
        - '§7面包 / 钓竿（余烬币）· 代烤鱼 · 熬回复药'
        - '§7遗物换重铸石 · 宝珠制稳固符（每周限次）'
        - '§8钓鱼 / 烹饪 / 熬药 提升生活等级'
        - '§8点击打开补给与生活面板'
        - '§8也可找工坊：烬砧 / 余晶 / 灰粮（右键）'
        - ''
        - '§e➥ §f打开补给菜单'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'menu: ember_life'
  i:
    display:
      material: book
      name: '§b帮助'
      lore:
        - ''
        - '§7怎么玩 · 操作 · 三套装 · 变强 · 收益与体力'
        - '§7补给与倒下 · 七张图 · 背景（可不读）'
        - ''
        - '§e➥ §f打开帮助页'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'menu: ember_help'
  R:
    display:
      material: book and quill
      name: '§f邮寄'
      lore:
        - ''
        - '§7领取系统邮件、战令与维护补偿'
        - '§8奖励统一进邮箱'
        - '§7打开邮寄'
        - ''
        - '§e➥ §f打开邮寄菜单'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'menu: ember_mail'

  c:
    display:
      material: cake
      name: '§a好友'
      lore:
        - ''
        - '§7好友列表与组队邀请入口'
        - '§8可接师徒（可选）'
        - '§7好友'
        - ''
        - '§e➥ §f打开好友菜单'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'menu: ember_friends'
  Y:
    display:
      material: banner
      name: '§2盟约'
      lore:
        - ''
        - '§7加入或创建公会，做盟课、打盟 Boss'
        - '§8创建 · 捐献 · 盟 Boss'
        - '§7盟约与捐献'
        - ''
        - '§e➥ §f打开盟约菜单'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'menu: ember_guild'
  d:
    display:
      material: comparator
      name: '§7设置'
      lore:
        - ''
        - '§7音效、提示与隐私等个人选项'
        - '§8低优先级个人选项'
        - '§7设置'
        - ''
        - '§e➥ §f打开设置菜单'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'menu: ember_settings'

  j:
    display:
      material: barrier
      name: '§c关闭'
      lore:
        - ''
        - '§7关闭菜单'
    actions:
      all:
        - close
        - 'sound: BLOCK_NOTE_PLING-1-0'
