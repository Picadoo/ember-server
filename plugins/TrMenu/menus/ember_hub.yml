# 余烬主界面（P1 默认模式，D63）— 书 §19.1「一级菜单只需要冒险、装备、工坊、仓库与设置」
# 主路：冒险 · 主线本（Q01–Q07）→ 装备 → 工坊；P2-2 深渊 · 余烬层（D70）；P2-5 团本（D75）；另有图录 / 技能组（D211）/ 轻技（余烬踏步）/ 补给·生活 / 邮寄 / 好友 / 荣誉与排行 / 帮助（盟约 D102 起不在主菜单）
# 旧模式入口（挂机 / 日常 / 周常 / 精英 / 深渊 / 团本 / 灾厄 / 誓约 / 天赋 / 使魔 / 旧强化镶嵌附魔 / 商城等）整页留在
# ember_hub_legacy.yml（不绑定命令，管理员 trmenu open ember_hub_legacy），源表 §13.15 D63
Title: '§6余烬 · 冒险枢纽'
Bindings:
  Commands:
    - '(?i)ember'
    - '(?i)menu'
  Items:
    - 'nether star'
Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 200
Layout:
  - 'LnHowpvFS'
  - 'TBmXgek i'
  - 'ZR c Y d '
  - 'Q A G U j'
Events:
  Open:
    - 'sound: BLOCK_CHEST_OPEN-1-0'
    - 'tell: §e今天：§f%corerpg_p1_route_pri%'
    - 'tell: §8%corerpg_p1_route_sec%'
    - 'command: corerpg p1 hope peek'
    - 'tell: §7右键手中「余烬星」随时打开本页 · 勿敲指令'
  Close:
    - 'sound: BLOCK_CHEST_CLOSE-1-0'
Icons:

  # D306 枢纽「今天该打哪」日路由决策卡（方案 M · 零经济）
  # D377：旁轨「今日可追」行 + 右键轻跳生活/工坊（左键主语义不动）
  # D399：体力行补短征30 + 今日可追短征半行 + 默认右键轻跳短征选页（体力不足禁进本跳）
  H:
    update: 20
    icons:
      - condition: 'check papi %corerpg_stamina% < 30'
        priority: 1
        display:
          material: compass
          name: '§e今天该打哪'
          lore:
            - '§e%corerpg_p1_route_pri%'
            - '§e体力 §f%corerpg_stamina%§7/§f%corerpg_stamina_max% §8不足'
            - '§e➥ §f左：挂机 · 右：补给'
        actions:
          left:
            - 'sound: BLOCK_NOTE_PLING-1-1'
            - 'menu: ember_p1_afk'
          right:
            - 'sound: BLOCK_NOTE_PLING-1-1'
            - 'menu: ember_life'
      - condition: 'check papi %corerpg_p1_afk_full% >= 1'
        priority: 2
        display:
          material: compass
          shiny: true
          name: '§e今天该打哪 §6（挂机已满）'
          lore:
            - '§e%corerpg_p1_route_pri%'
            - '§a挂机已满 · §e体力 §f%corerpg_stamina%§7/§f%corerpg_stamina_max%'
            - '§e➥ §f左：冒险 · 右：工坊 · Shift左：短征'
        actions:
          left:
            - 'sound: BLOCK_NOTE_PLING-1-2'
            - 'menu: ember_p1_adventure'
          right:
            - 'sound: BLOCK_ANVIL_USE-1-1'
            - 'menu: ember_p1_forge'
          shift_left:
            - 'sound: BLOCK_NOTE_PLING-1-2'
            - 'menu: ember_p1_short'
    display:
      material: compass
      name: '§e今天该打哪'
      lore:
        - '§e%corerpg_p1_route_pri%'
        - '§e体力 §f%corerpg_stamina%§7/§f%corerpg_stamina_max%'
        - '§e➥ §f左：冒险 · 右：短征'
    actions:
      left:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'menu: ember_p1_adventure'
      right:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'menu: ember_p1_short'


