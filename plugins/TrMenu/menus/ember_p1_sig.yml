# D174 第 1.5 阶段 · 签名传奇页（docs/design/DESIGN-ember-mainline-unlocks-2026-10-04.md §2.4）
# 图鉴（每个首领两件：获得过 / 还没获得 / 未解锁 + 效果 + 代价）· 正在用的两件上的签名（点击开关）· 点一条签名 → 烬炉烙印页。
# 文字 / 状态全部来自 PAPI %corerpg_p1_sig_*%（EmberGrowthService.sigPapi），菜单不自己算；按钮只调 /corerpg p1 sig 的子命令。
# 签名按 EmberSignature.DEFS 的顺序编号：n_1 = L01 … n_15 = L15（第 2a 阶段 Q04–Q06 在第 4、5 排；第 3 阶段 Q07 在最后一排，T = 签名调律页）。
# 入口：装备页「签名传奇」、技能组「签名传奇」、首通解锁消息里的 [打开签名页]、/corerpg p1 sig。返回键回到打开它的那一页。
# D290：与技能组互相深链（from skill → 返回技能组）。

Title: '§6签名传奇'

Bindings:
  Commands:
    - '(?i)ember_p1_sig'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 400

Layout:
  - '###PI#T##'
  - '#M W C R#'
  - '#u12 v34#'
  - '#w56 x78#'
  - '#y9J zKL#'
  - '#qDEFNbX#'

Events:
  Open:
    - 'sound: BLOCK_ENCHANTMENT_TABLE_USE-0.6-1.2'

Icons:
  '#':
    display:
      material: gray stained glass pane
      name: '§8'

  # D291
  P:
    display:
      material: map
      name: '§e推荐打法'
      lore:
        - ''
        - '§7机动 / 站桩 / 压上 ↔ 天赋一排'
        - '§8签名覆盖形状时仍先认打法标签'
        - ''
        - '§e➥ §f打开'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'menu: ember_p1_playstyle'

  I:
    update: 20
    display:
      material: nether star
      name: '§6签名传奇 · 说明'
      lore:
        - '%corerpg_p1_sig_head%'
        - ''
        - '§7每张主线图的首领有自己的签名效果（改打法，不加伤害倍率；都有代价）'
        - '§7生效：正在用的刃 1 条 + 已选护符 1 条；同类不叠；和已选天赋同类的不生效'
        - '§7来源：首通后普通重打这张图 → 每局 1 枚首领徽记，基础掉落 12% 是签名件'
        - '§7烬炉烙印：5 枚这张图的徽记 + 300×阶级 币，把签名烙到自己的件上'
        - '§e刃签名可覆盖烬斩符文：§fL07 直线 · L09 环斩 · L13 蓄力环斩'
        - '§8形状预览 / 二选一 → 右下「技能组」'
        - '§8签名记在你的存档上，跟着这件的编号走：升阶 / 强化 / 洗练都不丢；分解就没了'

  M:
    update: 20
    display:
      material: gold nugget
      name: '§e首领徽记'
      lore:
        - '%corerpg_p1_sig_marks%'
        - ''
        - '§8只用来烙印这张图的签名，不换别的东西'

  R:
    update: 20
    display:
