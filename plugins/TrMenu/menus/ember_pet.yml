# 使魔

Title: '§a余烬 · 使魔'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 200

Layout:
  - '#########'
  - '#   F   #'
  - '# L E S #'
  - '#   I   #'
  - '####B####'

Events:
  Open:
    - 'sound: BLOCK_NOTE_PLING-1-0.8'
    - 'tell: §a【使魔】 §7点灰灵或烬火切换出战'
    - 'tell: §8魂尘：补给 · 生活（旧靴/碎骨兑换）· 非挂机日表'
    - 'tell: §8缺魂尘：点本页「去生活兑魂尘」'
    - 'tell: §8本页可见等级与下一级魂尘'

Icons:
  '#':
    display:
      material: stained glass pane
      name: '§8 '

  B:
    display:
      material: arrow
      name: '§7返回主菜单'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-0'
        - 'menu: ember_hub'

  F:
    display:
      material: chest
      name: '§d去生活兑魂尘'
      lore:
        - ''
        - '§7旧靴 / 碎骨 → 魂尘'
        - '§8非挂机日表 · 补给·生活'
        - ''
        - '§d➥ §f打开补给 · 生活'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1.2'
        - 'menu: ember_life'

  L:
    display:
      material: book and quill
      name: '§e选定使魔 / 换一只'
      lore:
        - ''
        - '§7点开选定盘：灰灵 / 烬火'
        - '§8点一下切换出战 · 不用聊天 list'
        - ''
        - '§8未解锁：生活页孵化 / 持蛋点选'
        - ''
        - '§e➥ §f打开选定盘'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'menu: ember_pet_select'

  E:
    update: 20
    display:
      material: egg
      name: '§a出战 / 收回'
      lore:
        - ''
        - '§7选定：§f%corerpg_pet_active_name% §8· %corerpg_pet_level_line%'
        - '§7同时出战 §f1 §7只'
        - '§8默认偏外观；属性≤总战力 5%'
        - '§8升级吃魂尘（生活·钓鱼兑换）'
        - ''
        - '§e➥ §f左键出战 · 右键收回'
        - ''
        - '§a➥ §f出战 / 收回'
    actions:
      left:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'tell: §a【使魔】 §7正在出战…'
        - 'command: corerpg pet summon'
      right:
        - 'sound: UI_BUTTON_CLICK-1-1'
        - 'tell: §a【使魔】 §7正在收回…'
        - 'command: corerpg pet dismiss'

  S:
    update: 20
    display:
      material: glowstone dust
      name: '§6魂尘投喂'
      lore:
        - ''
        - '§e%corerpg_pet_level_line%'
        - '§6%corerpg_pet_feed_hint%'
        - ''
        - '§7生活兑换魂尘升级使魔 · 非挂机日表'
        - '§8不消耗核心 / 毕业刃'
        - '§8魂尘：补给 · 生活'
        - '§8缺尘点旁格「去生活兑魂尘」'
        - ''
        - '§8点击投喂'
        - ''
        - '§6➥ §f投喂'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §6【使魔】 §7投喂魂尘升级'
        - 'command: corerpg pet feed'
        - 'tell: §8没有魂尘？点本页「去生活兑魂尘」兑换'

  I:
    update: 20
    display:
      material: name tag
      name: '§a使魔状态'
      lore:
        - ''
        - '§7选定：§f%corerpg_pet_active_name%'
        - '§e%corerpg_pet_level_line%'
        - '§6%corerpg_pet_feed_hint%'
        - '§7展示战力加值：§f%corerpg_pet_power_bonus%'
        - ''
        - '§8投喂后重开本页可见变化'
        - '§8缺尘 → 「去生活兑魂尘」'
