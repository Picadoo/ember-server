# 使魔子菜单壳 — docs/design/DESIGN-ember-pet-bestiary.md
# D373：出战接 summon/dismiss + 魂尘来源诚实（生活·钓鱼）· DESIGN-ember-pet-loop-honest-2026-10-10
# 使魔

Title: '§a余烬 · 使魔'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 200

Layout:
  - '#########'
  - '#       #'
  - '# L E S #'
  - '#       #'
  - '####B####'

Events:
  Open:
    - 'sound: BLOCK_NOTE_PLING-1-0.8'
    - 'tell: §a【使魔】 §7收集出战 · 偏外观与微量助战（≤战力 5%）。'
    - 'tell: §8魂尘：补给 · 生活（旧靴/碎骨兑换）· 非挂机日表'

Icons:
  '#':
    display:
      material: stained glass pane
      name: '§8 '

  B:
    display:
      material: arrow
      name: '§7返回主菜单'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-0'
        - 'menu: ember_hub'

  L:
    display:
      material: book and quill
      name: '§e使魔图鉴'
      lore:
        - ''
        - '§7查看已收集使魔与碎片进度'
        - '§8掉落蛋 / 碎片合成'
        - ''
        - '§8点击查看已拥有使魔'
        - ''
        - '§e➥ §f查看说明'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'command: corerpg pet list'

  E:
    display:
      material: egg
      name: '§a出战 / 收回'
      lore:
        - ''
        - '§7同时出战 §f1 §7只'
        - '§8默认偏外观；属性≤总战力 5%'
        - '§8升级吃魂尘（生活·钓鱼兑换）'
        - ''
        - '§e➥ §f左键出战 · 右键收回'
        - ''
        - '§a➥ §f出战 / 收回'
    actions:
      left:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'tell: §a【使魔】 §7正在出战…'
        - 'command: corerpg pet summon'
      right:
        - 'sound: UI_BUTTON_CLICK-1-1'
        - 'tell: §a【使魔】 §7正在收回…'
        - 'command: corerpg pet dismiss'

  S:
    display:
      material: glowstone dust
      name: '§6魂尘投喂'
      lore:
        - ''
        - '§7生活兑换魂尘升级使魔 · 非挂机日表'
        - '§8不消耗核心 / 毕业刃'
        - '§8魂尘：补给 · 生活'
        - ''
        - '§8点击投喂'
        - ''
        - '§6➥ §f投喂'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §6【使魔】 §7投喂魂尘升级'
        - 'command: corerpg pet feed'
