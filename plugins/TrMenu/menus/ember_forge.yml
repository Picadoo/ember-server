# 1.12.0 (2026-09-27) 余烬锻炉 · 锻造保底 — CoreRpg ForgeService（forge.yml）
# 1.15.26 B-anvil-1：P=炼部件（ember_part）— 勿改升阶 A/B/C
Title: '§6余烬锻炉 · 锻造'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 500

Layout:
  - '#########'
  - '# A B C #'
  - '# E P S #'
  - '####I##Z#'

Icons:
  '#':
    display:
      material: stained glass pane
      name: '§8 '
  A:
    display:
      material: iron sword
      name: '§eT1 → T2'
      lore: ['§7手持 T1 刃/护符', '§7核碎×10 + 碎×40 + 1500币', '§e➥ §f查看配方']
    actions:
      all:
        - 'close'
        - 'command: corerpg forge'
  B:
    display:
      material: diamond sword
      name: '§6T2 → T3'
      lore: ['§7手持 T2 · 凝核×3 + 核碎×25 + 灾厄×6 + 5000币', '§8凝核：团本通关1 · 灾厄周首日箱1', '§e➥ §f查看配方']
    actions:
      all:
        - 'close'
        - 'command: corerpg forge'
  C:
    display:
      material: anvil
      name: '§a确认锻造（手持装备）'
      lore: ['§7保留50%强化（下取整）· 附魔/次要词条', '§7未解锁孔的宝石退回背包', '§c➥ §f立即锻造手持']
    actions:
      all:
        - 'close'
        - 'command: corerpg forge confirm'
  E:
    display:
      material: anvil
      name: '§c去强化'
      lore: ['§7强化刃/护符 +0～+10', '§e➥ §f打开强化']
    actions:
      all:
        - 'menu: ember_enhance'
  S:
    display:
      material: emerald
      name: '§e去镶嵌'
      lore: ['§7P1 孔石 · 希望保底 §f%corerpg_p1_gem_pity_hope%', '§7合成：碎8+骨4+币40 · 不走旧镶嵌', '§e➥ §f打开镶嵌']
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'menu: ember_p1_gem'
  P:
    display:
      material: flint
      name: '§a炼部件'
      lore:
        - '§7材料炼部件 · 灰箍：碎×12+铁锭×2'
        - '§8副手物防 +1 · 不计主线战力'
        - '§e➥ §f打开炼部件'
    actions:
      all:
        - 'menu: ember_part'
  I:
    display:
      material: book
      name: '§f说明'
      lore: ['§7手持装备后点左侧预览配方', '§7确认：点「确认锻造」（勿手打命令）']
  Z:
    display:
      material: arrow
      name: '§7返回主菜单'
    actions:
      all:
        - 'menu: ember_hub'
