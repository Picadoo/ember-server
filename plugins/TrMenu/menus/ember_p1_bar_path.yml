# TIP-FX / D13407 · 药栏路径选打薄页 · bar_path* · barpath right|left|key5|clear
# 入口：BarPath.offerPick / 无参 barpath / 周要约 / Q01首进或首通 → /ember_p1_bar_path（插件并行改开菜单）
# 选打：corerpg p1 barpath right|left|key5|clear
# 导航：技能组 ember_skill_kit / 冒险 / 备药
# 禁：教裸指令主 UI · 抬伤害/CD表/掉落/药价表 · 改 bite_path / bank_path / ticket_path / sip_path / armor_path / cook_path / prep_path / dose_path / 其他已齐选打 / D512 药栏语义 / 庭内 · ≠Bite果腹 · ≠Bank取银 · ≠Ticket旧票 · ≠Stash存仓 · ≠Sip喝药 · ≠Cook代烤 · ≠Prep买药 · ≠Dose补体 · 含Prep备药邻页
# PAPI（插件可能后到·静态接线）：bar_path / bar_path_label / bar_path_tip · bar_unlock（灰态·首进/首通 Q01）
# ≠ ember_p1_bank_path · ≠ ember_p1_ticket_path · ≠ ember_p1_flee_path · ≠ ember_p1_gate_path · ≠ ember_p1_call_path · ≠ ember_p1_link_path · ≠ ember_p1_hunt_path · ≠ ember_p1_pack_path · ≠ ember_p1_chest_path · ≠ ember_p1_duck_path · ≠ ember_p1_thaw_path · ≠ ember_p1_rally_path · ≠ ember_p1_smash_path · ≠ ember_p1_guard_path · ≠ ember_p1_hold_path · ≠ ember_p1_beacon_path · ≠ ember_p1_relay_path · ≠ ember_p1_breach_path · ≠ ember_p1_alert_path · ≠ ember_p1_stock_path · ≠ ember_p1_hurry_path · ≠ ember_p1_focus_path · ≠ ember_p1_doom_path · ≠ ember_p1_nest_path · ≠ ember_p1_save_path · ≠ ember_p1_sequel_path · ≠ ember_p1_bait_path · ≠ ember_p1_slip_path · ≠ ember_p1_crash_path · ≠ ember_p1_bolt_path · ≠ ember_p1_shift_path · ≠ ember_p1_gap_path · ≠ ember_p1_phase_path · ≠ ember_p1_wave_path · ≠ ember_p1_soak_path · ≠ ember_p1_shell_path · ≠ ember_p1_clone_path · ≠ ember_p1_press_path · ≠ ember_p1_cut_path · ≠ ember_p1_rush_path · ≠ ember_p1_clean_path · ≠ ember_p1_streak_path · ≠ ember_p1_blaze_path · ≠ ember_p1_spin_path · ≠ ember_p1_snap_path · ≠ ember_p1_veil_path · ≠ ember_p1_free_path · ≠ ember_p1_dodge_path · ≠ ember_p1_sidestep_path · ≠ ember_p1_step_path · ≠ ember_p1_flex_path · ≠ ember_p1_stride_path · ≠ ember_p1_counter_path · ≠ ember_p1_pledge_path · ≠ ember_p1_trial_path · ≠ ember_p1_abyss_path · ≠ ember_p1_short_path · ≠ ember_p1_raid_path · ≠ ember_p1_challenge_path · ≠ ember_p1_featured_path · ≠ ember_p1_sight_path · ≠ ember_p1_charm_path · ≠ ember_p1_grip_path · ≠ ember_p1_armor_path · ≠ ember_p1_sip_path · ≠ ember_p1_stash_path · ≠ ember_p1_pack_path


Title: '§e药栏 · 路径'

Bindings:
  Commands:
    - '(?i)ember_p1_bar_path'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 400

Layout:
  - '####I####'
  - '#1#2#3#C#'
  - '##K#A#F##'
  - '####Z####'

Events:
  Open:
    - 'sound: BLOCK_NOTE_PLING-1-1.1'
    - 'tell: §e药栏路径 §7· 当前 §e%corerpg_p1_bar_path_label%'
    - 'tell: §8点选 · 右栏 / 左栏 / 五键 / 清空 · 或技能组 / 冒险 / 备药'

Icons:
  '#':
    display:
      material: gray stained glass pane
      name: '§8'

  I:
    update: 20
    display:
      material: paper
      name: '§e药栏路径 · 说明'
      lore:
        - '§7当前路径：§e%corerpg_p1_bar_path_label%'
        - '§8%corerpg_p1_bar_path_tip%'
        - '§8点选 · 右栏 / 左栏 / 五键 / 清空'
        - '§8需本人首进或首通 Q01'
        - '§8回复药快捷栏落点（≠Bite果腹 · ≠Bank取银 · ≠Ticket旧票 · ≠Sip喝药 · ≠Cook代烤 · ≠Prep买药 · ≠Dose补体）'

  # 右栏 · RIGHT=1 · 选后立即重排 · 优先右侧（9→2）
  '1':
    update: 20
    icons:
      - condition: 'check papi %corerpg_p1_bar_unlock% < 1'
        priority: 1
        display:
          material: gray dye
          name: '§7右栏 §8（需首进/首通 Q01）'
          lore:
            - '§c需本人首通 Q01'
            - '§7选后立即重排 · 优先右侧（9→2）'
            - '§8解锁后再选路径'
      - condition: 'check papi %corerpg_p1_bar_path% == 1'
        priority: 2
        display:
          material: emerald
          shiny: true
          name: '§a右栏 §8· §f已选'
          lore:
            - '§7选后立即重排 · 优先右侧（9→2）'
            - '§8%corerpg_p1_bar_path_tip%'
            - '§a当前路径焦点'
            - '§8再点可重选同路径'
        actions:
          all:
            - 'sound: UI_BUTTON_CLICK-1-1'
            - 'command: corerpg p1 barpath right'
            - 'menu: ember_p1_bar_path'
    display:
      material: lime dye
      name: '§a右栏'
      lore:
        - '§7选后立即重排 · 优先右侧（9→2）'
        - '§8点选切换药栏路径'
        - '§e➥ §f设为右栏'
    actions:
      all:
        - 'sound: UI_BUTTON_CLICK-1-1'
        - 'command: corerpg p1 barpath right'
        - 'menu: ember_p1_bar_path'

  # 左栏 · LEFT=2 · 选后立即重排 · 优先左侧（2→9）
  '2':
    update: 20
    icons:
      - condition: 'check papi %corerpg_p1_bar_unlock% < 1'
        priority: 1
        display:
          material: gray dye
          name: '§7左栏 §8（需首进/首通 Q01）'
          lore:
            - '§c需本人首通 Q01'
            - '§7选后立即重排 · 优先左侧（2→9）'
            - '§8解锁后再选路径'
      - condition: 'check papi %corerpg_p1_bar_path% == 2'
        priority: 2
        display:
          material: gold nugget
          shiny: true
          name: '§a左栏 §8· §f已选'
          lore:
            - '§7选后立即重排 · 优先左侧（2→9）'
            - '§8%corerpg_p1_bar_path_tip%'
            - '§a当前路径焦点'
            - '§8再点可重选同路径'
        actions:
          all:
            - 'sound: UI_BUTTON_CLICK-1-1'
            - 'command: corerpg p1 barpath left'
            - 'menu: ember_p1_bar_path'
    display:
      material: gold nugget
      name: '§e左栏'
      lore:
        - '§7选后立即重排 · 优先左侧（2→9）'
        - '§8点选切换药栏路径'
        - '§e➥ §f设为左栏'
    actions:
      all:
        - 'sound: UI_BUTTON_CLICK-1-1'
        - 'command: corerpg p1 barpath left'
        - 'menu: ember_p1_bar_path'

  # 五键 · KEY5=3 · 选后立即重排 · 优先第 5 格再两侧
  '3':
    update: 20
    icons:
      - condition: 'check papi %corerpg_p1_bar_unlock% < 1'
        priority: 1
        display:
          material: gray dye
          name: '§7五键 §8（需首进/首通 Q01）'
          lore:
            - '§c需本人首通 Q01'
            - '§7选后立即重排 · 优先第 5 格再两侧'
            - '§8解锁后再选路径'
      - condition: 'check papi %corerpg_p1_bar_path% == 3'
        priority: 2
        display:
          material: ink sac
          shiny: true
          name: '§a五键 §8· §f已选'
          lore:
            - '§7选后立即重排 · 优先第 5 格再两侧'
            - '§8%corerpg_p1_bar_path_tip%'
            - '§a当前路径焦点'
            - '§8再点可重选同路径'
        actions:
          all:
            - 'sound: UI_BUTTON_CLICK-1-1'
            - 'command: corerpg p1 barpath key5'
            - 'menu: ember_p1_bar_path'
    display:
      material: ink sac
      name: '§7五键'
      lore:
        - '§7选后立即重排 · 优先第 5 格再两侧'
        - '§8点选切换药栏路径'
        - '§e➥ §f设为五键'
    actions:
      all:
        - 'sound: UI_BUTTON_CLICK-1-1'
        - 'command: corerpg p1 barpath key5'
        - 'menu: ember_p1_bar_path'

  # 清空 · NONE=0
  C:
    update: 20
    icons:
      - condition: 'check papi %corerpg_p1_bar_unlock% < 1'
        priority: 1
        display:
          material: gray dye
          name: '§7清空路径 §8（需首进/首通 Q01）'
          lore:
            - '§c需本人首通 Q01'
            - '§8解锁后再清 / 重选'
      - condition: 'check papi %corerpg_p1_bar_path% < 1'
        priority: 2
        display:
          material: gray dye
          name: '§7已清空 §8· §f未选'
          lore:
            - '§7当前无药栏路径焦点'
            - '§8先点 右栏 / 左栏 / 五键'
        actions:
          all:
            - 'sound: UI_BUTTON_CLICK-1-0.8'
            - 'command: corerpg p1 barpath clear'
            - 'menu: ember_p1_bar_path'
    display:
      material: barrier
      name: '§7清空路径'
      lore:
        - '§7当前：§e%corerpg_p1_bar_path_label%'
        - '§8清焦点 · 可重选（默认回右栏语义由插件）'
        - '§e➥ §f清空'
    actions:
      all:
        - 'sound: UI_BUTTON_CLICK-1-0.8'
        - 'command: corerpg p1 barpath clear'
        - 'menu: ember_p1_bar_path'

  # 技能组
  K:
    display:
      material: book
      name: '§6去技能组'
      lore:
        - '§7看按键 / 形状 / 身法方向'
        - '§8选好后可对照手感'
        - '§e➥ §f开技能组'
    actions:
      all:
        - 'sound: UI_BUTTON_CLICK-1-1'
        - 'menu: ember_skill_kit'

  # 冒险页
  A:
    display:
      material: compass
      name: '§e回冒险'
      lore:
        - '§7主线 / 挑战 / 深渊 / 短征'
        - '§8换一条内容再冲'
        - '§e➥ §f开冒险页'
    actions:
      all:
        - 'sound: UI_BUTTON_CLICK-1-1'
        - 'menu: ember_p1_adventure'

  # 熬药（BrewPath TIP-FY 选打邻页）
  F:
    display:
      material: brewing stand
      name: '§b熬药路径'
      lore:
        - '§7药栏旁路熬药'
        - '§8不改配方表'
        - '§e➥ §f开熬药路径'
    actions:
      all:
        - 'sound: UI_BUTTON_CLICK-1-1'
        - 'menu: ember_p1_brew_path'


  Z:
    display:
      material: arrow
      name: '§7关闭'
      lore:
        - '§8关掉本页'
    actions:
      all:
        - 'sound: UI_BUTTON_CLICK-1-0.8'
        - close
