# 日常副本子菜单 — EmberDaily
# EmberDaily 进本

Title: '§e日常 · 灰烬庭院'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 200

Layout:
  - '#########'
  - '#       #'
  - '# S P R #'
  - '#       #'
  - '####B####'

Events:
  Open:
    - 'sound: BLOCK_CHEST_OPEN-1-0'

Icons:
  '#':
    display:
      material: stained glass pane
      name: '§8 '

  B:
    display:
      material: arrow
      name: '§7返回主菜单'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-0'
        - 'menu: ember_hub'

  S:
    display:
      material: iron sword
      name: '§a开始挑战'
      lore:
        - ''
        - '§8灰烬庭院 · 回廊清潮后上中央垫'
        - ''
        - '§7进本即扣 §f1 §7次今日次数'
        - '§7失败不返还 · 请确认后再进'
        - ''
        - '§8流程：2 波小怪 → 蛮兵（首领）→ 通关箱'
        - '§8单人约 1 分钟一局 · 波间回血'
        - ''
        - '§e➥ §f点击进本'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'tell: §e[日] 正在进入 §6灰烬庭院§e …'
        - 'command: dp start EmberDaily'
        - close

  P:
    display:
      material: chest
      name: '§6奖励预览'
      lore:
        - ''
        - '§7战斗掉落（MM → NI）：'
        - '  §f碎片 / 骨尘 / Boss 核心×1'
