# 1.15.26 B-anvil-1 烬砧材料→部件 · 薄页（从 ember_forge「炼部件」进入）
# 玩家 lore 不教手打 /corerpg；底层 command 供 TrMenu 调用
Title: '§a烬砧 · 炼部件'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 800

Layout:
  - '#########'
  - '#   A   #'
  - '#   C   #'
  - '####I##Z#'

Icons:
  '#':
    display:
      material: stained glass pane
      name: '§8 '
  A:
    display:
      material: flint
      name: '§a余烬灰箍'
      lore:
        - '§7物防 +1 · 不进 P1 B/H'
        - '§e消耗：碎×12 + 铁锭×2'
        - '§8薄于守腕'
  C:
    display:
      material: anvil
      name: '§a确认炼制'
      lore:
        - '§7立即消耗材料炼成 1 件灰箍'
        - '§7不足则提示，不扣物'
        - '§c➥ §f确认炼制'
    actions:
      all:
        - 'close'
        - 'command: corerpg part craft ash_brace'
  I:
    display:
      material: book
      name: '§f说明'
      lore:
        - '§7在烬砧用材料炼成副手部件'
        - '§7点「确认炼制」即可'
        - '§8物防 +1 · 不进主线战力'
  Z:
    display:
      material: arrow
      name: '§7返回锻炉'
    actions:
      all:
        - 'menu: ember_forge'
