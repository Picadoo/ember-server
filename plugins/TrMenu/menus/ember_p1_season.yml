# 余烬 v1.1 · D116 赛季与排行 + D117 周目标（源表 §13.43–13.44）— 只做展示 / 外观货币，不加属性。
# 4 周一个赛季（周一 0 点 CST 换周），本周榜 + 赛季榜：深渊最高层、精选挑战通关、团本通关、R01/R02/R03 最快通关；
# 季末每榜前 3 名得赛季称号、各榜第 1 名再得 ❖ 名牌框、赛季内通关深渊第 5 层得「赛季深潜者」（D123，原第 8 层），结果归档。
# 周目标：精选挑战 1 · 深渊 3 层 · 团本 1 · 委托做满 3 天，每个 15 余烬徽、全完成再 +20（只能在外观商店用）。
# 全部文字来自 PAPI（参数源 ember-v1-runs.yml season: / weekly_goals:）。入口：主菜单「赛季 · 排行 · 周目标」左键、/ember_p1_season。

Title: '§d余烬 · 赛季 · 排行 · 周目标'

Bindings:
  Commands:
    - '(?i)ember_p1_season'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 400

Layout:
  - '#########'
  - '#S  G  L#'
  - '#1 2 345#'
  - '#gabcdef#'
  - '#H##B##P#'

Events:
  Open:
    - 'sound: BLOCK_CHEST_OPEN-1-0'

Icons:
  '#':
    display:
      material: gray stained glass pane
      name: '§8'

  S:
    update: 40
    display:
      material: nether star
      name: '§d%corerpg_p1_season%'
      lore:
        - ''
        - '§74 周一个赛季 · 每周一 0 点（北京时间）换周'
        - '§7季末：每榜前 3 名得赛季称号，各榜第 1 名再得 §d❖ §7名牌框'
        - '§7赛季内通关深渊第 5 层：称号「§5赛季深潜者§7」'
        - '§8只做展示，不加属性 · 测试号不上榜'
        - ''
        - '§e➥ §f左键：本周榜（聊天栏，含你的名次）'
        - '§e➥ §f右键：赛季榜'
    actions:
      left:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - close
        - 'command: corerpg p1 season week'
      right:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - close
        - 'command: corerpg p1 season season'

