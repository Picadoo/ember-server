# 强化子菜单 — docs/design/DESIGN-ember-enhance-socket.md §7
# 手持余烬装备后进行强化
# D307 W1d：旧轨旁注 — P1 请走主菜单工坊（不重做旧强化经济）

Title: '§c余烬 · 强化'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 200

Layout:
  - '#########'
  - '#       #'
  - '# I E R #'
  - '#       #'
  - '####B####'

Events:
  Open:
    - 'sound: BLOCK_ANVIL_LAND-1-0.6'
    - 'tell: §7请手持 §c余烬之刃 §7或 §e余烬护符 §7后再操作。'
    - 'tell: §8P1 装备请走主菜单「工坊」（ember_p1_forge）；本页仅旧物品强化。'

Icons:
  '#':
    display:
      material: stained glass pane
      name: '§8 '

  B:
    display:
      material: arrow
      name: '§7返回主菜单'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-0'
        - 'menu: ember_hub'

  I:
    display:
      material: paper
      name: '§e强化预览'
      lore:
        - '§7查看 +N、下一档成功率与材料'
        - '§8不扣物品'
        - '§e➥ §f点击预览'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §e【强化】 §7请确认手持余烬装备…'
        - 'command: corerpg enhance info'

  E:
    display:
      material: anvil
      name: '§c尝试强化 +1'
      lore:
        - '§7耗碎/骨/核 · +0～+10 · 失败或掉级'
        - '§8高危档可自动吃保护券'
        - '§c➥ §f点击强化'
    actions:
      all:
        - 'sound: BLOCK_ANVIL_USE-1-1'
        - 'tell: §c【强化】 §7正在尝试强化手持装备…'
        - 'command: corerpg enhance'
        - close

  R:
    display:
      material: book
      name: '§6规则速览'
      lore:
        - '§7+1～3稳 · +4～6掉1 · +7～9保护券 · +10稳固符'
        - '§8P1 请走主菜单工坊（本页旧物）'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §6【强化规则】 §7+1～3 稳 · +4～6 掉级 · +7～9 保护券 · +10 稳固符'
