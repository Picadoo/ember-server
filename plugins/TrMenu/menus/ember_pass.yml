# 余烬战令 — 每日免费补给 + 赛季 Lv1～30 等级奖励（CoreRpg 1.6.0 progress.yml pass_rewards，邮件发货）
# docs/design/DESIGN-ember-economy-monetization.md §5.3

Title: '§b余烬 · 战令'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 400

Layout:
  - '#########'
  - '#       #'
  - '# F U I #'
  - '# C L   #'
  - '####B####'

Events:
  Open:
    - 'sound: BLOCK_NOTE_PLING-1-1'
    - 'tell: §b【战令】 §7每日补给 + 等级奖励（Lv1～30）· 付费轨需解锁 · §c不出核心'

Icons:
  '#':
    display:
      material: stained glass pane
      name: '§8 '

  F:
    display:
      material: paper
      name: '§a免费轨 · 领取补给'
      lore:
        - ''
        - '§7余烬币 80 + 碎片 ×2'
        - '§8经系统邮件发放 · §e每日 1 次'
        - '§8赛季经验：签到 10 · 日常通关 20 · 周本 40 · 深渊 20 · 团本 40 · 盟Boss 20 · 精英周 15（日上限 120）'
        - ''
        - '§e➥ §f发送并尝试一键领取'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        # 2026-09-26 audit: was console mail send on every click (unlimited coin/shards) → CoreRpg 1.4.10 daily-limited
        - 'command: corerpg pass free'
        - 'command: corerpg mail claim all'
        - 'tell: §8若未自动入账，打开枢纽 → 邮寄 领取'

  U:
    display:
      material: gold ingot
      name: '§6解锁付费轨'
      lore:
        - ''
        - '§7外观、币、体力药 ×5（6/12/18/24/30 级）'
