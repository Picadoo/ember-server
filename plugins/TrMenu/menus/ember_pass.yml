      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'command: corerpg pass claim'
        - 'command: corerpg mail claim all'
        - 'command: corerpg pass rewards'

  C:
    display:
      material: chest
      name: '§e打开邮寄'
      lore:
        - ''
        - '§7查看 / 领取战令邮件附件'
