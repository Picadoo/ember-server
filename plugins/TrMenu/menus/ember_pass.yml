        - '§e➥ §f查看说明（不会发奖）'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'tell: §8【战令·等级】 §7P1 下暂不发放 · 请用签到 / 周目标 / 外观'
