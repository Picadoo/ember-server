        - '§e➥ §f查看晶钻并领欢迎礼'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'tell: §6【战令·付费轨】 §7尝试解锁 · 价 §f48 §7晶钻'
        - 'command: corerpg shop buy pass_unlock'
        - 'command: corerpg cash'
        - 'command: corerpg mail claim all'

  I:
    display:
      material: book
      name: '§e赛季规则'
      lore:
        - ''
        - '§7约 30 天一季'
        - '§7双轨并行 · 等级共享经验'
