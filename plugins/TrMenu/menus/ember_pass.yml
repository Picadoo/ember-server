# 余烬战令 — 旧免费补给 / 等级奖励在 P1 下挡发（D281）
# D284：菜单诚实；付费轨解锁入口仍可点，但不暗示 P1 可领旧币礼

Title: '§b余烬 · 战令'

Options:
  Arguments: false
  Default-Layout: 0
  Hide-Player-Inventory: false
  Min-Click-Delay: 400

Layout:
  - '#########'
  - '#       #'
  - '# F U I #'
  - '# C L   #'
  - '####B####'

Events:
  Open:
    - 'sound: BLOCK_NOTE_PLING-1-1'
    - 'tell: §b【战令】 §7P1 下暂不发放旧战令币礼 · 请用签到 / 周目标 / 外观'

Icons:
  '#':
    display:
      material: stained glass pane
      name: '§8 '

  F:
    display:
      material: paper
      name: '§8免费轨补给 · P1 暂停'
      lore:
        - ''
        - '§cP1 下暂不发放旧战令免费轨币/碎片'
        - '§7请用：签到 / 周目标 / 外观（余烬徽）'
        - '§8点这里只会收到灰字说明，不会到账'
        - ''
        - '§e➥ §f查看说明（不会发奖）'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §8【战令·免费轨】 §7P1 下暂不发放 · 请用签到 / 周目标 / 外观'
        - 'command: corerpg pass free'

  U:
    display:
      material: gold ingot
      name: '§6解锁付费轨'
      lore:
        - ''
        - '§7晶钻解锁本季付费轨标记（外观向）'
        - '§cP1 下旧等级币礼 / 补给仍不发'
        - '§8不卖毕业伤害 · 不出核心'
        - ''
        - '§6价 §f48 §6晶钻'
        - ''
        - '§e➥ §f尝试解锁（币礼仍挡）'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-2'
        - 'tell: §6【战令·付费轨】 §7解锁不恢复 P1 下的旧币礼 · 价 §f48 §7晶钻'
        - 'command: corerpg shop buy pass_unlock'
        - 'command: corerpg cash'

  I:
    display:
      material: book
      name: '§e赛季说明 · P1'
      lore:
        - ''
        - '§c旧战令经验 / 领取在 P1 下已停用'
        - '§7日常目标请用主菜单：签到 · 周目标 · 赛季外观'
        - '§8与月卡登录礼无关（月卡照常发）'
        - ''
        - '§e➥ §f查看说明'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §e【战令】 §7P1 下旧轨停用 · 请用签到 / 周目标 / 外观'
        - 'command: corerpg pass'

  L:
    display:
      material: chest
      name: '§8等级奖励 · P1 暂停'
      lore:
        - ''
        - '§cP1 下暂不发放旧战令等级币礼'
        - '§7请用：签到 / 周目标 / 外观'
        - '§8点这里只会收到灰字说明'
