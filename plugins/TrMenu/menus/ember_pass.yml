        - '§8红线：不卖毕业伤害'
        - ''
        - '§e➥ §f查看我的赛季等级'
    actions:
      all:
        - 'sound: BLOCK_NOTE_PLING-1-1'
        - 'tell: §e【战令】 §7约30天季 · 双轨 · 付费轨外观+券+体力药，无核心'
        - 'command: corerpg pass'

  L:
    display:
      material: chest
      name: '§6等级奖励 · 一键领取'
      lore:
        - ''
        - '§7赛季 Lv1～30：币 / 碎片 / 附魔晶 / 体力药'
