# CoreRpg — 余烬服 RPG：进度 HUD / 刷怪 / 余烬币 / 签到 / 活跃 / 悬赏
# 余烬币 = 软通货 D（DESIGN-ember-economy-monetization.md）

join_message:
  - "§6§l[余烬服] §e跟着主线走：引路人·灰烛 就在出生点北边（/corerpg quest 查看目标）。"
  - "§7挂机庭打僵尸拿碎片 · 骷髅拿骨尘 · 日本蛮兵拿核心碎片 · 死亡不掉落 · /hub 回城"
  - "§7指令：§f/ember §7主菜单 · §f/corerpg enhance §7强化 · §f/corerpg socket §7镶嵌 · §f/corerpg sign §7签到"
  - "§7进本门槛：周本 Lv.20 · 深渊 Lv.25 · 灾厄 Lv.30 · 团本 Lv.35（/ember 进入）"

scoreboard:
  title: "§6余烬进度"
  enabled: true

spawn:
  mob: EmberCryptZombie
  amount: 1
  command_template: "mm m spawn {mob} {amount} {world},{x},{y},{z}"

shard_name_contains: "余烬碎片"
dust_name_contains: "余烬骨尘"
crystal_name_contains: "余烬附魔晶"

coin:
  name: "余烬币"
  starting: 0
  kill_reward: 1

sign:
  reward: 100
  activity_points: 10

activity:
  kill_points: 1
  kill_cap: 15
  online_interval_minutes: 4
  online_points: 5
  online_cap: 15
  bounty_complete_points: 15
  chests:
    25: 50
    50: 100
    75: 150
    100: 250

bounties:
  - id: clear_undead
    name: "清剿亡灵"
    killTarget: 30
    rewardCoin: 80
  - id: ember_hunt
    name: "余烬猎杀"
    killTarget: 50
    rewardCoin: 120
  - id: crypt_sweep
    name: "地窟扫荡"
    killTarget: 20
    rewardCoin: 60

calamity:
  enabled: true
  times:
    - "12:00"
    - "20:00"
    - "22:00"
  # MM 4.11: mm m spawn <mob> <amount> <w,x,y,z>
  spawn_command: "mm m spawn EmberCalamityBoss 1 {world},{x},{y},{z}"
  location:
    world: ember_event
    x: -96.5
    y: 64.0
    z: 266.5
  warning_seconds: 10
  warning_message: "&c[余烬] &4灾厄将至——灰烬正在苏醒…"
  spawn_message: "&4[余烬] &c余烬灾厄使降临于 {world} ({x}, {y}, {z})！"
  # 击杀额外 NI（MM onDeath 另发孔石/核心；此处只补物品岗灾厄奖）
  kill_rewards:
    - "ni give {player} mat_calamity_ember 1"
    - "ni give {player} cosmetic_calamity_shard 1"
    # 助攻份额（2026-09-26）：kill_rewards 发给击杀者 + 本窗所有有伤害者；MM onDeath 只给尾刀者
    # （凝核 core_ember_compact×1 + 核心碎片×2）。这里只补核心碎片×1（< 尾刀的 2），
    # 不补凝核：固定数量最少 1，会与尾刀持平。
    - "ni give {player} mat_ember_core_fragment 1"

# Persistence 1.4.0+ — keep yaml unless ops explicitly switch (see config-mysql.example.yml)
storage: mysql
mysql:
  host: 127.0.0.1
  port: 3306
  database: ember
  username: ember
  password: "CHANGE_ME"
  pool-size: 10
  jdbc-params: "useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=UTC"


debug:
  mm_credit: false   # true = log every MM reward credit decision (corerpg mmgive/mmxp)

# 2026-09-27 gear stat layer (AttributePlus parked → CoreRpg applies NI lore stats).
# player→mob melee: + phys_damage × damage_scale (scaled by attack charge)
# max HP = 20 + floor(max_health × health_scale); mob→player dmg × (1 − def/(def+defense_k))
stats:
  enabled: true
  damage_scale: 1.0
  health_scale: 1.0
  defense_k: 20
  crit_multiplier: 1.5
  hearts_display_cap: 40
  # vanilla wither-skeleton melee adds 10 s Wither I (ignores defense) → stripped next tick for players
  strip_wither_on_hit: true
  # covenant pseudo-stats (crit / life steal / damage taken); coded in 1.10.0, parked until the phase-2 rebalance
  apply_covenant_stats: false

# 1.11.0 (2026-09-27): 野外（挂机）掉落每日上限 + 递减 — 超过上限后每份只有 over_chance 概率掉落；副本/灾厄不受限
afk_caps:
  enabled: true
  worlds: [ember_afk, world]
  over_chance: 0.25
  kill_coin: 150          # 野外击杀余烬币每日 150 后按 25%
  items:
    mat_ember_shard: 150
    mat_ember_bone_dust: 80
    mat_ember_core_fragment: 10
    mat_ember_stable_charm: 1
    mat_ember_protect_scroll: 2
    mat_ember_soul_dust: 2    # 1.12.0 挂机怪 2% 魂尘，日顶 2
