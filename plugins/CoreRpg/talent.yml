# 2026-09-27 stage4.2: layer2 + max_spendable 30 — docs/design/design-stage4-talent-layer2.md
# 2026-09-27: costs raised so each tree totals 20 (was 8/7/7, maxed at Lv10) — docs/reviews/critic-fixes-20260927.md
# CoreRpg talent — 余烬天赋树（docs/design/DESIGN-ember-covenant-talent.md §6.2）
# 维护备忘：扩树与 unlock/reset 尚待实现；本文件为契约形状
enabled: true

# Seed for new players / earned==0 (plugin computes on load) — Formula A stage4.2:
# L<=30: earned = min(20, starting + max(0,(L-level_points_from+1)*points_per_level))  # Lv30=20
# L>30:  earned = min(30, 20 + floor((L-30)/points_per_levels))
ember_level: 10
starting_talent_points: 5
points_per_level: 1
level_points_from: 16   # 2026-09-27 (critic): Lv10 = 5 pts, +1/level from Lv16, 20 (= one full tree) at Lv30
max_spendable_points: 30
points_per_achievement_chunk: 1
achievement_chunk_size: 50

layer2:
  enabled: true
  from_level: 31
  points_per_levels: 3   # 每 3 级 +1
  base_at_30: 20

reset:
  free_per_day: 1
  extra_crystal_cash: 25
  ticket_ni_id: mat_ember_talent_reset

trees:
  blaze:
    nodes:
      blaze_root:
        display: "§6燃锋"
        type: passive
        cost: 2
        requires: []
        stats: { phys_damage: 1 }
      blaze_crit1:
        display: "§c燃眼"
        type: passive
        cost: 3
        requires: [blaze_root]
        stats: { crit_chance_pct: 0.01 }
      blaze_leech1:
        display: "§4饮烬"
        type: passive
        cost: 3
        requires: [blaze_root]
        stats: { life_steal_pct: 0.005 }
      blaze_crit2:
        display: "§c灼心"
        type: passive
        cost: 3
        requires: [blaze_crit1]
        stats: { crit_damage_pct: 0.05 }
      blaze_slash:
        display: "§6烬斩"
        type: skill
        cost: 4
        requires: [blaze_crit1, blaze_leech1]
        skill_id: ember_blaze_slash
      blaze_cap:
        display: "§6燎原"
        type: passive
        cost: 5
        requires: [blaze_slash, blaze_crit2]
        stats: { phys_damage: 2, crit_chance_pct: 0.01 }

      blaze_ember2:
        display: "§6余烬脉"
        type: passive
        cost: 3
        requires: [blaze_cap]
        stats: { phys_damage: 1 }
      blaze_heat2:
        display: "§c炽脉"
        type: passive
        cost: 3
        requires: [blaze_ember2]
        stats: { crit_damage_pct: 0.03 }
      blaze_second:
        display: "§6再燃"
        type: passive
        cost: 4
        requires: [blaze_ember2]
        stats: { crit_chance_pct: 0.005, phys_damage: 1 }
  ash:
    nodes:
      ash_root:
        display: "§7灰踪"
        type: passive
        cost: 2
        requires: []
        stats: { attack_speed_pct: 0.02 }
      ash_haste1:
        display: "§e疾灰"
        type: passive
        cost: 3
        requires: [ash_root]
        stats: { attack_speed_pct: 0.02 }
      ash_slow1:
        display: "§8滞步"
        type: passive
        cost: 4
        requires: [ash_root]
        stats: { on_hit_slow_pct: 0.05 }
      ash_fam:
        display: "§7微尘使魔"
        type: skill
        cost: 5
        requires: [ash_haste1]
        skill_id: ember_ash_familiar
      ash_cap:
        display: "§7烟幕"
        type: passive
        cost: 6
        requires: [ash_fam, ash_slow1]
        stats: { move_speed_pct: 0.02, attack_speed_pct: 0.02 }

      ash_veil2:
        display: "§7灰纱"
        type: passive
        cost: 3
        requires: [ash_cap]
        stats: { move_speed_pct: 0.01 }
      ash_dust2:
        display: "§e细尘"
        type: passive
        cost: 3
        requires: [ash_veil2]
        stats: { attack_speed_pct: 0.01 }
      ash_shroud:
        display: "§8掩息"
        type: passive
        cost: 4
        requires: [ash_veil2]
        stats: { on_hit_slow_pct: 0.03, attack_speed_pct: 0.01 }
  warden:
    nodes:
      warden_root:
        display: "§9守碑"
        type: passive
        cost: 2
        requires: []
        stats: { phys_defense: 1 }
      warden_guard1:
        display: "§9石肤"
        type: passive
        cost: 3
        requires: [warden_root]
        stats: { damage_taken_pct: -0.02 }
      warden_taunt:
        display: "§1墓鸣"
        type: skill
        cost: 5
        requires: [warden_root]
        skill_id: ember_warden_taunt
      warden_charm1:
        display: "§e护符共鸣"
        type: passive
        cost: 3
        requires: [warden_root]
        stats: { charm_stat_bonus_pct: 0.03 }
      warden_cap:
        display: "§9永护"
        type: passive
        cost: 7
        requires: [warden_taunt, warden_guard1, warden_charm1]
        stats: { damage_taken_pct: -0.02, max_health: 4 }

      warden_bulwark2:
        display: "§9叠壁"
        type: passive
        cost: 3
        requires: [warden_cap]
        stats: { damage_taken_pct: -0.01 }
      warden_aegis2:
        display: "§9护冢"
        type: passive
        cost: 3
        requires: [warden_bulwark2]
        stats: { max_health: 2 }
      warden_vow2:
        display: "§1誓碑"
        type: passive
        cost: 4
        requires: [warden_bulwark2]
        stats: { phys_defense: 1, damage_taken_pct: -0.01 }
