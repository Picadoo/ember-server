# CoreRpg cash — 晶钻 / 日票限购 / 月卡（DESIGN-ember-cash-monthly.md）
# 维护备忘：配置可先落盘；落地后纳入 CoreRpg reload
# 红线：不直售碎片/晶/核心；日票硬顶是总进本 6（免费+氪+月卡）
enabled: true

timezone: Asia/Shanghai

# S0 余烬体力（design-ember-stamina-dnf-daily §A）— 停发票；进本扣体力
stamina:
  base_max: 90
  monthly_bonus: 30
  bank_cap: 30
  potion_daily_cap: 90
  potion_grant_amount: 30
  migration_t0: "2026-09-28"
  migration_days: 7
  costs:
    daily: 30
    daily_ash: 30
    daily_crypt: 30
    daily_tide: 30
    daily_spire: 30
    daily_frost: 30
    daily_rail: 30
    weekly: 45
    elite: 40
    abyss: 30
    raid: 50
    calamity: 0
  ticket_convert:
    ticket_ember_daily: 30
    ticket_ember_weekly: 45
    ticket_ember_abyss: 30
    ticket_ember_raid: 50
    ticket_ember_elite: 40


currency:
  id: ember_crystal_cash
  display: "余烬晶钻"
  player_yml_key: ember_crystal_cash
  # 现有 PlayerDataStore 已写 crystalCash；读时兼容，写契约键
  legacy_yml_key: crystalCash

# 日本：免费张数 + 总硬顶（进本/发票共用）
daily:
  free_tickets: 0  # S0: 停发日票，改体力日回满
  hard_cap: 6
  ticket_ni_id: ticket_ember_daily

shop:
  daily_ticket:
    id: daily_ticket
    price: 60
    sku_limit: 3          # 晶钻购买次数/日；仍受 daily.hard_cap 约束
    grant_ni: false  # S0: 发体力药/直加体力
  pass_unlock:
    id: pass_unlock
    price: 48
    # 季内限购 1；插件落地后读 seasonPassPaid
    season_limit: 1
    mail_template: pass_track_paid_welcome
  weekly_ticket:
    id: weekly_ticket
    price: 180
    sku_limit: 1          # 晶钻购买次数/周；仍受 hard_cap 约束
    hard_cap: 2          # 免费1+氪≤2
    grant_ni: true
    ticket_ni_id: ticket_ember_weekly


monthly:
  enabled: true
  duration_days: 30
  price: 68
  limit: 1                # 同时仅一张有效；续费从 expire 起顺延
  immediate_daily_ticket: 1  # S0: 开通立即 +30 体力
  daily_login:
    coin: 200
    daily_ticket: 1       # S0: 每点折算体力+30（非 NI 票）

weekly:
  free_tickets: 0
  ticket_ni_id: ticket_ember_weekly
raid:
  free_tickets: 0          # 2026-09-27: weekly login grant (menu promises 每周团本票×1)
  ticket_ni_id: ticket_ember_raid
abyss:
  free_tickets: 0
  ticket_ni_id: ticket_ember_abyss

# Stage 4.4 精英试炼周票 — 周一 0:00 Asia/Shanghai 与周本同节奏；不进商城日票池；持有硬顶 1
elite:
  free_tickets: 0
  ticket_ni_id: ticket_ember_elite
  hard_cap: 1

# 维护备忘：勋阶轻量档（当前无 LuckPerms）
vip:
  enabled: true
  daily_claim_coin: 120        # 勋阶 ≥1
  # 2026-09-26：勋阶 0（未开通）只给象征性日礼；设计未给层级数值，保守取 20
  tier0_daily_claim_coin: 20
  # 维护备忘：tiers — PlayerData.vipTier 默认 0
  tiers:
    0: { name: "无" }
    1: { name: "勋阶I" }
