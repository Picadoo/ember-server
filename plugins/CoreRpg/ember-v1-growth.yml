# ember-v1.0-P1 D141–D143 横向成长（P2 草案 §5za）：天赋专精 / 余烬勋记 / 词条洗练。三样的全部参数都在这个文件。
# 两份要一致：plugins/CoreRpg/ 和 CoreRpg/src/main/resources/。改完重启（或 /corerpg p1 growth reload）。
#
# 硬约束（用户 10-03 15:42）：三样全开到顶，Q01–Q07（普通 = 书参考装、挑战 = T3+6）和团本的通关率变化不超过约 3 个点，
# Q07 首通中位和两件极品最快路线变化不超过约 0.5 周。模型 tools/p1sim/growth.py（p1sim / p1party / p2econ 共用这份 yml）。
# 主线图对数值极敏感（+2% 攻击 = Q04 普通 0.5 档 +9 点，回复药 20%→22% = Q06 +8 点），所以：
#   天赋 = 有得有失的取舍（得在一种情况，失在另一种），按模型调到参考装上几乎抵消；
#   勋记 = 以经济 / 便利为主，战斗类很小；
#   词条 = 小的纯加成，上限跟成色走（标准件只能到 1 档），参考装都是标准件。
#
# 修饰键（Java EmberGrowth.Mods 和 growth.py 用同一套）：乘数默认 1，加数默认 0。
#   dmg_boss / dmg_mob / dmg_affix   对首领 / 普通怪 / 词缀精英（含分身）造成的伤害 ×
#   dmg_split                        对词缀精英裂出来的分身再 ×
#   dodge_dmg + dodge_secs           躲开首领预警招后 dodge_secs 秒内造成的伤害 ×
#   dodge_heal + dodge_icd           躲开首领预警招回最大生命的比例（冷却 dodge_icd 秒）
#   taken_tele / taken_boss / taken_mob / taken_affix / taken_all   受到首领预警招 / 首领普攻 / 怪物（非首领）/ 词缀精英 / 全部 伤害 ×
#   potion                           回复药回复比例 ×（20% × potion）
#   burn_ticks / burn_mult           焚烬点燃多几跳 / 每跳系数 ×（只在焚烬成套时）
#   burn_spread / spread_icd         燃烧中的敌人倒下时把最多几秒的燃烧传给 4 格内最近的敌人 / 每几秒最多传一次
#   dodge_burst / hit_burst          躲开 / 被打中首领预警招时烬爆计数 +n（内置冷却照旧）
#   burst_every / burst_mult         烬爆每几次普攻（加减）/ 系数 ×（只在烬爆成套时）
#   sustain_every / sustain_mult / sustain_hp   炽愈回复间隔（加减）/ 回复 × / 生命加成（1.12 的 0.12 部分）×
#   share_w / share_taken            烬核分摊时自己算几份 / 自己那份 ×
#   set_dmg                          焚烬 / 烬爆 套装事件伤害 ×
#   max_hp                           最大生命 ×
#   abyss_taken / abyss_fee          深渊里受到伤害 × / 深渊层费 ×
#   coin / shard_bonus               结算余烬币 × / 每次通关结算多给碎片
#   reroll_coin                      洗练的币 ×
version: 1

# ---------------------------------------------------------------- D141 天赋专精
talents:
  # 第一次重置免费，之后每次（币）
  respec_coin: 2000
  # 专精点：一次性，按进度给（合计 6）
  points:
    - {id: q03, kind: first_clear, arg: q03, name: "首通 Q03"}
    - {id: q05, kind: first_clear, arg: q05, name: "首通 Q05"}
    - {id: q07, kind: first_clear, arg: q07, name: "首通 Q07"}
    - {id: chal, kind: challenge_any, arg: "", name: "首通任一挑战版"}
    - {id: raid, kind: raid_any, arg: "", name: "首通任一团本"}
    - {id: abyss5, kind: abyss_floor, arg: "5", name: "深渊·余烬层到第 5 层"}
  # 每排只能点一个；点数 = 占用的专精点（重置时退回），币 = 第一次学会这个天赋时付一次（重置不退，以后再点不收）
  rows:
    - {row: 1, name: "应变", points: 1, coin: 800, theme: "首领预警招（D140）"}
    - {row: 2, name: "猎手", points: 2, coin: 2000, theme: "词缀精英与房间（D138）"}
    - {row: 3, name: "套装专精", points: 3, coin: 4000, theme: "只在对应套装成套时生效"}
  nodes:
    # 第 1 排「应变」：首领预警招（D140）。得失都只在首领战里。
    - id: t1a
      row: 1
      name: "回身斩"
      family: burst
      mods: {dodge_dmg: 1.05, dodge_secs: 3, taken_tele: 1.05}
      good: "躲开首领预警招后 3 秒内伤害 +5%"
      bad: "被首领预警招打中多受 5%"
    - id: t1b
      row: 1
      name: "稳桩"
      family: sustain
      mods: {taken_tele: 0.95, dmg_boss: 0.98}
      good: "受到首领预警招伤害 -5%"
      bad: "对首领伤害 -2%"
    - id: t1c
      row: 1
      name: "踏步回气"
      family: scorch
      mods: {dodge_heal: 0.01, dodge_icd: 12, taken_tele: 1.05}
      good: "躲开首领预警招回 1% 最大生命（12 秒一次）"
      bad: "被首领预警招打中多受 5%"
    # 第 2 排「猎手」：重复刷图的词缀精英（D138）。得失都只落在词缀精英（含分身）身上，首通局和首领战不受影响。
    - id: t2a
      row: 2
      name: "破缀"
      family: burst
      mods: {dmg_affix: 1.30, taken_affix: 1.20}
      good: "对词缀精英（含分身）伤害 +30%"
      bad: "受到词缀精英（含分身、炽热火圈）伤害 +20%"
    - id: t2b
      row: 2
      name: "守缀"
      family: sustain
      mods: {taken_affix: 0.75, dmg_affix: 0.85}
      good: "受到词缀精英（含分身、炽热火圈）伤害 -25%"
      bad: "对词缀精英（含分身）伤害 -15%"
    - id: t2c
      row: 2
      name: "拆分"
      family: scorch
      mods: {dmg_split: 1.50, dmg_affix: 0.80}
      good: "对分裂精英裂出来的分身伤害 +50%（门更快开）"
      bad: "对词缀精英本体伤害 -20%"
    # 第 3 排「套装专精」：只在穿对应套装成套时生效（换套自动失效，不用重置）。
    - id: t3a
      row: 3
      name: "燎原"
      family: scorch
      set: scorch
      mods: {burn_spread: 2, spread_icd: 10, burn_mult: 0.93}
      good: "燃烧中的敌人倒下时，把最多 2 秒燃烧传给 4 格内最近的敌人（10 秒一次）"
      bad: "焚烬燃烧每跳伤害 ×0.93"
    - id: t3b
      row: 3
      name: "反震"
      family: burst
      set: burst
      mods: {hit_burst: 2, taken_tele: 1.03}
      good: "被首领预警招打中时烬爆计数 +2（硬吃一招换一次更早的烬爆，和「稳桩」搭）"
      bad: "被首领预警招打中多受 3%"
    - id: t3c
      row: 3
      name: "扛核"
      family: sustain
      set: sustain
      mods: {share_w: 2, share_taken: 0.80, sustain_mult: 0.98}
      good: "烬核分摊时你算 2 份（队友少扛），你那份再 -20%"
      bad: "你自己扛的烬核变多（2 份 ×0.8 = 1.6 份）；炽愈回复量 ×0.98"

# ---------------------------------------------------------------- D142 余烬勋记
# 账号永久、自动解锁；条件全是已有的一次性成就。效果以经济 / 便利为主，战斗类只有「深渊里受伤」（只在深渊）。
# 主线图和团本里没有任何战斗加成。caps = 全部勋记合起来的硬上限（>1 是上限，<1 是下限；加数是上限）。
honors:
  caps: {coin: 1.04, shard_bonus: 1, abyss_fee: 0.95, abyss_taken: 0.98, reroll_coin: 0.85}
  list:
    - {id: h_abyss5, name: "深渊行者", kind: abyss_floor, arg: "5", desc: "深渊层费 -5%", mods: {abyss_fee: 0.95}}
    - {id: h_abyss10, name: "深渊老手", kind: abyss_floor, arg: "10", desc: "深渊里受到伤害 -2%（只在深渊）", mods: {abyss_taken: 0.98}}
    - {id: h_chal3, name: "挑战新秀", kind: challenge_count, arg: "3", desc: "结算余烬币 +2%", mods: {coin: 1.02}}
    - {id: h_chal7, name: "挑战全通", kind: challenge_count, arg: "7", desc: "每次通关结算 +1 余烬碎片", mods: {shard_bonus: 1}}
    - {id: h_raid1, name: "团本首胜", kind: raid_count, arg: "1", desc: "洗练的币 -10%", mods: {reroll_coin: 0.90}}
    - {id: h_raid3, name: "三团全胜", kind: raid_count, arg: "3", desc: "结算余烬币 +2%", mods: {coin: 1.02}}
    - {id: h_codex, name: "图录全满", kind: codex_full, arg: "", desc: "洗练的币 -5%（图录不给战斗属性）", mods: {reroll_coin: 0.95}}

# ---------------------------------------------------------------- D143 词条洗练
# 每件 T1+ 刃 / 护符一个词条槽（初始空）。一次洗练 = 同部位同阶的一件重复件（掉落来的、没投入、没穿着）或碎片，加币。
# 档位按 tier_weights 抽，截在成色上限 tier_cap[成色]（标准 1 / 精良 2 / 卓越 3 / 极品 4）再归一；
# 连续 pity 次没出到上限档，下一次必出上限档。洗完二选一：保留新 / 保留旧（不选 = 旧的）。
# 数值 = 1 / 2 / 3 / 4 档。参考装都是标准件，只能到 1 档。词条几乎都只落在词缀精英 / 分身 / 烬核上（D138 / D137），
# 通用的两条（余烬、稳桩）每档只有 0.5%；回复药类词条试过（+1% = Q06 约 +1 点）删掉了，code 5 空着不要复用。
reroll:
  pity: 5
  tier_weights: [50, 30, 15, 5]
  tier_cap: [1, 2, 3, 4]
  # 按物品阶 T0..T3
  coin: [0, 300, 600, 1000]
  shard: [0, 40, 80, 120]
  # code = 存档里的编号（玩家数据 p4_af_<物品 uid> = code × 10 + 档），上线后不要改
  affixes:
    blade:
      - {id: b_affix, code: 1, name: "破缀", key: dmg_affix, desc: "对词缀精英伤害", values: [1.04, 1.08, 1.12, 1.16]}
      - {id: b_set, code: 2, name: "余烬", key: set_dmg, desc: "套装事件（燃烧 / 烬爆）伤害", values: [1.005, 1.01, 1.015, 1.02]}
      - {id: b_split, code: 3, name: "拆分", key: dmg_split, desc: "对分身伤害", values: [1.05, 1.10, 1.15, 1.20]}
    charm:
      - {id: c_tele, code: 4, name: "稳桩", key: taken_tele, desc: "受到首领预警招伤害", values: [0.995, 0.99, 0.985, 0.98]}
      - {id: c_share, code: 6, name: "分核", key: share_taken, desc: "烬核自己那份", values: [0.97, 0.94, 0.91, 0.88]}
      - {id: c_affix, code: 7, name: "抗缀", key: taken_affix, desc: "受到词缀精英伤害", values: [0.96, 0.92, 0.88, 0.84]}
