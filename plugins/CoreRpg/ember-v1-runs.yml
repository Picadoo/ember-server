# ember-v1.0-P1 G04 — main maps Q01–Q03 (batch 1) and Q04–Q05 (batch 2) (book ch. 11–13, §9, §20.5, §23.2).
# CoreRpg runs the encounters (rooms, doors, A/B variants, boss skills, extra event) and the single settlement;
# DungeonPlus only creates the instance (EmberQ01..03 reuse the ember_daily* map templates), teleports, and ends it.
# Coordinates are the REAL template coordinates of ember_daily / ember_daily_ash / ember_daily_crypt (not the book's
# R0..RB layout, which those maps do not have) — see docs/design/DESIGN-ember-v1.0-P1-source-table.md §10 for the mapping.
# Check every point after editing:  DP_MAP_ROOT=<maps> python3 scripts/check-dp-spawns.py plugins/DungeonPlus/dungeon/EmberQ0*
# Runtime-only file edits need a restart (no reload path for runs on purpose: a live run keeps its snapshot).

version: 1
rule_version: g04-1
# §23.2 parameter changes bump balance_version (1 = book initial values incl. D31; 2 = §2c plan B, D60; 3 = P2-1 rotation, D66; 4 = P2-2 abyss table, D70; 5 = P2-5 raid r01, D75; 6 = P2-6 raid r02 + shared raid cap, D77–D78; 7 = P2-7 daily bounty in ember-v1.yml, D79; 8 = P2-8 rotation modifiers, D80; 9 = P2-9 map loot identity + targeted raid_item, D81–D82; 10 = Q01 onboarding ease, D86; 11 = weekly rule on repeat normal runs, D94; 12 = Q01 first-clear choice is the T1 charm, Q02 the T1 blade, D98; 13 = challenge ease + abyss rescale + T3 upgrade cost, D104; 14 = featured mark on repeat normal runs, D108; 15 = abyss re-curve (tier 1 = challenge) + Q02 targeted exchange, E-review D109–D110; 16 = seasons + weekly goals + raid last-phase revive, D116–D118; 17 = abyss fee paid by surplus T3 marks + season deep tier 5 + abyss board tie by clear time, D123–D124; 18 = first failed challenge / abyss run of the day refunds half its stamina, D128; 19 = bounty weekly goal prorated in the graduation week, D134; 20 = raid r03 on the Q05 map with the 烬核 share mechanic, D137; 21 = repeat-run variety (affixed elite + optional room event), D138; 22 = 国庆 2026 limited event dungeon gq26 + festival charm slot (ember-v1-festival.yml), D139; 23 = one new telegraphed move per Q01–Q07 boss + main-move timing re-tuned (clear rates ±2), D140; 24 = talent specialization in ember-v1-growth.yml (trade-off talents, sidegrades at the reference gear), D141; 25 = 余烬连战 boss rush + 花样委托 daily + optional 烬核同心 goal (D144), reroll lock-affix + 国庆币 leftover exchange + festival combo warn 1.2 (D145–D148); 26 = D152 卸甲 (disarm) 4th P2-8 weekly modifier heavy→melee challenge-only; 27 = D154 卫士潮 (guards) 5th P2-8 weekly modifier ranged→heavy challenge-only; 28 = D155 铁卫 (wall) 6th P2-8 weekly modifier melee→heavy challenge-only; 29 = D158 converted-mob twists for 卸甲 / 卫士潮 / 铁卫 (fast melee / charging heavy / heavy hitter); 30 = D176 Variety Pack 2: affix +regen/charge/frost, event +crystal/escort; 31 = D174 签名传奇 Q01–Q03 + 首领徽记 + 烬炉烙印 + 双签名 (EmberSignature constants); 32 = D178 Weekly Mod Pack 2: +bolters/shell/press; 33 = D177 P1 挂机庭 coin + xp rounds in ember-v1.yml afk (tools/p1sim/afk.py); 34 = D174 stage 2a Q04–Q06 signatures L07–L12 + 烬斩 line/ring/ignite/shield + low-HP 炽愈 hooks (EmberSignature constants, tools/p1sim/mainline.py); 35 = D174 stage 2b 自选誓约: the leader pledges the normal: true rules on repeat normal Q01–Q06 runs, +1 insignia per rule (EmberRunService C_PLEDGE); 36 = D174 stage 2b 连战·前哨 rush entry outpost (Q01→Q03 chain at T2, weekly 2 insignia per map + 1 T2 mark, own claim counter, DP EmberQ0B2); 37 = D174 stage 2b 首领残响 rush entries echo_q01..q04 (one boss at T2, 3 shared weekly claims × 2 insignia, p4_echo_claim); 38 = D177 rev 2 挂机庭 auto-combat: personal MM packs, per-kill coin / xp + account-bound vault shard / bone / core / blank (ledger bmat:, 2400 kills/day, offline 1/4 of measured rate) in ember-v1.yml afk (tools/p1sim/afk.py); 39 = D180 P1 每日签到 + 在线时长: monthly cumulative sign-in (coin / xp, insignia ×2 + mark ×2 per month) + online 15/30/60/120 min coin / xp in ember-v1.yml signin / online (tools/p1sim/signin.py); 40 = D183 烬爆族返工: 守炉重锤 L04 cost = 对首领伤害 ×0.985 only (was 被预警招打中 +3% + ×0.98), EmberSignature constants; 41 = D184 D174 第 3 阶段: Q07 签名 L13–L15 + 签名调律 (7 件调律版, EmberSignature.ALTS; L06 / L11 调律版代价 ×1.10 / ×1.12 被预警招打中); 42 = D180 rev 2: minutes in ember_afk count as online time and running AFK auto-combat counts as activity (ember-v1.yml online exclude_worlds [] + afk_combat_counts)); 43 = D182 奖励精英变招 Pack 1: Extra.ELITE one fixed light move per Q01–Q07 (elite_twists); 44 = D181 Variety Affix Pack 3: affix +mortar/molten)
balance_version: 44
# §9.5 new main maps cost 30 stamina; weekly first-free credits never apply here
cost: 30
# Endgame #6 (D128, balance_version 18, user 2026-10-03 07:07): the first failed challenge / abyss run of the stamina day
# (Asia/Shanghai) gives back this share of the stamina it cost — no loot, no coins, the abyss fee stays spent. Once per
# player per day (ledger row failrefund@<day>, like death_refund). p2econ --fail-refund: out-p2econ-d128-*.md. 0 = off
fail_refund: 0.5
party_min: 1
party_max: 3
# instance worlds are dungeon_<DungeonId>_<HEX>; must also be listed in ember-v1.yml scope.world_prefixes
world_prefix: dungeon_EmberQ0
# seconds a P1 entry pass stays valid for the DP js-condition (paid entries only)
pass_seconds: 30

# P2-9 (D81) per-map loot identity (book §9.1 target pool): each map's `loot: {family, slot}` biases its random items
# (base item, extra chest, abyss segments on that map). Target family weight stays target_weight (60 %) everywhere,
# own_family on a map whose family IS the player's target; on other maps the map family takes map_share of the
# non-target rest. No target: map family 50 %, others 25 %. slot = weight of the map slot (no slot = 50/50).
# Model: tools/p1sim/p2econ.py --loot (two-极品 speed must not move by more than about a week).
loot_bias:
  own_family: 0.625
  map_share: 0.75
  slot: 0.55

# P2-9 (D82) raid_item: the extra raid roll is the player's entry target family (raid `loot.family` without a target),
# slot 50/50, challenge quality table with this floor (1 = 精良; 极品 odds unchanged). Model: p2econ.py --raid.
raid_item:
  quality_floor: 1

# P2-1 (D66) weekly featured challenge: the map order above cycles every Monday 00:00 (Asia/Shanghai); each character's
# first weekly_cap challenge clears of the featured map add bonus_marks forge marks of the run tier (T3). No coin, no
# item, no multiplier (book §23.3). bonus_marks 0 = off. Model: tools/p1sim/p2econ.py (≈ +6% T3 marks over 8 weeks).
rotation:
  bonus_marks: 1
  weekly_cap: 3
  # D108 (balance_version 14): a repeat NORMAL clear of the featured map (already first-cleared by that character, map
  # tier 1 or 2, i.e. Q01–Q06) adds normal_bonus_marks forge marks of the map tier. It shares weekly_cap with the
  # challenge bonus above (one counter, 3 per week in total). Q07 normal (T3) gets nothing extra. 0 = off.
  # Model: p1sim.py --normal-mods [--feat-farm] / p2econ.py (--no-feat-normal for the old rule, --feat-separate).
  normal_bonus_marks: 1
  # P2-8 (D80 / D152 / D154 / D155 / D178) one weekly rule on the featured map's CHALLENGE runs only (index = ISO week mod count; with 7 maps and
  # 9 rules all 63 pairs come round). Rules change how the fight plays, never the rewards, never a multiplier:
  #   potion_cap N   heal potions per character per run (the 15 s shared cooldown still applies)
  #   remap a: b     role a spawns as role b (only when the map defines b; Q01/Q02 have no caster and keep ranged)
  #   swap_rooms     room 1 and room 3 trade enemy groups (each keeps its own spawn points and doors)
  # Model: tools/p1sim/p2econ.py --mods (featured clear rate per rule; rewards only move down).
  #   normal: true   (D94) the rule also applies to NORMAL runs of the featured map, but only when every party member
  #                  has already first-cleared it (first clears stay as the book). casters stays challenge-only: on
  #                  normal maps it eases Q03–Q07 by +6～+17 points. Model: p1sim.py --normal-mods.
  modifiers:
    - {id: lean, name: 限药, potion_cap: 3, normal: true, text: 本局每人最多喝 3 瓶回复药}
    - {id: casters, name: 术者换防, remap: {ranged: caster}, text: 弓手换成术者（直线预警，躲开就不疼）}
    - {id: reverse, name: 逆行, swap_rooms: true, normal: true, text: 第一间和第三间的敌群互换（开局就是最重的一间）}
    # D158 (balance_version 29, review round 2 #5): each swap's converted mobs get their own twist (converted: multipliers
    # on hp / atk per hit / attack interval / move speed of the mobs the rule swapped; others unchanged)
    - {id: disarm, name: 卸甲, remap: {heavy: melee}, converted: {hp: 0.8, interval: 0.75}, text: 重甲卸甲成近战：更脆但出手快 1/3（生命 ×0.8；没有重甲的图不变）}
    - {id: guards, name: 卫士潮, remap: {ranged: heavy}, converted: {hp: 0.8, speed: 1.35}, text: 弓手换成冲锋重甲：跑得快、会贴脸（移速 ×1.35，生命 ×0.8；没有弓手或重甲的图不变）}
    - {id: wall, name: 铁卫, remap: {melee: heavy}, converted: {hp: 0.85, atk: 1.5, interval: 1.25}, text: 近战全换成重击重甲：每下 ×1.5、更慢（生命 ×0.85；没有重甲的图不变）}
    # Pack 2 (D175→D178): 3 sidegrades; all challenge-only. Pool 6→9 → ISO week mod 9 (63 map×rule pairs).
    - {id: bolters, name: 弓潮, remap: {caster: ranged}, converted: {interval: 0.9}, text: 术者换成弓手：更多箭、少直线预警（出手间隔 ×0.9；没有术者的图不变）}
    - {id: shell, name: 龟甲, remap: {caster: heavy}, converted: {hp: 1.2, atk: 0.7, interval: 1.35}, text: 术者换成龟甲重甲：更肉、更慢、单下更轻（生命 ×1.2，攻击 ×0.7，间隔 ×1.35；没有术者的图不变）}
    - {id: press, name: 压阵, remap: {ranged: melee}, converted: {speed: 1.3, hp: 0.85}, text: 弓手换成冲锋近战：贴脸杂兵潮（移速 ×1.3，生命 ×0.85；没有弓手的图不变）}

# D116 (balance_version 16) seasons, display only: a season is `weeks` weeks from the Monday `anchor` (00:00 Asia/Shanghai).
# Weekly boards (best abyss tier cleared, featured challenge clears, raid clears) reset every Monday 00:00; season boards
# add the fastest R01 / R02 clear. At season end the top `top` of each board and everyone who cleared abyss tier
# `deep_tier` inside the season get cosmetic-only season titles (#1 on any board also the ❖ nameplate frame); results
# are archived in p1-runs/season-archive/. Accounts in ember-v1.yml leaderboard_exclude never rank or get awards.
season:
  anchor: "2026-09-28"
  weeks: 4
  # F-review #4 (D123, balance_version 17): 8 → 5 — p2econ 0.5 dodge reaches tier 5 by week 2 (median), 0.3 by ~week 9;
  # tier 8 was a 0.7-only title inside a 4-week season. The abyss board breaks ties at the same tier by the fastest clear
  # (seconds from the first room to the boss kill), so tier-10 players are not ordered by who logged in first on Monday.
  deep_tier: 5
  top: 3

# D117 weekly goals (players with their own Q07 first clear; reset with the week): featured = featured-map challenge
# clears (the week's rule applies there), abyss = abyss tiers cleared (any tier), raid = raid clears, bounty = days the
# daily bounty's last step was reached. Each finished goal pays `reward` 余烬徽, all of them `bonus` more. 余烬徽 only
# buys cosmetic-shop items (1 徽 = 1 shop point = 50 币 of list price): no coin, no marks, no items (book §23.3).
# Model: tools/p1sim/p2econ.py --goals (what the goals make players do; the reward itself cannot move the chase).
# Recheck #8 (D134, balance_version 19): in the week of the own Q07 first clear the bounty target is prorated to the days
# left (graduation day included: Saturday 2, Sunday 1); later weeks use the full target. Cosmetic-only reward (余烬徽).
weekly_goals:
  targets: {featured: 1, abyss: 3, raid: 1, bounty: 3, core: 2}
  reward: 15
  bonus: 20

# D118 one extra raid revive in the boss's last phase: after the phase change, once the boss is at or under
# last_phase_hp of its health with someone down, every fallen member stands up `delay` seconds later (once per raid,
# only while someone is still standing). 0 = off. Model: tools/p1sim/p1party.py --last-revive-hp 0.2 --last-revive-delay 20: R01 / R02 3-player week-2 54 % / 51 % (47 / 46 without).
raid_revive:
  last_phase_hp: 0.2
  delay: 20

# D138/D171 repeat-run variety (Pack 2): only on a NORMAL Q01–Q07 run where every member already has the map's
# first clear (never on a first clear, challenge, abyss, raid or rush). Fixed at entry from the run seed. Rewards are
# existing types only, paid at settlement: killing the affixed elite → affix_shard 余烬碎片; finishing the marked room
# event → event_core 余烬核心碎片. Affix pool 6 / event pool 3 (equal weight).
#   blazing 炽热 / split 分裂 / shield 厚甲 (D138)
#   regen   再生: every s try heal×maxHP; interrupt_window; interrupt if hurt ≥ interrupt_hp×maxHP
#   charge  冲锋: telegraph strip (≥1.2s), strip damage only (no body dash out of leash)
#   frost   凝霜: Slow aura; leave radius → Slow clears
#   timed / crystal 砸余烬晶 / escort 护宝兔
# Model: p1sim Stage C deferred (same as D176); D181 design → ship Stage A+B.
# Affix pool 8 / event pool 3 (equal weight). Pack 3 adds:
#   mortar 投弹: every s circle near nearest player feet (warn≥1.2, kb=0)
#   molten 亡爆: onDeath delayed circle at corpse (splitAdds do NOT trigger); cancel on unload
variety:
  affix_rate: 1.0
  affixes: [blazing, split, shield, regen, charge, frost, mortar, molten]
  affix_shard: 2
  blazing: {every: 3.0, radius: 1.5, warn: 1.0, dmg: 1.0}
  split: {count: 2, hp: 0.5}
  shield: {hp: 1.6}
  regen: {every: 4.0, heal: 0.10, interrupt_window: 1.5, interrupt_hp: 0.05}
  charge: {every: 5.5, warn: 1.2, length: 7, width: 2.5, dmg: 1.0}
  frost: {radius: 3.0, amplifier: 1, tick: 0.5}
  mortar: {every: 5.0, warn: 1.2, radius: 2.0, ahead: 0.0, dmg: 1.0}
  molten: {delay: 0.4, warn: 1.3, radius: 2.5, dmg: 1.2}
  event_rate: 0.5
  events: [timed, crystal, escort]
  event_secs: 30
  event_core: 1
  timed: {secs: 30}
  crystal: {count: 3, secs: 35}
  escort: {hp: 0.35}

# D182 奖励精英变招 Pack 1 (balance_version 43): Extra.ELITE gets one fixed light move per Q01–Q07 map
# (same shape system as boss moves: circle / cone / line / charge, light:true, warn≥1.2). dmg = elite.atk × multiplier
# (absolute). Rewards unchanged (ELITE_SHARD 10 + ELITE_CORE 1). open_delay = seconds before the first CD. Model:
# p1sim Extra.ELITE is still a plain mob (no twist TTK gate this pack — see design §7 note).
elite_twists:
  enabled: true
  open_delay: 3.0
  q01: {move: shove,  shape: line,   every: 14, warn: 1.2, length: 5, width: 2,   dmg: 1.0}
  q02: {move: stomp,  shape: circle, every: 14, warn: 1.2, radius: 2.5, ahead: 0, dmg: 1.1}
  q03: {move: sweep,  shape: cone,   every: 14, warn: 1.2, angle: 90, range: 4,  dmg: 1.0}
  q04: {move: barge,  shape: charge, every: 15, warn: 1.3, length: 6, width: 3,  dmg: 1.0, kb: 0}
  q05: {move: dust,   shape: circle, every: 15, warn: 1.2, radius: 2.0, target: player, dmg: 1.1}
  q06: {move: breath, shape: cone,   every: 15, warn: 1.2, angle: 100, range: 4, dmg: 1.0}
  q07: {move: slag,   shape: line,   every: 15, warn: 1.3, length: 6, width: 2.5, dmg: 1.1}

# §18.1 challenge difficulty for all seven maps, opened by the player's OWN Q07 first clear. One shared T3 reference
# (B_ref 90), overriding — not multiplying — the normal values; party HP 1+0.65(n−1) still applies; damage does not
# scale with party size. Same 30 stamina and the same fixed settlement; items and marks are T3 with the challenge
# quality table; no first-clear package. Boss skills: heavy (重斩/刀气/重砸/冲撞) = boss.heavy, the lighter second
# skill (marked `light: true` on the map) = boss.light. Warnings, shapes and recoveries are the normal ones.
challenge:
  requires: q07
  tier: 3
  b_ref: 90
  quality: [60, 28, 10, 2]
  # D104 (balance_version 13): eased to HP ×0.70 / damage ×0.85 so a fresh Q07 clearer (dodge 0.5, enhance moved onto
  # the new T3 piece with the free swap) clears the best map ~17 % and ~50 % after one T3 upgrade, ~85 % with two
  # (tools/p1sim/chrate.py; was 0 % / 6 % / 14 %). E-review D109: abyss tier 1 now equals these values (×1.00); only
  # tier 10 keeps the old absolute strength.
  mobs:
    melee:    {hp: 189, atk: 20}
    ranged:   {hp: 139, atk: 20}
    heavy:    {hp: 265, atk: 20}
    caster:   {hp: 164, atk: 20}
    treasure: {hp: 252, atk: 0}
    elite:    {hp: 630, atk: 20}
  boss: {hp: 5600, atk: 37, heavy: 61, light: 37}

# P2-2 (D70) P1 深渊 · 余烬层 (book §18.3): one segment = one accepted Q map (R1–R3 + its boss), picked by the segment
# seed, at the challenge values above × the tier factors below. Opened by the player's own Q07 first clear; tier t+1
# opens after a full clear of tier t. Each segment is its own entry: 30 stamina + the tier fee in 余烬币, both reserved
# at entry and refunded exactly like stamina (no entry / abort before the fight / restart); a started segment that fails
# keeps the cost. A full segment settles like a challenge run (300 coin, T3 item + mark) with the tier quality table;
# no rotation bonus, no first-clear package, no extra coin. Ten tiers is the hard cap (no endless floors).
# Model: tools/p1sim/p2econ.py --abyss.
abyss:
  requires: q07
  # F-review #5 (D124, balance_version 17): when the coins cannot pay a tier fee, surplus T3 marks (above the 8 kept for an
  # exchange) pay it at this many 余烬币 per mark (= the cosmetic-shop rate); refunds return the marks. 0 = coins only.
  # Model: p2econ.py --abyss --raid --goals (--fee-mark 200 vs 0): see docs §5s.
  fee_mark_coin: 200
  # hp / dmg multiply the challenge values; quality = 标准/精良/卓越/极品 weights; fee = 余烬币 per tier
  # D104: hp ÷0.70 and dmg ×1.20 against the eased challenge = the same absolute strength as before (tier 1 = old challenge)
  # E-review (D109, balance_version 15): tier 1 = the challenge itself (×1.00), a linear ramp to tier 10 at its old
  # absolute strength (hp 2.07 / dmg 1.42). Quality follows the strength: tier 1 = the challenge table, tiers 2–3
  # get 3 % 极品, tiers 4–8 the old tier 3–7 tables, tiers 9/10 keep theirs. Model: p2econ.py --abyss (0.3 dodge:
  # ≥1 tier 30 % → 100 % by week 12; two 极品 ≥30 % at week 9 / 7 / 5 vs 9 / 8 / 4 before). D111: fees of tiers 8–10
  # trimmed 420/480/540 → 400/440/480 (0.7 dodge coin-blocked days 59 → 55 of 84, chase speed unchanged).
  tiers:
    - {hp: 1.00, dmg: 1.00, quality: [60, 28, 10, 2], fee: 0}
    - {hp: 1.12, dmg: 1.05, quality: [58, 29, 10, 3], fee: 60}
    - {hp: 1.24, dmg: 1.09, quality: [57, 29, 11, 3], fee: 120}
    - {hp: 1.36, dmg: 1.14, quality: [54, 30, 12, 4], fee: 180}
    - {hp: 1.48, dmg: 1.19, quality: [51, 31, 13, 5], fee: 240}
    - {hp: 1.60, dmg: 1.23, quality: [48, 32, 14, 6], fee: 300}
    - {hp: 1.71, dmg: 1.28, quality: [45, 33, 15, 7], fee: 360}
    - {hp: 1.83, dmg: 1.33, quality: [42, 34, 16, 8], fee: 400}
    - {hp: 1.95, dmg: 1.37, quality: [36, 36, 18, 10], fee: 440}
    - {hp: 2.07, dmg: 1.42, quality: [33, 37, 18, 12], fee: 480}

