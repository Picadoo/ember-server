# --- CoreBrew demo items (extend, do not rename furnace IDs above) ---
# Stack size: NeigeItems has no max-stack YAML key; CoreBrew/BrewNmsHooks raise
# max stack to 127 for these IDs (bottles / ingredients / results). Client may
# still visually cap at 64 — server Count byte ceiling is 127 on 1.12.
bottle_ember_water:
