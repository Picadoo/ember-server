# --- CoreEnchant catalyst (replaces vanilla lapis on enchanting table) ---
# Base INK_SACK:4 so 1.12 client accepts the lapis slot; vanilla lapis rejected via NI id check.
crystal_ember_enchant:
  material: INK_SACK
  damage: 4
  name: '&d余烬附魔晶'
  lore:
    - '&8附魔台专用催化剂'
    - '&8合成：3碎片+1骨尘 → 1'
    - '&8合成：1核心+2碎片 → 2'
    - '&c普通青金石无效'
  enchantments:
    DURABILITY: 1
  hideflags:
    - HIDE_ENCHANTS
