# D417 骨架 · 短征 sx11 烬镜对廊（EmberSx11）— 与 EmberSx10 同构：DP 只建实例，不刷怪不发奖。
# 地图：ember_short_sx11（本地自 ember_raid 拷贝（与 config 登记一致）；烬镜对廊主题 WE 另号）
# 进入：只经 CoreRpg（菜单 / corerpg p1 enter sx11）→ 预留体力 30 → 发 P1 通行证再 dp start-console。
# 房间/门/首领/S50 结算由 CoreRpg（ember-v1-runs.yml short.sx11）；结束走 ember_p1_complete / ember_p1_fail。
# 首航硬提醒：short.sx11 须含 rooms×3+boss（防 D391 FAIL）。
# MM：本号入仓 · Guard/Crossbow/Elite/Warden + EmberSx11MirrorCast；本壳不假造完整 MM 波次。
# 禁：单廊换皮；环廊复读 sx06；递闸串室复读 sx10；连续霜雾廊复读 sx03；跳石/错层/塔升/风廊气质当主识别。

dungeon-init-script:
  - "$setmap{name=ember_short_sx11} @init"
  - "$setspawn{location=0,64,5} @init"
  - "$setting{break=false;place=false;pvp=false;mode=ADVENTURE} @init"
  - "$revive-setting{revive=false;number=0;death-location=true} @init"

dungeon-start:
  condition:
    - "$team-condition{team=true;min=1;max=1;message=§c短征人数 1，当前 (<size>)} @system"
    - "$js-condition{text='%corerpg_p1_pass_sx11%'=='yes';message=§c请从 §e短征 · 选本 §c菜单进入烬镜对廊（体力与解锁由 CoreRpg 校验）} @system"
  action-script:
    - "$message{type=text;text=§6[余烬] §e烬镜对廊 §7· 短征 · 对廊前厅→左右对称双廊→合镜终厅；两侧各通后中门开，击败合镜守吏后统一结算} @dungeon"
    - "$teleport{location=0,64,5;defspawn=true} @player"

dungeon-area: []

# 结算由 CoreRpg（S50）；禁本文件发旧币表
dungeon-reward-script: []
