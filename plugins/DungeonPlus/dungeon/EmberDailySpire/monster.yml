# 日 · S3 线 E 断塔回廊：塔底→开门上阶→中层环廊混编→开门→顶台 Boss
# 分房 $kill（禁 $kill-any）；门1 z=4@y64；门2 z=4@y70 · x=-1..1 → AIR
# Display：$kill 对齐 MM 去色名 断塔卫尸 / 裂隙箭骷 / 断塔守望
# 2026-09-28 波次差异: 环廊双侧裂隙箭骷 2+2 → 再卫尸×2（顺序单 $kill）
# 2026-09-28 第二房/Boss前压试点: 房2 start 链式重叠（对齐霜晶/锈轨）；wave2a start→wave2b delay2；开门在 wave2b
# 2026-09-28 Boss前压: wave2b.end→boss_prep(卫尸×2 @ ±3,76,2)→boss；房2链式零动
# 2026-09-28 环廊防坠: wave2b (0,70,-6)→(0,70,-4)；(0,70,2)→(-1,69,1)（设计(0,70,1)中轴空洞，±微调可站）
groups:
  wave1:
  - monster:
    - "$mob{plugin=MythicMobs;name=EmberDailySpireZombie;location=-5,64,-3;amount=2;scattered=0.8;level=1} @dungeon"
    - "$mob{plugin=MythicMobs;name=EmberDailySpireZombie;location=5,64,-3;amount=1;scattered=0.5;level=1} @dungeon"
    - "$mob{plugin=MythicMobs;name=EmberDailySpireZombie;location=-5,64,2;amount=1;scattered=0.5;level=1} @dungeon"
    - "$mob{plugin=MythicMobs;name=EmberDailySpireZombie;location=5,64,2;amount=1;scattered=0.5;level=1} @dungeon"
    condition:
    - "$kill{mobname=断塔卫尸;amount=5} @system"
    start:
    - "$message{type=text;text=§e【塔底厅】清尽断塔卫尸再开上阶门} @dungeon"
    end:
    - "$message{type=text;text=§a底层已清 · 上阶门开了} @dungeon"
    - "$operation-block{loc=-1,64,4;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=-1,65,4;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=-1,66,4;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=0,64,4;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=0,65,4;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=0,66,4;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=1,64,4;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=1,65,4;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=1,66,4;mode=set;type=AIR} @dungeon"
    - "$command{text=effect %player_name% instant_health 1 2 true;console=true} @player"
    - "$monstergroup{group=wave2a;repeat=false;delay=3} @dungeon"
    auto-start: false

  # 中层环廊：对射 start 即链式刷卫尸（重叠压）；开门仅在 wave2b $kill
  wave2a:
  - monster:
    - "$mob{plugin=MythicMobs;name=EmberDailySpireSkeleton;location=-6,70,0;amount=2;scattered=0.8;level=1} @dungeon"
    - "$mob{plugin=MythicMobs;name=EmberDailySpireSkeleton;location=6,70,0;amount=2;scattered=0.8;level=1} @dungeon"
    condition:
    - "$kill{mobname=裂隙箭骷;amount=4} @system"
    start:
    - "$message{type=text;text=§e【中层环廊·对射】双侧裂隙箭骷 —— 一上环廊就双边挨箭 · 卫尸将交错压上} @dungeon"
    - "$monstergroup{group=wave2b;repeat=false;delay=2} @dungeon"
    end:
    - "$message{type=text;text=§7对射侧已清} @dungeon"
    - "$command{text=effect %player_name% instant_health 1 2 true;console=true} @player"
    auto-start: false

  wave2b:
  - monster:
    - "$mob{plugin=MythicMobs;name=EmberDailySpireZombie;location=0,70,-4;amount=1;scattered=0.5;level=1} @dungeon"
    - "$mob{plugin=MythicMobs;name=EmberDailySpireZombie;location=-1,69,1;amount=1;scattered=0.5;level=1} @dungeon"
    condition:
    - "$kill{mobname=断塔卫尸;amount=2} @system"
    start:
    - "$message{type=text;text=§e【环廊·卫尸】断塔卫尸×2 —— 与对射重叠压 · 清完开顶门} @dungeon"
    end:
    - "$message{type=text;text=§a环廊已清 · 顶门开了 · 门槛压} @dungeon"
    - "$operation-block{loc=-1,70,4;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=-1,71,4;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=-1,72,4;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=0,70,4;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=0,71,4;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=0,72,4;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=1,70,4;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=1,71,4;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=1,72,4;mode=set;type=AIR} @dungeon"
    - "$command{text=effect %player_name% instant_health 1 2 true;console=true} @player"
    - "$monstergroup{group=boss_prep;repeat=false;delay=2} @dungeon"
    auto-start: false

  # Boss 前门压：顶台门槛两侧卫尸贴脸（door2 z=4@y70 上顶后 → Boss (0,76,0)）
  boss_prep:
  - monster:
    - "$mob{plugin=MythicMobs;name=EmberDailySpireZombie;location=-3,76,2;amount=1;scattered=0.5;level=1} @dungeon"
    - "$mob{plugin=MythicMobs;name=EmberDailySpireZombie;location=3,76,2;amount=1;scattered=0.5;level=1} @dungeon"
    condition:
    - "$kill{mobname=断塔卫尸;amount=2} @system"
    start:
    - "$message{type=text;text=§e【顶台·门槛】两侧断塔卫尸贴脸 —— 清完才出守望} @dungeon"
    end:
    - "$message{type=text;text=§7门槛已清 · 守望现身} @dungeon"
    - "$command{text=effect %player_name% instant_health 1 2 true;console=true} @player"
    - "$monstergroup{group=boss;repeat=false;delay=2} @dungeon"
    auto-start: false

  boss:
  - monster:
    - "$mob{plugin=MythicMobs;name=EmberDailySpireWarden;location=0,76,0;amount=1;scattered=0.5;level=1} @dungeon"
    condition:
    - "$kill{mobname=断塔守望;amount=1} @system"
    start:
    - "$message{type=text;text=§c【顶台】断塔守望！有栏可绕 · 当心推离} @dungeon"
    end:
    - "$end{type=text;text=§a余烬窟·断塔回廊 通关！奖励发放中…;reward=true;delay=2;end-type=COMPLETE} @dungeon"
    auto-start: false
