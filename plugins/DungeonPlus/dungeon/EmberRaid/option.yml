# 余烬团本 — docs/ember-raid-channel-spec.md · 通道→终厅
# 启动：/dp start EmberRaid
# 次数：扣 NI「余烬团本票」×1（周发 1 张）= 周首通实践保底
# 怪：EmberRaidFootman/Archer/Elite/Boss（勿改 EmberAbyss DP）
# 通关箱：材料保底 + 周首通团戒；T3 不保底（终厅 MM 概率）

dungeon-init-script:
  - "$setmap{name=ember_raid} @init"
  - "$setspawn{location=-40,65,270} @init"
  - "$setting{break=false;place=false;pvp=false;mode=ADVENTURE} @init"
  - "$revive-setting{revive=true;number=5;death-location=true} @init"

dungeon-start:
  condition:
    - "$team-condition{team=true;min=3;max=5;message=§c团本人数 3～5，当前 (<size>)} @system"
    - "$js-condition{text='<item:余烬团本票 *1 *true>'=='true';message=§c缺少§9余烬团本票§c×1（每周 1 张，进本即扣）} @system"
  action-script:
    - "$message{type=text;text=§9团本已点燃。§7分路推进——左卫兵、右射手，汇合后再闯终厅。} @dungeon"
    - "$message{type=text;text=§8已扣除余烬团本票 ×1} @dungeon"
    - "$teleport{location=-40,65,270;defspawn=true} @player"
    - "$monstergroup{group=wave1;repeat=false;delay=2} @dungeon"

dungeon-area: []

# 通关箱（每次 COMPLETE · 全队）
# 材料保底；孔石锋利×1（二选一取锐）；不发灾厄余烬（灾厄主产）
# 团戒：周首通保底。团票每周 1 张 ⇒ 同周再通需额外票；
#   周首通去重：corerpg raid grant-ring（raidRingWeek=DailyService.weekId）
# T2/T3：不保底；终厅 Boss MM 概率（15/12 · 8/6）
dungeon-reward-script:
  - "$message{type=text;text=§a使徒倒下。§9同袍之证已结算。} @dungeon"
  - "$command{text=ni give <player.name> mat_ember_core_fragment 4;console=true} @player"
  - "$command{text=ni give <player.name> crystal_ember_enchant 2;console=true} @player"
  - "$command{text=ni give <player.name> mat_ember_shard 10;console=true} @player"
  - "$command{text=ni give <player.name> mat_ember_bone_dust 6;console=true} @player"
  - "$command{text=ni give <player.name> gem_ember_sharp 1;console=true} @player"
  # 周首通保底团戒（NI acc_ember_raid_ring）
  - "$command{text=corerpg raid grant-ring <player.name>;console=true} @player"
  - "$message{type=text;text=§6周首通保底 · 余烬团戒（戒+刃=同袍套装）} @dungeon"
  - "$message{type=text;text=§8同周再通不重复发戒（团票每周 1）· T3 不保底} @dungeon"
  - "$command{text=mvtp <player.name> ember_hub;console=true} @player"
