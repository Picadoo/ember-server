# P5 2026-09-27: hall→corridor→boss hall open cells (spawn 0,65,0 · boss pad 40,66,0)
#   Legacy room x -46..-34,z 264..276 scrubbed.
# 团本 · 通道分路 → 终厅（docs/ember-raid-channel-spec.md）
# Display 保持：团本·通道卫兵/射手/精英 · 团本·终厅使徒
# 不必真分图：文案 + 左右刷点错开做出分路压力
groups:
  wave1:
  - monster:
    - "$mob{plugin=MythicMobs;name=EmberRaidFootman;location=18,65,-7;amount=6;scattered=1.0;level=1} @dungeon"
    condition:
    - "$kill{mobname=团本·通道卫兵;amount=6} @system"
    start:
    - "$message{type=text;text=§9【左道】卫兵压上——左边清！} @dungeon"
    end:
    # 2026-09-27 real-combat balance: wave-end heal (Instant Health III, 16 HP)
    - "$command{text=effect %player_name% instant_health 1 2 true;console=true} @player"
    - "$message{type=text;text=§a左道肃清} @dungeon"
    - "$monstergroup{group=wave2;repeat=false;delay=3} @dungeon"
    auto-start: false

  wave2:
  - monster:
    - "$mob{plugin=MythicMobs;name=EmberRaidFootman;location=18,65,-7;amount=3;scattered=1.0;level=1} @dungeon"
    - "$mob{plugin=MythicMobs;name=EmberRaidArcher;location=22,65,7;amount=4;scattered=1.0;level=1} @dungeon"
    condition:
    # 2026-09-26 修：kill-any 按本组计数（实战冒烟：wave2 的 3 卫兵 + 4 射手全灭后 amount=13 永不满足、卡波）
    - "$kill{mobname=团本·通道卫兵;amount=3} @system"
    - "$kill{mobname=团本·通道射手;amount=4} @system"
    start:
    - "$message{type=text;text=§9【右道】射手就位——右边先压远程！} @dungeon"
    end:
    # 2026-09-27 real-combat balance: wave-end heal (Instant Health III, 16 HP)
    - "$command{text=effect %player_name% instant_health 1 2 true;console=true} @player"
    - "$message{type=text;text=§a通道打开 · 精英将至} @dungeon"
    - "$monstergroup{group=wave3;repeat=false;delay=3} @dungeon"
    auto-start: false

  wave3:
  - monster:
    - "$mob{plugin=MythicMobs;name=EmberRaidElite;location=30,65,0;amount=1;scattered=1.0;level=1} @dungeon"
    - "$mob{plugin=MythicMobs;name=EmberRaidFootman;location=30,65,0;amount=3;scattered=1.0;level=1} @dungeon"
    condition:
    - "$kill{mobname=团本·通道精英;amount=1} @system"
    start:
    - "$message{type=text;text=§d【汇合】通道精英挡住终厅门！} @dungeon"
    end:
    # 2026-09-27 real-combat balance: wave-end heal (Instant Health III, 16 HP)
    - "$command{text=effect %player_name% instant_health 1 2 true;console=true} @player"
    - "$message{type=text;text=§4终厅裂开——使徒现身！} @dungeon"
    - "$monstergroup{group=boss;repeat=false;delay=4} @dungeon"
    auto-start: false

  boss:
  - monster:
    # 2026-09-27: boss (wither skeleton, 2.4 tall) moved to the room centre; at z 276 it sat in the 3-high outer ring and could not step onto the 2-high quartz ledge → never reached players
    - "$mob{plugin=MythicMobs;name=EmberRaidBoss;location=40,66,0;amount=1;scattered=1.0;level=1} @dungeon"
    condition:
    - "$kill{mobname=团本·终厅使徒;amount=1} @system"
    start:
    - "$message{type=text;text=§4【终厅】使徒！分摊砸击，别叠脸！} @dungeon"
    end:
    - "$message{type=text;text=§a使徒倒下。§9同袍之证已结算。} @dungeon"
    - "$end{type=text;text=§9余烬团本 通关！;reward=true;delay=2;end-type=COMPLETE} @dungeon"
    auto-start: false
