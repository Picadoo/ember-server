# D407 骨架 · 短征 sx07 烬塔回升（EmberSx07）— 与 EmberSx06 同构：DP 只建实例，不刷怪不发奖。
# 地图：ember_short_sx07（本地自 ember_daily_tide_v1 拷贝；烬塔回升主题 WE 另号）
# 进入：只经 CoreRpg（菜单 / corerpg p1 enter sx07）→ 预留体力 30 → 发 P1 通行证再 dp start-console。
# 房间/门/首领/S46 结算由 CoreRpg（ember-v1-runs.yml short.sx07）；结束走 ember_p1_complete / ember_p1_fail。
# 首航硬提醒：short.sx07 须含 rooms×3+boss（防 D391 FAIL）。

dungeon-init-script:
  - "$setmap{name=ember_short_sx07} @init"
  - "$setspawn{location=0,64,5} @init"
  - "$setting{break=false;place=false;pvp=false;mode=ADVENTURE} @init"
  - "$revive-setting{revive=false;number=0;death-location=true} @init"

dungeon-start:
  condition:
    - "$team-condition{team=true;min=1;max=1;message=§c短征人数 1，当前 (<size>)} @system"
    - "$js-condition{text='%corerpg_p1_pass_sx07%'=='yes';message=§c请从 §e短征 · 选本 §c菜单进入烬塔回升（体力与解锁由 CoreRpg 校验）} @system"
  action-script:
    - "$message{type=text;text=§6[余烬] §e烬塔回升 §7· 短征 · 塔基庭→折返上行→塔冠；清房开门，击败塔冠守吏后统一结算} @dungeon"
    - "$teleport{location=0,64,5;defspawn=true} @player"

dungeon-area: []

# 结算由 CoreRpg（S46）；禁本文件发旧币表
dungeon-reward-script: []
