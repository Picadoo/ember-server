# 深核·周 — DESIGN-dungeon-daily-weekly.md §6
# P3 2026-09-27: 深核廊三室（前厅Y65→中核Y68→深室Y63）；spawn 仍 -40,65,270
# 启动：/dp start EmberWeekly
# 次数：扣 NI id ticket_ember_weekly ×1（显示名「余烬周票」；周发 1）
# B0.1: 扣票改由 CoreRpg TicketEntryService（NI id）；本文件不再 <item:显示名> 扣次

dungeon-init-script:
  - "$setmap{name=ember_weekly} @init"
  - "$setspawn{location=-40,65,270} @init"
  - "$setting{break=false;place=false;pvp=false;mode=ADVENTURE} @init"
  - "$revive-setting{revive=true;number=4;death-location=true} @init"

dungeon-start:
  condition:
    - "$team-condition{team=true;min=1;max=3;message=§c周常本人数 1～3，当前 (<size>)} @system"
    # 2026-09-26 等级门槛（CoreRpg progress.yml level_gates.weekly=20；DP 逐队员判定；放在扣票条件前 → 被拒不扣票；OP 豁免）
    - "$js-condition{text='%corerpg_gate_weekly%'=='yes'||'%player_is_op%'=='yes';message=§c周常本需要余烬等级 §eLv.20§c · 队伍中有人等级不足（/corerpg level 查看）} @system"
    # B0.1: 票已在 /corerpg enter 按 NI id 扣除；此处仅保留人数/等级门
  action-script:
    - "$message{type=text;text=§c深核·周 开始！已消耗体力 ×1} @dungeon"
    - "$teleport{location=-40,65,270;defspawn=true} @player"
    - "$monstergroup{group=wave1;repeat=false;delay=2} @dungeon"

dungeon-area: []

# 2026-09-26 修：$command 不认 <player.name>（控制台 "玩家 <player.name> 不在线"，奖励/结算/回城从未执行）→ PAPI %player_name%
dungeon-reward-script:
  - "$message{type=text;text=§6周常通关奖励已发放} @dungeon"
  - "$command{text=ni give %player_name% mat_ember_core_fragment 3;console=true} @player"
  - "$command{text=ni give %player_name% crystal_ember_enchant 2;console=true} @player"
  - "$command{text=ni give %player_name% mat_ember_shard 8;console=true} @player"
  - "$command{text=ni give %player_name% mat_ember_bone_dust 4;console=true} @player"
  # 装备保底：固定刃（下期可改随机）
  # T1 装备阶（DESIGN-ember-growth-curve.md）— 替换原 T0 保底刃
  - "$command{text=corerpg loot %player_name% weekly_t1;console=true} @player"
  # 2026-09-26 audit：服无经验球，附魔/铁砧需要经验等级 → 通关箱给 6 级（附魔 1～3 级/次，铁砧修理 2 级/片）
  - "$command{text=xp 6L %player_name%;console=true} @player"
  # 2026-09-26：战令赛季经验 + 余烬等级经验（CoreRpg progress.yml）
  - "$command{text=corerpg progress %player_name% weekly_clear;console=true} @player"
  - "$command{text=mvtp %player_name% ember_hub;console=true} @player"
