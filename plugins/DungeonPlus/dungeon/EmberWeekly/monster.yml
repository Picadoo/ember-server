# P3 2026-09-27: 深核廊三室刷点 — 前厅Y65 / 中核Y68 / 深室Y63
# 周 · Display：深核廊僵尸/骷髅/蛮兵·甲/蛮兵·乙
# kill / heal / reward 逻辑保留；不改 MM 血伤掉落
# 2026-09-28 中核链式: wave2→wave2a/2b；$kill 分组；消 kill-any；传深室挂 wave2b.end
groups:
  wave1:
  - monster:
    - "$mob{plugin=MythicMobs;name=EmberWeeklyZombie;location=-40,65,280;amount=3;scattered=1.0;level=1} @dungeon"
    condition:
    - "$kill{mobname=深核廊僵尸;amount=3} @system"
    start:
    - "$message{type=text;text=§e【深核·前厅】清杂：僵尸×3} @dungeon"
    end:
    - "$command{text=effect %player_name% instant_health 1 2 true;console=true} @player"
    - "$teleport{location=-40,68,308} @player"
    - "$monstergroup{group=wave2a;repeat=false;delay=3} @dungeon"
    auto-start: false

  # 中核链式重叠（对齐日常房2）：wave2a 尸 start 即刷 wave2b 骷；传深室仅在 wave2b.end；禁 kill-any
  wave2a:
  - monster:
    - "$mob{plugin=MythicMobs;name=EmberWeeklyZombie;location=-40,68,308;amount=2;scattered=1.0;level=1} @dungeon"
    condition:
    - "$kill{mobname=深核廊僵尸;amount=2} @system"
    start:
    - "$message{type=text;text=§e【深核·中核】僵尸贴上 —— 骷髅将交错压上} @dungeon"
    - "$monstergroup{group=wave2b;repeat=false;delay=2} @dungeon"
    end:
    - "$message{type=text;text=§7中核尸侧已清} @dungeon"
    - "$command{text=effect %player_name% instant_health 1 2 true;console=true} @player"
    auto-start: false

  wave2b:
  - monster:
    - "$mob{plugin=MythicMobs;name=EmberWeeklySkeleton;location=-42,68,312;amount=3;scattered=1.0;level=1} @dungeon"
    condition:
    - "$kill{mobname=深核廊骷髅;amount=3} @system"
    start:
    - "$message{type=text;text=§e【深核·中核】骷髅重叠压上 —— 清完进入深室} @dungeon"
    end:
    - "$message{type=text;text=§a中核已清 · 转入深室} @dungeon"
    - "$command{text=effect %player_name% instant_health 1 2 true;console=true} @player"
    - "$teleport{location=-40,63,340} @player"
    - "$monstergroup{group=wave3;repeat=false;delay=3} @dungeon"
    auto-start: false

  wave3:
  - monster:
    - "$mob{plugin=MythicMobs;name=EmberWeeklyBruteA;location=-40,63,340;amount=1;scattered=1.0;level=1} @dungeon"
    condition:
    - "$kill{mobname=深核廊蛮兵·甲;amount=1} @system"
    start:
    - "$message{type=text;text=§c【深核·深室】蛮兵·甲！清完还有终局·乙} @dungeon"
    end:
    - "$command{text=effect %player_name% instant_health 1 2 true;console=true} @player"
    - "$message{type=text;text=§a甲倒下 · 终局将至} @dungeon"
    - "$monstergroup{group=boss;repeat=false;delay=4} @dungeon"
    auto-start: false

  boss:
  - monster:
    - "$mob{plugin=MythicMobs;name=EmberWeeklyBruteB;location=-40,63,342;amount=1;scattered=1.0;level=1} @dungeon"
    condition:
    - "$kill{mobname=深核廊蛮兵·乙;amount=1} @system"
    start:
    - "$message{type=text;text=§4【深核·终局】蛮兵·乙——别贪刀} @dungeon"
    end:
    - "$end{type=text;text=§6深核·周 通关！;reward=true;delay=2;end-type=COMPLETE} @dungeon"
    auto-start: false
