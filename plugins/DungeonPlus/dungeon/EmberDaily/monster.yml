# 日 · 新 MM Display（去色）：灰烬庭院僵尸/骷髅/蛮兵
# 2026-09-27 P4: 灰烬庭院独立地图 — spawn 0,65,0；回廊刷点开放格；Boss 仅中央垫 0,66,12。
#   Waves 数量/回血/kill 条件不变（2 僵尸 → 1僵尸+2骷髅 → 蛮兵×1；波末 instant_health III）。
groups:
  wave1:
  - monster:
    - "$mob{plugin=MythicMobs;name=EmberDailyZombie;location=-13,65,6;amount=2;scattered=0.5;level=1} @dungeon"
    condition:
    - "$kill{mobname=灰烬庭院僵尸;amount=2} @system"
    start:
    - "$message{type=text;text=§e【庭院·清潮】第一波：回廊僵尸×2 —— 别急着冲中央} @dungeon"
    end:
    - "$message{type=text;text=§a第一波完成 · 余烬回暖（+12 生命）} @dungeon"
    - "$command{text=effect %player_name% instant_health 1 2 true;console=true} @player"
    - "$monstergroup{group=wave2;repeat=false;delay=3} @dungeon"
    auto-start: false

  wave2:
  - monster:
    - "$mob{plugin=MythicMobs;name=EmberDailyZombie;location=-13,65,24;amount=1;scattered=0.5;level=1} @dungeon"
    - "$mob{plugin=MythicMobs;name=EmberDailySkeleton;location=12,65,24;amount=2;scattered=0.5;level=1} @dungeon"
    condition:
    # 2026-09-26 修：DP 击杀条件按本组计数，原数量 > 本组刷怪数 → 永远卡波
    - "$kill-any{mobname=灰烬庭院僵尸,灰烬庭院骷髅;amount=3} @system"
    start:
    - "$message{type=text;text=§e【庭院·混响】第二波：僵尸+骷髅 —— 先清远程} @dungeon"
    end:
    - "$message{type=text;text=§a第二波完成 · 余烬回暖 · Boss 将至} @dungeon"
    - "$command{text=effect %player_name% instant_health 1 2 true;console=true} @player"
    - "$monstergroup{group=boss;repeat=false;delay=3} @dungeon"
    auto-start: false

  boss:
  - monster:
    - "$mob{plugin=MythicMobs;name=EmberDailyBrute;location=0,66,12;amount=1;scattered=0.5;level=1} @dungeon"
    condition:
    - "$kill{mobname=灰烬庭院蛮兵;amount=1} @system"
    start:
    - "$message{type=text;text=§c【庭院·中央垫】Boss 蛮兵！走位躲开砸击再输出} @dungeon"
    end:
    - "$end{type=text;text=§a余烬窟·日 通关！奖励发放中…;reward=true;delay=2;end-type=COMPLETE} @dungeon"
    auto-start: false
