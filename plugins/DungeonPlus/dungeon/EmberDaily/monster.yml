# 日 · S1 分房：门廊→房1前厅→开门→房2回廊→开门→Boss终厅
# 2026-09-28 S1: 波次 僵尸×5 / 混编×6 / 蛮兵×1；阶段 $operation-block 撤铁门
# 2026-09-28 门2修: wave2a 僵尸×3 + wave2b 骷髅×3（顺序单 $kill），开门链路无 kill-any
# 2026-09-28 波次差异: 房2 先对射骷×2 → 再涌尸×4（禁旧「先3尸后3骷」）
# Display 名仍：灰烬庭院僵尸/骷髅/蛮兵（MM 未改）
# 2026-09-28 门宽对齐: 门1 z=13 / 门2 z=25 仅 x=-1..1 × y=65..67（AIR×9）；删 loc=-2
# 2026-09-28 第二房/Boss前压试点: wave1 裁至4；door2→boss_prep(门槛尸×2)→boss；房2不动
# 2026-09-28 庭院房2链式: wave2a.start→wave2b delay=2；开门仍 wave2b.end→boss_prep
groups:
  wave1:
  - monster:
    - "$mob{plugin=MythicMobs;name=EmberDailyZombie;location=-5,65,7;amount=2;scattered=0.8;level=1} @dungeon"
    - "$mob{plugin=MythicMobs;name=EmberDailyZombie;location=5,65,7;amount=2;scattered=0.8;level=1} @dungeon"
    condition:
    - "$kill{mobname=灰烬庭院僵尸;amount=4} @system"
    start:
    - "$message{type=text;text=§e【前厅】清尽僵尸再开门 —— 别急着撞铁门} @dungeon"
    end:
    - "$message{type=text;text=§a前厅已清 · 门开了} @dungeon"
    - "$operation-block{loc=-1,65,13;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=-1,66,13;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=-1,67,13;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=0,65,13;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=0,66,13;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=0,67,13;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=1,65,13;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=1,66,13;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=1,67,13;mode=set;type=AIR} @dungeon"
    - "$command{text=effect %player_name% instant_health 1 2 true;console=true} @player"
    - "$monstergroup{group=wave2a;repeat=false;delay=3} @dungeon"
    auto-start: false

  # 房2链式：wave2a 对射骷 start→delay2 wave2b 涌尸；开门仍 wave2b.end→boss_prep；无 kill-any
  wave2a:
  - monster:
    - "$mob{plugin=MythicMobs;name=EmberDailySkeleton;location=-6,65,21;amount=1;scattered=0.5;level=1} @dungeon"
    - "$mob{plugin=MythicMobs;name=EmberDailySkeleton;location=6,65,21;amount=1;scattered=0.5;level=1} @dungeon"
    condition:
    - "$kill{mobname=灰烬庭院骷髅;amount=2} @system"
    start:
    - "$message{type=text;text=§e【回廊·对射】左右柱后骷髅 —— 涌尸将重叠压上} @dungeon"
    - "$monstergroup{group=wave2b;repeat=false;delay=2} @dungeon"
    end:
    - "$message{type=text;text=§7对射侧已清} @dungeon"
    - "$command{text=effect %player_name% instant_health 1 2 true;console=true} @player"
    auto-start: false

  wave2b:
  - monster:
    - "$mob{plugin=MythicMobs;name=EmberDailyZombie;location=-6,65,17;amount=2;scattered=0.8;level=1} @dungeon"
    - "$mob{plugin=MythicMobs;name=EmberDailyZombie;location=6,65,17;amount=1;scattered=0.5;level=1} @dungeon"
    - "$mob{plugin=MythicMobs;name=EmberDailyZombie;location=0,65,19;amount=1;scattered=0.5;level=1} @dungeon"
    condition:
    - "$kill{mobname=灰烬庭院僵尸;amount=4} @system"
    start:
    - "$message{type=text;text=§e【回廊·涌尸】僵尸重叠压上 —— 清完开 Boss 门} @dungeon"
    end:
    - "$message{type=text;text=§a回廊已清 · Boss 门开了 · 终厅门槛压} @dungeon"
    - "$operation-block{loc=-1,65,25;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=-1,66,25;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=-1,67,25;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=0,65,25;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=0,66,25;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=0,67,25;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=1,65,25;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=1,66,25;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=1,67,25;mode=set;type=AIR} @dungeon"
    - "$command{text=effect %player_name% instant_health 1 2 true;console=true} @player"
    - "$monstergroup{group=boss_prep;repeat=false;delay=2} @dungeon"
    auto-start: false

  # Boss 前门压：终厅门槛内侧两侧尸贴脸（door2 z=25 与 Boss z=31 之间）
  boss_prep:
  - monster:
    - "$mob{plugin=MythicMobs;name=EmberDailyZombie;location=-3,65,27;amount=1;scattered=0.5;level=1} @dungeon"
    - "$mob{plugin=MythicMobs;name=EmberDailyZombie;location=3,65,27;amount=1;scattered=0.5;level=1} @dungeon"
    condition:
    - "$kill{mobname=灰烬庭院僵尸;amount=2} @system"
    start:
    - "$message{type=text;text=§e【终厅·门槛】两侧僵尸贴脸 —— 清完才出蛮兵} @dungeon"
    end:
    - "$message{type=text;text=§7门槛已清 · 蛮兵现身} @dungeon"
    - "$command{text=effect %player_name% instant_health 1 2 true;console=true} @player"
    - "$monstergroup{group=boss;repeat=false;delay=2} @dungeon"
    auto-start: false

  boss:
  - monster:
    - "$mob{plugin=MythicMobs;name=EmberDailyBrute;location=0,66,31;amount=1;scattered=0.5;level=1} @dungeon"
    condition:
    - "$kill{mobname=灰烬庭院蛮兵;amount=1} @system"
    start:
    - "$message{type=text;text=§c【终厅·中央垫】Boss 蛮兵！走位躲开砸击再输出} @dungeon"
    end:
    - "$end{type=text;text=§a余烬窟·庭院 通关！奖励发放中…;reward=true;delay=2;end-type=COMPLETE} @dungeon"
    auto-start: false
