# D421 骨架 · 短征 sx13 烬衡悬梁（EmberSx13）— 与 EmberSx12 同构：DP 只建实例，不刷怪不发奖。
# 地图：ember_short_sx13（本地骨架另号；烬衡悬梁主题 WE 另号）
# 进入：只经 CoreRpg（菜单 / corerpg p1 enter sx13）→ 预留体力 30 → 发 P1 通行证再 dp start-console。
# 房间/门/首领/S52 结算由 CoreRpg（ember-v1-runs.yml short.sx13）；结束走 ember_p1_complete / ember_p1_fail。
# 首航硬提醒：short.sx13 须含 rooms×3+boss（防 D391 FAIL）。
# MM：另号 · Guard/Crossbow/Elite/Warden + EmberSx13BalanceCast；本壳不假造完整 MM 波次。
# 禁：窄桥复读 sx05；跳石复读 sx09；转枢复读 sx12；递闸串室复读 sx10；对廊/环廊/塔升/错层/风廊/霜雾廊气质当主识别。

dungeon-init-script:
  - "$setmap{name=ember_short_sx13} @init"
  - "$setspawn{location=0,64,5} @init"
  - "$setting{break=false;place=false;pvp=false;mode=ADVENTURE} @init"
  - "$revive-setting{revive=false;number=0;death-location=true} @init"

dungeon-start:
  condition:
    - "$team-condition{team=true;min=1;max=1;message=§c短征人数 1，当前 (<size>)} @system"
    - "$js-condition{text='%corerpg_p1_pass_sx13%'=='yes';message=§c请从 §e短征 · 选本 §c菜单进入烬衡悬梁（体力与解锁由 CoreRpg 校验）} @system"
  action-script:
    - "$message{type=text;text=§6[余烬] §e烬衡悬梁 §7· 短征 · 衡门庭→悬梁衡廊→衡冠终厅；过配重衡梁后击败衡冠守吏，统一结算} @dungeon"
    - "$teleport{location=0,64,5;defspawn=true} @player"

dungeon-area: []

# 结算由 CoreRpg（S52）；禁本文件发旧币表
dungeon-reward-script: []
