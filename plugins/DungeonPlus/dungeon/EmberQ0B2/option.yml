# D174 stage 2b 首领厅（连战·前哨 Q05 / 首领残响 Q04–Q07）。地图 ember_daily_spire_v1（Q05 断塔回廊）的首领厅，和 D144 余烬连战（EmberQ0B1）同一个大厅、独立的 DP 副本。
# 进入：只经 CoreRpg（冒险 → 进阶模式 / /corerpg p1 rush <outpost|echo_q01..q07> go）：先校验本人首通，再发 P1 通行证并 dp start-console。
# 几个模式共用这个副本：通行证按副本校验（%corerpg_p1_passd_EmberQ0B2%），具体打哪个模式由 CoreRpg 的会话决定。
# 本文件不刷怪、不发奖：首领由 CoreRpg（ember-v1-runs.yml rush: outpost / echo_*）在大厅中央生成，
# 结束由 CoreRpg 触发脚本组 ember_p1_complete / ember_p1_fail（actionscript/ember-p1.yml）。reward=false，无旧奖励脚本（E02）。

dungeon-init-script:
  - "$setmap{name=ember_daily_spire_v1} @init"
  - "$setspawn{location=0,80,133} @init"
  - "$setting{break=false;place=false;pvp=false;mode=ADVENTURE} @init"
  # 与主线普通版相同：无倒地/复活系统，倒下观战，全员倒下即失败（CoreRpg 判定）
  - "$revive-setting{revive=false;number=0;death-location=true} @init"

dungeon-start:
  condition:
    - "$team-condition{team=true;min=1;max=3;message=§c首领厅人数 1～3，当前 (<size>)} @system"
    - "$js-condition{text='%corerpg_p1_passd_EmberQ0B2%'=='yes';message=§c请从 冒险 → 进阶模式 进入（资格由 CoreRpg 校验）} @system"
  action-script:
    - "$message{type=text;text=§6[余烬] §c首领厅 §7· 首领在大厅中央现身；打倒后统一结算} @dungeon"
    - "$teleport{location=0,80,133;defspawn=true} @player"

dungeon-area: []

# 不发任何旧奖励（徽记 / 印记全部由 CoreRpg 单次结算）
dungeon-reward-script: []
