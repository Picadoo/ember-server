# D391 FAIL 修 · 短征 sx01 烬门哨岗（EmberSx01）— 与主线 Q01 同构：DP 只建实例，不刷怪不发奖。
# 地图：ember_short_sx01（自 ember_daily_v1 / Q01 白盒拷贝 · 有墙有门洞有垫）
# 进入：只经 CoreRpg（菜单 / corerpg p1 enter sx01）→ 预留体力 30 → 发 P1 通行证再 dp start-console。
# 房间/门/首领/S40 结算由 CoreRpg（ember-v1-runs.yml short.sx01）；结束走 ember_p1_complete / ember_p1_fail。

dungeon-init-script:
  - "$setmap{name=ember_short_sx01} @init"
  - "$setspawn{location=0,64,5} @init"
  - "$setting{break=false;place=false;pvp=false;mode=ADVENTURE} @init"
  - "$revive-setting{revive=false;number=0;death-location=true} @init"

dungeon-start:
  condition:
    - "$team-condition{team=true;min=1;max=1;message=§c短征人数 1，当前 (<size>)} @system"
    - "$js-condition{text='%corerpg_p1_pass_sx01%'=='yes';message=§c请从 §e短征 · 烬门哨岗 §c菜单进入（体力与解锁由 CoreRpg 校验）} @system"
  action-script:
    - "$message{type=text;text=§6[余烬] §e烬门哨岗 §7· 短征 · 走进前方房间开始；清房开门，击败首领后统一结算} @dungeon"
    - "$teleport{location=0,64,5;defspawn=true} @player"

dungeon-area: []

# 结算由 CoreRpg（S40）；禁本文件发旧币表
dungeon-reward-script: []
