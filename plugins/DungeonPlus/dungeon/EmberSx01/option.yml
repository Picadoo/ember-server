# D391 骨架 · 短征 sx01 烬门哨岗（EmberSx01）
# 地图：ember_short_sx01（本地自 ember_daily_v1 白盒复制 · 有墙有门有垫 · 主题换皮待 WE）
# 进入：只经 CoreRpg（菜单 / corerpg p1 enter sx01）→ 预留体力 30 → 发 P1 通行证再 dp start-console。
# 本号：地图+DP 壳；刷怪/日帽/S40 结算 / p1 pass 键 → 并行号（MM / 插件键 / 经济）。
# reward=false 路径：结算由 CoreRpg 单次发放（对齐 Q01）；本文件不发旧 DP 奖励。

dungeon-init-script:
  - "$setmap{name=ember_short_sx01} @init"
  - "$setspawn{location=0,64,5} @init"
  - "$setting{break=false;place=false;pvp=false;mode=ADVENTURE} @init"
  - "$revive-setting{revive=false;number=0;death-location=true} @init"

dungeon-start:
  condition:
    - "$team-condition{team=true;min=1;max=1;message=§c短征人数 1，当前 (<size>)} @system"
    - "$js-condition{text='%corerpg_p1_pass_sx01%'=='yes';message=§c请从 §e短征 · 烬门哨岗 §c菜单进入（体力与解锁由 CoreRpg 校验；进本键未就绪时不可开）} @system"
  action-script:
    - "$message{type=text;text=§6[余烬] §e烬门哨岗 §7· 短征 · 清三房 · 终厅拉开可躲} @dungeon"
    - "$teleport{location=0,64,5;defspawn=true} @player"

dungeon-area: []

# 结算由 CoreRpg（S40）；禁本文件发旧币表
dungeon-reward-script: []
