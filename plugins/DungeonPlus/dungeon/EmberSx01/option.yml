# D391 续 · 短征 sx01 烬门哨岗（EmberSx01）— 刷点已钉
# 地图：ember_short_sx01（自 ember_daily_v1 / Q01 白盒拷贝 · 有墙有门洞有垫）
# 进入：只经 CoreRpg（菜单 / corerpg p1 enter sx01）→ 预留体力 30 → 发 P1 通行证再 dp start-console。
# reward=false：结算由 CoreRpg S40；本文件不发旧 DP 奖励。
# 开本：关 Q01 三道门洞铁栅（模板为 AIR）→ 启 wave1

dungeon-init-script:
  - "$setmap{name=ember_short_sx01} @init"
  - "$setspawn{location=0,64,5} @init"
  - "$setting{break=false;place=false;pvp=false;mode=ADVENTURE} @init"
  - "$revive-setting{revive=false;number=0;death-location=true} @init"

dungeon-start:
  condition:
    - "$team-condition{team=true;min=1;max=1;message=§c短征人数 1，当前 (<size>)} @system"
