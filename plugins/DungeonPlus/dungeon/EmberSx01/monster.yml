  - monster:
    - "$mob{plugin=MythicMobs;name=EmberSx01Warden;location=0,64,102;amount=1;scattered=0.5;level=1} @dungeon"
    condition:
    - "$kill{mobname=烬门哨长;amount=1} @system"
    start:
    - "$message{type=text;text=§c【烬门·终厅】烬门哨长！蓄力砸地时拉开} @dungeon"
    end:
    - "$end{type=text;text=§a烬门哨岗 通关！结算发放中…;reward=false;delay=2;end-type=COMPLETE} @dungeon"
    auto-start: false
