# 短征 sx01 · EmberSx01 刷点（D391 续 · 钉坐标）
# 地图：ember_short_sx01 = 自 ember_daily_v1（Q01 白盒）拷贝；坐标沿用 CoreRpg q01 rooms/boss
# 对照：EmberDailyFrost monster.yml 分房 $kill + 门 AIR；Q01 门模板为 AIR，开本先关铁栅
# 三房：R1 哨岗尸+哨弓骷 → 门1 → R2 伍长 → 门2/门3 + 传终厅口 → R3 烬门哨长（Cast 在 MM）
# Display/$kill 去色名：哨岗尸 / 哨弓骷 / 哨岗伍长 / 烬门哨长
# 禁：改旧七线 Daily；本文件不发旧 DP 奖励（reward=false；S40 由 CoreRpg）

groups:
  wave1:
  - monster:
    - "$mob{plugin=MythicMobs;name=EmberSx01Zombie;location=-6,64,29;amount=2;scattered=0.8;level=1} @dungeon"
    - "$mob{plugin=MythicMobs;name=EmberSx01Zombie;location=0,64,29;amount=1;scattered=0.5;level=1} @dungeon"
    - "$mob{plugin=MythicMobs;name=EmberSx01Skeleton;location=6,64,29;amount=1;scattered=0.5;level=1} @dungeon"
    - "$mob{plugin=MythicMobs;name=EmberSx01Skeleton;location=9,64,28;amount=1;scattered=0.5;level=1} @dungeon"
    condition:
    - "$kill{mobname=哨岗尸;amount=3} @system"
    - "$kill{mobname=哨弓骷;amount=2} @system"
    start:
    - "$message{type=text;text=§e【哨岗·前庭】清尽哨岗尸与哨弓骷 —— 别急着撞铁门} @dungeon"
    end:
    - "$message{type=text;text=§a前庭已清 · 东闸开了} @dungeon"
    - "$operation-block{loc=16,64,29;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=16,64,30;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=16,64,31;mode=set;type=AIR} @dungeon"
