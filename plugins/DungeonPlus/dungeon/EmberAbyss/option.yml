# 余烬深渊 — docs/ember-abyss-evacuate-spec.md · DESIGN-ember-abyss-evacuate.md
# 启动：/dp start EmberAbyss（玩家走菜单按钮，勿在 tell 里强调指令）
# 次数：维护备忘：遗留票物/体力口径；现行进本扣体力（深渊无首免，按 cash.yml stamina.costs.abyss，现行 30）
# 维护备忘：扣次由 CoreRpg TicketEntryService/StaminaService 在 corerpg enter 时处理，本文件不扣次；遗留 NI 票物 ticket_ember_abyss 按 stamina.ticket_convert 折体力
# 材料/孔石：corerpg abyss settle 按最高层查表；COMPLETE 额外 T2 周首；战斗掉落仍走 MM
# 2026-09-27 P2 shaft：井顶 spawn (-40,90,274)；层平台见 monster.yml / STATUS-ember-abyss-maps-p2
# 2026-09-27 stage4.1：COMPLETE 顶层 = floor12（非 floor8）；周首通稳定符在 settle(floor≥12) 内发

dungeon-init-script:
  - "$setmap{name=ember_abyss} @init"
  - "$setspawn{location=-40,90,274} @init"
  - "$setting{break=false;place=false;pvp=false;mode=ADVENTURE} @init"
  - "$revive-setting{revive=true;number=2;death-location=true} @init"

dungeon-start:
  condition:
    - "$team-condition{team=true;min=1;max=2;message=§c深渊人数 1～2，当前 (<size>)} @system"
    # 2026-09-26 等级门槛（CoreRpg progress.yml level_gates.abyss=25；DP 逐队员判定；被拒未进本时 CoreRpg 退还本次体力；OP 豁免）
    - "$js-condition{text='%corerpg_gate_abyss%'=='yes'||'%player_is_op%'=='yes';message=§c深渊需要余烬等级 §eLv.25§c · 队伍中有人等级不足 · 打开枢纽 → 角色查看等级} @system"
    # 维护备忘：体力已在 corerpg enter 扣除；未进本自动退还，进本后撤离按最高层结算、体力不退；此处仅保留人数/等级门
  action-script:
    - "$message{type=text;text=§5深渊已开启。§7能走多深，就走多深。本期可下潜至第 §f12 §7层。} @dungeon"
    - "$message{type=text;text=§8需要撤离：打开菜单 → 深渊 → 撤离 · 按最高层结算 · 体力不退} @dungeon"
    - "$teleport{location=-40,90,274;defspawn=true} @player"
    - "$command{text=corerpg abyss progress %player_name% 0;console=true} @player"
    - "$monstergroup{group=floor1;repeat=false;delay=2} @dungeon"

dungeon-area: []

# COMPLETE（本期顶层 floor12）触发：settle 发档位箱 + 周首通稳定符(≥12) + T2 刃/护符 + 回城
# 撤离/超时走 jar evacuate 或 timeout settle，勿再走本脚本（reward=false）
# 周首通稳定符只在 AbyssSettleService.settle(floor≥12) 发，此处勿再调 corerpg loot abyss_weekly12
# 2026-09-26 修：$command 不认 <player.name>（控制台 "玩家 <player.name> 不在线"，奖励/结算/回城从未执行）→ PAPI %player_name%
dungeon-reward-script:
  - "$message{type=text;text=§5深渊结算：按本局最高层发箱（体力不退）} @dungeon"
  - "$command{text=corerpg abyss settle %player_name%;console=true} @player"
  - "$command{text=corerpg loot %player_name% abyss_t2;console=true} @player"
  # 2026-09-26：战令赛季经验 + 余烬等级经验（CoreRpg progress.yml）
  - "$command{text=corerpg progress %player_name% abyss_clear;console=true} @player"
  - "$command{text=mvtp %player_name% ember_hub;console=true} @player"
