# 2026-09-27 P2 shaft: per-floor ring platforms (Y step~5; F10-12 wider). Teleport on wave start.
# 2026-09-27: spawn points moved into the map's open room (old ones were inside solid blocks → mobs/bosses suffocated;
#   see docs/critic-fixes-20260927.md §10). Map ember_abyss room: x -43..-37, z 267..273
# 深渊 · Display：余烬深渊·潮尸/骨潮/混潮/蛮层/看守
# 冲层+撤离：docs/ember-abyss-evacuate-spec.md · DESIGN-ember-abyss-evacuate.md
# 清层 end：progress N → 播报+撤离提示 → 下一层（顶层 floor12 COMPLETE）
# 2026-09-27 stage4.1：可下潜至 12；撤离提示改为菜单文案
# 2026-09-26 修：$command 不认 <player.name>（控制台 "玩家 <player.name> 不在线"，奖励/结算/回城从未执行）→ PAPI %player_name%
groups:
  floor1:
  - monster:
    - "$mob{plugin=MythicMobs;name=EmberAbyssZombie;location=-38,85,274;amount=3;scattered=1.0;level=1} @dungeon"
    condition:
    - "$kill{mobname=余烬深渊·潮尸;amount=3} @system"
    start:
    - "$teleport{location=-38,85,274} @player"
    - "$message{type=text;text=§5—— 第 §f1 §5层 —— §7潮尸×3} @dungeon"
    end:
    # 2026-09-27 real-combat balance: wave-end heal (Instant Health III, 16 HP)
    - "$command{text=effect %player_name% instant_health 1 2 true;console=true} @player"
    - "$command{text=corerpg abyss progress %player_name% 1;console=true} @player"
    - "$message{type=text;text=§a第 1 层通过} @dungeon"
    - "$message{type=text;text=§8需要撤离：打开菜单 → 深渊 → 撤离} @dungeon"
    - "$monstergroup{group=floor2;repeat=false;delay=3} @dungeon"
    auto-start: false

  floor2:
  - monster:
    - "$mob{plugin=MythicMobs;name=EmberAbyssMix;location=-42,80,266;amount=2;scattered=1.0;level=1} @dungeon"
    - "$mob{plugin=MythicMobs;name=EmberAbyssSkeleton;location=-38,80,266;amount=2;scattered=1.0;level=1} @dungeon"
    condition:
    - "$kill-any{mobname=余烬深渊·混潮,余烬深渊·骨潮;amount=4} @system"
    start:
    - "$teleport{location=-42,80,266} @player"
    - "$message{type=text;text=§5—— 第 §f2 §5层 —— §7混潮+骨潮} @dungeon"
    end:
    # 2026-09-27 real-combat balance: wave-end heal (Instant Health III, 16 HP)
    - "$command{text=effect %player_name% instant_health 1 2 true;console=true} @player"
    - "$command{text=corerpg abyss progress %player_name% 2;console=true} @player"
    - "$message{type=text;text=§a第 2 层通过} @dungeon"
    - "$message{type=text;text=§8需要撤离：打开菜单 → 深渊 → 撤离} @dungeon"
    - "$monstergroup{group=floor3;repeat=false;delay=3} @dungeon"
