# D410 骨架 · 短征 sx08 错层烬庭（EmberSx08）— 与 EmberSx07 同构：DP 只建实例，不刷怪不发奖。
# 地图：ember_short_sx08（本地自 ember_elite 拷贝；错层烬庭主题 WE 另号）
# 进入：只经 CoreRpg（菜单 / corerpg p1 enter sx08）→ 预留体力 30 → 发 P1 通行证再 dp start-console。
# 房间/门/首领/S47 结算由 CoreRpg（ember-v1-runs.yml short.sx08）；结束走 ember_p1_complete / ember_p1_fail。
# 首航硬提醒：short.sx08 须含 rooms×3+boss（防 D391 FAIL）。
# MM：庭卫/错层弩/上层守吏 + EmberSx08…Cast → 怪物岗另号；本壳不假造完整 MM。

dungeon-init-script:
  - "$setmap{name=ember_short_sx08} @init"
  - "$setspawn{location=0,64,5} @init"
  - "$setting{break=false;place=false;pvp=false;mode=ADVENTURE} @init"
  - "$revive-setting{revive=false;number=0;death-location=true} @init"

dungeon-start:
  condition:
    - "$team-condition{team=true;min=1;max=1;message=§c短征人数 1，当前 (<size>)} @system"
    - "$js-condition{text='%corerpg_p1_pass_sx08%'=='yes';message=§c请从 §e短征 · 选本 §c菜单进入错层烬庭（体力与解锁由 CoreRpg 校验）} @system"
  action-script:
    - "$message{type=text;text=§6[余烬] §e错层烬庭 §7· 短征 · 下层庭→错层换层→上层终厅；清房开门，击败上层守吏后统一结算} @dungeon"
    - "$teleport{location=0,64,5;defspawn=true} @player"

dungeon-area: []

# 结算由 CoreRpg（S47）；禁本文件发旧币表
dungeon-reward-script: []
