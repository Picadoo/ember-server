# 余烬·精英试炼 — docs/design/design-stage4-elite-weekly.md §1～§5
# 启动：菜单 corerpg elite start → dp start EmberEliteWeekly（玩家不可见 /dp start）
# 次数：维护备忘：遗留票物/体力口径；现行进本扣发起者体力（本周首次免费，之后按 cash.yml stamina.costs.elite，现行 40）；每人每周通关 1 次
# 维护备忘：扣次由 CoreRpg TicketEntryService/StaminaService 在 corerpg enter 时处理，本文件不扣次；遗留 NI 票物 ticket_ember_elite 按 stamina.ticket_convert 折体力
# P3 2026-09-27: 独立 map ember_elite 试炼短廊（石英/金砖中轴）

dungeon-init-script:
  - "$setmap{name=ember_elite} @init"
  - "$setspawn{location=-35,70,270} @init"
  - "$setting{break=false;place=false;pvp=false;mode=ADVENTURE} @init"
  - "$revive-setting{revive=true;number=3;death-location=true} @init"

dungeon-start:
  condition:
    - "$team-condition{team=true;min=1;max=2;message=§c精英试炼人数 1～2，当前 (<size>)} @system"
    # 等级 + 本周未通关（%corerpg_gate_elite%，不查票/首免）；OP 豁免；发起者在 CoreRpg 先判同两项，不符不扣；队员被拒未进本时 CoreRpg 退还本次体力/首免
    - "$js-condition{text='%corerpg_gate_elite%'=='yes'||'%player_is_op%'=='yes';message=§c精英试炼需要余烬 Lv.40，且本周尚未通关} @system"
    # 维护备忘：体力/首免已在 corerpg enter 扣除（未进本自动退还）；此处仅保留人数/等级门
  action-script:
    - "$message{type=text;text=§e精英试炼开启。§7每人每周限通关一次，没过可以再来——词缀会咬人。} @dungeon"
    - "$teleport{location=-35,70,270;defspawn=true} @player"
    - "$monstergroup{group=wave1;repeat=false;delay=2} @dungeon"

dungeon-area: []

# COMPLETE 奖励顺序：通关箱 → 孔石 → 周首通稳定符 → progress → quest event → 回城
# $command 使用 PAPI %player_name%（勿用 <player.name>）
dungeon-reward-script:
  - "$message{type=text;text=§a试炼通过。§7火还在你这边。} @dungeon"
  - "$command{text=ni give %player_name% mat_ember_core_fragment 4;console=true} @player"
  - "$command{text=ni give %player_name% mat_ember_shard 12;console=true} @player"
  - "$command{text=ni give %player_name% mat_ember_bone_dust 6;console=true} @player"
  - "$command{text=ni give %player_name% crystal_ember_enchant 1;console=true} @player"
  - "$command{text=corerpg loot %player_name% elite_gem;console=true} @player"
  - "$command{text=corerpg elite weekly-first %player_name%;console=true} @player"
  - "$command{text=corerpg progress %player_name% elite_weekly;console=true} @player"
  - "$command{text=corerpg quest event %player_name% elite_weekly_clear;console=true} @player"
  - "$command{text=mvtp %player_name% ember_hub;console=true} @player"
