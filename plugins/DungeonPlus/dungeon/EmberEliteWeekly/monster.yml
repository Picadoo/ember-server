# P3 2026-09-27: ember_elite 试炼短廊刷点 — 厅一Y70 / 厅二Y72 / 厅三Y68
# Display 与 MythicMobs EmberEliteWeekly.yml 去色明文对齐；不改 MM 血伤掉落
groups:
  wave1:
  - monster:
    - "$mob{plugin=MythicMobs;name=EmberEliteZombie;location=-30,70,270;amount=3;scattered=1.0;level=1} @dungeon"
    - "$mob{plugin=MythicMobs;name=EmberEliteSkeleton;location=-28,70,272;amount=2;scattered=1.0;level=1} @dungeon"
    condition:
    - "$kill-any{mobname=余烬试炼·炽尸,余烬试炼·骨刺;amount=5} @system"
    start:
    - "$message{type=text;text=§e—— 试炼一：词缀苏醒 ——} @dungeon"
    end:
    - "$command{text=effect %player_name% instant_health 1 2 true;console=true} @player"
    - "$message{type=text;text=§7第一层词缀散了。} @dungeon"
    - "$teleport{location=-4,72,270} @player"
    - "$monstergroup{group=wave2;repeat=false;delay=3} @dungeon"
    auto-start: false

  wave2:
  - monster:
    - "$mob{plugin=MythicMobs;name=EmberEliteBrute;location=-4,72,270;amount=1;scattered=1.0;level=1} @dungeon"
    - "$mob{plugin=MythicMobs;name=EmberEliteMix;location=-6,72,268;amount=2;scattered=1.0;level=1} @dungeon"
    condition:
    - "$kill-any{mobname=余烬试炼·蛮纹,余烬试炼·混纹;amount=3} @system"
    start:
    - "$message{type=text;text=§c—— 试炼二：蛮压词缀 ——} @dungeon"
    end:
    - "$command{text=effect %player_name% instant_health 1 2 true;console=true} @player"
    - "$message{type=text;text=§7蛮压退潮。执行官在前。} @dungeon"
    - "$teleport{location=22,68,270} @player"
    - "$monstergroup{group=wave3;repeat=false;delay=3} @dungeon"
    auto-start: false

  wave3:
  - monster:
    - "$mob{plugin=MythicMobs;name=EmberEliteBoss;location=24,68,270;amount=1;scattered=1.0;level=1} @dungeon"
    condition:
    - "$kill{mobname=余烬试炼·烬纹执行官;amount=1} @system"
    start:
    - "$message{type=text;text=§4—— 试炼终：烬纹执行官 ——} @dungeon"
    end:
    - "$end{type=text;text=§a试炼通过。§7火还在你这边。;reward=true;delay=2;end-type=COMPLETE} @dungeon"
    auto-start: false
