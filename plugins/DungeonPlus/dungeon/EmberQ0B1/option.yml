# D144 余烬连战（每周首领连战）。地图 ember_daily_spire_v1（Q05 断塔回廊）的首领厅：出生即在大厅入口，R3→大厅的门由 CoreRpg 加护栏。
# 进入：只经 CoreRpg（冒险菜单 / /corerpg p1 enter rush）：先校验本人首通 Q07、本周次数（每周 1 次），再发 P1 通行证并 dp start-console。
# 本文件不刷怪、不发奖：Q05 → Q06 → Q07 三个首领依次在大厅中央现身（招式同各自主线图），由 CoreRpg（ember-v1-runs.yml rush:）负责，
# 结束由 CoreRpg 触发脚本组 ember_p1_complete / ember_p1_fail（actionscript/ember-p1.yml）。reward=false，无旧奖励脚本（E02）。

dungeon-init-script:
  - "$setmap{name=ember_daily_spire_v1} @init"
  - "$setspawn{location=0,80,133} @init"
  - "$setting{break=false;place=false;pvp=false;mode=ADVENTURE} @init"
  # 与主线普通版相同：无倒地/复活系统，倒下观战，全员倒下即失败（CoreRpg 判定）
  - "$revive-setting{revive=false;number=0;death-location=true} @init"

dungeon-start:
  condition:
    - "$team-condition{team=true;min=1;max=3;message=§c余烬连战人数 1～3，当前 (<size>)} @system"
    - "$js-condition{text='%corerpg_p1_pass_rush%'=='yes';message=§c请从 冒险 菜单或 /corerpg p1 enter rush 进入（资格与每周次数由 CoreRpg 校验）} @system"
  action-script:
    - "$message{type=text;text=§6[余烬] §c余烬连战 §7· 三个首领依次现身，中间短暂休息；全部击败后统一结算} @dungeon"
    - "$teleport{location=0,80,133;defspawn=true} @player"

dungeon-area: []

# 不发任何旧奖励（T3 印记 / 余烬徽 / 称号全部由 CoreRpg 单次结算）
dungeon-reward-script: []
