# P5 2026-09-27: realign to ember_raid hall/corridor/boss open cells (数值未改)
# 轻量盟 Boss：2 波杂兵/精英 + EmberCalamityBoss
# MM：EmberAbyssZombie / EmberAbyssSkeleton / EmberAbyssBrute / EmberCalamityBoss（已有，无新 MM）
# $kill Display（无颜色）：余烬深渊·潮尸 / 余烬深渊·骨潮 / 余烬深渊·蛮层 / 余烬灾厄使
groups:
  wave1:
  - monster:
    - "$mob{plugin=MythicMobs;name=EmberAbyssZombie;location=4,65,-6;amount=5;scattered=1.0;level=1} @dungeon"
    - "$mob{plugin=MythicMobs;name=EmberAbyssSkeleton;location=4,65,6;amount=3;scattered=1.0;level=1} @dungeon"
    condition:
    # 2026-09-26 修：mobname 须与 MM Display 去色一致（EmberAbyss* 实际是 余烬深渊·潮尸/骨潮/蛮层），原名永不匹配 → 卡波
    - "$kill{mobname=余烬深渊·潮尸;amount=5} @system"
    - "$kill{mobname=余烬深渊·骨潮;amount=3} @system"
    start:
    - "$message{type=text;text=§6盟 Boss 波次 1：§7深渊潮 · 僵尸与骨鸣} @dungeon"
    end:
    # 2026-09-27 real-combat balance: wave-end heal (Instant Health III, 16 HP)
    - "$command{text=effect %player_name% instant_health 1 2 true;console=true} @player"
    - "$message{type=text;text=§a第一波肃清 · 蛮兵将至} @dungeon"
    - "$monstergroup{group=wave2;repeat=false;delay=3} @dungeon"
    auto-start: false

  wave2:
  - monster:
    - "$mob{plugin=MythicMobs;name=EmberAbyssBrute;location=20,65,0;amount=1;scattered=1.0;level=1} @dungeon"
    - "$mob{plugin=MythicMobs;name=EmberAbyssZombie;location=20,65,0;amount=3;scattered=1.0;level=1} @dungeon"
    condition:
    # 2026-09-26 修：mobname 须与 MM Display 去色一致（EmberAbyss* 实际是 余烬深渊·潮尸/骨潮/蛮层），原名永不匹配 → 卡波
    - "$kill{mobname=余烬深渊·蛮层;amount=1} @system"
    start:
    - "$message{type=text;text=§d精英：§f余烬深渊蛮兵} @dungeon"
    end:
    # 2026-09-27 real-combat balance: wave-end heal (Instant Health III, 16 HP)
    - "$command{text=effect %player_name% instant_health 1 2 true;console=true} @player"
    - "$message{type=text;text=§4地脉裂口——§c余烬灾厄使§4现身！} @dungeon"
    - "$monstergroup{group=boss;repeat=false;delay=3} @dungeon"
    auto-start: false

  boss:
  - monster:
    # 2026-09-27: boss (wither skeleton, 2.4 tall) moved to the room centre; at z 276 it sat in the 3-high outer ring and could not step onto the 2-high quartz ledge → never reached players
    - "$mob{plugin=MythicMobs;name=EmberGuildCalamity;location=40,66,0;amount=1;scattered=1.0;level=1} @dungeon"
    condition:
    - "$kill{mobname=余烬灾厄使;amount=1} @system"
    start:
    - "$message{type=text;text=§4终局：余烬灾厄使！§7全力输出。} @dungeon"
    end:
    - "$message{type=text;text=§a灾厄使倒下。§6盟约周 Boss 通关结算中…} @dungeon"
    - "$end{type=text;text=§6余烬盟约 Boss 通关！;reward=true;delay=2;end-type=COMPLETE} @dungeon"
    auto-start: false
