# 日 · S2 线 B 焦骨甬道：拱门→房1→开门→房2混编→开门→Boss 鼓室
# 分房 $kill（禁 $kill-any）；门 IRON_FENCE x=-1..1 y=65..67 @ z=16/36 → AIR
# Display：$kill 对齐 MM 去色名 焦骨尸 / 燃矢骷 / 焦核蛮兵
# 2026-09-28 波次差异: 房1 主甬×4 + 假岔尽头×2 同组计入 door1（假岔无怪/不计入=FAIL）
# 2026-09-28 房2链式: wave2a.start→wave2b delay=2；开门+boss 仍在 wave2b.end
# 2026-09-28 Boss前压: wave2b.end→boss_prep(燃矢×2 @ ±2,65,38)→boss；房2链式零动
groups:
  wave1:
  - monster:
    - "$mob{plugin=MythicMobs;name=EmberAshZombie;location=-3,65,8;amount=2;scattered=0.8;level=1} @dungeon"
    - "$mob{plugin=MythicMobs;name=EmberAshZombie;location=3,65,8;amount=2;scattered=0.8;level=1} @dungeon"
    - "$mob{plugin=MythicMobs;name=EmberAshZombie;location=8,65,10;amount=1;scattered=0.5;level=1} @dungeon"
    - "$mob{plugin=MythicMobs;name=EmberAshZombie;location=7,65,11;amount=1;scattered=0.5;level=1} @dungeon"
    condition:
    - "$kill{mobname=焦骨尸;amount=6} @system"
    start:
    - "$message{type=text;text=§e【甬道·前段】主甬+假岔焦骨尸 —— 假岔也要清才开门} @dungeon"
    end:
    - "$message{type=text;text=§a前段已清 · 门开了} @dungeon"
    - "$operation-block{loc=-1,65,16;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=-1,66,16;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=-1,67,16;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=0,65,16;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=0,66,16;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=0,67,16;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=1,65,16;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=1,66,16;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=1,67,16;mode=set;type=AIR} @dungeon"
    - "$command{text=effect %player_name% instant_health 1 2 true;console=true} @player"
    - "$monstergroup{group=wave2a;repeat=false;delay=3} @dungeon"
    auto-start: false

  # 房2：尸×3+燃矢×3 链式重叠（对齐断塔）；开门仅在 wave2b
  wave2a:
  - monster:
    - "$mob{plugin=MythicMobs;name=EmberAshZombie;location=-2,65,24;amount=2;scattered=0.8;level=1} @dungeon"
    - "$mob{plugin=MythicMobs;name=EmberAshZombie;location=0,65,22;amount=1;scattered=0.5;level=1} @dungeon"
    condition:
    - "$kill{mobname=焦骨尸;amount=3} @system"
    start:
    - "$message{type=text;text=§e【甬道·弯折】焦骨尸来袭 —— 燃矢将交错贴脸压上} @dungeon"
    - "$monstergroup{group=wave2b;repeat=false;delay=2} @dungeon"
    end:
    - "$message{type=text;text=§7弯折尸侧已清} @dungeon"
    - "$command{text=effect %player_name% instant_health 1 2 true;console=true} @player"
    auto-start: false

  wave2b:
  - monster:
    - "$mob{plugin=MythicMobs;name=EmberAshSkeleton;location=1,65,28;amount=2;scattered=0.8;level=1} @dungeon"
    - "$mob{plugin=MythicMobs;name=EmberAshSkeleton;location=-1,65,32;amount=1;scattered=0.5;level=1} @dungeon"
    condition:
    - "$kill{mobname=燃矢骷;amount=3} @system"
    start:
    - "$message{type=text;text=§e【甬道·后段】燃矢骷重叠压上 —— 清完开鼓室门} @dungeon"
    end:
    - "$message{type=text;text=§a弯折已清 · 鼓室门开了 · 门槛压} @dungeon"
    - "$operation-block{loc=-1,65,36;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=-1,66,36;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=-1,67,36;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=0,65,36;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=0,66,36;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=0,67,36;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=1,65,36;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=1,66,36;mode=set;type=AIR} @dungeon"
    - "$operation-block{loc=1,67,36;mode=set;type=AIR} @dungeon"
    - "$command{text=effect %player_name% instant_health 1 2 true;console=true} @player"
    - "$monstergroup{group=boss_prep;repeat=false;delay=2} @dungeon"
    auto-start: false

  # Boss 前门压：鼓室入口内侧两侧燃矢贴脸（door2 z=36 与 Boss (0,65,44) 之间）
  boss_prep:
  - monster:
    - "$mob{plugin=MythicMobs;name=EmberAshSkeleton;location=-2,65,38;amount=1;scattered=0.5;level=1} @dungeon"
    - "$mob{plugin=MythicMobs;name=EmberAshSkeleton;location=2,65,38;amount=1;scattered=0.5;level=1} @dungeon"
    condition:
    - "$kill{mobname=燃矢骷;amount=2} @system"
    start:
    - "$message{type=text;text=§e【鼓室·门槛】两侧燃矢贴脸 —— 清完才出焦核} @dungeon"
    end:
    - "$message{type=text;text=§7门槛已清 · 焦核现身} @dungeon"
    - "$command{text=effect %player_name% instant_health 1 2 true;console=true} @player"
    - "$monstergroup{group=boss;repeat=false;delay=2} @dungeon"
    auto-start: false

  boss:
  - monster:
    - "$mob{plugin=MythicMobs;name=EmberAshBrute;location=0,65,44;amount=1;scattered=0.5;level=1} @dungeon"
    condition:
    - "$kill{mobname=焦核蛮兵;amount=1} @system"
    start:
    - "$message{type=text;text=§c【鼓室】焦核蛮兵！窄场走位再输出} @dungeon"
    end:
    - "$end{type=text;text=§a余烬窟·焦骨甬道 通关！奖励发放中…;reward=true;delay=2;end-type=COMPLETE} @dungeon"
    auto-start: false
