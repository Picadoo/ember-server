# ember v1.1 D137 — R03 断塔回廊·团（P1 团本，3～5 人）。复用 Q05 的地图 ember_daily_spire_v1；单独的 DP 地牢只为放宽人数。
# 进入：只经 CoreRpg（冒险菜单 / 主菜单 / /corerpg p1 enter r03）：先校验全队资格、周次数（与 r01 / r02 合计）与体力、为每人预留 50 体力，再发 P1 通行证并 dp start-console。
# 本文件不刷怪、不发奖：房间/门/A·B 变体/首领/额外事件与唯一一次结算都由 CoreRpg（plugins/CoreRpg/ember-v1-runs.yml）负责，
# 结束由 CoreRpg 触发脚本组 ember_p1_complete / ember_p1_fail（actionscript/ember-p1.yml）。reward=false，无旧奖励脚本（E02）。

dungeon-init-script:
  - "$setmap{name=ember_daily_spire_v1} @init"
  - "$setspawn{location=0,64,5} @init"
  - "$setting{break=false;place=false;pvp=false;mode=ADVENTURE} @init"
  # D106 团本倒下：留在实例里观战队友（revive=true 但 number=0：DP 的点击复活用不了）；
  # 复活只由 CoreRpg 在下一个房间开打 / 首领转阶段时用 dp revive <玩家> true true 触发（50% 生命）
  - "$revive-setting{revive=true;number=0;death-location=true} @init"

dungeon-start:
  condition:
    - "$team-condition{team=true;min=3;max=5;message=§c团本人数 3～5，当前 (<size>)} @system"
    - "$js-condition{text='%corerpg_p1_pass_r03%'=='yes';message=§c请从 冒险 菜单或 /corerpg p1 enter r03 进入（体力与解锁由 CoreRpg 校验）} @system"
  action-script:
    - "$message{type=text;text=§6[余烬] §e断塔回廊·团 §7· 3～5 人团本 · 走进前方房间开始；清房开门，击败首领后统一结算} @dungeon"
    - "$teleport{location=0,64,5;defspawn=true} @player"

dungeon-area: []

# G04: 不发任何旧奖励（币/材料/经验/daily_clear 全部由 CoreRpg 单次结算）
dungeon-reward-script: []
