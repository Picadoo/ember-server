# D392 骨架 · 短征 sx02 锈灯栈道（EmberSx02）— 与 EmberSx01 同构：DP 只建实例，不刷怪不发奖。
# 地图：ember_short_sx02（自 ember_daily_rail_v1 拷贝 · 非 sx01 同观感壳；栈道主题 WE 另号）
# 进入：只经 CoreRpg（菜单 / corerpg p1 enter sx02）→ 预留体力 30 → 发 P1 通行证再 dp start-console。
# 房间/门/首领/S41 结算由 CoreRpg（ember-v1-runs.yml short.sx02）；结束走 ember_p1_complete / ember_p1_fail。

dungeon-init-script:
  - "$setmap{name=ember_short_sx02} @init"
  - "$setspawn{location=0,64,5} @init"
  - "$setting{break=false;place=false;pvp=false;mode=ADVENTURE} @init"
  - "$revive-setting{revive=false;number=0;death-location=true} @init"

dungeon-start:
  condition:
    - "$team-condition{team=true;min=1;max=1;message=§c短征人数 1，当前 (<size>)} @system"
    - "$js-condition{text='%corerpg_p1_pass_sx02%'=='yes';message=§c请从 §e短征 · 选本 §c菜单进入锈灯栈道（体力与解锁由 CoreRpg 校验）} @system"
  action-script:
    - "$message{type=text;text=§6[余烬] §e锈灯栈道 §7· 短征 · 走上栈台开始；清房开门，击败灯塔守吏后统一结算} @dungeon"
    - "$teleport{location=0,64,5;defspawn=true} @player"

dungeon-area: []

# 结算由 CoreRpg（S41）；禁本文件发旧币表
dungeon-reward-script: []
