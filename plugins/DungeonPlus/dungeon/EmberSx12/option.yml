# D419 骨架 · 短征 sx12 烬枢转厅（EmberSx12）— 与 EmberSx11 同构：DP 只建实例，不刷怪不发奖。
# 地图：ember_short_sx12（本地骨架另号；烬枢转厅主题 WE 另号）
# 进入：只经 CoreRpg（菜单 / corerpg p1 enter sx12）→ 预留体力 30 → 发 P1 通行证再 dp start-console。
# 房间/门/首领/S51 结算由 CoreRpg（ember-v1-runs.yml short.sx12）；结束走 ember_p1_complete / ember_p1_fail。
# 首航硬提醒：short.sx12 须含 rooms×3+boss（防 D391 FAIL）。
# MM：另号 · Guard/Crossbow/Elite/Warden + EmberSx12PivotCast；本壳不假造完整 MM 波次。
# 禁：单廊换皮；环廊复读 sx06；对廊复读 sx11；递闸串室复读 sx10；连续霜雾廊/跳石/错层/塔升/风廊气质当主识别。

dungeon-init-script:
  - "$setmap{name=ember_short_sx12} @init"
  - "$setspawn{location=0,64,5} @init"
  - "$setting{break=false;place=false;pvp=false;mode=ADVENTURE} @init"
  - "$revive-setting{revive=false;number=0;death-location=true} @init"

dungeon-start:
  condition:
    - "$team-condition{team=true;min=1;max=1;message=§c短征人数 1，当前 (<size>)} @system"
    - "$js-condition{text='%corerpg_p1_pass_sx12%'=='yes';message=§c请从 §e短征 · 选本 §c菜单进入烬枢转厅（体力与解锁由 CoreRpg 校验）} @system"
  action-script:
    - "$message{type=text;text=§6[余烬] §e烬枢转厅 §7· 短征 · 入枢庭→环枢侧厢→枢冠终厅；清侧厢后转枢对齐，击败枢冠守吏后统一结算} @dungeon"
    - "$teleport{location=0,64,5;defspawn=true} @player"

dungeon-area: []

# 结算由 CoreRpg（S51）；禁本文件发旧币表
dungeon-reward-script: []
