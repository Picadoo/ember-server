# 短征 sx14 · 烬裂折廊（EmberSx14）— MythicMobs 4.11 / MC 1.12.2
# 依据：docs/design/DESIGN-ember-short-dungeon-sx14-2026-10-10.md §2.2/§2.4（批 A·M · D423）
# 对照源：EmberSx12（数值同档裂折廊主题差异）+ EmberSx12PivotCast / EmberSx01SentryCast 范式
# 三房：R1 裂门卫+折廊弩 · R2 精英 · R3 Boss+RiftCast；刷点坐标沿用 Q01/sx01–sx12 惯例（见 STATUS）
# 键名对齐 short.sx14：Guard / Crossbow（设计「折廊衡侍」远程；1.12 BOW）/ Elite / Warden
# 禁：改旧七线 Daily；禁改 sx01–sx12；禁复读线性/环廊/对廊/转枢/衡梁/递闸/跳石/错层/塔升/风廊/霜雾廊气质；首航不发装备/徽记
# 新 MM id，禁复用 EmberSx01–12 本壳

EmberSx14Guard:
  # R1 近战裂门庭卫 · 对照 sx12 Guard 48/4
  Type: ZOMBIE
  Display: '&c裂门卫'
  Health: 48
  Damage: 4
  Options:
    MovementSpeed: 0.23
    AlwaysShowName: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    PreventSunburn: true
  Equipment:
  - LEATHER_HELMET HEAD
  - LEATHER_CHESTPLATE CHEST
  Skills:
  - skill{s=EmberDailySoftHit} @target ~onAttack 0.15
  - command{c="corerpg mmgive <caster.uuid> mat_ember_shard 1"} @Self ~onDeath

EmberSx14Crossbow:
  # R1 远程折廊弩 · 1.12 用 BOW；键名 Crossbow 对齐设计「折廊衡侍」与 short.sx14 ranged
  Type: SKELETON
  Display: '&c折廊弩'
  Health: 32
  Damage: 4
  Options:
    MovementSpeed: 0.26
    AlwaysShowName: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    PreventSunburn: true
  Equipment:
  - LEATHER_HELMET HEAD
  - BOW HAND
  Skills:
  - skill{s=EmberDailySoftHit} @target ~onAttack 0.12
  - command{c="corerpg mmgive <caster.uuid> mat_ember_bone_dust 1"} @Self ~onDeath

EmberSx14Elite:
  # R2 精英折廊督卫 · 对照 sx12 Elite 120/3；设计 R2「途中 1 波梁卫或梁弩」
  Type: HUSK
  Display: '&c折廊督卫'
  Health: 120
  Damage: 3
  Options:
    MovementSpeed: 0.21
    AlwaysShowName: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    KnockbackResistance: 0.4
    PreventSunburn: true
  Equipment:
  - IRON_HELMET HEAD
  - CHAINMAIL_CHESTPLATE CHEST
  Skills:
  - command{c="corerpg mmxp <caster.uuid> elite"} @Self ~onDeath
  - skill{s=EmberDailySoftHit} @target ~onAttack 0.18
  - command{c="corerpg mmgive <caster.uuid> mat_ember_shard 1"} @Self ~onDeath 0.6

EmberSx14Warden:
  # R3 Boss 裂冠守吏 · RiftCast 裂扫斩/折角压浪可读可躲；对照 sx12 Warden；D441 HP240 Cast可读；未抬过日更 Boss 210
  Type: ZOMBIE
  Display: '&c裂冠守吏'
  Health: 240
  Damage: 3
  Options:
    MovementSpeed: 0.2
    AlwaysShowName: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    KnockbackResistance: 0.55
    PreventSunburn: true
  Equipment:
  - IRON_HELMET HEAD
  - IRON_CHESTPLATE CHEST
  Skills:
  - command{c="corerpg mmxp <caster.uuid> elite"} @Self ~onDeath
  - skill{s=EmberDailySoftHit} @target ~onAttack 0.18
  - skill{s=EmberSx14RiftCast} @self ~onTimer:70
  - command{c="corerpg mmgive <caster.uuid> mat_ember_core_fragment 1"} @Self ~onDeath
  - command{c="corerpg mmgive <caster.uuid> mat_ember_shard 1"} @Self ~onDeath 0.5
