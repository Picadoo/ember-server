# 2026-09-27: death rewards → corerpg mmgive/mmxp <caster.uuid> (credited to the last player hitter; MM <trigger> was often 'Unknown')
# 2026-09-26：~onDeath 几率行由 ">0 X"（血量>0 条件，死亡时恒不成立 → 从未触发）改为纯几率 "X"；按 docs/ember-gear-drop-t0-t3.md 审计下调过高项，见 docs/smoke-gating-drops-20260926.md
# 团本 EmberRaid — 通道杂兵 → 终厅机制战

EmberRaidFootman:
  Type: ZOMBIE
  Display: '&c团本·通道卫兵'
  Health: 200
  Damage: 8
  Options:
    MovementSpeed: 0.25
    AlwaysShowName: true
    PreventOtherDrops: true
  Equipment:
  - IRON_HELMET HEAD
  Skills:
  - skill{s=EmberCryptBleed} @target ~onAttack 0.2
  - command{c="corerpg mmgive <caster.uuid> mat_ember_shard 1"} @Self ~onDeath 0.5
  - command{c="corerpg mmgive <caster.uuid> gear_ember_t1_blade 1"} @Self ~onDeath 0.02

EmberRaidArcher:
  Type: SKELETON
  Display: '&c团本·通道射手'
  Health: 150
  Damage: 4
  Options:
    MovementSpeed: 0.26
    AlwaysShowName: true
    PreventOtherDrops: true
  Equipment:
  - IRON_HELMET HEAD
  - BOW HAND
  Skills:
  - skill{s=EmberWeeklyGuardPulse} @target ~onAttack 0.2
  - command{c="corerpg mmgive <caster.uuid> mat_ember_bone_dust 1"} @Self ~onDeath 0.5
  - command{c="corerpg mmgive <caster.uuid> gear_ember_t1_talisman 1"} @Self ~onDeath 0.02

EmberRaidElite:
  Type: HUSK
  Display: '&c团本·通道精英'
  Health: 900
  Damage: 13
  Options:
    MovementSpeed: 0.22
    AlwaysShowName: true
    PreventOtherDrops: true
    KnockbackResistance: 0.5
  Equipment:
  - IRON_HELMET HEAD
  Skills:
  # 2026-09-26：第二经验等级来源（CoreRpg progress.yml，精英 +1 / 首领 +2，每日上限）
  - command{c="corerpg mmxp <caster.uuid> elite"} @Self ~onDeath
  - skill{s=EmberRaidCallout} @target ~onAttack 0.12
  - skill{s=EmberWeeklyChainSlam} @target ~onAttack 0.15
  - command{c="corerpg mmgive <caster.uuid> mat_ember_core_fragment 1"} @Self ~onDeath
  - command{c="corerpg mmgive <caster.uuid> gear_ember_t2_blade 1"} @Self ~onDeath 0.02
  - command{c="corerpg mmgive <caster.uuid> gear_ember_t1_blade 1"} @Self ~onDeath 0.05

EmberRaidBoss:
  Type: WITHER_SKELETON
  Display: '&c团本·终厅使徒'
  Health: 2000
  Damage: 3
  # 2026-09-27: HP attribute is capped at 2048 (spigot.yml) → melee taken ×0.45 ≈ 4450 effective HP
  DamageModifiers:
  - ENTITY_ATTACK 0.45
  Options:
    MovementSpeed: 0.22
    AlwaysShowName: true
    PreventOtherDrops: true
    KnockbackResistance: 0.65
    MaxCombatDistance: 36
  Equipment:
  - DIAMOND_HELMET HEAD
  Skills:
  # 2026-09-26：第二经验等级来源（CoreRpg progress.yml，精英 +1 / 首领 +2，每日上限）
  - command{c="corerpg mmxp <caster.uuid> boss"} @Self ~onDeath
  - skill{s=EmberRaidCallout} @target ~onAttack 0.2
  - skill{s=EmberRaidSmash} @target ~onAttack 0.16
  - skill{s=EmberRaidSummonAid} @self ~onTimer:160
  - speak{m="&c终厅使徒&7：分路已尽，留下余烬。";cooldown=20} @PlayersInRadius{r=40} ~onCombat >0 0.12
  # 团戒改通关箱周首通保底（option.yml），此处不发
  - command{c="corerpg mmgive <caster.uuid> gear_ember_t2_blade 1"} @Self ~onDeath 0.15
  - command{c="corerpg mmgive <caster.uuid> gear_ember_t2_talisman 1"} @Self ~onDeath 0.12
  - command{c="corerpg mmgive <caster.uuid> gear_ember_t3_blade 1"} @Self ~onDeath 0.08
  - command{c="corerpg mmgive <caster.uuid> gear_ember_t3_talisman 1"} @Self ~onDeath 0.06
  # 1.12.0 锻造保底：凝核发给副本内每位参战者（64 格内），不再只给尾刀
  - command{c="corerpg mmgiveall <caster.uuid> core_ember_compact 1"} @Self ~onDeath
  - command{c="corerpg mmgive <caster.uuid> mat_ember_stable_charm 1"} @Self ~onDeath 0.05
  - command{c="corerpg mmgive <caster.uuid> mat_ember_core_fragment 2"} @Self ~onDeath
