# 2026-09-27: death rewards → corerpg mmgive/mmxp <caster.uuid> (credited to the last player hitter; MM <trigger> was often 'Unknown')
# 2026-09-26：~onDeath 几率行由 ">0 X"（血量>0 条件，死亡时恒不成立 → 从未触发）改为纯几率 "X"；按 docs/ember-gear-drop-t0-t3.md 审计下调过高项，见 docs/smoke-gating-drops-20260926.md
# 深渊 EmberAbyss — 层系数上涨（潮/骨/混/蛮/看守）
# 2026-09-27 宝石几率下调（目标活跃玩家约 2~3 天 1 颗，见 docs/critic-fixes-20260927.md）
# DP 可用 level= 再叠 LevelModifiers；单路径 ni give

EmberAbyssZombie:
  Type: ZOMBIE
  Display: '&5余烬深渊·潮尸'
  Health: 110
  Damage: 5
  Options:
    MovementSpeed: 0.25
    AlwaysShowName: true
    PreventOtherDrops: true
  Equipment:
  - CHAINMAIL_HELMET HEAD
  LevelModifiers:
  - health 6
  - damage 0.8
  Skills:
  - skill{s=EmberAbyssPressure} @target ~onAttack 0.28
  - command{c="corerpg mmgive <caster.uuid> gem_ember_sharp 1"} @Self ~onDeath 0.003
