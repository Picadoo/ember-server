# 2026-09-27: death rewards → corerpg mmgive/mmxp <caster.uuid> (credited to the last player hitter; MM <trigger> was often 'Unknown')
# 2026-09-26：~onDeath 几率行由 ">0 X"（血量>0 条件，死亡时恒不成立 → 从未触发）改为纯几率 "X"；按 docs/ember-gear-drop-t0-t3.md 审计下调过高项，见 docs/tests/smoke-gating-drops-20260926.md
# 余烬地窟 — MythicMobs 4.11 / Paper 1.12.2（锁定：Mobs/EmberCrypt.yml）
# 掉落只走一条：~onDeath + @Trigger → ni give <trigger.name>（进背包）
# 已去掉 NeigeItems.Drops，避免与 ni give 叠双份

EmberCryptZombie:
  Type: ZOMBIE
  Display: '&6余烬地窟僵尸'
  Health: 28
  Damage: 4
  Options:
    MovementSpeed: 0.24
    AlwaysShowName: true
    PreventOtherDrops: true
  Equipment:
  - LEATHER_HELMET HEAD
  - WOOD_SWORD HAND
  Skills:
  - skill{s=EmberCryptBleed} @target ~onAttack 0.22
  - skill{s=EmberCryptSlow} @target ~onAttack 0.18
  - command{c="corerpg mmgive <caster.uuid> mat_ember_shard 1"} @Self ~onDeath
  - command{c="corerpg mmgive <caster.uuid> gear_ember_blade 1"} @Self ~onDeath 0.05

EmberCryptSkeleton:
  Type: SKELETON
  Display: '&e余烬地窟骷髅'
  Health: 22
  Damage: 5
  Options:
    MovementSpeed: 0.26
    AlwaysShowName: true
    PreventOtherDrops: true
  Equipment:
  - LEATHER_HELMET HEAD
  - BOW HAND
  Skills:
  - skill{s=EmberCryptBleed} @target ~onAttack 0.2
  - skill{s=EmberCryptSlow} @target ~onAttack 0.25
  - command{c="corerpg mmgive <caster.uuid> mat_ember_bone_dust 1"} @Self ~onDeath
  - command{c="corerpg mmgive <caster.uuid> gear_ember_charm 1"} @Self ~onDeath 0.05

EmberCryptBrute:
  Type: HUSK
  Display: '&c余烬地窟蛮兵'
  Health: 55
  Damage: 7
  Options:
    MovementSpeed: 0.2
    AlwaysShowName: true
    PreventOtherDrops: true
    KnockbackResistance: 0.45
  Equipment:
  - IRON_HELMET HEAD
  - IRON_CHESTPLATE CHEST
  - IRON_LEGGINGS LEGS
  - IRON_BOOTS FEET
  - IRON_SWORD HAND
  Skills:
  # 2026-09-26：第二经验等级来源（CoreRpg progress.yml，精英 +1 / 首领 +2，每日上限）
  - command{c="corerpg mmxp <caster.uuid> elite"} @Self ~onDeath
  - skill{s=EmberCryptBleed} @target ~onAttack 0.3
  - skill{s=EmberCryptSlow} @target ~onAttack 0.2
  - skill{s=EmberCryptBruteSlam} @target ~onAttack 0.12
  - command{c="corerpg mmgive <caster.uuid> mat_ember_core_fragment 1"} @Self ~onDeath
  - command{c="corerpg mmgive <caster.uuid> gear_ember_blade 1"} @Self ~onDeath 0.18
  - command{c="corerpg mmgive <caster.uuid> gear_ember_charm 1"} @Self ~onDeath 0.12
