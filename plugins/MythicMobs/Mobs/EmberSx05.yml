# 短征 sx05 · 裂谷风廊（EmberSx05）— MythicMobs 4.11 / MC 1.12.2
# 依据：docs/design/DESIGN-ember-short-dungeon-sx05-2026-10-10.md §2.2/§2.4（批 A·M · D400）
# 对照源：EmberSx04（数值同档风廊主题差异）+ EmberSx01SentryCast / EmberSx04FurnaceCast 范式
# 三房：R1 崖卫+风廊弩 · R2 精英 · R3 Boss+WindCast；刷点坐标沿用 Q01/sx01–sx04 惯例（见 STATUS）
# 键名对齐 short.sx05：Guard / Crossbow（设计「风廊弩」；1.12 BOW）/ Elite / Warden
# 禁：改旧七线 Daily；禁改 sx01–sx04；首航不发装备/徽记（薄材料+mmxp）

EmberSx05Guard:
  # R1 近战崖卫 · 对照 sx04 Guard 48/4
  Type: ZOMBIE
  Display: '&c崖卫'
  Health: 48
  Damage: 4
  Options:
    MovementSpeed: 0.23
    AlwaysShowName: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    PreventSunburn: true
  Equipment:
  - LEATHER_HELMET HEAD
  - LEATHER_CHESTPLATE CHEST
  Skills:
  - skill{s=EmberDailySoftHit} @target ~onAttack 0.15
  - command{c="corerpg mmgive <caster.uuid> mat_ember_shard 1"} @Self ~onDeath

EmberSx05Crossbow:
  # R1 远程风廊弩 · 1.12 用 BOW；键名 Crossbow 对齐设计「风廊弩」与 short.sx05 ranged
  Type: SKELETON
  Display: '&c风廊弩'
  Health: 32
  Damage: 4
  Options:
    MovementSpeed: 0.26
    AlwaysShowName: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    PreventSunburn: true
  Equipment:
  - LEATHER_HELMET HEAD
  - BOW HAND
  Skills:
  - skill{s=EmberDailySoftHit} @target ~onAttack 0.12
  - command{c="corerpg mmgive <caster.uuid> mat_ember_bone_dust 1"} @Self ~onDeath

EmberSx05Elite:
  # R2 精英风廊督卫 · 对照 sx04 Elite 120/3
  Type: HUSK
  Display: '&c风廊督卫'
  Health: 120
  Damage: 3
  Options:
    MovementSpeed: 0.21
    AlwaysShowName: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    KnockbackResistance: 0.4
    PreventSunburn: true
  Equipment:
  - IRON_HELMET HEAD
  - CHAINMAIL_CHESTPLATE CHEST
  Skills:
  - command{c="corerpg mmxp <caster.uuid> elite"} @Self ~onDeath
  - skill{s=EmberDailySoftHit} @target ~onAttack 0.18
  - command{c="corerpg mmgive <caster.uuid> mat_ember_shard 1"} @Self ~onDeath 0.6

EmberSx05Warden:
  # R3 Boss 风心守吏 · WindCast 风剪条/侧风斩可读可躲；对照 sx04 Warden HP180；未抬过日更 Boss 210
  Type: ZOMBIE
  Display: '&c风心守吏'
  Health: 180
  Damage: 3
  Options:
    MovementSpeed: 0.2
    AlwaysShowName: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    KnockbackResistance: 0.55
    PreventSunburn: true
  Equipment:
  - IRON_HELMET HEAD
  - IRON_CHESTPLATE CHEST
  Skills:
  - command{c="corerpg mmxp <caster.uuid> elite"} @Self ~onDeath
  - skill{s=EmberDailySoftHit} @target ~onAttack 0.18
  - skill{s=EmberSx05WindCast} @self ~onTimer:80
  - command{c="corerpg mmgive <caster.uuid> mat_ember_core_fragment 1"} @Self ~onDeath
  - command{c="corerpg mmgive <caster.uuid> mat_ember_shard 1"} @Self ~onDeath 0.5
