# 2026-09-27: death rewards → corerpg mmgive/mmxp <caster.uuid> (credited to the last player hitter; MM <trigger> was often 'Unknown')
# 2026-09-26：~onDeath 几率行由 ">0 X"（血量>0 条件，死亡时恒不成立 → 从未触发）改为纯几率 "X"；按 docs/ember-gear-drop-t0-t3.md 审计下调过高项，见 docs/smoke-gating-drops-20260926.md
# 周常 EmberWeekly — 房间换挡 + 双蛮兵链

EmberWeeklyZombie:
  Type: ZOMBIE
  Display: '&6深核廊僵尸'
  Health: 110
  Damage: 4
  Options:
    MovementSpeed: 0.24
    AlwaysShowName: true
    PreventOtherDrops: true
  Equipment:
  - CHAINMAIL_HELMET HEAD
  Skills:
  - skill{s=EmberCryptBleed} @target ~onAttack 0.2
  - skill{s=EmberWeeklyShiftCall} @self ~onTimer:200
  - command{c="corerpg mmgive <caster.uuid> mat_ember_shard 1"} @Self ~onDeath
  - command{c="corerpg mmgive <caster.uuid> gear_ember_t1_blade 1"} @Self ~onDeath 0.01

EmberWeeklySkeleton:
  Type: SKELETON
  Display: '&6深核廊骷髅'
  Health: 70
  Damage: 3
  Options:
    MovementSpeed: 0.26
    AlwaysShowName: true
    PreventOtherDrops: true
  Equipment:
  - CHAINMAIL_HELMET HEAD
  - BOW HAND
  Skills:
  - skill{s=EmberWeeklyGuardPulse} @target ~onAttack 0.22
  - command{c="corerpg mmgive <caster.uuid> mat_ember_bone_dust 1"} @Self ~onDeath
  - command{c="corerpg mmgive <caster.uuid> gear_ember_t1_talisman 1"} @Self ~onDeath 0.01

EmberWeeklyBruteA:
  Type: ZOMBIE
  Display: '&6深核廊蛮兵·甲'
  Health: 350
  Damage: 4
  Options:
    MovementSpeed: 0.21
    AlwaysShowName: true
    PreventOtherDrops: true
    KnockbackResistance: 0.5
    PreventSunburn: true
  Equipment:
  - IRON_HELMET HEAD
  Skills:
  # 2026-09-26：第二经验等级来源（CoreRpg progress.yml，精英 +1 / 首领 +2，每日上限）
  - command{c="corerpg mmxp <caster.uuid> elite"} @Self ~onDeath
  - skill{s=EmberWeeklyChainSlam} @target ~onAttack 0.2
  - skill{s=EmberCryptBleed} @target ~onAttack 0.25
  - command{c="corerpg mmgive <caster.uuid> mat_ember_core_fragment 1"} @Self ~onDeath
  - command{c="corerpg mmgive <caster.uuid> gear_ember_t1_blade 1"} @Self ~onDeath 0.18
  - command{c="corerpg mmgive <caster.uuid> gear_ember_t2_blade 1"} @Self ~onDeath 0.03

EmberWeeklyBruteB:
  # 2026-09-27 variance pass: zombie body (husk hunger stopped regen), steady melee only (no random knock-up / guard-pulse bursts),
  #   a steady ember aura (1 dmg / 2 s within 8 blocks, so damage lands even when the brute is kited),
  #   and an ember pulse every 15 s that heals nearby players 6 HP (predictable mid-fight heal)
  Type: ZOMBIE
  Display: '&6深核廊蛮兵·乙'
  Health: 1300
  Damage: 2
  Options:
    MovementSpeed: 0.22
    AlwaysShowName: true
    PreventOtherDrops: true
    KnockbackResistance: 0.6
    PreventSunburn: true
  Equipment:
  - IRON_HELMET HEAD
  Skills:
  # 2026-09-26：第二经验等级来源（CoreRpg progress.yml，精英 +1 / 首领 +2，每日上限）
  - command{c="corerpg mmxp <caster.uuid> elite"} @Self ~onDeath
  - message{m="&6【深核廊】&7余烬回暖——你的伤口在愈合。"} @PlayersInRadius{r=20} ~onTimer:300
  - damage{amount=1} @PlayersInRadius{r=8} ~onTimer:40
  - heal{amount=6} @PlayersInRadius{r=20} ~onTimer:300
  - command{c="corerpg mmgive <caster.uuid> mat_ember_core_fragment 1"} @Self ~onDeath
  - command{c="corerpg mmgive <caster.uuid> gear_ember_t1_talisman 1"} @Self ~onDeath 0.12
  - command{c="corerpg mmgive <caster.uuid> gear_ember_blade 1"} @Self ~onDeath 0.2
  # 1.12.0 稳定符免费小概率来源（周本首领）
  - command{c="corerpg mmgive <caster.uuid> mat_ember_stable_charm 1"} @Self ~onDeath 0.04
