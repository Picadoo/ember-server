# 2026-09-26：~onDeath 几率行由 ">0 X"（血量>0 条件，死亡时恒不成立 → 从未触发）改为纯几率 "X"；按 docs/ember-gear-drop-t0-t3.md 审计下调过高项，见 docs/smoke-gating-drops-20260926.md
# 周常 EmberWeekly — 房间换挡 + 双蛮兵链

EmberWeeklyZombie:
  Type: ZOMBIE
  Display: '&6深核廊僵尸'
  Health: 36
  Damage: 5
  Options:
    MovementSpeed: 0.24
    AlwaysShowName: true
    PreventOtherDrops: true
  Equipment:
  - CHAINMAIL_HELMET HEAD
  - IRON_SWORD HAND
  Skills:
  - skill{s=EmberCryptBleed} @target ~onAttack 0.2
  - skill{s=EmberWeeklyShiftCall} @self ~onTimer:200
  - command{c="ni give <trigger.name> mat_ember_shard 1";asop=true} @Trigger ~onDeath
  - command{c="ni give <trigger.name> gear_ember_t1_blade 1";asop=true} @Trigger ~onDeath 0.01

