# 2026-09-27: zombie 24hp/3dmg → 20/2 and no wood sword (+4), brute 48hp/6dmg → 40/4 and no iron sword (+6) (mobs now really spawn in the room instead of suffocating in rock)
# 2026-09-27: death rewards → corerpg mmgive/mmxp <caster.uuid> (credited to the last player hitter; MM <trigger> was often 'Unknown')
# 2026-09-26：~onDeath 几率行由 ">0 X"（血量>0 条件，死亡时恒不成立 → 从未触发）改为纯几率 "X"；按 docs/ember-gear-drop-t0-t3.md 审计下调过高项，见 docs/smoke-gating-drops-20260926.md
# 日常 EmberDaily — 清潮轻压（灰烬庭院）
# 单路径 ni give；勿与地窟 Display 撞名（DP $kill 用去色 Display）

EmberDailyZombie:
  Type: ZOMBIE
  Display: '&a灰烬庭院僵尸'
  Health: 45
  Damage: 4
  Options:
    MovementSpeed: 0.23
    AlwaysShowName: true
    PreventOtherDrops: true
  Equipment:
  - LEATHER_HELMET HEAD
  Skills:
  - skill{s=EmberDailySoftHit} @target ~onAttack 0.15
  - command{c="corerpg mmgive <caster.uuid> mat_ember_shard 1"} @Self ~onDeath

EmberDailySkeleton:
  # 2026-09-28 S1 回廊近战化：去弓 → 木剑贴脸；Display/$kill 名不变（灰烬庭院骷髅）
  Type: SKELETON
  Display: '&a灰烬庭院骷髅'
  Health: 35
  Damage: 4
  Options:
    MovementSpeed: 0.25
    AlwaysShowName: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
  Equipment:
  - LEATHER_HELMET HEAD
  - WOOD_SWORD HAND
  Skills:
  - skill{s=EmberDailySoftHit} @target ~onAttack 0.12
  - command{c="corerpg mmgive <caster.uuid> mat_ember_bone_dust 1"} @Self ~onDeath

EmberDailyBrute:
  # 2026-09-27 consistency pass: zombie body (husk hunger blocked regen), no random tap/soft-hit procs,
  #   a steady ember aura (0.5 dmg / 2 s within 6 blocks) so the fight costs about the same every run
  Type: ZOMBIE
  Display: '&a灰烬庭院蛮兵'
  Health: 180
  Damage: 2
  Options:
    MovementSpeed: 0.2
    AlwaysShowName: true
    PreventOtherDrops: true
    KnockbackResistance: 0.6
    PreventSunburn: true
  Equipment:
  - IRON_HELMET HEAD
  - IRON_CHESTPLATE CHEST
  Skills:
  # 2026-09-26：第二经验等级来源（CoreRpg progress.yml，精英 +1 / 首领 +2，每日上限）
  - command{c="corerpg mmxp <caster.uuid> elite"} @Self ~onDeath
  - damage{amount=0.5} @PlayersInRadius{r=6} ~onTimer:40
  - command{c="corerpg mmgive <caster.uuid> mat_ember_core_fragment 1"} @Self ~onDeath
  - command{c="corerpg mmgive <caster.uuid> gear_ember_blade 1"} @Self ~onDeath 0.12
  - command{c="corerpg mmgive <caster.uuid> gear_ember_charm 1"} @Self ~onDeath 0.08
  - command{c="corerpg mmgive <caster.uuid> gear_ember_t1_blade 1"} @Self ~onDeath 0.03
