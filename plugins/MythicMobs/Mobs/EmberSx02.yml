# 短征 sx02 · 锈灯栈道（EmberSx02）— MythicMobs 4.11 / MC 1.12.2
# 依据：docs/design/DESIGN-ember-short-dungeon-sx02-2026-10-10.md §2.2/§2.4（批 A·M @5bb2c41c）
# 对照源：EmberSx01（数值同档略主题差异）+ EmberFrostNovaCast / EmberSx01SentryCast 范式
# 三房：R1 巡卫+弩手 · R2 精英 · R3 Boss+BeaconCast；刷点坐标沿用 Q01/sx01 惯例（见 STATUS）
# 禁：改旧七线 Daily；禁改 sx01；首航不发装备/徽记（薄材料+mmxp）

EmberSx02Guard:
  # R1 近战巡卫 · 对照 sx01 Zombie 45/4；锈灯略厚一档
  Type: ZOMBIE
  Display: '&e锈灯巡卫'
  Health: 48
  Damage: 4
  Options:
    MovementSpeed: 0.23
    AlwaysShowName: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    PreventSunburn: true
  Equipment:
  - LEATHER_HELMET HEAD
  - LEATHER_CHESTPLATE CHEST
  Skills:
  - skill{s=EmberDailySoftHit} @target ~onAttack 0.15
  - command{c="corerpg mmgive <caster.uuid> mat_ember_shard 1"} @Self ~onDeath

EmberSx02Archer:
  # R1 远程弩手 · 1.12 用 BOW；对照 sx01 Skeleton 35/4；略薄
  Type: SKELETON
  Display: '&e栈道弩手'
  Health: 32
  Damage: 4
  Options:
    MovementSpeed: 0.26
    AlwaysShowName: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    PreventSunburn: true
  Equipment:
  - LEATHER_HELMET HEAD
  - BOW HAND
  Skills:
  - skill{s=EmberDailySoftHit} @target ~onAttack 0.12
  - command{c="corerpg mmgive <caster.uuid> mat_ember_bone_dust 1"} @Self ~onDeath

EmberSx02Elite:
  # R2 精英栈道督卫 · 对照 sx01 Elite 120/3；轻压力
  Type: HUSK
  Display: '&e栈道督卫'
  Health: 120
  Damage: 3
  Options:
    MovementSpeed: 0.21
    AlwaysShowName: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    KnockbackResistance: 0.4
    PreventSunburn: true
  Equipment:
  - IRON_HELMET HEAD
  - CHAINMAIL_CHESTPLATE CHEST
  Skills:
  - command{c="corerpg mmxp <caster.uuid> elite"} @Self ~onDeath
  - skill{s=EmberDailySoftHit} @target ~onAttack 0.18
  - command{c="corerpg mmgive <caster.uuid> mat_ember_shard 1"} @Self ~onDeath 0.6

EmberSx02Warden:
  # R3 Boss 灯塔守吏 · Cast 可读扫线落点；对照 sx01 Warden HP180；未抬过日更 Boss 210
  Type: ZOMBIE
  Display: '&e灯塔守吏'
  Health: 180
  Damage: 3
  Options:
    MovementSpeed: 0.2
    AlwaysShowName: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    KnockbackResistance: 0.55
    PreventSunburn: true
  Equipment:
  - IRON_HELMET HEAD
  - IRON_CHESTPLATE CHEST
  Skills:
  - command{c="corerpg mmxp <caster.uuid> elite"} @Self ~onDeath
  - skill{s=EmberDailySoftHit} @target ~onAttack 0.18
  - skill{s=EmberSx02BeaconCast} @self ~onTimer:80
  - command{c="corerpg mmgive <caster.uuid> mat_ember_core_fragment 1"} @Self ~onDeath
  - command{c="corerpg mmgive <caster.uuid> mat_ember_shard 1"} @Self ~onDeath 0.5
