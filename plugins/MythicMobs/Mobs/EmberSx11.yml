# 短征 sx11 · 烬镜对廊（EmberSx11）— MythicMobs 4.11 / MC 1.12.2
# 依据：docs/design/DESIGN-ember-short-dungeon-sx11-2026-10-10.md §2.2/§2.4（批 A·M · D417）
# 对照源：EmberSx10（数值同档对廊/合镜主题差异）+ EmberSx10GateCast / EmberSx01SentryCast 范式
# 三房：R1 对廊卫+侧廊弩 · R2 精英 · R3 Boss+MirrorCast；刷点坐标沿用 Q01/sx01–sx10 惯例（见 STATUS）
# 键名对齐 short.sx11：Guard / Crossbow（设计「侧廊影侍」远程；1.12 BOW）/ Elite / Warden
# 禁：改旧七线 Daily；禁改 sx01–sx10；首航不发装备/徽记（薄材料+mmxp）

EmberSx11Guard:
  # R1 近战对廊卫 · 对照 sx10 Guard 48/4
  Type: ZOMBIE
  Display: '&c对廊卫'
  Health: 48
  Damage: 4
  Options:
    MovementSpeed: 0.23
    AlwaysShowName: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    PreventSunburn: true
  Equipment:
  - LEATHER_HELMET HEAD
  - LEATHER_CHESTPLATE CHEST
  Skills:
  - skill{s=EmberDailySoftHit} @target ~onAttack 0.15
  - command{c="corerpg mmgive <caster.uuid> mat_ember_shard 1"} @Self ~onDeath

EmberSx11Crossbow:
  # R1 远程侧廊弩 · 1.12 用 BOW；键名 Crossbow 对齐设计「侧廊影侍」与 short.sx11 ranged
  Type: SKELETON
  Display: '&c侧廊弩'
  Health: 32
  Damage: 4
  Options:
    MovementSpeed: 0.26
    AlwaysShowName: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    PreventSunburn: true
  Equipment:
  - LEATHER_HELMET HEAD
  - BOW HAND
  Skills:
  - skill{s=EmberDailySoftHit} @target ~onAttack 0.12
  - command{c="corerpg mmgive <caster.uuid> mat_ember_bone_dust 1"} @Self ~onDeath

EmberSx11Elite:
  # R2 精英镜廊督卫 · 对照 sx10 Elite 120/3；设计 R2「途中每侧 1 波」
  Type: HUSK
  Display: '&c镜廊督卫'
  Health: 120
  Damage: 3
  Options:
    MovementSpeed: 0.21
    AlwaysShowName: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    KnockbackResistance: 0.4
    PreventSunburn: true
  Equipment:
  - IRON_HELMET HEAD
  - CHAINMAIL_CHESTPLATE CHEST
  Skills:
  - command{c="corerpg mmxp <caster.uuid> elite"} @Self ~onDeath
  - skill{s=EmberDailySoftHit} @target ~onAttack 0.18
  - command{c="corerpg mmgive <caster.uuid> mat_ember_shard 1"} @Self ~onDeath 0.6

EmberSx11Warden:
  # R3 Boss 合镜守吏 · MirrorCast 镜面扫线/对折斩可读可躲；对照 sx10 Warden HP180；未抬过日更 Boss 210
  Type: ZOMBIE
  Display: '&c合镜守吏'
  Health: 240
  Damage: 3
  Options:
    MovementSpeed: 0.2
    AlwaysShowName: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    KnockbackResistance: 0.55
    PreventSunburn: true
  Equipment:
  - IRON_HELMET HEAD
  - IRON_CHESTPLATE CHEST
  Skills:
  - command{c="corerpg mmxp <caster.uuid> elite"} @Self ~onDeath
  - skill{s=EmberDailySoftHit} @target ~onAttack 0.18
  - skill{s=EmberSx11MirrorCast} @self ~onTimer:70
  - command{c="corerpg mmgive <caster.uuid> mat_ember_core_fragment 1"} @Self ~onDeath
  - command{c="corerpg mmgive <caster.uuid> mat_ember_shard 1"} @Self ~onDeath 0.5
