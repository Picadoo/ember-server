# 短征 sx04 · 烬井螺旋（EmberSx04）— MythicMobs 4.11 / MC 1.12.2
# 依据：docs/design/DESIGN-ember-short-dungeon-sx04-2026-10-10.md §2.2/§2.4（批 A·M @0ffa02f2）
# 对照源：EmberSx03（数值同档炉心主题差异）+ EmberSx01SentryCast / EmberAshBurstCast 范式
# 三房：R1 井卫+螺旋弩 · R2 精英 · R3 Boss+FurnaceCast；刷点坐标沿用 Q01/sx01–sx03 惯例（见 STATUS）
# 键名对齐 short.sx04：Guard / Crossbow（设计「螺旋弩」；Crossbow 风格对齐 sx03）/ Elite / Warden
# 禁：改旧七线 Daily；禁改 sx01/sx02/sx03；首航不发装备/徽记（薄材料+mmxp）

EmberSx04Guard:
  # R1 近战井卫 · 对照 sx03 Patrol 48/4
  Type: ZOMBIE
  Display: '&c井卫'
  Health: 48
  Damage: 4
  Options:
    MovementSpeed: 0.23
    AlwaysShowName: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    PreventSunburn: true
  Equipment:
  - LEATHER_HELMET HEAD
  - LEATHER_CHESTPLATE CHEST
  Skills:
  - skill{s=EmberDailySoftHit} @target ~onAttack 0.15
  - command{c="corerpg mmgive <caster.uuid> mat_ember_shard 1"} @Self ~onDeath

EmberSx04Crossbow:
  # R1 远程螺旋弩 · 1.12 用 BOW；键名 Crossbow 对齐设计「螺旋弩」与 short.sx04 ranged
  Type: SKELETON
  Display: '&c螺旋弩'
  Health: 32
  Damage: 4
  Options:
    MovementSpeed: 0.26
    AlwaysShowName: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    PreventSunburn: true
  Equipment:
  - LEATHER_HELMET HEAD
  - BOW HAND
  Skills:
  - skill{s=EmberDailySoftHit} @target ~onAttack 0.12
  - command{c="corerpg mmgive <caster.uuid> mat_ember_bone_dust 1"} @Self ~onDeath

EmberSx04Elite:
  # R2 精英井阶督卫 · 对照 sx03 Elite 120/3
  Type: HUSK
  Display: '&c井阶督卫'
  Health: 120
  Damage: 3
  Options:
    MovementSpeed: 0.21
    AlwaysShowName: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    KnockbackResistance: 0.4
    PreventSunburn: true
  Equipment:
  - IRON_HELMET HEAD
  - CHAINMAIL_CHESTPLATE CHEST
  Skills:
  - command{c="corerpg mmxp <caster.uuid> elite"} @Self ~onDeath
  - skill{s=EmberDailySoftHit} @target ~onAttack 0.18
  - command{c="corerpg mmgive <caster.uuid> mat_ember_shard 1"} @Self ~onDeath 0.6

EmberSx04Warden:
  # R3 Boss 炉心井守 · FurnaceCast 井心喷涌可读可躲；对照 sx03 Warden HP180；未抬过日更 Boss 210
  Type: ZOMBIE
  Display: '&c炉心井守'
  Health: 240
  Damage: 3
  Options:
    MovementSpeed: 0.2
    AlwaysShowName: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    KnockbackResistance: 0.55
    PreventSunburn: true
  Equipment:
  - IRON_HELMET HEAD
  - IRON_CHESTPLATE CHEST
  Skills:
  - command{c="corerpg mmxp <caster.uuid> elite"} @Self ~onDeath
  - skill{s=EmberDailySoftHit} @target ~onAttack 0.18
  - skill{s=EmberSx04FurnaceCast} @self ~onTimer:70
  - command{c="corerpg mmgive <caster.uuid> mat_ember_core_fragment 1"} @Self ~onDeath
  - command{c="corerpg mmgive <caster.uuid> mat_ember_shard 1"} @Self ~onDeath 0.5
