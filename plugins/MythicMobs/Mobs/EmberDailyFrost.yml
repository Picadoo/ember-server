# S4 日常线 F · 余烬窟·霜晶裂隙（EmberDailyFrost）
# 依据：docs/design-ember-daily-s4.md §4.4
# 冻台友好；Display 去色勿与既有五线撞名；掉落 corerpg mmgive

EmberDailyFrostZombie:
  Type: ZOMBIE
  Display: '&b霜晶尸'
  Health: 51
  Damage: 4
  Options:
    MovementSpeed: 0.23
    AlwaysShowName: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    PreventSunburn: true
  Equipment:
  - LEATHER_HELMET HEAD
  Skills:
  - skill{s=EmberDailySoftHit} @target ~onAttack 0.15
  - potion{type=SLOW;duration=35;level=0} @target ~onAttack 0.12
  - command{c="corerpg mmgive <caster.uuid> mat_ember_shard 1"} @Self ~onDeath

EmberDailyFrostSkeleton:
  # 霜矢骷：裂隙台可射；移速略高 + SoftHit 可贴脸；PreventRandomEquipment
  Type: SKELETON
  Display: '&b霜矢骷'
  Health: 40
  Damage: 4
  Options:
    MovementSpeed: 0.27
    AlwaysShowName: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    PreventSunburn: true
  Equipment:
  - LEATHER_HELMET HEAD
  - BOW HAND
  Skills:
  - skill{s=EmberDailySoftHit} @target ~onAttack 0.13
  - potion{type=SLOW;duration=30;level=0} @target ~onAttack 0.14
  - command{c="corerpg mmgive <caster.uuid> mat_ember_bone_dust 1"} @Self ~onDeath

EmberDailyFrostBrute:
  # 霜核蛮兵：霜厅慢压 + 冻步减速区；异于潮闸冲锋 / 焦核窄冲
  Type: HUSK
  Display: '&b霜核蛮兵'
  Health: 210
  Damage: 3
  Options:
    MovementSpeed: 0.19
    AlwaysShowName: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    KnockbackResistance: 0.55
    PreventSunburn: true
  Equipment:
  - IRON_HELMET HEAD
  - IRON_CHESTPLATE CHEST
  Skills:
  - command{c="corerpg mmxp <caster.uuid> elite"} @Self ~onDeath
  - skill{s=EmberDailySoftHit} @target ~onAttack 0.18
  - potion{type=SLOW;duration=50;level=0} @PlayersInRadius{r=6} ~onTimer:45
  - damage{amount=0.4} @PlayersInRadius{r=5} ~onTimer:45
  - command{c="corerpg mmgive <caster.uuid> mat_ember_core_fragment 1"} @Self ~onDeath
  - command{c="corerpg mmgive <caster.uuid> mat_ember_shard 1"} @Self ~onDeath 0.5
