# ember-v1.0-P1 G04 — first-batch main maps Q01 灰烬庭院 / Q02 焦骨甬道 / Q03 残誓地窖 (book ch. 11–13, normal version).
# Spawned ONLY by the CoreRpg run director (plugins/CoreRpg/ember-v1-runs.yml); never by DP groups, spawners or other mobs.
# - Health = book single-player value; CoreRpg multiplies it by the locked party factor 1 + 0.65 (n − 1) at spawn (A18).
# - Damage = book raw value; CoreRpg pins every hit to it and enforces the minimum interval (melee 2.5 s, ranged / heavy
#   3 s, bosses 3.2 / 3 / 3 s), then the P1 pipeline applies the player's mitigation M once. Arrow damage is replaced too.
# - Boss moves (Q01 重斩, Q02 砸地 + 横扫 below 50 %, Q03 誓斩 + adds at 50 %) and the Q03 caster line are telegraphed by
#   CoreRpg (flame outline + chat warning; the hit area never exceeds the outline). No MM skills, no drops, no xp,
#   no corerpg mmgive / mmxp lines (E02: the only payout is the boss settlement).
# - PreventSunburn on every undead body (instances can be daytime); CoreRpg also cancels combustion of run mobs.

