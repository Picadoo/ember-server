# 短征 sx13 · 烬衡悬梁（EmberSx13）— MythicMobs 4.11 / MC 1.12.2
# 依据：docs/design/DESIGN-ember-short-dungeon-sx13-2026-10-10.md §2.2/§2.4（批 A·M · D421）
# 对照源：EmberSx12（数值同档衡悬梁主题差异）+ EmberSx12PivotCast / EmberSx01SentryCast 范式
# 三房：R1 衡门卫+梁廊弩 · R2 精英 · R3 Boss+BalanceCast；刷点坐标沿用 Q01/sx01–sx12 惯例（见 STATUS）
# 键名对齐 short.sx13：Guard / Crossbow（设计「梁廊衡侍」远程；1.12 BOW）/ Elite / Warden
# 禁：改旧七线 Daily；禁改 sx01–sx12；禁复读窄桥/跳石/转枢/递闸/对廊/环廊/塔升/错层/风廊/霜雾廊气质；首航不发装备/徽记
# 新 MM id，禁复用 EmberSx01–12 本壳

EmberSx13Guard:
  # R1 近战衡门庭卫 · 对照 sx12 Guard 48/4
  Type: ZOMBIE
  Display: '&c衡门卫'
  Health: 48
  Damage: 4
  Options:
    MovementSpeed: 0.23
    AlwaysShowName: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    PreventSunburn: true
  Equipment:
  - LEATHER_HELMET HEAD
  - LEATHER_CHESTPLATE CHEST
  Skills:
  - skill{s=EmberDailySoftHit} @target ~onAttack 0.15
  - command{c="corerpg mmgive <caster.uuid> mat_ember_shard 1"} @Self ~onDeath

EmberSx13Crossbow:
  # R1 远程梁廊弩 · 1.12 用 BOW；键名 Crossbow 对齐设计「梁廊衡侍」与 short.sx13 ranged
  Type: SKELETON
  Display: '&c梁廊弩'
  Health: 32
  Damage: 4
  Options:
    MovementSpeed: 0.26
    AlwaysShowName: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    PreventSunburn: true
  Equipment:
  - LEATHER_HELMET HEAD
  - BOW HAND
  Skills:
  - skill{s=EmberDailySoftHit} @target ~onAttack 0.12
  - command{c="corerpg mmgive <caster.uuid> mat_ember_bone_dust 1"} @Self ~onDeath

EmberSx13Elite:
  # R2 精英衡廊督卫 · 对照 sx12 Elite 120/3；设计 R2「途中 1 波梁卫或梁弩」
  Type: HUSK
  Display: '&c衡廊督卫'
  Health: 120
  Damage: 3
  Options:
    MovementSpeed: 0.21
    AlwaysShowName: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    KnockbackResistance: 0.4
    PreventSunburn: true
  Equipment:
  - IRON_HELMET HEAD
  - CHAINMAIL_CHESTPLATE CHEST
  Skills:
  - command{c="corerpg mmxp <caster.uuid> elite"} @Self ~onDeath
  - skill{s=EmberDailySoftHit} @target ~onAttack 0.18
  - command{c="corerpg mmgive <caster.uuid> mat_ember_shard 1"} @Self ~onDeath 0.6

EmberSx13Warden:
  # R3 Boss 衡冠守吏 · BalanceCast 衡扫斩/倾梁压浪可读可躲；对照 sx12 Warden HP180；未抬过日更 Boss 210
  Type: ZOMBIE
  Display: '&c衡冠守吏'
  Health: 180
  Damage: 3
  Options:
    MovementSpeed: 0.2
    AlwaysShowName: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    KnockbackResistance: 0.55
    PreventSunburn: true
  Equipment:
  - IRON_HELMET HEAD
  - IRON_CHESTPLATE CHEST
  Skills:
  - command{c="corerpg mmxp <caster.uuid> elite"} @Self ~onDeath
  - skill{s=EmberDailySoftHit} @target ~onAttack 0.18
  - skill{s=EmberSx13BalanceCast} @self ~onTimer:80
  - command{c="corerpg mmgive <caster.uuid> mat_ember_core_fragment 1"} @Self ~onDeath
  - command{c="corerpg mmgive <caster.uuid> mat_ember_shard 1"} @Self ~onDeath 0.5
